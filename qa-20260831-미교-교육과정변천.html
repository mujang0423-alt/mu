<title>미교 - 교육과정 변천</title>
<style>

<h1>미교 · 미술과 교육과정 변천</h1>
<div id="bar">
<label><input type="checkbox" id="only"> 틀린 것만</label>
<button id="exp">오답 내보내기</button>
<button id="cp">번호 복사</button>
<span id="cnt"></span>
</div>
<div id="list"></div>
<textarea id="pad" style="position:fixed;left:-9999px"></textarea>
<script>
const L=document.getElementById("list"),O=document.getElementById("only"),C=document.getElementById("cnt");
let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
QA.forEach((q,i)=>{
 const d=document.createElement("details");
 d.innerHTML='<summary><span class="num">'+(i+1)+'.</span>'+esc(q[0])+'</summary><div class="a">'+esc(q[1])+'</div><div class="chk"><label><input type="checkbox" data-i="'+i+'"'+(S[i]?" checked":"")+'> 틀림</label></div>';
 d.querySelector("input").onchange=e=>{S[i]=e.target.checked;if(!S[i])delete S[i];save();render()};
 L.appendChild(d);
});
function render(){
 [...L.children].forEach((d,i)=>d.classList.toggle("hide",O.checked&&!S[i]));
 C.textContent="틀림 "+Object.keys(S).length+" / "+QA.length;
}
O.onchange=render;render();
document.getElementById("cp").onclick=()=>{
 const t=Object.keys(S).map(i=>+i+1).sort((a,b)=>a-b).join(",");
 const p=document.getElementById("pad");p.value=t;
 try{navigator.clipboard.writeText(t)}catch(e){p.select();document.execCommand("copy")}
 alert(t||"없음");
};
document.getElementById("exp").onclick=()=>{
 const w=QA.filter((q,i)=>S[i]);
 if(!w.length)return alert("체크된 문항이 없습니다.");
 const h=document.documentElement.outerHTML
  .replace(/const KEY="[^"]*"/,'const KEY="'+KEY+'-wrong"')
  .replace(/const QA=\[[\s\S]*?\n\];/,"const QA="+JSON.stringify(w)+";");
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));
 a.download=KEY+"-wrong.html";a.click();
};
</script>
</body>
</html>
