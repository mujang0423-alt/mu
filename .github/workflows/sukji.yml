name: sukji
on:
  push:
    paths: ['**.html']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'EOF'
          import pathlib
          S=pathlib.Path('.github/sukji.html').read_text(encoding='utf-8')
          for p in pathlib.Path('.').rglob('*.html'):
            if '.github' in p.parts: continue
            t=p.read_text(encoding='utf-8')
            if 'SUKJI' in t: continue
            i=t.lower().rfind('</body>')
            t=t[:i]+S+t[i:] if i>=0 else t+S
            p.write_text(t,encoding='utf-8')
          EOF
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m "숙지 추가" && git push)
