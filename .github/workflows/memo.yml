name: memo
on:
  push:
    paths: ['.github/memo.html', '.github/workflows/memo.yml']
  workflow_run:
    workflows: [sukji]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency: memo
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 - <<'PY'
          import pathlib
          S=pathlib.Path('.github/memo.html').read_text(encoding='utf-8')
          for p in pathlib.Path('.').rglob('*.html'):
            if '.github' in p.parts or p.name.lower().startswith('index'): continue
            t=p.read_text(encoding='utf-8')
            if '/*MEMO*/' in t: continue
            i=t.lower().rfind('</body>')
            t=t[:i]+S+t[i:] if i>=0 else t+S
            p.write_text(t,encoding='utf-8')
          PY
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "메모 기능 추가"
          for n in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
