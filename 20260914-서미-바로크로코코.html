<!doctype html><html lang=ko><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>20260914 서미 바로크·로코코</title>
<script>const KEY="0914-서미-바로크로코코";
const QA=[["17세기 바로크 시대 각국의 후원층과 미술 경향은?","· 이탈리아·스페인: 반종교개혁으로 종교화(제단화)가 여전히 성행, 궁정 초상화 중심. 후원층은 왕실과 교회\n· 네덜란드: 종교개혁 성공으로 신흥 부르주아가 후원자\n· 프랑스: 왕실 중심의 고전적·이상적 풍경화\n· 영국: 상류 사회 귀족 중심"],["기입: 18세기 프랑스에서 궁정의 귀족들이 정원이 있는 야외에 모여 개최한 사교적 모임을 주제로 그린 그림. '연애' 또는 '풍류'로 번역됨.","페트 갈랑트(Fête galante), 아연화(雅宴畵)."],["샤르댕에 대해 설명하시오.","프랑스 정물화가로 근대 정물화의 출발점.\n· 왕실 중심의 이상적·고전적 경향과 달리 일상적이고 소박한 소재를 다룸\n· 벨라스케스의 영향\n· 의미 없는 소재, 형태와 질감, 삼각형 구도의 배치로 정물화에 전문성 부여\n· 자연스러운 빛의 흐름 표현"],["네덜란드 정물화의 두 유형은?","· 프롱크(pronk) 정물화: 보석·은기 등 값비싼 귀족 취향의 정물\n· 바니타스(vanitas) 정물화: '죽음을 기억하라'는 메멘토 모리의 메시지, 삶의 허무와 인간의 유한함을 담은 교훈적 상징\n공통적으로 트롱프뢰유(눈속임)적 극사실 묘사와 강한 명암 대비.\n대표 작가: 빌럼 칼프(Willem Kalf)"],["푸생에 대해 설명하시오.","프랑스 바로크 화가.\n· 왕립 회화·조각 아카데미에서 모범이 된 그랜드 매너(그랑 마니에르) 양식의 그림\n· 정확한 소묘, 정확한 해부학과 인체 비례\n· 역사적 주제 중시"],["기입: 이상화된 미를 의미하는 프랑스적 개념으로, 고대 로마의 전통과 이상화된 자연 풍경 속에서 영웅적 인물을 그리는 것.","그랜드 매너(Grand Manner). 이상미, 비례, 조화, 균형, 수평·수직의 질서가 특징."],["레이놀즈와 게인즈버러를 비교하시오.","둘 다 영국의 초상화가.\n· 레이놀즈: 그랜드 매너 양식을 따라 귀족 초상화를 그림. 해부학과 비례를 중시하고 고대풍으로 이상화해 연출\n· 게인즈버러: 서민의 일상적 모습을 다루며 좀 더 직관적"],["바로크 건축의 특징은?","성당과 궁정 건축 중심. 화려하고 복잡한 장식, 열주와 아치의 사용."],["베르니니에 대해 설명하시오.","바로크 조각가.\n· 건축에 종속되어 있던 조각의 관계를 재편하고 회화적으로 표현해 회화와 조각의 경계를 허묾\n· 순간의 동세를 포착한 표현\n· 바람에 날리는 옷주름 등으로 연극성과 장엄함을 드러냄"],["카라바조에 대해 설명하시오.","이탈리아 바로크의 시초.\n· 테네브리즘: 레오나르도 다 빈치의 키아로스쿠로를 극단화해 빛과 어둠의 대비를 강하게 표현\n· 당대의 평범한 의상을 입은 인물로 종교화를 그려 현실적 모습으로 표현\n· 세속적이고 생생한 인물 유형을 강조함으로써 사실주의의 새로운 장을 마련"],["벨라스케스에 대해 설명하시오.","스페인 바로크의 궁정화가.\n· 초기에는 카라바조의 영향을 받은 테네브리즘, 후기에는 베네치아파의 영향\n· 난쟁이·거지 등으로 소재의 범위를 확장\n· 알라 프리마 기법 사용 (할스에게 영향)\n· 생생한 색채와 분절된 붓터치로 마네 등 인상주의에 영향\n· 보데곤(bodegón)이라는 소박한 정물 양식\n· 시각적 사실주의"],["라위스달에 대해 설명하시오.","네덜란드 풍경화가.\n· 수평적 구도, 화면의 2/3 이상을 차지하는 하늘 → 컨스터블에게 영향\n· 인생무상 등 관념적·상징적 내용을 담아 풍경을 표현"],["렘브란트의 초기와 후기를 비교하시오.","· 초기: 활기찬 분위기, 테네브리즘 기법, 집단 초상화를 많이 그림\n· 후기: 경제적·사회적 지위의 몰락에 따른 불안한 모습, 자화상을 다수 제작. 렘브란트 라이팅(후측면광)으로 모호한 윤곽선과 미묘한 명암을 만들어 내면의 감정을 드러냄. 임파스토 기법 사용"],["픽처레스크란?","'그림이 될 만한'이라는 뜻. 고성(古城) 등 고전적 건축물과 자연 풍경을 함께 그린 것."],["클로드 로랭에 대해 설명하시오.","프랑스 바로크 풍경화가.\n· '밀어내다'라는 뜻의 레푸수아르(repoussoir)로 주제를 부각\n· 클로드 글라스 사용\n· 이탈리아풍 건축을 중심에 두고 주변에 자연 풍경을 배치\n· 중간 톤의 갈색 색채로 조화를 이룸\n· 대상을 관찰하되 이상적으로 재구성해 표현\n기법: 픽처레스크, 레푸수아르, 클로드 글라스"],["로코코의 시대적·사회적 배경은?","· 바로크에 대한 비판으로 등장\n· 절대왕정의 쇠퇴, 귀족·부르주아 출신 중심의 그림\n· 페트 갈랑트 유행\n· 푸생파보다 루벤스파가 중심\n· 계몽주의와 프랑스 혁명의 영향"],["로코코 조각에서 유행한 양식은?","퐁파두르 양식 (조개 모티프).\n※ 녹취가 불명확한 부분 — 로카이유(rocaille)와 함께 교재 확인 권장."],["프라고나르의 그림에 대해 설명하시오.","로코코 화가.\n· 페트 갈랑트를 주제로 화려한 색채와 섬세한 표현\n· 네덜란드·플랑드르 풍경화의 영향으로 꽃이 만발한 자연을 그림\n· 파스텔 색채와 유동적인 붓질, 낙천적인 성격"],["윌리엄 호가스에 대해 설명하시오.","영국 로코코 화가.\n· 당대의 현실적 주제에 초점을 맞춰 영국 미술을 근대적으로 변화시키고, 영국 미술을 독립적인 양식적 화파로 만드는 데 중요한 역할\n· 사회적 악습을 풍자하기 위해 연극 무대를 재현한 듯한 연작 그림을 그림"],["기입: 풍속화이자 집단 초상화에 해당하는 것으로, 가족이나 친구 모임의 단란한 정경을 그린 것.","컨버세이션 피스(Conversation Piece)."]];</script>
<style>
body{margin:0;padding:12px;font:15px/1.6 system-ui,'Malgun Gothic',sans-serif;background:#f6f6f4;color:#1c1c1c}
#bar{position:sticky;top:0;z-index:9;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;margin:-12px -12px 12px;background:#fff;border-bottom:1px solid #ddd}
#bar button{padding:6px 10px;border:1px solid #bbb;border-radius:6px;background:#fafafa;cursor:pointer;font-size:14px}
#bar button:active{background:#eee}
#bar label{font-size:14px;cursor:pointer}
details{background:#fff;border:1px solid #e0e0e0;border-radius:8px;margin:0 0 8px;padding:10px 12px}
details[open]{border-color:#b9c6d8}
summary{cursor:pointer;font-weight:600}
summary b{color:#3a6ea5;margin-right:4px}
.a{white-space:pre-wrap;margin:10px 0 0;padding-top:10px;border-top:1px dashed #ddd;color:#333}
.w{display:inline-block;margin-top:10px;font-size:13px;color:#a33;user-select:none}
.w input{vertical-align:-2px}
details:has(.w input:checked){background:#fff6f6;border-color:#e3b7b7}
</style>
<div id=bar><label><input type=checkbox id=only> 틀린 것만</label><button id=exp>오답 내보내기</button><button id=cpy>번호 복사</button></div>
<div id=app></div>
<script id=s>
const $=s=>document.querySelector(s),app=$('#app');
let st={};try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
app.innerHTML=QA.map((v,i)=>`<details data-i=${i}><summary><b>${i+1}.</b>${v[0]}</summary><div class=a>${v[1]}</div><label class=w><input type=checkbox data-c=${i}> 틀림</label></details>`).join('');
const flt=()=>app.querySelectorAll('details').forEach(d=>d.hidden=$('#only').checked&&!st[d.dataset.i]);
app.querySelectorAll('[data-c]').forEach(c=>{c.checked=!!st[c.dataset.c];c.onchange=()=>{st[c.dataset.c]=c.checked;save();flt()}});
$('#only').onchange=flt;flt();
const nums=()=>QA.map((_,i)=>st[i]?i+1:0).filter(Boolean);
const fb=t=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();alert(t||'없음')};
$('#cpy').onclick=()=>{const t=nums().join(',');try{navigator.clipboard.writeText(t).then(()=>alert('복사: '+(t||'없음')),()=>fb(t))}catch(e){fb(t)}};
$('#exp').onclick=()=>{const q=QA.filter((_,i)=>st[i]);if(!q.length)return alert('체크된 문항이 없습니다');
const h='<!doctype html><html lang=ko><meta charset=utf-8><title>'+KEY+'-wrong</title><script>const KEY='+JSON.stringify(KEY+'-wrong')+';const QA='+JSON.stringify(q)+';<\/script>'+$('style').outerHTML+$('#bar').outerHTML+'<div id=app></div>'+$('#s').outerHTML;
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download=KEY+'-wrong.html';a.click();URL.revokeObjectURL(a.href)};
</script>
