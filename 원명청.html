<script>
const QA=[
["원나라 화단의 전체적 특징은?","몽골족이 한족을 몰아내고 원을 세우면서 화원(원체) 화풍이 쇠퇴. 나라 잃은 슬픔·울분을 표현하는 유민화가 등장. 한족 지식인이 관직을 버리고 은거하며 수양·취미로 그림을 그려 문인화가 화단을 지배."],
["원대에 유입된 종교는?","라마교(티베트 불교)."],
["전선 〈부옥산거도〉의 특징은?","복고주의 천명(당·송의 고법 추구). 이곽파 영향의 잡목 표현(계산행려도의 잡목과 유사), 당 이소도풍의 고식(古式) 산 표현, 이사훈 계열의 청록 설채. 북종화와 남종화를 절충하려 함."],
["〈부옥산거도〉에 나타나는 원대 산수화의 특징은?","자연 자체의 재현에서 벗어나 사의성 표현에 초점을 두고 과거 양식과의 절충을 시도. 그림에 시를 쓰거나 감상자의 찬을 덧붙여 시·서·화 삼절을 본격 추구. 은일 사상 반영."],
["황공망 〈부춘산거도〉의 특징은?","부춘강의 풍경을 그린 실경 산수. 피마준·반두준·미점준·하엽준·갈필 등 다양한 준법 사용. 지극히 간결하고 맑고 윤택한 필묵으로 몰골·건묵·습묵을 적절히 섞어 문인 산수화의 최고 모범으로 평가. 존재감이 미미했던 동원·거연(동거파) 화풍을 중국 화단의 주류로 올려놓음."],
["절파의 명칭 유래와 배경은?","대진이 창시. 대진의 고향이 절강성이어서 앞 글자 '절'을 따 절파라 불림."],
["절파의 특징은?","마하파 계승 - 변각구도, 부벽준 사용. 마하파보다 더 거칠고 강한 필묵, 강한 흑백 대비. 소경산수(인물 부각), 중경 삽입·원경 생략. 의도적으로 복잡하고 무질서함을 추구."],
["초기 절파를 왜 광태사학파라 불렀나?","필치가 너무 거칠고 구성이 과격하여 문인들이 '미쳤다'는 경멸의 뜻으로 미칠 광(狂)자를 써서 부름."],
["명대 절파 화풍이 조선 초기에 영향을 준 화가는?","강희안."],
["오파의 배경과 특징은?","심주·문징명 중심. 심주의 고향 오현(吳縣)의 '오'를 따 오파. 원말 4대가의 영향을 받되 고스란히 답습하지 않고 자신만의 개성을 가미. 형식에 지나치게 구애받지 않고 신선하고 세련된 색채와 자유로운 화면 구성 추구."],
["명대 공예 두채(鬪彩)의 기법은?","성화 연간. 청화로 문양의 윤곽선을 그리고 유약을 발라 고온에서 구운 뒤, 청화 윤곽선 안에 녹색·적색·황색 등 안료를 칠해 다시 저온에서 구워내는 상회 기법. 초록·연두 계열을 즐겨 씀."],
["오채와 두채의 차이점은?","둘 다 유약 위에 문양을 그리는 상회 기법. 두채는 청화로 윤곽선을 그리고 그 안에 채색(윤곽선 필수), 오채는 정해진 윤곽 없이 자유롭게 채색."],
["청나라의 시대적 배경은?","만주족(여진족)이 명을 무너뜨리고 건국. 원과 달리 한족을 무조건 박해하지 않고 회유·문화 통치. 금석학·고증학 장려로 청동기 등 복고 취향 유행. 후기에는 아편전쟁으로 영국에 의해 문호 개방."],
["청대 회화 화단의 전개는?","초기에 정통파(사왕오운)와 혁신파(창신파: 사승·유민화가)가 등장. 동기창의 상남폄북론 영향으로 남종문인화 유행. 궁중에서는 낭세녕 등 서양 선교사가 기록화를 그리며 사실적 서양화법과 동양화법이 결합. 이후 양주팔괴, 말기 해상화파 등장."],
["청대 정통파는 누구인가?","사왕오운 - 왕시민·왕감·왕휘·왕원기와 오력·운수평."],
["정통파의 한계는?","동기창은 옛것을 바탕으로 새로움을 더하라 했으나, 지나치게 방작과 고법에만 치우쳐 형식화되고 사의성과 이상성을 결여."],
["사왕오운 중 운수평은?","왕휘에게 밀려 산수화에서 화훼화로 전향. 왕휘는 우산파, 왕원기는 누동파를 창시."],
["운수평이 주장한 섭정론(攝情論)이란?","대상의 사실성보다 자신의 마음과 감정을 담아서 그린다는 화론."],
["팔대산인 그림의 특징은?","감필로 반추상적 표현. 졸고 있는 새, 눈을 부릅뜬 물고기 등 주변 사물을 통해 나라 잃은 울분과 저항 의식을 표출."],
["황산파의 특징은?","준법을 거의 사용하지 않고 메마른 갈필의 필선 사용. 바위를 기하학적이고 각지게 표현. 황산의 실경을 그림."],
["홍인의 특징은?","황산파의 대표. 준법을 거의 쓰지 않고 메마른 필선, 바위를 기하학적·각지게 표현. 예찬의 절대준 영향. 작품을 판화로도 제작해 한국·일본 등 해외에 영향을 미침."],
["석도의 표현 특징은?","황산파의 영향을 받았으나 황산파의 특징인 메마른 필선이나 기하학적 윤곽선을 쓰는 대신, 먹을 진하게 쓰고 각진 형태를 추구하지 않으며 자유로운 변형을 가함. 색점을 넣거나 엉킨 실타래 같은 필선."],
["정통파와 창신파(혁신파)의 차이는?","정통파는 동기창의 뜻을 따라 준법을 많이 쓰고 방작 위주의 산수화. 창신파는 방작을 경멸하고 준법을 의도적으로 멀리하며 자신만의 가법으로 개성 있는 그림 추구. 사승(석계·팔대산인·석도·홍인)은 모두 유민화가로 이민족 지배에 대한 분노와 슬픔을 나타냄."],
["양주팔괴의 특징은?","화가마다 개성이 각기 다름. 방작하지 않고 참신하고 개성적인 그림. 대중적 소재인 화훼화를 즐겨 사용. 명대 민간 예술 전통 계승. 인물·화훼를 많이 그렸고 표현이 자유롭고 색채가 화려. 말기에는 화단이 혼란해지며 도석인물화보다 장식적·귀족적인 미인도(사녀화)가 증가."],
["해상화파의 등장 배경은?","아편전쟁 패배 후 남경조약으로 상해·천진 등 항구가 강제 개방. 무역과 상업이 활발해져 부유한 상인층이 형성되고 화가들이 상해로 몰려들며 화단이 형성됨."],
["해상화파는 무엇과 무엇으로 나뉘나?","금석파와 친인척으로 이루어진 사임(四任)."],
["금석파의 특징은?","문인화 지향. 금석학을 공부해 서예적 필치가 섞여 나타남. 화훼화를 많이 그리고 서양홍 등 붉은색·강한 색상 사용. 전체적으로 대중적이고 장식적."],
["아속공상(雅俗共賞)이란?","고상한 선비와 속된 일반 서민이 함께 감상하고 즐기는 경지. 민간 예술과의 관계 속에서 도달한 것."],
["해상화파가 주로 쓴 안료는?","서양홍(양홍)."],
["해상화파가 화훼화를 많이 그린 이유는?","주 구매 계층인 부유한 대상인과 외국인들에게 인기가 많았기 때문."],
["조지겸·오창석이 즐겨 쓴 소재와 그 상징은?","등나무. 다손 번창과 부귀를 상징."],
["사임(四任)의 표현 특징은?","네 사람 모두 개성적. 주로 인물화와 화훼화를 다뤘는데, 인물화는 환상파 진홍수풍의 고졸한 그림, 화훼화는 오창석류의 강렬한 채색이 강조된 그림."],
["환상파의 배경과 특징은?","사회가 혼란해지고 환관의 부정부패로 문인 숙청이 잦아지면서 등장. 현실 도피를 위해 골동·고동기 문화나 신선이 사는 세상에 관심을 가짐. 그림에도 비현실적 이상향 등 현실 도피적 성향이 나타남."],
["진홍수의 표현 특징은?","인물·화조·산수에 모두 뛰어남. 고풍스러운 기법으로 처리하면서도 이색적이고 공필로 정세하게 표현. 고개지의 그림처럼 의습을 처리했는데 당시 골동 취향이 반영된 것."],
["남진북최(南陳北崔)란?","남쪽의 진홍수, 북쪽의 최자충."],
["정운붕 〈세상도〉의 의미는?","코끼리 상(象)이 사물의 상(相)과 같은 발음인 점을 이용하여, 마음의 형상을 씻는다는 뜻을 내포."],
["동기창과 막시룡의 저서는?","동기창은 《화지》, 막시룡은 《화설》."],
["동기창 〈청변산도〉의 특징은?","산을 흰 띠 모양으로 표현해 평면적으로 처리한 점이 독특(근대적 시각). 동원의 영향을 받아 산 정상은 반두로 처리."],
["동기창 〈현계초은도〉의 제목 뜻은?","초은(招隱)은 은자를 찾아 방문한다는 뜻."],
["동기창이 창시한 화파와 등장 배경은?","송강파(화정파라고도 함). 후기 오파가 건실한 구도와 세부 처리를 추구하지 않고 윤곽 속필로 그리거나 기발한 아이디어만 좇는 감각적 화풍으로 흐른 것을 폐단으로 인식, 순수한 문인화를 추구하기 위해 등장."],
["송강파의 큰 특징은?","원사대가를 모방하고 그중에서도 황공망을 으뜸으로 삼음. 방작을 매우 많이 함. 동기창의 의도는 방작에 새로움까지 더하는 것이었으나 후대는 방작에 그침."],
["절파와 오파를 구도·필묵·준법으로 비교하면?","절파는 중경을 의도적으로 강하게 삽입해 무질서와 혼란을 나타내고 수묵 위주에 부벽준 등 준법을 많이 씀. 오파는 구도를 자유롭거나 간결하게 쓰고 맑은 색채를 사용하며 준법을 자제(특히 문징명)."],
["양명학이란?","성리학이 이(理)와 이상, 격물치지를 중시한 데 비해 개인의 마음을 중시한 보다 실질적인 유학. 청 초기 창신파와 양주화파·해상화파에 영향."],
["원나라 공예의 특징은?","청화백자가 크게 유행. 라마교의 영향으로 색이 강렬하고 화려·장식적. (법랑은 송대에 등장)"],
["별도의 얇은 문양판을 덧붙여 장식하는 기법은?","첩화(貼花)."],
["청화백자에 철 성분이 검은 점처럼 드문드문 나타나는 것은?","철반문."],
["구획된 테두리 안에 유약을 발라 저온에서 구워내는 금속공예 기법은?","겹사법랑(유선칠보). 우리나라에서는 '파란'이라 부름."],
["정사초의 난처럼 뿌리 아래 흙을 그리지 않는 난 그림은?","노근란. 몽골에 국토를 빼앗긴 것을 상징."],
["전선 〈산거도〉의 특징은?","산속에 은거하고 싶은 마음을 표현. 남송 조백숙의 〈만송금궐도〉의 영향으로 소나무 형태가 둥글둥글하고 구도도 이를 따름. 청록산수 화풍."],
["조맹부 〈작화추색도〉의 특징은?","역원근법의 역삼각형 구도. 좌측 작산은 피마준, 우측 화부주산은 하엽준. 청록산수 요소. 산과 나무를 서예의 기법으로 처리해 회화와 서예의 일치를 시도."],
["조맹부가 말한 회화와 서예의 일치는?","서화용필동법(書畵用筆同法)."],
["오진이 묵죽 그림을 묶은 화첩은?","《묵죽보》. 방작의 원류로 평가됨."],
["오진의 표현 특징은?","갈필을 덜 쓰고 먹과 물기가 있는 습윤한 필묵 사용. 〈어부도〉, 《묵죽보》의 대나무 그림."],
["왕몽 〈청변은거도〉의 특징은?","화면을 빽빽하게 가득 채운 밀집 구성. 우모준으로 암석을 거칠게 표현. 고원법과 부감시."],
["변문진 〈삼우백금도〉가 특이한 점은?","문인화의 주제인 세한삼우와 직업 화가들이 즐겨 그린 화조화를 결합한 점. 공필로 그림. (수묵 사의 화조화의 개척자는 임량)"],
["세한삼우의 뜻과 함의는?","소나무·대나무·매화. 추운 겨울을 함께 버티는 세 벗. 선비의 지조와 절개를 뜻함."],
["이재 〈방곽희산수도〉의 특징은?","곽희의 〈조춘도〉를 바탕으로 했으나 전체 경물이 혼잡스럽고 무질서하게 배치되어 있으며, 산은 도안화되고 사찰이 부자연스럽게 자리 잡음. 이러한 경향이 명대 산수의 대표적 특징이며 절파 화풍의 기초가 됨."],
["원대 이곽파의 특징은?","이곽파 화풍을 본받으면서도 인물을 부각. 산과 나무가 커지고 도안화됨. 중앙의 산이 유기적으로 연결되지 않고 조각으로 나뉘어 회화적으로 재구성됨. 나무는 회화성을 위해 사실성을 잃음. 전경의 나무를 과도하게 크게 그리고 중경은 경물 대신 여백으로 처리."],
["원파(院派)의 특징과 그 기법은?","누각 등을 섬세하게 그림. 자를 대고 선을 그어 그리는 계화(界畵) 기법을 사용."]
];
const S=document.querySelector("style"),
card=(q,a,n,c)=>"<details><summary>"+n+". "+q+"</summary><div class=a>"+a+"</div><label><input type=checkbox"+(c?" checked":"")+"> 틀림</label></details>";
let W={};try{W=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(W))}catch(e){}},
wr=()=>QA.map((_,i)=>i).filter(i=>W[i]),
flt=()=>{[...list.children].forEach((d,i)=>d.hidden=only.checked&&!W[i]);cnt.textContent="총 "+QA.length+"문항 / 오답 "+wr().length};
list.innerHTML=QA.map(([q,a],i)=>card(q,a,i+1,W[i])).join("");
[...list.children].forEach((d,i)=>d.querySelector("input").onchange=e=>{W[i]=e.target.checked;save();flt()});
only.onchange=flt;flt();
exp.onclick=()=>{const w=wr(),h="<!doctype html><meta charset=utf-8><title>"+KEY+"-wrong</title><style>"+S.textContent+"</style><h1>오답 노트 ("+w.length+"문항)</h1>"+w.map(i=>card(QA[i][0],QA[i][1],i+1,1)).join(""),
u=URL.createObjectURL(new Blob([h],{type:"text/html"})),a=document.createElement("a");a.href=u;a.download=KEY+"-wrong.html";a.click();URL.revokeObjectURL(u)};
cp.onclick=async()=>{const t=wr().map(i=>i+1).join(",");try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement("textarea");x.value=t;document.body.append(x);x.select();document.execCommand("copy");x.remove()}cp.textContent="복사됨";setTimeout(()=>cp.textContent="번호 복사",1200)};
</script>
