<script id="d">const QA=[
["중세의 미술교육","길드 교육과 수도원 교육. 길드는 도제-직인-장인으로 이어지는 도제식 교육이며, 모방과 구두(口頭)식으로 이루어졌다."],
["르네상스 미술교육의 특징","· 초기: 대가와 초학자가 모여 서로의 작품을 토론·감상하는 비공식 워크숍 형태\n· 후기: 아카데미아 델 디세뇨 같은 공식 아카데미 설립, 대가들이 정립한 법칙을 바탕으로 체계적 교육(원근법, 해부학, 인체 자세 등)"],
["르네상스 교육의 목적","신과 같이 창조물을 만들 수 있는 예술가를 기르는 것. 그런 창조를 위해 일정한 법칙을 배워야 한다고 보았다."],
["르네상스 후기의 교육 방법과 과목","바사리의 『예술가 열전』 등으로 대가들의 법칙을 체계화하고, 이를 일방적으로 모방·전수받는 형태. 과목은 원근법, 인체 해부학, 비례, 드레이퍼리 등. 학교는 도시 캠퍼스 형태를 취했고, 추구한 미는 데코룸이었다."],
["르네상스 아카데미의 '도시 캠퍼스' 형태란?","한 건물에 정해져 있지 않고 현대 대학처럼 도시 공간 곳곳에 흩어져 이를 활용하는 형태."],
["데코룸(decorum) 미술","'교양 있고 적절하며 중도적인'이라는 뜻. 감정에도 이성에도 지나치게 치우치지 않는 적절하고 중도적인 미술."],
["디세뇨(disegno)","예술가가 그림을 그리기 이전에 머릿속에서 구상하는 활동. 드로잉이나 밑그림도 여기에 해당한다. '그리다(disegnare)'의 명사형."],
["알베르티의 저서","『회화론』"],
["알베르티가 제시한 회화의 법칙","· 원근법에 기초한 인간 형태의 비율, 빛에 의한 공간감으로 역사적 현실성을 불러일으켜야 한다\n· 회화는 고전 문헌이나 성서에서 유래한 역사적 에피소드(히스토리아)를 담아야 한다\n· 사람들을 교화하고 공포·기쁨을 느끼게 하며 교육할 수 있는 주제를 전달하기 위해 적절한 색감·빛·비율·구성으로 정교하게 제작되어야 한다"],
["전제주의 시대의 미술교육","프랑스 왕립 회화조각 아카데미, 그리고 존 로크의 신사 교육."],
["프랑스 왕립 회화조각 아카데미의 배경과 목적","왕권이 강해지던 시기를 배경으로 함. 목적은 두 가지 — ① 길드 견제 ② 정치 선전적 그림을 그려 왕권을 강화하는 것."],
["프랑스 왕립 아카데미의 교육 과정","교수(대가)의 드로잉 모사 → 석고 드로잉 → 실물 드로잉."],
["아카데미 장르의 최상위·최하위 등급","가장 높은 것은 역사화, 가장 낮은 것은 정물화."],
["존 로크의 미술교육 주장","『교육론(신사 교육론)』에서 드로잉을 신사가 배워야 할 교양 교육의 필수 요소로 주장. 드로잉을 배우면 불분명한 생각을 정리할 수 있고, 말이나 언어보다 조용하면서도 정확하고 효율적으로 시각적 전달이 가능하다고 보았다."],
["로크의 아마추어 미술교육의 의의","최초로 미술교육이 직업 화가를 위한 전문교육이 아니라, 엘리트 계층을 위한 일반 교육으로서의 역할을 하게 했다."],
["계몽주의 시대 미국의 아카데미","유럽 아카데미를 모방. 1791년 필라델피아 아카데미 창립. 1749년 벤저민 프랭클린이 제출한 필라델피아 아카데미 교육계획안에 드로잉이 포함되었다."],
["벤저민 프랭클린의 의의","드로잉이 신사를 위한 것이 아니라 기계공을 위한 것임을 강조함으로써, 미국에서 최초로 미술교육과 산업의 연계 필요성을 주장했다."],
["계몽주의 시대 프랑스·영국·독일의 학교 명칭","프랑스: 장식미술학교 / 영국: 디자인학교 / 독일: 무역학교"],
["예술가의 작업장이나 화실을 뜻하는 말은?","아틀리에(atelier)"],
["영국 디자인학교의 교육 체제 변화","윌리엄 다이스가 이끌다가 만국박람회에서 혹평을 받은 뒤 헨리 콜로 바뀜. 콜은 교육을 이원화하여 ① 모두를 대상으로 한 일반 드로잉 교육 ② 전문가 대상 전문 교육으로 나눔. 레드그레이브의 23단계를 따라 체계화해 순서대로 가르쳤고 실물 드로잉을 포함시켰다. 사우스 켄싱턴 사범학교도 세웠다."],
["헨리 콜의 바람직한 장식의 원칙","기하학의 원칙, 고착의 원칙, 자연의 직접적 모사."],
["러스킨이 제시한 미술교육의 두 가지","시각과 창안. 창안은 무언가를 새롭게 창조하는 것으로, 신이 부여한 것이어서 타고나야 하는 능력이다."],
["페스탈로치의 '관념의 ABC'","알파벳 ABC를 배우고 사용하듯이 선·곡선·각을 순서대로 사용하며, 이를 마치 알파벳처럼 읽어낼 수 있다고 본 것."],
["페스탈로치의 교육 내용","소묘와 수공(공작)을 통해 눈과 손의 감각 훈련을 강조했다."],
["루소의 저서","『에밀』"],
["루소가 창의성 중심 미술교육 학자들에게 준 영향","· 미술에 대해 지도하거나 간섭하지 않는 것이 바람직하다\n· 아동은 창의적 잠재력이 있고 이를 개발하기 위해 미술을 활용해야 한다\n· 자유로운 학습 환경을 조성해 어린이가 미술 능력을 표출하게 해야 한다\n· 어린이의 욕구와 흥미를 바탕으로 미술 경험을 제공해야 한다"],
["실러의 저서","『인간의 미적 교육에 관한 서간』"],
["실러의 시대적 배경","· 정치적: 자유와 평등을 위해 시작된 프랑스 혁명이 폭력으로 물든 것에 대한 절망감\n· 경제적: 산업혁명의 분업적 노동으로 사람들이 자아 정체성을 잃고 분열됨 → 총체적 인간으로 거듭나야 함을 주장\n· 사상적: 칸트 『판단력 비판』"],
["실러의 세 가지 충동","· 물질충동: 감정, 직관, 감각, 즉흥\n· 형식충동: 사고, 판단, 법칙\n· 유희충동: 앞의 두 충동을 결합한 것"],
["유희충동을 가지면 어떻게 되는가?","물질충동과 형식충동을 적절히 조화시켜 미적 인간으로 거듭날 수 있다. 유희충동이 발달한 예술가야말로 미적 자유를 얻은 진정한 조화로운 인간이 될 수 있다."],
["미적 가상이란?","논리적 가상이 아니라 아름다움을 비추는 가상으로, 순수예술에 해당하는 것."],
["실러의 의의","미술을 총체적 인간성 확립의 수단으로 보아, 미술교육의 중요성을 최초로 환기시켰다."],
["표현기능중심 미술교육의 배경","산업혁명의 대량 생산으로 제품의 질이 저하되어 등장. 아카데미 미술교육의 오랜 전통을 이어받았다."],
["표현기능중심 미술교육의 성과","· 미술교육을 학교 교육의 한 부분으로 자리 잡게 함\n· 눈과 손의 협응력을 위해 체계적·과학적으로 지도함\n· 드로잉에 한정되었던 아카데미 전통 미술교육을 디자인·건축 등 다양한 분야로 확장\n· 미술교육이 사회적 요구를 적극적으로 수용하도록 실천함"],
["표현기능중심 미술교육의 한계점","· 학습자의 특성을 고려하지 않은 획일적 프로그램과 반복 훈련 강조\n· 학생을 작품·제품 생산을 위한 도구로 바라봄\n· 학교생활을 단지 미래를 위한 준비 과정으로 보고 지나친 희생과 훈련을 강조\n· 미술 표현에 정해진 법칙이나 방법이 있다고 믿고 이를 주입하려 함"],
["미술교육의 정당성 두 가지와 표현기능중심의 위치","본질주의(내재적) 정당성과 맥락주의(외재적) 정당성. 표현기능중심은 맥락주의에 속한다."],
["맥락주의 정당성이란?","미술교육이 개인이나 사회의 발전을 도모하는 유용한 수단이 될 수 있기 때문에 필요하다는 입장."],
["도우(Dow)의 저서","『구성(Composition)』"],
["도우의 교육 방법","종합적 지도 방법. 미술의 기본을 자신이 정리한 디자인의 요소와 원리로 치환하여, 학생이 미술을 체계적으로 배울 수 있게 했다. 이 요소와 원리는 과거·현재·미래, 동양·서양 미술의 모든 형태에서 가장 기본이 된다고 보았다."],
["도우의 디자인 3요소와 원리","· 3요소: 선, 노탕(명암), 색채\n· 원리: 대립, 변화, 종속, 반복, 대칭"],
["바우하우스의 배경","대량 생산으로 제품 품질이 떨어지면서 예술과 공업의 결합 필요성이 대두됨. 산업혁명, 독일공작연맹(DWB), 미술공예운동의 영향을 받았다."],
["바우하우스의 목표","· 건축을 중심으로 순수미술과 응용미술 등 모든 예술을 통합(종합예술)\n· 공예가의 지위를 순수미술 수준으로 격상\n· 산업 지도자·장인들과 꾸준히 교류하여 학생들이 이후 사회에 진출할 수 있도록 도움"],
["바우하우스의 교육과정 단계","예비교육 → 공방교육 → 건축교육"],
["바우하우스 공방교육의 구성","형태교육과 공작교육. 공작교육은 물건을 만드는 것이고, 형태교육은 관찰·표현·형성의 세 가지로 이루어진다."],
["바우하우스의 시사점과 한계점","· 시사점: 산업사회가 필요로 하는 미술가 양성에 기여했고, 체계적이고 합리적인 교수법이 20세기 이후 디자인 교육 전반에 영향을 미쳤다\n· 한계점: 기술·기능 위주의 교육에 지나치게 중점을 두었고, 미술의 본질을 협소하게 해석해 도구로서의 미술교육에 국한시켰다"],
["대공황기(오와토나 프로젝트) 미술교육","듀이의 실용주의 사상과 사회재건주의 철학을 바탕으로, 미술교육을 공동체 재건과 일상의 문제를 해결하는 수단으로 사용. 주제를 통합하고 지역 사회를 강조했다."],
["오와토나 프로젝트의 목적","· 예술을 통해 사회의 문제를 해결하는 것\n· 학생의 취미를 개발하여 민주 시민으로 형성되도록 하는 것\n· 창의적 활동을 경험하는 것"],
["오와토나 프로젝트의 성과","기금이 중단된 뒤에도 미술교육 프로그램을 그대로 유지했고, 미술을 주제로 하는 다양한 토론회와 미술 야간 수업을 설립하자는 요구가 증가했다."],
["창의성 중심 미술교육의 배경","표현기능중심 미술교육에 대한 반발, 아동중심 교육사조의 확산, 표현주의 미술의 등장, 심리학의 발달."],
["창의성 중심 미술교육의 성과","· 미술교육의 주체를 교사에서 어린이로 전환시킴\n· 미술교육을 인간의 삶과 교육에서 중요한 위치로 격상시킴\n· 미술교육에서 아동의 표현 과정과 발달 과정의 중요성을 인식시킴"],
["창의성 중심 미술교육의 한계점","· 지나치게 자기표현을 중시하여 미술교육에 필요한 기초 기능 부족을 초래\n· 교사의 역할을 축소해 수업이 방임적으로 흐를 수 있음\n· 미술의 본질과 사회적 요구를 무시하고 미술을 자기표현·정서표현으로 한정시킴"],
["치젝의 교육 방법","· 재료 선택지 제공\n· 그룹별 지도\n· 성인의 간섭 배제"],
["치젝의 그룹별 지도","상상하는 것을 그리기를 원하는 아동과 보고 그리기를 원하는 아동으로 나누어 그룹별로 지도했다."],

["로웬펠드가 말한 창의성의 네 가지 특성","감수성, 유창성, 융통성, 독창성."],

["발도르프의 네 가지 기질","우울질, 담즙질, 점액질, 다혈질."],
["허버트 리드의 저서","『예술을 통한 교육』"],

<script id="r">
const $=id=>document.getElementById(id),L=$('list'),B=[];

QA.forEach((q,i)=>{
