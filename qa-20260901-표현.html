["판본체가 받은 영향과 특징","한자의 전서체 영향을 받아 등장. 필획의 굵기가 일정하고 가로획과 세로획이 수평, 수직을 이루며 글자가 정방형이고 좌우 대칭적. 획의 중심과 글자의 중심이 모두 가운데에 있음"],

<style id="cs">
body{margin:0;padding:16px;font:16px/1.6 -apple-system,system-ui,sans-serif;color:#222;background:#fafaf8}
.bar{position:sticky;top:0;background:#fafaf8;padding:8px 0 10px;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:9}
.bar button{padding:6px 10px;font-size:14px;border:1px solid #bbb;border-radius:6px;background:#fff}
.bar label{font-size:14px}
#n{font-size:13px;color:#777;margin-left:auto}
details{border-bottom:1px solid #e5e3dd;padding:10px 2px}
summary{cursor:pointer;font-weight:600}
summary b{color:#a35}
details p{margin:8px 0 6px;padding-left:14px;border-left:3px solid #e0ddd4;white-space:pre-wrap}
.w{font-size:13px;color:#a35;padding-left:14px}
</style>
<div id="app"></div>
<script id="s">
const D=document,app=D.getElementById('app');let st={};
try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
app.innerHTML='<div class="bar"><label><input type="checkbox" id="f"> 틀린 것만</label><button id="ex">오답 내보내기</button><button id="cp">번호 복사</button><span id="n"></span></div>'+QA.map((q,i)=>'<details><summary><b>'+(i+1)+'.</b> '+q[0]+'</summary><p>'+q[1]+'</p><label class="w"><input type="checkbox" data-c="'+i+'"> 틀림</label></details>').join('');
const its=[...app.querySelectorAll('details')],W=()=>QA.map((_,i)=>i).filter(i=>st[i]),g=id=>D.getElementById(id);
const upd=()=>{const f=g('f').checked;its.forEach((d,i)=>d.style.display=f&&!st[i]?'none':'');g('n').textContent='틀림 '+W().length+' / '+QA.length};
app.querySelectorAll('[data-c]').forEach(b=>{const i=b.dataset.c;b.checked=!!st[i];b.onchange=()=>{b.checked?st[i]=1:delete st[i];save();upd()}});
g('f').onchange=upd;upd();
g('ex').onclick=()=>{const h='<!doctype html><meta charset="utf-8"><title>'+KEY+'-wrong</title><style id="cs">'+g('cs').textContent+'</style><script>const KEY='+JSON.stringify(KEY+'-wrong')+',QA='+JSON.stringify(W().map(i=>QA[i]))+';<\/script><div id="app"></div><script id="s">'+g('s').textContent+'<\/script>',a=D.createElement('a');
a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download=KEY+'-wrong.html';a.click()};
g('cp').onclick=async()=>{const t=W().map(i=>i+1).join(',');try{await navigator.clipboard.writeText(t)}catch(e){const x=D.createElement('textarea');x.value=t;D.body.append(x);x.select();D.execCommand('copy');x.remove()}};
</script>
