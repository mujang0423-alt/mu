<h1>서양미술사 용어 정리 (0905)</h1>
<div id="b"><label><input type="checkbox" id="o"> 틀린 것만</label><button id="e">오답 내보내기</button><button id="c">번호 복사</button></div>

<script id="d">const QA=[["14세기 후반~16세기 프랑스 고딕 건축의 최종 단계를 가리키는 용어로, 19세기 초 건축사에 도입되었다. 곡선 양식의 반대 형태이며 후기 고딕의 격자창 장식에서 파생되어 불꽃 같은 형태를 이룬다.", "플랑부아양 양식."], ["'유동·유출·변전'의 뜻으로, '흘러가다·밀려오다'라는 라틴어에서 유래한 말. 혼합매체적인 액션 형식의 하나로 극단적인 반예술 운동을 가리킨다.", "플럭서스."], ["플럭서스에서 '이벤트'란?", "일시성·무계획성을 특징으로 하는 행위. 크게는 해프닝의 일종이나 일시성과 무계획성이 강해 해프닝보다 즉흥적이고 덜 연극적. 보이스는 연기와 문학적 창조성을 부정하고 연기에 탐닉하는 해프닝에 반대하며, 현실성 자체를 전면에 드러내기 위해 자유의지에 의한 픽션 없는 이벤트를 주장."], ["프리드가 미니멀 아트와 대상성 개념과 관련하여 제시한 것으로, 대상에 대한 인식과 체험을 얻어내는 모더니즘 세계관의 일부를 이루는 개념은?", "현존성."], ["현존성은 무엇을 극복함으로써 완성되는가?", "회화에서의 환영주의."], ["프랭크 게리는 디자인사에서 어디에 속하는가?", "해체주의."], ["건축의 노벨상으로 불리는 상은?", "프리츠커상."], ["아실 고르키의 미술사적 위치는?", "최초의 추상표현주의 작가이자 최후의 초현실주의 작가."], ["아실 고르키의 조형적 특징은?", "자동기술법에서 출발해 추상으로 나아감. 강한 생명력과 성적인 분위기를 띠는 유기체적 추상."], ["낸 골딘의 작업은?", "사진작가로, 사회에서 주류로 인정받지 못하는 집단을 촬영하여 그들의 정체성을 다룸."], ["낸 골딘이 1990년대에 제작한 작업은?", "초창기 사진에 등장했던 인물들의 삶이 에이즈로 무너져 가는 것을 시간 순으로 기록하는 작업."], ["공공미술의 정의는?", "공공을 위해 어떤 특정한 목적에 의해 계획되고 실행되는 미술."], ["공공미술의 대표적인 장르로 크게 구상된 것은?", "미디어 파사드."], ["공공미술을 하는 두 가지 방식은?", "① 공공 문제에 대한 글로벌한 이슈를 직접적으로 문제 제기하는 방식. ② 도시 환경의 특정한 문제에 한정하여 장소 특정적으로 작업하는 방식."], ["1930년대 이후 단순하고 양극화된 근대 건축 양식을 지칭하는 용어는?", "국제 양식."], ["국제 양식이라는 용어의 기원이 된 발터 그로피우스의 저작은?", "『국제 건축』."], ["국제 양식 건물의 요건은?", "직육면체 구성, 강철로 된 상자 모양의 공간 추구, 비대칭적인 전체 구성, 평평한 지붕, 장식 없는 표면, 큰 유리창."], ["국제 양식에 사용된 재료는?", "철근 콘크리트 등 산업 재료."], ["굿 디자인이란?", "직설적으로는 '좋은 디자인'이라는 뜻이나, 실제로는 현대 디자인의 규범을 객관적으로 설정하고 대중의 취향을 유도하려는 일련의 계몽적 움직임을 가리킴."], ["굿 디자인의 기준은?", "목적성, 기능성, 심미성, 경제성, 독창성, 사회성."], ["게오르게 그로스가 속한 유파는?", "신즉물주의."], ["신즉물주의는 무엇을 비판하며 등장했는가?", "표현주의와 추상미술. 표현주의가 지나치게 주관적인 감정을 표출하여 현실도피적이라는 점, 추상미술이 지나치게 엘리트주의적이라는 점을 비판."], ["신즉물주의의 표현 특징은?", "인물을 과장하여 우스꽝스럽게 그리는 캐리커처적 묘사. 풍자적이고 사회 고발적."], ["게오르게 그로스의 이력은?", "베를린 다다 운동의 창립 멤버가 되었고 1918년 노벰버 그룹에 가입."], ["후안 그리스가 피카소·브라크의 영감에 의한 작업과 대조를 이루는 점은?", "회색과 갈색을 주조로 하는 단색 톤의 분석적 큐비즘을 거친 후, 가장 처음으로 다시 색채를 사용함."], ["후안 그리스가 도입한 기법은?", "대상의 재현으로부터 해방시키고 자율적인 회화적 과정으로 연출하기 위해 큐비즘의 콜라주 기법을 도입."], ["기계의 구조나 외형에서 현대적인 아름다움을 발견하고 그것을 디자인의 미학적 원리로 삼으려는 입장은?", "기계미학."], ["기계미학의 의의는?", "기능주의 이론의 미학적 토대로서 디자인의 발전에 직접적인 연관과 상상력을 제공."], ["1863년 파리 살롱전에서 낙선한 작품들을 모아 열었던 전시회는?", "낙선전(살롱 데 르퓌제)."], ["낙선전의 의의는?", "19세기 후반 부르주아들에게 프랑스 아카데미 미술의 영향력이 점차 줄어들고 있다는 사실을 방증. 미술가들의 자율성을 무엇보다 중시하는 현대미술이 시작되는 역사적 계기가 됨."], ["낙선전에서 가장 논란이 되었던 마네 「풀밭 위의 점심 식사」가 전통과 다른 두 가지는?", "명암법(입체감 없는 평면적 묘사)과 주제 선정."], ["낙선전 이후 이어진 전시는?", "앵데팡당전."], ["코르벨(내쌓기) 기법이란?", "돌이나 나무 등의 재료를 층층이 쌓을 때 이를 지탱하기 위해 각 층을 아래층보다 더 튀어나오게 쌓는 방식."], ["에밀 놀데의 유파와 즐겨 사용한 기법은?", "표현주의. 목판화와 에칭을 많이 사용."], ["회화주의 사진의 등장 배경은?", "사진이 예술을 생산할 수 있는 매체라는 것을 증명하기 위해 시작됨. 사진에 가공과 기법을 가해 회화와 같은 예술성을 담고자 함."], ["계몽주의는 무엇을 토대로 등장했는가?", "존 로크가 데카르트에 반대하여 인간은 환경의 산물이라 주장하며 형성된 경험주의, 그리고 과학의 발전. 이성과 지식을 통해 사회적·지성적 개혁에 도달할 수 있다는 믿음이 기반이 됨."], ["고딕에서 말하는 이상주의와 자연주의의 차이는?", "이상주의는 고대의 그림처럼 대상을 이상화시켜 그리는 것. 자연주의는 대상의 감정이 드러나도록 사실 그대로 표현하는 것으로, 사실적인 표현에 힘입어 인간적인 면이 부각됨을 뜻함."], ["안토니 곰리의 작업이 유사하다고 평가되는 종교는?", "불교. 정신 수련과 비슷하다고 봄. 자신의 몸을 직접 캐스팅함으로써 작가는 물질을 가장 가깝게 경험하며, 인체를 대상이 아닌 외부 세계를 접하는 장소로 인식."], ["안토니 곰리 인물상 설치 작업의 의도는?", "인물상은 특수한 장소에 설치되어야 장소와 조형물의 관계에서 새로운 맥락을 창출함. 우리가 살고 있는 익숙한 장소의 다른 측면을 구체화하는 것."], ["관계미학이 등장한 전시의 이름은?", "트래픽전."], ["관계미학은 무엇에 반발하며 등장했는가?", "제도 비판 미술."], ["관계미학의 내용은?", "부리오에 따르면 관계적인 작품은 비평이나 미술 기관 같은 미술 제도를 염두에 두지 않음. 제도 비판적·정치적 미술에서 벗어나 포괄적인 상호 인간관계를 주제로 사회적 상호작용과 신체적 반응을 이끌어내는 데 목적을 둠."], ["부리오가 예술가를 무엇으로 규정했는가?", "사회적 엔지니어."], ["부리오가 마르크스 이론을 빌려 전시 장소를 설명한 개념은?", "사회적 틈."], ["관계미학에서 부리오가 추구하는 두 가지 가치는?", "연회에서의 유쾌함, 상호주체성."], ["클레어 비숍이 관계미학을 비판하며 낸 저서는?", "「적대감과 관계의 미학」."], ["클레어 비숍의 비판 요지는?", "사람들을 초대해 함께 식사하는 식의 작업이 실질적으로 어떤 사회적 관계를 형성했는지, 실제로 해결된 것이 있는지를 문제 제기."], ["브루스 나우먼 「녹색 빛의 통로」는 어떤 작품인가?", "관람자가 녹색 빛이 감도는 아주 좁은 공간을 통과하게 하고, 폐쇄회로 카메라를 설치해 관람자가 자신의 모습을 볼 수 있도록 한 작품."], ["미술비평가 카터 래트클리프가 관람자에게 불편한 감정을 유발하는 작품을 규정한 용어는?", "적대적 공감."], ["구타이 그룹이란?", "일본의 전위 미술가 운동. 퍼포먼스로 유명하며, 이후 육체를 사용하는 퍼포먼스나 해프닝 등을 포괄적으로 지칭하는 데 영향을 줌."], ["1957년 프랑스에서 미셸 번스타인, 콩스탕, 기 드보르, 아스거 요른 등에 의해 출범한 급진적인 정치·문화 운동은?", "상황주의 인터내셔널(국제상황주의, SI)."], ["상황주의 인터내셔널이 다른 혁명 운동과 구별되는 점은?", "정부나 경제 시스템을 장악하려기보다 문화나 가족 제도에 대한 태도를 바꾸자는, 일상생활에서의 혁명을 요구했다는 점."], ["상황주의 인터내셔널의 네 가지 기법은?", "표류, 전용, 심리지리학, 통합적 도시주의."], ["상황주의 인터내셔널의 모태가 된 두 그룹은?", "이미지주의 바우하우스, 문자주의 인터내셔널."], ["발터 그로피우스가 지은 공장의 이름은?", "파구스 구두 공장."], ["조형 모듈을 일정한 규칙에 의해 확장시키거나 반복시키는 방식으로 제작한 작품을 부르는 용어는? (솔 르윗이 대표적)", "시리얼 아트."], ["일반적으로 추상미술에 대비되는 회화적 형태로서, 개인적인 이야기나 역사·신화 등 구체적인 스토리를 전달하는 서술적 미술은?", "내러티브 아트."], ["레스타니가 1차 선언문 발표 후 개최한 전시의 기치는?", "'현실에 대한 새로운 조망적 접근'."], ["누보 레알리슴의 목적은?", "현실의 단면을 그대로 제시하는 것."], ["다니엘 스포에리는 현실을 어떻게 그대로 제시했는가?", "사람들을 초대해 먹다 남은 음식과 식탁을 그대로 고정해 벽에 걸어 제시. 이를 '타블로 피에주(덫 그림)'라 함."], ["원래는 기둥 열주와 같이 건축물을 받치는 것이란 뜻이지만, 오늘날에는 2층 이상 건물에서 1층에 방을 만들지 않고 기둥만 세운 공간을 가리키는 용어는?", "필로티."], ["고딕 건축의 장식용 소탑 꼭대기에 있는 것은?", "피너클."]];</script>
<script id="s">
const L=document.getElementById('l'),O=document.getElementById('o');
let W={};try{W=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(W))}catch(e){}};
const ft=()=>[...L.children].forEach((d,i)=>d.hidden=O.checked&&!W[i]);
const N=()=>Object.keys(W).map(Number).sort((a,b)=>a-b);
QA.forEach((q,i)=>{
 const d=document.createElement('details');
 d.innerHTML='<summary>'+(i+1)+'. '+q[0]+'</summary><div class="a">'+q[1]+'</div><label class="w"><input type="checkbox"> 틀림</label>';
 const c=d.querySelector('input');c.checked=!!W[i];d.classList.toggle('x',!!W[i]);
 c.onchange=()=>{c.checked?(W[i]=1):(delete W[i]);d.classList.toggle('x',c.checked);sv();ft()};
 L.appendChild(d);
});
O.onchange=ft;ft();
const fb=t=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();alert('복사: '+t)};
document.getElementById('c').onclick=()=>{const t=N().map(i=>i+1).join(',');try{navigator.clipboard.writeText(t).then(()=>alert('복사: '+t),()=>fb(t))}catch(e){fb(t)}};
document.getElementById('e').onclick=()=>{
 const s=N().map(i=>QA[i]);if(!s.length)return alert('체크된 문항이 없습니다.');
 const h='<!doctype html><meta charset="utf-8"><script>const KEY="'+KEY+'-wrong";<\/script><title>'+document.title+' 오답</title>'+document.querySelector('style').outerHTML+'<h1>'+document.querySelector('h1').textContent+' — 오답</h1>'+document.getElementById('b').outerHTML+'<div id="l"></div><script>const QA='+JSON.stringify(s)+';<\/script><script>'+document.getElementById('s').textContent+'<\/script>';
 const u=URL.createObjectURL(new Blob([h],{type:'text/html'})),a=document.createElement('a');a.href=u;a.download=KEY+'-wrong.html';a.click();URL.revokeObjectURL(u);
};
</script></body></html>
