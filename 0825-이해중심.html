<script id="qa">const QA=[
["이해 중심 미술교육의 등장 배경은?","스푸트니크 충격에 따른 창의성 중심 미술교육에 대한 반발, 학문 중심 교육과정의 대두, 형태심리학(지각심리학)의 영향, 현대미술의 다양한 전개."],
["이해 중심 미술교육의 평가는?","결과 평가."],
["'미술이 모든 학교 체제에서 각 학년의 모든 어린이에게 기본적인 교육이 될 수 있는 가능성을 실험하는 장소로 채택되었다' — 무엇에 대한 설명인가?","스탠퍼드-케터링 프로젝트."],
["케터링 교육과정의 구성 요소 및 개발 절차는?","영역 개념 또는 표현 양식, 원리 또는 매체, 이론적 근거, 목표, 동기 부여 활동, 학습 활동, 수업 보조 매체, 평가 절차."],
["바칸의 수업 방법 두 가지는?","① 수업 활동 전에 생생하고 시각적인 동기 부여를 충분히 제공한다. ② 교사의 언어는 부드러우면서도 적극적이어야 한다."],
["아이스너의 교육 방법은?","미술사·미술비평·미술 제작의 세 영역을 동등하게 나누어 가르친다. 제작 과제를 제시해 아동이 작품을 만든 뒤, 작품의 미적 요소와 특징을 이야기하고 작가의 작품을 감상하며 인류의 문화와 역사를 이해하도록 한다."],
["아이스너는 평가에 대해 무엇을 강조했나?","학생의 성취와 성취도를 이해하기 위해 형식적·비형식적 평가가 모두 필요하다고 보았다. 교육적 감식안을 지닌 전문가에 의한 과정 평가, 즉 질적 평가를 강조했고 행동 목표에 기초한 평가는 비판했다."],
["아이스너가 제시한 대안적 평가는?","교육적 감식안과 교육 비평."],
["아이스너가 행동 목표를 비판하며 제시한 목표는?","표현적 결과와 문제 해결 목표."],
["표현적 결과란?","사전에 정해진 목표 없이 표현 활동을 하고, 그 표현 과정에서 생성된 결과를 평가하는 것."],
["스탠퍼드-케터링 프로젝트의 네 가지 전제는?","① 어린이의 자연스러운 성장을 기대하지 않는다. ② 미술이 수단으로 이용되더라도 (시각)미술만이 제공할 수 있는 고유한 공헌이 있다. ③ 학습 목표와 교육 내용을 잘 갖춘 교육과정이 필요하다. ④ 형식적·비형식적 평가가 모두 필요하며 성취도를 이해하는 데 도움이 된다."],
["아이스너가 제시한 창의성의 유형 네 가지는?","경계 확장하기, 발명하기, 한계 깨뜨리기, 미적으로 조직하기."],
["'미적으로 조직하기'란?","대상의 배치와 결합을 통해 질적인 창의성을 드러내는 것. 새로운 창조가 아니더라도 앞의 세 능력이 갖추어지면 자동으로 충족될 수 있다."],
["비평 영역에서 중요한 여섯 차원은?","경험적, 형식적, 상징적, 주제적, 재료적, 맥락적 차원."],
["경험적 차원이란?","작품에 대한 느낌과 경험. 자신의 경험에 비추어 작품에서 느끼는 감정을 이야기하는 것."],
["상징적 차원이란?","작품에 사용된 상징의 의미를 파악하는 것. 소재가 지닌 의미를 추정한다."],
["재료적 차원이란?","작품에 어떤 재료가 사용되었는지, 그 재료가 작품에 주는 시각적 경험이 무엇인지 파악하는 것."],
["DBAE에서 미술사란?","과거의 미술 표현 양식과 미술 문화재를 통해 다양한 미술 및 문화 간의 상호작용, 역사적 이유와 작품에 대한 깊이를 이해하는 것. 역사적·문화적 맥락에서 작품을 감상하고 이해할 수 있도록 한다."],
["DBAE에서 미술비평이란?","미술 작품의 의미와 중요성을 설명할 수 있는 것. 작품에 대한 묘사와 해석을 하고, 기준에 근거해 작품의 가치와 선택·결정의 이유를 제시할 수 있는 비평적 능력을 발달시키도록 한다."],
["창의성 중심 미술교육과 DBAE의 학습 활동 단위 차이는?","창의성 중심은 학급 단위로 이루어져 다른 학급으로 전이되지 않는 반면, DBAE는 학교 및 지역 단위의 공통된 교육과정을 활용해 전이가 가능하다. 내용도 아동의 경험·상상·꿈 이야기에서 미학·미술사·미술비평·미술 제작 네 영역의 균등한 지도로 달라진다."],
["DBAE와 비교한 네오 DBAE의 특징은?","① 네 영역을 균등 배분하지 않고 선택·중첩해 결합한다. ② 서구·주류 순수미술 중심에서 다문화·소수민족 미술로 내용 범위가 확장된다. ③ 학문 내부를 넘어 타 교과와의 통합을 강조한다. ④ 교사의 자율성이 커진다. ⑤ 과정 평가를 중시한다."],
["네오 DBAE의 등장 배경은?","RIG 프로그램을 통해 DBAE의 단점을 보완하고 현장에서 실제로 사용할 수 있는 프로그램을 개발하려는 목적, 다문화 미술교육의 영향, 구성주의 교육과 홀리스틱 교육과정의 대두."],
["아트 프로펠의 과정 다섯 단계는?","주제 인식 및 제1 제작 → 관련 자료 탐색 → 탐색 내용을 반영한 제2 제작 → 제1·제2 작품 비교 → 반성 및 평가."],
["아트 프로펠의 세 영역과 '제작'의 방법은?","제작·지각·반성. 제작은 주제에 대한 사전 학습이 없는 상태에서 1차적으로 표현하는 것."],
["아트 프로펠은 어떤 교육인가?","제작을 중심으로 한 표현·감상·이해의 통합적 교육."],
["아트 프로펠의 탄생 배경과 목적은?","하버드 프로젝트 제로의 일환으로 굿맨과 가드너(다중지능 이론)를 두 축으로 개발되었다. 목적은 학생의 예술적 지능을 측정할 수 있는 도구의 개발."],
["아트 프로펠의 특징은?","프로세스폴리오를 통한 지속적인 과정 평가, 제작 중심의 제작·지각·반성 통합 교육, 반성 활동을 통한 비평 능력 신장."],
["아트 프로펠의 장점은?","평가가 학생을 구분 짓는 것이 아니라 창조 과정의 한 부분이라는 인식을 확대했고, 결과보다 활동 과정 자체의 중요성을 인식하는 계기를 마련했으며, 반성 활동을 통해 비평 능력을 향상시킨다."],
["다중지능 이론의 핵심 주장은?","인간의 지능은 하나가 아니라 아홉 개의 각기 다른 지능으로 분리되어 있고, 각 지능은 상호 보완적이며 실제 생활 속에서는 통합되어 발달한다."],
["지능과 교육의 관계는?","각 지능은 교육에 의해 일정 수준까지 개발될 수 있다."],
["아홉 가지 지능 중 가장 뛰어난 지능은?","우열은 없다. 아홉 가지 지능은 동등한 능력을 가지고 있다."],
["브라우디의 교육은 어떤 교육인가?","미적 교육."],
["브라우디의 교육 방법을 무엇이라 부르는가?","지각적(시각적) 접근법."],
["브라우디의 교육 방법은?","예술가가 매체를 지각하고 표현하듯 학생도 그렇게 할 수 있도록 한다. 초등 시기부터 미적 문해력을 길러 주고, 감상 수업에서도 예술에 대한 지식만 갖게 하는 것이 아니라 비평과 반성적 사고를 통해 미적 지각 능력을 기르도록 한다."],
["브라우디가 작품에 대한 감수성을 기르고 시각적 문해력을 발달시키기 위해 도입한 것은?","미적 주사."],
["미적 주사의 네 가지 특성은?","감각적 특성, 형식적 특성, 기술적 특성, 표현적 특성."],
["각성된 애호란?","학생이 작품을 보았을 때 그 작품의 좋고 싫음을 분명하게 말하고 그 근거를 제시할 수 있는 상태. 교육은 학생이 각성된 애호에 도달하도록 해야 한다."],
["다문화 미술교육의 등장 배경은?","1960~70년대 시민운동과 그에 따른 미국의 다문화 교육 정책, 세계화·국제화의 흐름, 사상적으로는 포스트모더니즘과 문화적 다원주의·사회재건주의."],
["다문화 미술교육의 목적은?","문화적 다양성을 존중하고 문화적으로 다양한 사회 안에서 효과적으로 살아갈 수 있는 인간을 육성하는 것. 문화적 정체성 함양, 민주 시민 육성, 교육 기회의 확대."],
["다문화 미술교육의 방법은?","비주류 미술을 주류 미술과 대등한 수준으로 격상해 교육 내용으로 삼고, 실용미술에도 관심을 둔다. 토론·연구 보고서 등 다양한 수행평가를 활용하고, 학생이 제작에 직접 참여하게 하며, 사회·문화·역사 등과의 통합적 교육을 통해 작품이 생산된 배경에까지 관심을 갖게 한다."],
["다문화 미술교육의 성과는?","세계화·다원화 흐름 속에서 문화적 정체성 함양에 기여했고, 미술을 통한 사회 문제 해결 방안을 모색했으며, 비주류 미술을 교육 내용으로 끌어들여 미술의 범위를 확장했다. 조사·토론 활동을 통해 비판적 수용 능력도 향상시켰다."],
["다문화 미술교육의 한계점은?","미술이 사회 교과의 보조 역할로 전락할 수 있고, 수업의 질이 교사의 역량과 참여 학생의 특성·배경에 좌우된다. 다문화 교육에 대한 철학적 접근이 없으면 작가의 이름과 시대·지역만 암기하는 관광식 교육이 될 수 있다."],
["다문화 미술교육 방법 중 변증법적 방법이란?","하나의 명제를 세운 뒤 반대 명제를 세워 새로운 것을 도출하는 방법. 모순과 대립을 바탕으로 설명한다(정-반-합)."],
["뱅크스의 접근 방식 세 가지는?","교육과정 개혁 접근, 성취 접근, 그룹 간 교육 접근."],
["뱅크스의 교육과정 개혁 접근 방식 네 가지는?","기여적 접근, 부가적 접근, 변혁적(전환) 접근, 사회적 행동 접근."],
["변혁적(전환) 접근이란?","비서구 문화에 대한 기존의 지식이나 가치관을 전환시키고 새로운 사실을 인식·이해시키는 것."],
["그룹 간 교육 접근이란?","구성원들이 서로에 대해 더 긍정적인 태도를 가지도록 돕고, 소외된 그룹의 구성원에게는 스스로에 대해 더 긍정적인 느낌과 자부심을 갖도록 하는 것."],
["톰 헤이브의 다문화 미술교육 단계는?","문화적 동화 → 문화적 분리 → 두 문화 교육 → 다원문화 교육 이념 → 문화 이해형 → 사회 개조형."],
["문화적 동화란?","소수 집단이 다수 집단에 편입되어 다수 집단의 문화를 배워야 한다는 입장."],
["문화적 분리란?","소수 민족은 자기 고유의 문화를 먼저 배워야 한다는 입장."],
["다원문화 교육 이념이란?","두 문화 교육에서 발전한 것으로 복수의 다른 문화에 대응할 수 있도록 하는 데 초점을 둔다. 자신의 문화와 다른 문화의 미술 활동에 관여함으로써 다른 문화를 더 깊게 이해한다."],
["문화 이해형의 요점은?","실천적인 형태라는 점 정도만 알아 두면 된다."],
["문화적 동화에서 나타날 수 있는 미술교육의 문제점은?","비주류 학생의 소외와 반발, 자기 문화에 대한 정체성 상실과 부정적 인식, 사회·문화적 맥락을 다룰 수 없음, 서구 문화가 기준이 되어 버림."],
["슬리터와 그랜트의 사회재건주의적 접근이란?","학생으로 하여금 사회 구조적 불평등에 도전하고 사회적·문화적 다양성에 관한 목적을 증진시키는 데 주안점을 둔다. 학생이 분석적이고 도전적인 사고자가 되도록 교육한다."],

["'문화 탐구를 통해 얻은 시사점을 실생활에 적용하는 단계로, 서로 다른 의견을 주장하고 조정·협상해 실천을 위한 공동의 결정을 만드는 것'은?","반성적 의사 결정."],
["맥피의 철학적 배경은?","포스트모더니즘, 문화적 다원주의, 사회재건주의."],
["맥피의 목적은?","도구적 목적 — 미술이 사회에서 언어로서 어떤 기능을 하는지 이해하게 하고, 환경 개선을 통해 미술이 환경 속에서 갖는 범위를 알게 한다. 내용적 목적 — 창의성 육성과 비평 능력 함양."],
["맥피의 교육 내용은?","디자인, 대중매체, 다문화."],

["도움과 억압, 처벌과 보상의 정도는 지각-묘사 이론의 어느 요소인가?","작업 환경."],
["밀러가 제시한 것으로, 학습자 내면에서 학습의 필요성을 이끌어 내고 학문의 원리나 교과목의 통합적 재구성을 염두에 두고 수업하는 교육 유형은?","홀리스틱 교육과정."]

<script>
let S=new Set(),L=list,F=f;
try{S=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...S]))}catch(e){}},
num=()=>[...S].sort((a,b)=>a-b).map(i=>i+1);
function render(){
 L.textContent="";n.textContent=S.size?"틀림 "+S.size+"개":"";
 QA.forEach((q,i)=>{
  if(F.checked&&!S.has(i))return;
  const d=document.createElement("details"),l=document.createElement("label"),c=document.createElement("input");
  d.append(Object.assign(document.createElement("summary"),{textContent:i+1+". "+q[0]}),
   Object.assign(document.createElement("p"),{textContent:q[1]}));
  c.type="checkbox";c.checked=S.has(i);
  c.onchange=()=>{c.checked?S.add(i):S.delete(i);save();F.checked?render():n.textContent="틀림 "+S.size+"개"};
  l.className="w";l.append(c,"틀림");d.append(l);L.append(d);
 });
}
F.onchange=render;
e.onclick=()=>{
 const d=document.documentElement.cloneNode(true);
 d.querySelector("#qa").textContent="const QA="+JSON.stringify(QA.filter((q,i)=>S.has(i)))+";";
 d.querySelector("#k").textContent='const KEY="'+KEY+'-wrong";';
 d.querySelector("#list").textContent="";d.querySelector("#f").removeAttribute("checked");
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob(["<!doctype html>"+d.outerHTML],{type:"text/html;charset=utf-8"}));
 a.download=KEY+"-wrong.html";a.click();URL.revokeObjectURL(a.href);
};
c.onclick=()=>{
 const t=num().join(",");
 try{navigator.clipboard.writeText(t).catch(()=>fb(t))}catch(x){fb(t)}
 c.textContent="복사됨";setTimeout(()=>c.textContent="번호 복사",1200);
};
function fb(t){const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()}
render();
</script></body></html>
