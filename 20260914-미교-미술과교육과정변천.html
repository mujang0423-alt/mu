<title>20260914 미교 미술과 교육과정 변천</title>
<script>const KEY="0914-미교-미술과교육과정변천";
const QA=[["1차 교육과정에서 목표는 어떻게 제시되었나?","일반 목표와 학년별 목표로 나누어 제시.\n※ 녹취가 불명확한 부분 — 교재 확인 권장."],["2차 교육과정은 무엇 중심의 미술교육과정인가?","창의성(창조) 중심 미술교육과정."],["2차 교육과정에서 새롭게 신설·도입된 것은?","· 학년 목표 신설\n· 지도상의 유의점 신설\n· 중학교 교사용 지도서 보급\n· 사범학교(사범대학) 설립"],["3차 교육과정은 무엇 중심의 미술교육과정인가?","이해 중심 미술교육."],["3차 교육과정의 시대적 배경과 강화된 교육 내용은?","배경: 유신 체제·군사정변 등 정치적 상황.\n강화: 민족미술에 대한 지도 강화 — 우리나라 미술품과 문화재를 감상·보존·애호하는 태도에 중점."],["3차 교육과정의 중·고등학교 목표는?","미적 정서를 충분히 함양하고 인격 및 교양을 지니는 것."],["4차 목표 빈칸: '미술 경험을 통한 국민의 주체성 육성, 표현을 통한 ○○○ 개발, 자율성·상상력·개방성·탐구적 태도 함양'","창의성 개발."],["4차 교육과정에서 강조된 것은?","· 미적 정서의 강조\n· 학생의 발달 단계와 미적 경험에 맞는 내용 선정을 통한 교육의 효율성 강조"],["4차 교육과정에서 '지도상의 유의점'은 무엇으로 바뀌었나?","평가 항목이 추가되어 '지도 및 평가상의 유의점'으로 변경."],["4차에 인간중심 교육과정이 등장한 배경은?","3차가 지나치게 이해(지적 영역) 중심이어서 정의적 목표가 소홀해짐 → 전인적 성장을 추구하는 인간중심 교육과정 등장."],["4차 교육과정의 중·고등학교 목표는?","중·고 모두 인격 함양. 고등학교는 문화 창달과 국민적 자질 육성에 중점."],["5차 교육과정에서 새롭게 등장한 것은?","단일한 총괄 목표. 이전에는 중·고등학교 목표가 따로 제시되었으나 5차부터 하나의 미술과 목표로 제시."],["5차 교육과정은 단일한 총괄 목표 아래 무엇을 두었나?","학교 급별 수준."],["6차 교육과정은 무엇의 영향을 받았고, 무엇이 신설되었나?","DBAE의 영향으로 4개 영역 중 '미학'이 도입.\n신설: '미술과 생활' 과목, '성격' 항목.\n감상 영역에서 미술사·미술 비평을 강조하고 지도 방법·평가 방법을 구체적으로 제시."],["7차 교육과정의 학교급 체제는?","국민 공통 기본 교육과정(초1~고1) + 선택 중심 교육과정(고2~고3)."],["7차 교육과정의 영역은?","미적 체험, 표현, 감상."],["7차 표현 영역의 하위 내용은?","주제 표현, 표현 방법, 조형 요소와 원리, 재료와 용구."],["7차 감상 영역의 하위 내용은?","미술품 감상, 미술 문화유산 이해."],["7차에서 학습 분량을 최적화하고 수준과 범위를 적정화한 장치는?","필수 학습 요소."],["2007 개정에서 표현 영역은 어떻게 바뀌었나?","'재료와 용구'가 표현 방법에 흡수되고 '표현 과정'이 추가 → 주제 표현, 표현 방법, 조형 요소와 원리, 표현 과정."],["2007 개정에서 전 영역에 반영된 학습 내용은?","시각문화(다문화 포함)에 대한 학습이 전 영역에 반영."],["2007 총괄 목표 빈칸: '미술의 다양한 활동을 통하여 ○○○○○, 창의적 표현 능력, 비평 능력을 기르고 ○○ ○○를 향수할 수 있는 능력과 태도를 기른다'","미적 감수성 / 미술 문화."],["2007 개정에서 목표 체계는 어떻게 바뀌었나?","총괄 목표 + 4개 하위 항목으로 이루어진 미술과 목표와 함께 학년별 목표를 추가로 제시. (학년별 목표는 2009 개정에서 삭제)"],["2007 개정 감상 영역의 내용 요소는?","미술 작품, 미술 문화."],["2009 개정에서 영역은 어떻게 바뀌었나?","'미적 체험'이 '체험'으로 → 체험, 표현, 감상."],["2009 개정에서 미술 교과의 편성과 시수는 어떻게 변했나?","예술 교과군으로 편성되면서 시수가 줄어듦."],["2009 총괄 목표 빈칸: '미적 감수성과 직관으로 대상을 이해하고 삶을 창의적으로 향유하며 미술 문화를 계승·발전시킬 수 있는 ○○○ 인간을 육성한다'","전인적."],["2009 개정 표현 영역은?","'표현 과정'이 사라지고 주제 표현, 표현 방법, 조형 요소와 원리."],["2009 개정 감상 영역의 내용 요소와 그 이유는?","미술사, 미술 비평. 다문화와 비평을 중시하게 되면서 포함됨."],["2015 개정 교육과정의 학교급 구분은?","초1~중3: 공통 교육과정 / 고1~고3: 선택 중심 교육과정."],["2015 개정 내용 체계의 구성 요소는?","영역, 핵심 개념, 일반화된 지식, 내용 요소, 기능."],["2015 선택 중심 교육과정의 구성과 그 변화는?","일반 선택(미술)과 진로 선택(미술 창작, 미술 감상과 비평)으로 구성.\n2009의 일반 과목·심화 과목이 일반 선택·진로 선택으로 바뀌면서 하부 영역 개수가 현저히 줄어듦."],["2015 개정 영역별 내용 요소는?","체험: 지각, 소통, 연결\n표현: 발상, 제작\n감상: 이해, 비평"],["2015 체험 영역에 '연결'이 포함된 이유는?","· 체험·표현·감상이 통합·연계되도록\n· 미술과 생활을 연계해 경험을 강조하도록\n· 다른 교과와 통합해 교과 간 통합을 이루도록"],["2015 개정 미술과 역량 5가지는?","미적 감수성, 창의·융합 능력, 시각적 소통 능력, 자기 주도적 미술 학습 능력, 미술 문화 이해 능력."],["2022 개정 미술과 역량 5가지는?","심미적 태도, 창의·융합 능력, 시각적 소통 능력, 정체성 역량, 공동체 역량."],["총론의 핵심역량 6가지는?","자기관리 역량, 지식정보처리 역량, 창의적 사고 역량, 심미적 감성 역량, 협력적 소통 역량, 공동체 역량.\n※ 2015에서는 '협력적 소통' 자리가 '의사소통 역량'이었음."],["2022 개정에서 목표 체계는 어떻게 바뀌었나?","총괄 목표가 사라지고 중학교 목표, 고등학교 일반 선택·진로 선택·융합 선택 과목별 목표가 각각 제시됨."],["2022 개정 선택 중심 교육과정의 구분은?","일반 선택, 진로 선택, 융합 선택."],["2022 개정 미술과 영역은?","미적 체험, 표현, 감상."],["2022 개정 내용 체계에서 새롭게 신설된 것은?","핵심 아이디어, 성취기준 해설, 성취기준 적용 시 고려 사항."],["핵심 아이디어란?","2015의 핵심 개념과 일반화된 지식을 묶은 것. 영역을 아우르면서 해당 영역 학습을 통해 일반화할 수 있는 내용을 핵심적으로 진술한 것."],["핵심 아이디어의 효과는?","해당 영역 학습에 초점을 부여하여 깊이 있는 학습을 가능하게 하는 토대가 됨."],["2022 내용 요소의 3범주는?","지식·이해, 과정·기능, 가치·태도."],["지식·이해 / 과정·기능 / 가치·태도의 정의는?","지식·이해: 해당 영역에서 알고 이해해야 할 기초적인 개념과 내용\n과정·기능: 교과 고유의 사고 및 탐구 과정 또는 기능\n가치·태도: 교과 활동을 통해 기를 수 있는 고유한 가치와 태도"],["성취기준이란?","영역별 내용 요소를 학습한 결과 학생이 궁극적으로 할 수 있거나 할 수 있기를 기대하는 도달점."],["2022 개정에서 교수·학습 및 평가 항목은 어떻게 바뀌었나?","'교수·학습 방법 및 유의사항', '평가 방법 및 유의사항'에서 유의사항이 삭제되고 '교수·학습 및 평가'로 새롭게 제시."],["2022 진로 선택 '미술 창작'의 영역은?","설계와 창작, 창작의 확장."],["2022 융합 선택 '미술과 매체'의 영역은?","매체 이해, 매체 활용."]];</script>

function view(i){
  const u=ui[i],m=M[i]||{},has=!!((m.t&&m.t.trim())||(m.img&&m.img.length));
  u.box.innerHTML=has?esc(m.t||"")+(m.img||[]).map(p=>'<img loading="lazy" src="'+esc(RAW+enc(p))+'">').join(""):"";
  u.box.style.display=has?"":"none";
  u.btn.textContent=has?"메모 수정":"＋ 메모";
}
function shrink(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,1400/Math.max(im.width,im.height)),c=el("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  const d=c.toDataURL("image/jpeg",.82);URL.revokeObjectURL(im.src);res({url:d,b64:d.split(",")[1]})};
  im.onerror=()=>rej(new Error("이미지를 읽지 못함"));im.src=URL.createObjectURL(f)})}
async function get(){
  const r=await fetch(API+enc(PATH)+"?ref="+BR+"&t="+Date.now(),{headers:{Authorization:"Bearer "+tok()},cache:"no-store"});
  if(r.status===404)return{d:{},sha:null};
  if(!r.ok)throw new Error("읽기 실패 "+r.status);
  const j=await r.json();let d={};try{d=JSON.parse(ub64(j.content))||{}}catch(e){}
  return{d:d,sha:j.sha};
}
async function put(p,content,msg,sha){
  const b={message:msg,content:content,branch:BR};if(sha)b.sha=sha;
  const r=await fetch(API+enc(p),{method:"PUT",headers:{Authorization:"Bearer "+tok(),"Content-Type":"application/json"},body:JSON.stringify(b)});
  if(!r.ok){let m=r.status;try{m=(await r.json()).message||m}catch(e){}const e=new Error(m);e.status=r.status;throw e}
}
async function commit(i,v){
  for(let n=0;;n++){
    const g=await get(),d=g.d;if(v)d[i]=v;else delete d[i];
    try{await put(PATH,b64(JSON.stringify(d,null,1)),"메모: "+NAME+" "+(i+1)+"번",g.sha);M=d;store();return}
    catch(e){if(n>=2||(e.status!==409&&e.status!==422))throw e}
  }
}
function thumb(src,rm){const w=el("span","mm-th"),im=el("img"),x=el("b");im.src=src;x.textContent="×";x.onclick=rm;w.append(im,x);return w}

function edit(i){
  const u=ui[i],m=M[i]||{},imgs=(m.img||[]).slice(),adds=[];
  const ta=el("textarea");ta.value=m.t||"";ta.placeholder="모르는 단어 뜻, 보충 설명…";
  const th=el("div"),fi=el("input"),st=el("span","mm-st");
  fi.type="file";fi.accept="image/*";fi.multiple=true;fi.style.display="none";
  const draw=()=>{th.innerHTML="";
    imgs.forEach((p,k)=>th.append(thumb(RAW+enc(p),()=>{imgs.splice(k,1);draw()})));
    adds.forEach((a,k)=>th.append(thumb(a.url,()=>{adds.splice(k,1);draw()})))};
  fi.onchange=async()=>{for(const f of fi.files){try{adds.push(await shrink(f))}catch(e){st.textContent=e.message}}fi.value="";draw()};
  const close=()=>{u.ed.innerHTML="";u.ed.style.display="none";u.bar.style.display="";view(i)};
  const ok=btn("저장",async()=>{
    if(!tok()){st.textContent="허브(index)에서 '토큰'을 먼저 저장해야 해요";return}
    ok.disabled=true;
    try{
      const paths=[];
      for(let k=0;k<adds.length;k++){
        st.textContent="사진 올리는 중 "+(k+1)+"/"+adds.length;
        const p="memo/img/"+NAME+"-"+(i+1)+"-"+Date.now().toString(36)+k+".jpg";
        await put(p,adds[k].b64,"메모 사진: "+NAME);paths.push(p);
      }
      st.textContent="저장 중…";
      const t=ta.value.replace(/\s+$/,""),all=imgs.concat(paths);
      await commit(i,(t||all.length)?{t:t,img:all}:null);
      ds.forEach((_,k)=>{if(k!==i)view(k)});close();
    }catch(e){st.textContent="저장 실패: "+e.message;ok.disabled=false}
  });
  u.ed.innerHTML="";u.ed.append(ta,th,fi,btn("사진 추가",()=>fi.click()),ok,btn("취소",close),st);
  u.bar.style.display="none";u.ed.style.display="";draw();ta.focus();
}

ds.forEach((d,i)=>{
  const w=el("div","mm"),box=el("div","mm-box"),bar=el("div"),ed=el("div"),b=btn("＋ 메모",()=>edit(i));
  bar.append(b);ed.style.display="none";w.append(box,bar,ed);d.append(w);
  ui[i]={box:box,bar:bar,ed:ed,btn:b};view(i);
});

(async()=>{try{
  let d;
  if(tok())d=(await get()).d;
  else{const r=await fetch(RAW+enc(PATH)+"?t="+Date.now(),{cache:"no-store"});if(r.status===404)d={};else if(r.ok)d=await r.json();else return}
  M=d||{};store();ds.forEach((_,k)=>{if(ui[k].ed.style.display==="none")view(k)});
}catch(e){}})();
})</script>
