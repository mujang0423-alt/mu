<h1>한국미술사 · 불교조각 (260902)</h1>
<div class="bar"><label class="t"><input type="checkbox" id="o"> 틀린 것만</label><button id="e">오답 내보내기</button><button id="n">번호 복사</button></div>

<script>
const QA=[
["뚝섬 출토 금동여래좌상의 양식적 특징은?","5세기 삼국시대 초기 금동불. 상현좌에 선정인, 민머리(소발). 북위 불상의 영향으로 갸름한 얼굴과 좁은 어깨를 보이며 전체적으로 고졸한 느낌."],
["뚝섬 출토 금동여래좌상의 의의는?","현존 우리나라 최초의 사자좌 형식 불상. 5세기경 남아 있는 드문 금동불로, 우리나라 불상의 초기 양식을 알려주는 자료."],
["연가7년명 금동여래입상의 특징은?","북위 양식 기반에 고구려화가 진행. 지느러미처럼 삐죽삐죽한 옷주름, 왼손에 걸쳐진 옷자락, 왼쪽으로 몰린 주름, 통견. 고구려적 요소로는 은행알처럼 부은 두 눈, 고졸한 미소, 도톰한 손·발과 연화대좌 꽃잎."],
["연가7년명에서 신묘명 삼존불로 가며 양식이 어떻게 변하나?","초기의 북위 양식(갸름한 얼굴, 좁고 가파른 어깨)에서 점차 고구려화가 심해지고, 6세기 후반에는 동위 양식이 나타남. 이 시기 소형 금동불상이 다수 제작됨."],
["신묘명 금동삼존불(6세기 후반)의 전체 특징은?","주형거신광 형태의 광배, 광배에 화불 표현, 일광삼존 양식, 화염문 장식. 북위에서 동위 양식으로 넘어가는 단계."],
["화불이란?","연꽃 속에서 부처가 화생하는 장면을 작은 여래형으로 표현한 것. 부처와 보살이 중생 교화를 위해 때와 장소를 가리지 않고 나타남을 상징. 신묘명 삼존불에서 처음 등장."],
["신묘명 금동삼존불에 보이는 동위 양식은?","유려한 당초문과 화염문, 둥근 얼굴, 축 늘어진 옷자락, 물고기 비늘 같은 특이한 옷주름."],
["원오리 소조보살입상의 제작 기법(니조)은?","니조는 塼土보다 묽은 흙을 쓰는 테라코타식 소조불. 점토를 빚은 후 속을 긁어내고 불에 굽는 방식으로, 건조식보다 내구성이 좋다."],
["원오리 소조상에 담긴 신앙은?","천불 신앙. 무수한 부처가 하나의 불로 귀일한다는 사상."],
["원오리 소조보살입상의 고구려적(한국적) 양식은?","통통한 얼굴과 통통한 연화좌, 상투를 튼 듯한 높은 머리 형태, 입가의 미소."],
["백제 금동여래입상(6세기 중반)의 특징은?","수·당 양식 수용 이전의 북위 양식. 옷자락이 왼쪽으로 쏠리고 옷 끝 가운데가 위로 들림. 수인은 시무외인·여원인(통인)."],
["7세기 이후 수·당 양식을 받은 백제 보살상의 특징은?","역동성이 강해져 삼곡 자세가 나타남. 천의가 U자형으로 바뀌고, 백제의 미소를 띠며 어깨와 허리가 가늘어짐. 좌상에서 입상으로 변화."],
["백제에서 수·당 양식 수용으로 새로 등장한 것은?","마애불과 사면불."],
["군수리 석조여래좌상의 특징은?","둥근 얼굴에 선정인, 상현좌의 사각형 대좌, U자형 옷주름, 민머리(소발)."],
["서산 마애삼존불의 수인·구도·백제적 특징은?","수인은 시무외인·여원인. 삼각 구도이며 위쪽은 부조가 깊고 아래로 갈수록 얕아짐. 앞에 목조 전실이 있던 흔적이 남아 있고, 연화좌 위에 서 있음. 특유의 온화한 백제의 미소가 특징."],
["황룡사지 출토 금동여래입상의 특징은?","머리 부분이 결실된 상. 가운데 옷자락이 들려 있고 옷주름이 물결무늬로 흘러내림. 정면 위주의 상이라 전체적으로 판판하다."],
["삼양동 출토 금동관음보살입상 등 7세기 신라 불상의 특징은?","수·당 영향으로 양감이 풍부하고 얼굴이 팽팽함. 허리를 뒤튼 듯한 자세는 수나라 양식. 팽팽한 얼굴, 가슴의 단순한 굴곡, 느슨한 옷주름은 신라화된 면모."],
["금동미륵보살반가사유상의 의의는?","현존 최대의 금동 반가사유상. 정면 위주의 불상에서 벗어나 입체감과 사실성을 찾기 시작한 상."],
["금동미륵보살반가사유상이 쓰고 있는 관은?","삼산관."],
["일본 목조반가사유상이 한국에서 제작되었다고 보는 근거는?","우리나라에서만 나는 소나무로 제작되었기 때문. 얼굴은 이후 일본식으로 바뀌어 더 냉엄한 표정을 띤다."],
["감산사 석조아미타여래입상의 조성 배경은?","발원자가 돌아가신 부모를 기리기 위해 조성한 상."],
["감산사 석조아미타여래입상의 제작상 특징은?","주형거신광. 광배와 불신이 하나의 돌로 이루어져 있다."],
["감산사 상의 옷주름 양식과 그 뜻은?","우전왕식 옷주름. 옷주름이 촘촘히 늘어지다가 다리 부분에서 양옆으로 펼쳐지는 형식."],
["석굴암 본존불이 이상주의적 사실주의를 띠는 이유는?","비례가 완벽한 사실적 표현이면서도, 부분적인 간략화와 근육의 생략을 통해 이상화된 모습을 보이기 때문."],
["석굴암 본존불은 어디의 영향을 받았나?","인도(굽타) 양식의 영향. 당나라 영향으로는 반달형 눈썹, 가늘고 긴 눈, 윤곽이 뚜렷한 입술, 도톰한 볼이 꼽힌다."],
["불국사 금동비로자나불좌상의 특징은?","통일신라 말. 선종의 영향으로 양감과 형태미가 약화됨. 작은 입, 목의 삼도, 지권인. 특히 지권인의 손 모양이 일반적인 경우와 반대인 점이 특징."],
["통일신라 후기에 비로자나불이 유행한 이유는?","비로자나불은 밀교의 주존불로, 화엄 사상과 함께 당에서 승려들을 통해 전래되면서 주류가 되었기 때문."],
["통일신라 조각의 초기·중기·후기 특징은?","초기: 수·당 영향에서 벗어나지 못해 사실적·화려하고 운동감이 있음.\n중기: 신라적 특징이 나타나 단순화와 근육 생략으로 이상적 사실주의, 부드러운 눈매와 미소(석굴암·불국사).\n후기: 선종 대두로 양식이 쇠퇴. 금동불은 소규모로만, 대형불은 철불로 제작되고 형식화·지방색·개성화가 나타남."],
["통일신라 말~고려 초 철불이 유행한 원인은?","나라가 혼란해지며 불상 주재료인 구리 공급이 원활하지 못했고, 지방 호족이 전쟁 대비로 철을 많이 비축해 구하기 쉬웠으며, 대형 불상 제작에 용이한 재료였기 때문."],
["철불의 장점과 단점은?","장점: 값이 싸고 대형불 제작이 가능하며, 주조 과정이 비교적 간편해 짧은 시간에 만들 수 있다.\n단점: 주조 접합 자국이 남고 질감이 거칠며 내구성과 유연성이 떨어진다."],
["귀부란?","비석의 받침돌 역할을 하는 거북 모양의 돌."],
["이수란?","이무기나 용의 형상을 새겨 비석의 머리에 씌워 장식한 것."],
["석굴암 비도의 사천왕 배치는?","동쪽 지국천왕, 서쪽 광목천왕, 남쪽 증장천왕, 북쪽 다문천왕. 광목천왕은 유일하게 얼굴 부분이 따로 끼워져 있어 어색해 보이며, 상마다 부조의 깊이(고부조·저부조)가 조금씩 다르다."],
["석굴암 본존불 바로 뒤에 있는 상과 그 역할은?","십일면관음보살상. 열한 개의 얼굴로 중생을 굽어살펴 자비로 괴로움을 구제하고 왕생의 길로 인도한다."],
["금강역사상의 역할은?","아·훔 형상의 한 쌍으로 문 앞을 지키며 불법을 수호하는 역할."],
["수행자 중 가장 높은 지위에 있는 존재는?","나한."],
["천부상이란?","대부분 무기를 들고 무장한 모습. 불교 발생 이전 인도 고대 신들이 불교에 귀의해 불법을 찬양·수호하는 존재로, 그 자체가 신앙의 대상은 될 수 없다. 제석천·범천·사천왕 등이 포함된다."],
["불상 목 위에 표현된 세 개의 주름은?","삼도."],
["양 눈썹 사이에 빛나는 흰 털은?","백호."],
["지장보살의 성격과 도상은?","지신 신앙에서 유래. 미륵불이 출현할 때까지 지옥에서 고통받는 중생을 구제하고, 악도에 떨어져 헤매는 중생의 성불을 돕는다. 두건을 쓰고 왼손에 연꽃, 오른손에 시무외인 또는 보주·석장·여의주를 든 형태. 모든 중생을 구제할 때까지 성불하지 않겠다고 서원."],
["결가부좌란?","부처가 좌선할 때 취하는 자세로, 책상다리 상태에서 양 발바닥이 위를 향하도록 하는 자세."],
["의좌·유희좌·윤왕좌·교각좌의 차이는?","의좌: 두 다리를 늘어뜨리고 걸터앉은 자세.\n유희좌: 한쪽은 결가부좌, 다른 다리는 아래로 늘어뜨림.\n윤왕좌: 한쪽은 결가부좌, 다른 쪽 무릎을 세워 앉음.\n교각좌: 양 다리를 교차시킨 자세."],
["연화좌에서 위로 향한 것·아래로 향한 것·둘을 합한 것은?","앙련 / 복련 / 앙복련."],
["별인(수인)의 종류와 해당 불상은?","항마촉지인 - 석가불, 지권인 - 비로자나불, 아미타구품인 - 아미타불, 전법륜인 - 석가불(설법). 시무외인·여원인은 통인."],
["탄생불이 취하는 수인은?","천지인. 태어나자마자 '천상천하 유아독존'을 외치며 한 손가락을 위로 치켜든 자세."],
["가릉빈가란?","아름다운 소리로 불법을 설하는 상상의 새. 극락정토에 살며 새의 몸에 사람 얼굴을 하고 있다."],
["불상이 손에 쥐고 있는 물건과, 의식 때 흔들어 소리를 내는 것은?","지물 / 금강령."],
["석가의 협시보살과 각각의 상징은?","문수보살은 지혜, 보현보살은 지혜의 실천과 자비."],
["아미타불의 협시보살은?","관음보살과 대세지보살."],
["고려 철조석가여래좌상을 석굴암 본존불과 비교하면?","양감이 줄고 옷을 더 많이 걸침. 이목구비가 작아지고 코와 눈썹이 날카로우며 눈이 옆으로 길게 째짐. 귓불이 길어지고 옷주름이 도식적. 전체적으로 조형성이 떨어져 추상적·경직된 양식으로 변화."],
["관촉사 석조미륵보살입상(은진미륵)의 특징은?","국가 주도로 조성되어 왕즉불 사상이 담김. 지방화로 미의식이 약화됨. 머리에 큰 보관을 쓰고 아미타구품인. 몸에 비해 머리가 크고, 입술은 채색, 눈은 다른 돌로 상감. 우리나라에서 가장 큰 석불."],
["고려 전기 지역별 불상 양식(강원도·충청도)은?","강원도: 높은 보관, 미소 띤 얼굴, 영락 등 화려한 장식, 활달하고 부드러운 느낌.\n충청도: 양감이 줄고, 면류관을 쓴 거대한 석불 양식(관촉사 은진미륵 계열)."],
["합천 해인사 건칠희랑대사좌상의 의의와 제작 방법은?","우리나라 유일의 승려 초상조각. 앞면은 목심건칠, 뒷면은 나무(기목)로 제작."],
["기목조란?","하나의 나무로 깎는 것이 아니라 여러 개의 나무를 조각해 붙여 만드는 기법."],
["탈활건칠과 목심건칠의 차이는?","목심건칠: 처음부터 나무 뼈대를 넣고 그 위에 삼베와 옻칠을 입혀 만듦.\n탈활건칠: 흙으로 덩어리를 먼저 만들고 삼베를 입힌 뒤 표면에 옻칠, 완전히 건조된 후 내부의 흙을 파내고(탈활) 안에 나무 심을 짜 넣어 고정."],
["부석사 소조아미타여래좌상의 제작 과정은?","나무로 골격을 세우고 손가락 등은 철사로 심을 만든 뒤, 그 위에 삼베를 바르고 진흙을 바르고 흙물을 끼얹기를 반복한 후 훈연 건조."],
["부석사 소조아미타여래좌상의 의의와 특징은?","우리나라 소조불 중 가장 큼. 건칠불처럼 제작한 점이 특이하며, 광배는 목판 위에 흙을 입혀 조각했다."],
["충주 대원사 철조여래좌상의 특징은?","길게 째진 눈 등에서 추상성이 강함. 통일신라의 대자대비한 구제자에서 신비스럽고 두려운 절대자의 모습으로 바뀐 밀교적 성격."],
["고려 전기와 후기 조각의 특징은?","전기: 통일신라 말 전통을 이어 중부 지역은 자연주의가 중심, 영남 지방은 기술적 퇴화와 겹쳐 경직되고 추상적인 경향. 철불이 유행.\n후기: 중부 지역 자연주의 계통이 쇠퇴하고 송·원 영향으로 소형 불상이 유행. 금동불에서 라마 계통 양식이 수용됨."],
["기림사 건칠관음보살좌상(조선)의 특징은?","라마 양식 영향으로 보관이 매우 화려한 반면 옷은 단촐함. 목이 앞으로 나오고 등이 굽었으며 몸에 비해 머리가 큼. 조형미가 떨어지는 것이 이 시기 특징. 탈활건칠로 제작."],
["능묘 앞 석인상의 조형적 특징은?","육체의 양감이나 얼굴 표정에는 주의를 기울였으나 신체의 균형이 상실되고 3~4등신의 볼품없는 조각."],
["원각불과 마애불의 차이는?","마애불은 바위 면에 새긴 것, 원각불은 사방에서 관찰 가능한 환조 형태의 불상."],
["무령왕릉 진묘수의 역할은?","무덤을 지키는 수호신."]
];
const $=s=>document.querySelector(s),L=$("#l");
let C=[];try{C=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}};
const flt=()=>{const o=$("#o").checked;[...L.children].forEach((d,i)=>d.hidden=o&&!C[i])};
function render(){L.innerHTML="";QA.forEach((q,i)=>{const d=document.createElement("details");d.className=C[i]?"w":"";
d.innerHTML="<summary>"+(i+1)+". "+q[0]+"</summary><div class='a'>"+q[1]+"</div><label class='c'><input type='checkbox'"+(C[i]?" checked":"")+"> 틀림</label>";
d.querySelector("input").onchange=e=>{C[i]=e.target.checked;d.className=C[i]?"w":"";save();flt()};L.appendChild(d)});flt()}
$("#o").onchange=flt;
$("#e").onclick=()=>{const w=QA.filter((_,i)=>C[i]);if(!w.length)return alert("체크된 문항이 없습니다.");
const h="<!doctype html>"+document.documentElement.outerHTML.replace(/const KEY="[^"]*"/,'const KEY="'+KEY+'-wrong"').replace(/const QA=\[[\s\S]*?\];/,"const QA="+JSON.stringify(w)+";");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));a.download=KEY+"-wrong.html";a.click();URL.revokeObjectURL(a.href)};
const fb=t=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();alert(t||"없음")};
$("#n").onclick=()=>{const t=QA.map((_,i)=>C[i]?i+1:0).filter(Boolean).join(",");
try{navigator.clipboard.writeText(t).then(()=>alert(t||"없음"),()=>fb(t))}catch(e){fb(t)}};
render();
</script></body></html>
