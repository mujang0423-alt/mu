<script>const KEY="김성희서미사2_전공복습",SUBJ="서미",TITLE="김성희 서미사② 조각 확장·문제풀이·미래주의~국제주의 건축",QA=[
["전통 조각의 정의와 두 가지 속성은?", "· 3차원의 덩어리로 인물을 이상적·사실적으로 재현, 의미는 인물(형태)이 만들어냄<br>· 두 가지 속성: <b>장소성 + 기념비성<\/b><br>· 로댕: 장소성·기념비성을 흔들었지만 인물 대상에서 완전히 벗어나지는 못함"],
["피카소가 바꾼 조각의 정의는?", "· 조각 = 3차원 덩어리 재현 → 조각 = <b>공간과 구조를 만들어내는 것<\/b><br>· 방법: 선재·면재를 구축하여 구조와 공간 생성<br>· 닫힌(폐쇄적) 공간 → 열린(개방적) 공간, 허공간이 밖으로 드러나 현실(일상) 공간과 맞닿음 → 조형 공간과 현실 공간의 경계 붕괴"],
["미래주의 조각의 ‘역선(力線, Lines of Force)’과 보치오니 조각론은?", "· 피카소의 구조·공간 개념에 <b>운동감·시간성<\/b> 추가<br>· 역선: 대상과 환경이 분리되지 않고 상호 침투하는 역동적 조형성, 사선·역선으로 시간성 표현, 조각을 고정된 실체가 아닌 역동적 공간의 장으로<br>· 보치오니: 조각이 고정된 볼륨·폐쇄된 형태에 머물러선 안 됨 / 《공간 속에서의 병의 전개》: 대상이 환경과 분리되지 않고 연속적으로 변화·소멸하는 과정"],
["러시아 구성주의 조각의 공간 개념과 특징(타틀린·가보)은?", "· 피카소 + 미래주의 영향, 구조·공간·시간 표현(미래주의와 방법론이 다름)<br>· 공간의 유일한 조형적 실체를 <b>깊이(Depth)<\/b>로 정의<br>· 용접·측정학 등 산업 기법, 산업적 재료(투명 소재·나일론 실)<br>· 타틀린 <b>역부조<\/b>: 벽 모서리(미술 외 공간)를 조형 공간으로 → 현실 공간을 조형 공간으로 흡수<br>· 가보: 나일론 실 같은 선적 구성으로 착시·운동감 → 키네틱 아트의 기반"],
["미니멀리즘 → 설치 미술의 조각 개념과 칼 안드레는?", "· 전통적 받침대(기념비성) 완전 거부, 작품이 놓인 공간 전체를 조형 조건으로<br>· 칼 안드레: 바닥에 금속 플레이트 배열 → 조각을 <b>걸어 다니며 인식하는 공간<\/b>으로, 관람자의 신체적 지각·이동 경험"],
["조각의 ‘물질 → 비물질’ 과정 단계표(조각 정의/의미를 만드는 것)", "· 전통 조각: 3차원 덩어리·인물 재현 / 인물(형태)<br>· 피카소: 공간·구조 만들기(=구축) / 형(形)<br>· 미래주의·구성주의: 운동감·시간성 표현 / 대상 + 환경의 상호작용<br>· 미니멀 이후 설치 미술: 조각 = 환경·공간·장소(비물질) / <b>환경 + 대중의 체험<\/b><br>· 설치 이후: 관람자가 어떻게 체험하느냐가 포스트모던·동시대 미술의 핵심 질문<br>· 조각과 회화가 각자 발전하다 현대에 결국 만남 = 현대 미술의 본질"],
["[문제풀이① 유미주의] 지문: 휘슬러는 “미술은 도덕적 목적이 아니라 색채와 구성 리듬의 조화로 감각이 우선시되는 자율적 미적 경험이다”라고 보았고, 이는 미적 판단이 유용성·도덕·욕구와 무관해야 한다는 칸트의 ( ㄱ )에 토대를 둔다. 반면 러스킨은 “미술은 자연의 진실한 재현과 도덕적·사회적 가치를 전달해야 하며, 신의 섭리·도덕적 진리를 표현해야 한다”고 보았다. ㄱ과 러스킨의 미술관은?", "· ㄱ: <b>무관심성<\/b> → 유미주의(Aestheticism)의 철학적 토대<br>· 러스킨: <b>도구주의<\/b>(미술 = 도덕·사회적 가치 전달 수단)<br>· 휘슬러: 자율적 미적 경험(유미주의)"],
["[문제풀이② 신인상주의] 지문: 시냐크가 이론화한 ( ㄱ )은 슈브뢸의 색채 대비 이론과 오그던 루드의 광학 이론에 근거해, 인상주의의 직관적·즉흥적 붓질 대신 과학적 분석에 기초한 점묘로 감상자의 눈에서 색이 혼합되도록 하였다. 이 방식이 생동감이 결여됐다는 비판을 받자 쇠라는 ( ㄴ )의 이론을 수용해 보완하였다. ㄱ, ㄴ과 보완 방식은?", "· ㄱ: <b>분할묘법<\/b>(점묘법)<br>· ㄴ: <b>샤를 앙리<\/b><br>· 보완: 색채는 과학적으로 분할하되, 구성에서는 <b>상승선·하강선·곡선<\/b>을 활용해 정서적 표현을 강화 → 점묘법의 감정적 한계 보완"],
["[문제풀이③ 세잔] 지문: 세잔은 사물의 한 단면이나 색면이 인접한 다른 공간으로 흘러 들어가듯 연결·중첩되는 처리 방식인 ( ㄱ )를 사용하였다. 대상의 명확한 윤곽선을 의도적으로 허물고 전경과 배경이 서로 침투하는 유기적 구조를 만든 결과는?", "· ㄱ: <b>파사주(Passage)<\/b><br>· 결과: <b>3차원적 환영은 억제<\/b>되고 <b>2차원 평면 위에서 구축적 견고함이 회복<\/b>됨"],
["[문제풀이④ 19세기 말 건축] 시카고 학파(Chicago School)의 배경·특징과 설리번의 원리는? (아르누보 건축과 재료 활용 측면의 공통점 포함)", "· 미국: 산업화에 따른 도시 밀도 문제 해결, 역사가 없어 복고주의 없이 바로 기능적 건축<br>· <b>철골 구조 + 엘리베이터<\/b> → 고층 빌딩 시대 개막<br>· 루이스 설리번: <b>“형태는 기능을 따른다”<\/b> → 근대 건축의 미학적 원리<br>· 아르누보와의 공통점: 산업 재료(철)의 물리적 특성을 건축의 ‘구조’인 동시에 ‘미학’으로 승화"],
["[문제풀이⑤ 보링거] 지문: 보링거는 《추상과 감정이입》에서 예술의 양식적 변화를 단순히 기술적 발달이 아닌, 인류가 세계와 맺는 심리적 관계의 변화, 즉 ( ㄱ )의 발현으로 설명하였다. ㄱ은?", "· ㄱ: <b>예술 충동<\/b><br>· 감정이입: 세계와 조화 → 자연 모방(그리스·르네상스)<br>· 추상 충동: 세계에 대한 불안·적대감 → 기하학적 추상으로 도피(중세·원시·표현주의)"],
["[문제풀이⑥ 키르히너] 다리파가 목판화를 사용한 이유 3가지는?", "① <b>판화의 복제 가능성 → 대중 전달<\/b>: 저렴하고 여러 장 찍어 포스터처럼 배포, 대중 선동<br>② <b>장인의 수공성 표현<\/b>: 기계 인쇄에 대한 저항, 기계 중심 산업화 비판<br>③ <b>원시성 추구<\/b>: 수공적 노동 가치 강조, 나무의 거친 질감과 강렬한 흑백 대비 활용"],
["[문제풀이⑦ 칸딘스키] 지문: 칸딘스키는 《예술에 있어서 정신적인 것에 관하여》에서 예술을 외적 대상의 모방이 아닌 인간 ‘정신’에 작용하는 고차원의 행위로 정의하고, 색채와 형태가 영혼에 직접 일으키는 내적 울림을 전달하고자 3단계로 작품을 분류했다. ( ㄱ )은 외부 자연의 직접적·즉각적 느낌, ( ㄴ )은 마음의 움직임을 무의식적·자동 발생적으로 표출, ( ㄷ )은 내적 울림을 장기간 이성적으로 설계한 최종 순수 조형 단계. ㄱ~ㄷ은?", "· ㄱ: <b>인상(Impression)<\/b><br>· ㄴ: <b>즉흥(Improvisation)<\/b> – 비물질적 정신성<br>· ㄷ: <b>구성(Composition)<\/b>"],
["[문제풀이⑧] 피카소 《기타》의 조형적 혁신성 두 가지와 의의는?", "1. 선재·면재를 활용해 <b>구축적 구조<\/b> 형성<br>2. 형태를 분해·재구성해 <b>은폐됐던 내부 공간을 작품의 공간<\/b>으로 활용<br>· 의의: 조각의 정의 자체가 바뀜 → 부피 있는 물체에서 비어 있는 공간과 구조 자체를 예술 공간으로 전환한 ‘<b>공간과 구조의 예술<\/b>’"],
["[문제풀이⑨] 피카소 《압생트의 잔》 설명 중 틀린 것은?<br>1) 동일한 주형으로 제작된 여섯 개의 청동 판본이 존재하며, 조각 매체의 전통적 복제 가능성을 보여준다.<br>2) 실제 숟가락인 레디메이드 오브제를 청동으로 주조하여 잔의 상단부에 부착하였다.<br>3) 잔의 표면을 절개하고 내부를 개방해 은폐된 내부 공간을 구축적 공간으로 드러냈다.<br>4) 오브제와 청동 주조물을 결합한 아상블라주로 실재와 허구의 경계를 무너뜨리는 사유적 조각을 실천했다.<br>5) 각 판본에 서로 다른 점무늬 채색을 가하는 입체 콜라주적 수법으로 회화·조각의 경계를 해체했다.", "· 틀린 것: <b>2번<\/b> → 실제 숟가락을 청동으로 떠낸 게 아니라 <b>그냥 붙인 것<\/b>(파피에 콜레에서 종이 붙이듯, 레디메이드 오브제)<br>· 1번: 전통적 복제 가능성 / 3번: 분석적 큐비즘 특징(잔의 표면 절개 + 내부 개방 → 은폐된 내부 공간을 구축적 공간으로) / 4번: 오브제 + 청동 주조 결합 → 사유적 조각 / 5번: 각 판본 표면에 서로 다른 채색 → 입체 콜라주"],
["[문제풀이⑩] 피카소 《시녀들》이 포스트모던을 예견하며 현대미술의 새 지평을 열었다는 의미 두 가지는?", "· <b>차용·전유<\/b>: 벨라스케스 명화를 입체주의 언어로 재해석 → 근대적 독창성·권위성 해체<br>· <b>다수 변형 시리즈<\/b>: 같은 원본을 58개 이상 다르게 → 의미는 고정되지 않고 맥락에 따라 다양하게 재해석됨을 시각화"],
["패러디 vs 전유(Appropriation) vs 차용 구분은?", "· <b>패러디<\/b>: 차용 + <b>반드시 조롱 포함<\/b> (뒤샹의 수염 난 모나리자)<br>· <b>전유<\/b>: 차용 + 다른 맥락·의미로 <b>재맥락화<\/b> (워홀의 마릴린 먼로, 리히텐슈타인의 만화 이미지, 피카소의 시녀들)<br>· 차용은 너무 포괄적 → 요즘 단답형 답으로 안 나옴"],
["1945년 이전 현대 미술(20세기 초반) 전체 구조는?", "· 전통을 완전히 부정하는 아방가르드<br>· 가장 큰 산물: <b>추상화의 탄생<\/b>(점진적 형성) + 오브제 미술 동시 등장(파피에 콜레·아상블라주)<br>· 45년 이후: 추상표현주의·색면 추상 → 미니멀 → 포스트모던 → 동시대"],
["추상화의 지역별 전개와 공통 뿌리는?", "· 20c 초 = 아직 국제 양식이 아닌 <b>지역 양식<\/b><br>· 프랑스: 야수파·큐비즘(진보) / 이탈리아: 미래주의(정치) / 러시아: 구성주의·절대주의(양쪽) / 네덜란드: 신조형주의·데 스테일(진보)<br>· 공통 뿌리: <b>분석적 큐비즘(선의 추상성)<\/b><br>· 계보: 야수파(색의 추상성) → 큐비즘(선의 추상성 + 오브제) → [진보] 오르피즘 → 신조형주의·데 스테일 → 절대주의 / [정치] 미래주의 → 구성주의 → 다다<br>· 45년 이후 진보 → 추상표현주의·색면·미니멀 / 정치 → 설치·퍼포먼스·참여 미술"],
["미래주의(Futurism)의 핵심 이념과 키워드는?", "· 이탈리아, 정치 아방가르드, 이념: <b>속도 + 기계 미학<\/b><br>· 키워드: 속도, 동시성, 역선(力線), 사선, 기계미, 인공 빛의 에너지<br>· 너무 강한 이탈리아 전통을 과격하게 타파하려는 욕구<br>· 작가 = 생산자(노동자), 기계·기술이 창조의 주체<br>· 이념은 혁명적이나 자기 기법을 창안 못함 → 실천은 구성주의가"],
["마리네티의 미래주의 선언문(1909)의 특징은?", "· 《르 피가로》(프랑스 신문)에 발표 → <b>대중 매체를 예술 선전 도구로 최초 활용<\/b>, 아방가르드와 대중문화의 연계<br>· 도서관·박물관·학술원을 “과거 유산의 무덤”에 비유, 전통 파괴 선언<br>· 기계·기술 창조력 숭배, 전쟁·파괴 찬양 ↔ 고상한 취미(엘리트주의·형식주의) 거부<br>· 포토몽타주, 테크놀로지 선전 형식과 예술 창작의 융합 예견"],
["미래주의 화가 선언(보치오니·발라·카라·루솔로·세베리니)과 ‘동시성’ 표현 방법은?", "· 마리네티 선언이 너무 문학적 → 시각 예술로 구체화<br>· <b>동시성(Simultaneity)<\/b>: 움직이는 대상의 연속적 순간을 한 화면에 겹쳐 시간과 공간을 동시에 표현<br>· 방법: 원색 대비·파편화된 색채로 빛의 진동·에너지(신인상주의 차용) / <b>역선·사선·방사형·예각 구도<\/b>로 속도감 / 시각에서 청각·후각까지 확장된 총체적 예술(“소음도, 매연 냄새도”) / 관객이 몰입하는 몰입형 회화 장치"],
["미래주의 조각 선언(보치오니, 1912)의 내용은?", "· 전통적·관념적 누드 조각 강하게 비판<br>· 조각 = <b>운동의 등가물<\/b>: 파편적·유동적 형태로 해체해 사물과 환경의 상호작용 형상화<br>· 유리·목재·철판 등 모든 재료 사용 가능 선언(실천은 구성주의가)"],
["입체파 vs 미래주의 비교(공통·차이·목적·영향)", "· 공통: 형태를 분해해서 재구성<br>· 차이: 입체파 = 대상 중심(대상과 공간 독립), <b>정적<\/b> / 미래주의 = 대상과 환경의 상호작용, <b>동적<\/b><br>· 목적: 형태의 구조·물질성 탐구 / 속도·동시성 표현<br>· 영향: 형태를 다각도로 관찰 / 형태를 파괴해 속도감 극대화<br>· 피카소의 앉은 여인은 대상이 가만히 있고 관찰자가 움직임, 세베리니는 춤추는 여자 = 대상부터 다름"],
["미래주의 ‘스와레(Soirée)’란?", "· 예견적 해프닝: 극장·강당 등에서 선언문 낭독 + 도발적 욕설 등을 결합<br>· 예술과 삶의 경계 파괴, 관객과의 충돌·조화로 사고 변화·반응 유도<br>· <b>퍼포먼스·행위 예술·관객 참여 미술의 원형<\/b>(1970년대에나 나올 법한 것을 먼저)"],
["미래주의 작가: 보치오니·발라의 특징은?", "· <b>보치오니<\/b>: 피카소 영향, 형과 대상의 상호 침투·동시성 / 《거리가 집으로 몰려온다》: 인물과 공간이 소용돌이치는 극적 동시성, 등 돌린 관람자를 그려 대중의 감정이입·참여 유도<br>· <b>발라<\/b>: 《줄에 매달린 개》 연속 사진 영향, 대상·배경 혼합 / 《달리는 소녀》 신인상주의 점묘 차용하되 형태를 파괴해 속도감 / 《칼새의 비상》 역선·사선·방사형으로 형태 없이 속도감 → 추상화로 진전"],
["미래주의 작가: 세베리니·카라의 특징은?", "· <b>세베리니<\/b>: 큐비즘 면 분할 + 신인상주의 색채 분할 절충, 무희·카바레·도시 야경 등 대중적 일상, 청각·후각까지 시각화, 부르주아 도덕성에 대항하는 희극적 분위기, 콜라주·텍스트 삽입<br>· <b>카라<\/b>: 《개입주의자들의 시위》 – 방사형 구도, 의성어·문자 삽입, 전쟁 개입 선동 정치 포스터 / 1차 대전 후 실망해 형이상학적 회화로"],
["오르피즘(Orphism)과 레이오니즘(Rayonism) 비교는?", "· <b>오르피즘<\/b>: 프랑스, 진보 / 입체파 분석 구조 + 야수파·신인상주의 색채 → 빛과 색의 조화로운 리듬, 장식적·긍정적 / 빛 자체를 주제, 미술과 음악의 감성적 유사성을 회화로 구현한 최초 시도 / 색의 추상화 계보: 야수파 → 큐비즘 → 오르피즘 → 신조형주의<br>· <b>레이오니즘<\/b>: 러시아, 광선 자체의 에너지·운동 / 오르피즘 = 빛의 장식성·아름다움 vs 레이오니즘 = 빛의 <b>에너지·힘<\/b> / 입체·미래·오르피즘 결합, 교차하는 빛의 선과 파열된 움직임 / 곤차로바·라리오노프 → 절대주의·구성주의에 영향"],
["러시아 아방가르드 전체 계보와 흐름은?", "· 네오 프리미티비즘 → 레이오니즘 → 절대주의 → 구성주의<br>· 처음엔 민족주의적 민속 미술 + 서구 현대 미술(큐비즘·야수파) 결합 → 점점 추상화<br>· 절대주의(진보) → 구성주의(정치)<br>· 국가 정책에 눌려 미국으로 → 추상표현주의 등에 영향, 동시대에 재조명"],
["절대주의(Suprematism)의 정의와 ‘영도(Zero Degree)’는?", "· 큐보-퓨처리즘을 주도한 <b>말레비치<\/b>(단 한 명)가 창안한 기하학적 추상, 진보 아방가르드<br>· 목적: 비물질의 세계, <b>순수한 감정<\/b>(슬픔·이지적 표현 다 제거한 순결한 정신 상태 – 이해보다 암기)<br>· 물질 세계에 없는 형태(기하학 도형)를 창안 → “비물질 세계의 완전히 순결한 형태”<br>· 순수성 3: ① 감성의 절대적 순수성 ② 형태와 색채의 순수성 ③ <b>영도<\/b> – 재현·스토리·대상 모든 것에서 벗어난 완전히 순수한 절대적 상태(반드시 암기)<br>· 이후 구성주의에 영향"],
["말레비치(절대주의)와 몬드리안의 차이는?", "· 몬드리안: <b>나무에서 출발<\/b>해 단순화 과정(자연 → 추상)<br>· 말레비치: 세상에 없는 형태를 창안해 “순수하다”고 규정 → 자연의 재현 거부, <b>비대상적 형태<\/b>로 예술의 영도에 도달"],
["절대주의 작품 전개 3단계는?", "· 《흰 바탕 위에 검은 사각형》: 절대주의의 출발, 가장 순수한 기본형<br>· 《절대주의 구성》: 사각형들이 무중력으로 떠다님 → 비물질성<br>· 《백색 위에 백색》: 정점, 검은색마저 사라지고 흰 물감+캔버스만 남음 / 흰색 = 무한·영도·무한 가능성의 공간 → 물감·캔버스라는 물질만 남음 → <b>미니멀아트·모노크롬에 결정적 영향<\/b>"],
["신조형주의(Neo-Plasticism)의 특징과 수직·수평선의 상징은?", "· 네덜란드, 몬드리안, 이지적 추상(“차가운 추상” ↔ 칸딘스키의 뜨거운 추상)<br>· 보편적 조형 언어: 몬드리안이 “이게 보편적 질서야”라고 선언<br>· 수직·수평선의 대비, 삼원색과 삼무채색의 대비, 장식·서정성 배제 → 순수 기하학적 질서<br>· 수직선 = 활동성·의지 / 수평선 = 휴식·안정성 → 대비가 핵심"],
["등가성의 원리 vs 역동적 평형 구분은?", "· <b>등가성의 원리<\/b>: 이질적이지만 대등한 관계, 반대 요소 간 균형, <b>비대칭의 균형<\/b> – 크기·형태가 달라도 시각적으로 동등한 힘과 가치 (= 원칙)<br>· <b>역동적 평형<\/b>: 등가성 원리를 구현했을 때 나타나는 화면 상태 – 수직·수평·원색·무채색 등 상반 요소들의 활성화된 긴장 상태, 정적 균형이 아닌 긴장 속 균형 (= 결과 상태)"],
["데 스테일(De Stijl)과 디자인의 기능 세 가지(매우 중요)는?", "· 신조형주의 원리를 조각·건축·디자인에 적용, 바우하우스·국제 건축 양식의 토대, 진보 아방가르드(목적: 미적 기능)<br>· <b>합목적적 기능<\/b>: 실용성·쓰임새 (바우하우스 의자)<br>· <b>미적 기능<\/b>: 아름다움 (리트펠트 의자 – 불편하지만 예쁨)<br>· <b>상징적 기능<\/b>: 상징·지위 (왕좌, 어좌, 아기 의자)<br>· 데 스테일은 미에, 바우하우스는 실용성에 우위 → 바우하우스가 합목적 기능을 추구했더니 미적 기능도 = 미스 반데어로에 의자<br>· 모더니즘이 장식을 안 했다고 미를 포기한 게 아님 → 색·선·면의 구성 자체가 장식이고 미"],
["슈뢰더 주택과 리트펠트 〈적청 의자〉의 의의는?", "· <b>슈뢰더 주택<\/b>: 데 스테일 원리를 건축에 완벽 구현, 요소들의 통합·등가성·평형 / 개방된 공간, 가변적 벽체 → 피카소 기타처럼 내부 공간을 개방한 원리의 건축적 구현<br>· <b>적청 의자<\/b>: 수직·수평·삼원색 구성, 앉으면 딱딱·불편 → 기능성보다 <b>미학 실험<\/b>"],
["데 스테일 조형 원칙 2가지와 반 두스뷔르흐와의 결별 이유는?", "· 1. <b>요소화<\/b>: 자연·사물을 더 이상 환원 불가능한 기본 단순 형태로 분석<br>· 2. <b>통합(합성)<\/b>: 균형, 비대칭적 균형, 역동적 평형 구현<br>· 반 두스뷔르흐가 수직·수평선에 <b>사선<\/b> 도입(역동성·긴장감) → 몬드리안이 자기의 절대적 질서를 깼다며 결별"],
["반드시 외울 용어(동시성·역선·등가성·역동적 평형·영도·스와레·전유) 정리", "· 동시성 = 움직이는 대상의 연속적 순간을 한 화면에 겹쳐 시간·공간 동시 표현<br>· 역선·사선 = 미래주의의 트레이드마크<br>· 등가성의 원리 = 이질적 요소들의 비대칭적 균형<br>· 역동적 평형 = 등가성 원칙을 구현한 화면 상태(긴장 속 균형)<br>· 영도 = 말레비치의 용어, 가장 순수한 절대적 상태<br>· 스와레 = 미래주의 해프닝, 퍼포먼스의 원형<br>· 전유 = 차용 + 다른 맥락·의미로 재맥락화(패러디는 조롱 포함)"],
["비교 3가지: ① 큐비즘 vs 미래주의 ② 데 스테일 vs 바우하우스 의자 ③ 신인상주의 vs 미래주의 색채 분할", "① 공통(형태 분해·재구성), 차이(대상 중심 vs 대상+환경 상호작용, 정적 vs 동적)<br>② <b>미적 기능<\/b> vs <b>합목적적 기능<\/b><br>③ <b>자연 과학적 분석<\/b> vs <b>기계 에너지·인공 빛 표현<\/b>"],
["구성주의(러시아) 3줄 요약과 시기별 표는?", "· 정치 아방가르드, 타틀린·로드첸코 중심, 구조·기능·기계적 조형·사회적 실용성, 미래주의 이념의 실제 실천<br>· 1910년대: <b>팍트라 + 텍토닉<\/b>(산업 재료로 새 구조) – 타틀린, 카운터 릴리프, 기념탑<br>· 1920년대: <b>공리주의 → 포토몽타주<\/b>(이미지 복원, 대중 소통) – 로드첸코, 리시츠키<br>· 망명 이후: <b>순수주의 → 국제 추상 양식<\/b>(바우하우스) – 가보, 페브스너<br>· 계보: 큐비즘(기타) → 구성주의(팍트라·텍토닉) → 국제 추상 조각(가보, 키네틱) → 기능주의 건축(바우하우스, 르 코르뷔지에, 미스 반데어로에)"],
["구성주의의 역사적 배경(1910년대~1927년 이후)은?", "· 1910년대 아방가르드 부상: 1917 프롤레타리아 혁명 후 타틀린·말레비치·칸딘스키 등이 문화 행정기관에 참여, 산업 재료·기술을 예술 수단으로 → 실험적 추상<br>· 1920년대 공리주의 등장·분화: 정부가 공리주의(실용주의) 내세우며 “추상은 너무 어렵다” 압박 → ① 공리주의 수용파(타틀린·로드첸코): 팍트라·텍토닉 유지 + <b>사진으로 이미지 복원 → 포토몽타주<\/b> ② 순수 미술 추구파(가보·페브스너): 독일 바우하우스로 망명 → 국제 추상 양식<br>· 강사 비유: 분석적 큐비즘에서 형태가 없어지자 종합적 큐비즘이 이미지를 복원한 것과 같음<br>· 1927년 이후 스탈린: 사회주의 리얼리즘 강제, 추상·포토몽타주 금지 → 당 선전·우상화용 구상 미술로 전락"],
["팍트라(Faktura)와 텍토닉(Tektonics)의 구분은?", "· <b>팍트라<\/b>(질감·성질): 재료 자체가 가진 느낌과 성질을 그대로 살림 – 철은 구부러진 형태로, 유리는 투명함을 살려 / 작가가 결정하는 게 아니라 재료가 형태를 만듦<br>· <b>텍토닉<\/b>(공간 구조·기능): 재료의 물리적 특성이 자연스럽게 새로운 공간 구조를 만듦 → 기능과 공간이 자동 결정 / 작가는 <b>창조자가 아닌 생산자<\/b>(재료의 논리를 따르는 사람)<br>· 피카소 = 재료 무시하고 마음대로 창조 / 타틀린 = 산업 재료의 성질을 따라 구축<br>· 한마디로: “예술가가 재료를 지배하는 게 아니라 재료가 작품을 결정한다”"],
["타틀린(Tatlin)의 카운터 릴리프와 제3 인터내셔널 기념탑은?", "· 피카소 기타 영향 → <b>카운터 릴리프(역부조)<\/b>: 벽 모서리에 설치, 부피·양감 거부, 실제 공간 자체를 작품 일부로 / 조각이 아닌 “공간적 구성체”<br>· 1920년대 공리주의 수용 후 포스터·잡지·건축·무대 미술·공업 디자인으로<br>· <b>제3 인터내셔널 기념탑<\/b>: 나선형 구조 → 아래로부터의 혁명성·미래 지향성 / 내부 원통·각뿔이 일정 주기로 회전 / 팍트라·텍토닉으로 추상 언어를 구축해 대중과 정치적으로 소통하려 한 시도(실현 못함)"],
["로드첸코(Rodchenko) 작업 4단계는?", "① 단색화 실험(1921): 빨강·파랑·노랑 3부작, “최초의 단색화이자 순수 회화의 종말 선언”, 색+물감+캔버스만<br>② 사진(1924~): 공리주의 목적(이미지 부활·대중 소통) + 팍트라(카메라라는 산업 재료)<br>③ 포토몽타주: 자신이 찍은 사진 + 기하학 도형 + 텍스트 / 〈책을 읽자〉 포스터 – 확성기처럼 그래픽이 퍼지는 디자인<br>④ 노동자 클럽(1925): 변형 가능한 가구, 노동자를 위한 디자인 → 위계적 질서 붕괴, 미술과 생활의 통합"],
["로드첸코 사진의 고각·저각 촬영 효과와 〈전화 앞에서〉 (기출)", "· <b>고각<\/b>(위→아래, 하이앵글): 인물의 익명성 + 화면의 추상적·역동적 구성 → 구성적 추상성<br>· <b>저각<\/b>(아래→위, 로우앵글): 상승감·확장감 → 노동자의 영웅화<br>· 〈전화 앞에서〉: 전화 교환원(익명의 여성 노동자)을 고각 촬영, 누구인지보다 <b>화면의 추상적·역동적 구성<\/b>이 핵심, 기계 문명과 여성의 사회 진출 상징<br>⚠ 기출: ‘화면을 추상적으로 구성하고 있다’를 묻는 어려운 문제"],
["리시츠키(El Lissitzky)와 프룬(PROUN)·프로운 룸은?", "· 타이포그래피 글자를 조형화, 사진·도형·텍스트 결합해 정치 메시지 시각화<br>· 〈붉은 쐐기로 흰색을 쳐라〉 같은 순수 추상 포스터의 한계(어려움) → <b>포토몽타주<\/b>로 극복(사진이라는 팍트라로 포토몽타주라는 텍토닉)<br>· <b>프룬(PROUN)<\/b> “새로움을 위한 계획”: 추상화처럼 보이지만 미래 사회 건축 도면, 수직·수평·대각선 교차하는 역동적·비대칭 구성<br>· <b>프로운 룸(1923)<\/b>: 방이라는 3차원 공간 전체를 작품으로, 관람객이 걸어 다니며 체험 → <b>최초의 설치미술<\/b>"],
["파라메트릭 디자인(Parametric Design)이란?", "정의된 매개변수와 규칙을 표현하는 알고리즘 기반 설계 프로세스. 파라미터(매개변수)는 사용자가 직접 설정·조작하는 변수로, 다양한 변수를 대입해 결과값을 계산 → 최적의 결과 도출"],
["가보·페브스너 형제의 사실주의 선언문(1920) 내용은?", "· 시간과 공간은 예술의 불가분 요소<br>· “부피만이 공간을 표현하는 유일한 수단이 아니다” → 선·면·투명 구조로도 공간 표현 가능(<b>깊이<\/b>)<br>· 키네틱 요소로 시간을 작품에 적극 포함<br>· 1921 독일 바우하우스 활동 → 구성주의의 국제적 확산, 키네틱·미디어 아트의 선구"],
["‘용적 측정법’ vs ‘용접 측정법’ 구분은?", "· <b>용적 측정법<\/b>: 박스가 꽉 닫힘 → 물질 덩어리로 부피 측정(로댕 방식)<br>· <b>용접 측정법<\/b>: 박스에 공간이 뚫림 → <b>깊이<\/b>로 부피 표현, 선재·면재 구성"],
["가보(Gabo)의 주요 작품과 특징은?", "· 〈구성된 두상〉: 공간의 깊이로 부피를 표현한 첫 시도<br>· 〈선적인 구성〉: 투명 아크릴판에 나일론 실 → <b>무아레 현상(착시)<\/b>으로 곡면, 물질보다 비물질적 형태<br>· 〈키네틱 구조〉: 금속 막대 + 모터 → 움직임으로 시간성<br>· 공간의 구축(음의 공간), 4차원적 입체주의(보는 각도에 따라 ‘시간’), 산업 재료(나일론·플라스틱·금속선)"],
["모홀리-나기(Moholy-Nagy)의 특징과 동시대 작가와의 차이는?", "· 빛·공간·운동에 집중한 비물질적 공간 탐구, 포토그램(카메라 없이 빛으로 인화)<br>· 차이: 반 두스뷔르흐·타틀린 등은 이론·추상 단계에 머묾(제3인터내셔널 기념비 미실현) ↔ 실제 과학·기술로 작품 완성<br>· 특징: ① 과학자와 협업(헝가리 조명기술자 오토 발과 8년) ② 다매체성(추상영화, 연극무대 디자인) ③ 관객 참여와 역동성<br>· 결론: 움직임 = 관객의 감각기관을 총체적으로 자극하는 수단 → 옵아트·키네틱·미디어 아트의 선구"],
["모홀리-나기 〈빛-공간 변조기(Light-Space Modulator)〉의 의의는?", "· 실제로 만든 것은 금속 구조물이지만 보여주려는 것은 그 뒤의 <b>그림자(비물질)<\/b><br>· “정적 조형을 동적 조형으로 변화시킴”<br>· 빛과 움직임을 조형 예술의 주요 요소로 끌어올린 선구작"],
["카메라 없는 사진 기법 구분(포토그램 계열 vs 빛·현상 조작 vs 시아노타입)", "· <b>포토그램<\/b>(상위 개념): 카메라 없이 물체를 감광지에 올려 빛으로 찍음<br>　– 포토제닉 드로잉(탈보트): 원조, 식물·레이스 올려 찍음(염화은 종이)<br>　– 레이요그램(만 레이): 다다이즘적 예술 발전<br>　– 샤드그라프(크리스티안 샤드): 다다, 종이 오린 것을 인화지에 얹어 추상 형태·정치 포스터<br>　– 모홀리-나기: 바우하우스식, 그림자·투명도 실험<br>· <b>솔라리제이션<\/b>(상위): 현상 중 빛에 재노출 → 명암 반전 / 사바티에 효과 = 실제 기법 이름<br>· <b>시아노타입<\/b>(허셜): 완전 별개, 청록색 청사진, 철염 화학약품 / 안나 앳킨스 식물도감"],
["콜더(Calder)의 모빌과 스태빌은?", "· <b>모빌<\/b>: 1920년대 말 철사 인형 조각(“공중에 그린 선”, 회화·조각의 경계) → 1930년대 몬드리안의 원색·평면 + 가보의 구축 원리 → 모빌 완성 → 1932 초현실주의 우연성 가미, 자연에 의해 우연적으로 움직임<br>· <b>스태빌<\/b>: 모빌의 상대 개념, 거대해진 조각(움직이는 것·안 움직이는 것), 핵심은 환경적 특징 – 관객이 주변을 돌며 신체적·공간적 체험, 1960년대 이후 받침대 없는 야외 설치 조각"],
["국제주의 건축 양식의 형성과 나라별 운동은?", "· 구성주의 → 가보 형제 망명 → 바우하우스 → 1930년대 국제주의 양식, 조각의 비물질성·무중력 개념이 건축에 적용<br>· 독일 바우하우스: “형태는 기능을 따른다”, 산업 재료+기법으로 실용성<br>· 네덜란드 데 스틸: 회화적 이상의 미(순수미)를 건축에<br>· 러시아 구성주의: 사회주의 이념 + 산업 기술<br>· 공통: 기계적 질서, 기하학적 순수성, 재료의 진실성"],
["국제주의 양식의 형식적 특징 4가지는?", "1. <b>보편성<\/b>: 어느 나라나 수직·수평의 육면체<br>2. <b>산업 재료<\/b>: 특히 철골 + 유리<br>3. <b>비물질성·무중력성<\/b>: 벽면이 가벼워지고 유리로 대체<br>4. <b>개방성<\/b>: 유리를 통해 밖과 안의 풍경 연결"],
["르 코르뷔지에의 명언과 ‘현대 건축 5원칙’은?", "· “<b>집은 살기 위한 기계다<\/b>” – 기능주의(가장 편리하면 좋은 것)<br>· 배경: 석조 내력벽 한계 → 철근 콘크리트로 기둥이 하중 부담하는 <b>도미노(Dom-ino) 시스템<\/b>(domus 말장난)<br>1. <b>필로티<\/b>: 1층 벽 제거, 기둥 위로 띄움 → 비물질·무중력감(1층 주차장)<br>2. <b>가로로 긴 창<\/b>: 벽이 하중을 받지 않음<br>3. <b>자유로운 평면<\/b>: 내부 벽 자유 이동<br>4. <b>자유로운 입면(파사드)<\/b><br>5. <b>옥상 정원<\/b>: 평지붕 활용<br>· 대표작: <b>빌라 사부아<\/b> – 5원칙 모두 드러남"],
["르 코르뷔지에의 ‘모듈러(Modulor)’란?", "인체 치수(키 180cm 유럽 남성 기준)를 바탕으로 모든 건축 부품을 <b>규격화·표준화<\/b>"],
["고대 로마 주거 도무스 vs 인술라 구분은?", "· <b>도무스(Domus)<\/b>: 귀족·상류층, 1~2층 단독주택, 외부 창 적고 안뜰(아트리움) 중심 내향적 구조, 수세식 화장실·수도 등 고급<br>· <b>인술라(Insula)<\/b>: 서민·중산층, 4~5층(최대 10층) 다층 공동주택, 1층 상가·윗층 주거, 좁고 화재에 취약한 나무 구조<br>· 암기: 도무스 = 돈 많이 / 인술라 = 인간 수 많음"],
["미스 반데어로에(Mies van der Rohe)의 명언과 특징은?", "· “<b>적을수록 좋다(Less is more)<\/b>”<br>· 르 코르뷔지에의 기능주의보다 <b>미(美)의 극대화<\/b>(미술로 치면 미니멀)<br>· 구조체(기둥)와 벽체 완전 분리 → 공간의 흐름·유연성<br>· 재료 자체를 미적 요소로(크롬 도금·대리석 등 고급 재료) → 재료의 물성이 장식"]];</script>

<style>
:root{--bg:#fafaf7;--fg:#222;--card:#fff;--line:#e3e1da;--acc:#c0392b;--sub:#6b6b6b}
@media(prefers-color-scheme:dark){:root{--bg:#18181a;--fg:#e8e6e1;--card:#232326;--line:#38383c;--acc:#ff7a6b;--sub:#9a9a9a}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px}
h1{font-size:16px;margin:0 0 6px}.t{background:var(--acc);color:#fff;border-radius:4px;padding:1px 7px;margin-right:6px;font-size:13px}
button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
main{max-width:820px;margin:auto;padding:10px}
.q{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.q.x{border-color:var(--acc)}.w .q:not(.x){display:none}
.q label{font-size:12px;color:var(--sub);white-space:nowrap;padding-top:3px}
details{flex:1;min-width:0}summary{cursor:pointer;font-weight:600}summary b{color:var(--acc)}
details>div{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
details>div b{color:var(--acc)}#c{font-size:12px;color:var(--sub);margin-left:6px}
</style>
<body>
<script id="app">
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},$=s=>document.querySelector(s),N=(x,i)=>x[2]||i+1,C=()=>Object.keys(S).sort((a,b)=>a-b);
document.title=`[${SUBJ}] ${TITLE}`;
document.body.insertAdjacentHTML('afterbegin',`<header><h1><span class=t>${SUBJ}</span>${TITLE}</h1><label><input type=checkbox id=f> 틀린 것만</label> <button id=ex>오답 내보내기</button> <button id=cp>번호 복사</button><span id=c></span></header><main id=L>${QA.map((x,i)=>`<div class="q${S[N(x,i)]?' x':''}"><label><input type=checkbox data-n=${N(x,i)}${S[N(x,i)]?' checked':''}> 틀림</label><details><summary><b>${N(x,i)}.</b> ${x[0]}</summary><div>${x[1]}</div></details></div>`).join('')}</main>`);
const cnt=m=>$('#c').textContent=m||`틀림 ${C().length}/${QA.length}`;cnt();
$('#L').onchange=e=>{const t=e.target,n=t.dataset.n;t.checked?S[n]=1:delete S[n];t.closest('.q').classList.toggle('x',t.checked);sv();cnt()};
$('#f').onchange=e=>document.body.classList.toggle('w',e.target.checked);
$('#cp').onclick=()=>{const t=C().join(','),ok=()=>cnt('복사됨: '+(t||'없음')),fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove();ok()};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}};
$('#ex').onclick=()=>{const w=QA.map((x,i)=>[x[0],x[1],N(x,i)]).filter(x=>S[x[2]]);if(!w.length)return cnt('체크된 문항 없음');const j=v=>JSON.stringify(v).replace(/<\//g,'<\\/'),h='\ufeff<script>const KEY='+j(KEY+'-wrong')+',SUBJ='+j(SUBJ)+',TITLE='+j(TITLE+' (오답)')+',QA='+j(w)+';<\/script>\n<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+$('style').outerHTML+'<body>'+$('#app').outerHTML,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html;charset=utf-8'}));a.download=KEY+'-wrong.html';a.click()};
</script>
