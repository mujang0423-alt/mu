<script>const QA=[["덕흥리 고분의 의의?", "무덤 주인공과 축조 연대를 정확히 알 수 있는 유일한 고구려 고분"], ["강서대묘 현무 vs 통구사신총 현무?", "통구사신총 현무가 색채가 더 뚜렷하고 역동적"], ["조선 16세기 초상화 특징?", "살구빛 얼굴색, 공신상 제작, 얼굴의 높낮이(요철) 표현 시도 ※세밀한 훈염·세필 묘사는 후기"], ["강희안 고사관수도의 형식과 도가적 특징?", "소경산수인물화 / 물을 바라보며 자연과 자신을 관조 — 무위자연"], ["이암 화조구자도의 상징?", "흰·검은 개: 역병·잡귀를 물리침\n누렁이: 풍요·재산\n복숭아나무: 악귀를 쫓음"], ["김시 vs 손자 김식의 소 그림?", "김시: 쓸쓸한 정취\n김식: 다정다감하고 따뜻한 정취"], ["이정근 설경산수도 특징?", "X자형 구성, 식빵 모양 주산, 녹청색 위주 설채, 굵기 변화 심한 구륵법, 변형된 수지법"], ["이정근 미법산수도 특징?", "길게 이어지는 대각선 구도, 근농원담의 묵법"], ["조영석이 그림을 실은 화첩 이름?", "사제첩(사향노루 배꼽이라는 뜻)"], ["정선 인왕제색도를 그린 이유?", "병든 친구 이병연의 쾌유를 빌며 그의 집 근처를 그림(소나무=장수)"], ["소상팔경 중 연사모종?", "안개 낀 산사에서 들려오는 저녁 종소리"], ["조속 금궤도 특징?", "김알지 탄생설화, 청록 설채·오방정색, 세로 축화 형식"], ["정선 단발령망금강도 특징?", "부감시, 중경을 여백으로 처리한 파격 구성, 서양화법 부분 수용(가는 윤곽선 + 먹 농담으로 음영)"], ["김두량 월야산수도의 달 표현 기법?", "홍운탁월법(달 주변을 바림해 달을 드러냄)"], ["김정희 불이선란도 — 초서·예서 필법으로 그렸다는 뜻의 말?", "초예기자지법"], ["허련 그림의 독자성?", "황공망·예찬의 구도·필법을 바탕으로 독필 사용, 푸르스름한 담청"], ["한국 최초로 추상 양식을 추구한 화파와 그 뜻?", "신사실파 ※신감각파 X — 마음이 느낀 대로 표현하는 것이 새로운 사실"], ["권영우 작업의 지향?", "화선지를 뚫고 찢고 붙이는 무심한 동작의 반복 → 물성 극대화, 정신의 해방·자연 회귀라는 동양적 접근"], ["추녀·사래·부연을 제외한 서까래 끝에 붙이는 기와?", "연목기와"], ["취두·치미 등이 장식되지 않은 마루 끝에 세우는 기와?", "망와 ※잡상 X"], ["개심사 대웅전 특징?", "다포식인데 맞배지붕, 연등천장"], ["종묘의 의의와 방 사이 칸막이 대신 친 것?", "고대식 제례 형식, 단일 목조건축 중 최대 규모 / 발·장막을 쳐서 하늘나라를 상징"], ["경회루에서 기둥 사이 위쪽에 달아 경관을 액자처럼 보이게 하는 장식?", "낙양각"], ["통일신라에 탑 중심 → 금당 중심으로 바뀐 이유?", "진신사리를 모신 탑이 줄어 탑의 중요도 하락, 불상을 모신 금당의 중요도 상승"], ["수원화성 공심돈의 역할?", "높게 지어 적의 동선을 살피고 공격·방어를 동시에 하는 시설"], ["수원화성 육축의 빗물을 빼는 구멍?", "누혈"], ["1937년 창립, 김환기·유영국·이규상 등이 활동한 전위 미술단체?", "자유전(자유미술가협회) ※원형회 X"], ["1957년 결성, 앵포르멜이 크게 유행한 협회?", "현대미술가협회"], ["박서보의 60년대 원형질 → 70년대 시리즈?", "묘법"], ["디아스포라의 뜻?", "흩어진 사람들 — 고향을 떠나 다른 지역에 정착해 사는 공동체(원래 유대인을 부르던 말)"], ["노수현의 특징?", "실경산수(후에 관념산수로 복귀), 전통 기법에 현대적·현실적 시각을 접목"], ["허백련의 의의?", "전통 남종화법과 그 정신을 엄격히 전수해 독자적 고법 화풍을 이룸"], ["김은호의 화법?", "채색 중심의 감각적 화법 ※서양화법 X"], ["김종영의 의의?", "한국 최초로 추상 조각을 제시"], ["도리 밑에서 도리를 받치는 장방형 단면의 가로 부재?", "장여 ※쇠서 X"], ["보 vs 도리?", "보: 서까래 방향으로 놓임\n도리: 보와 직각, 서까래 바로 밑에서 직교하는 가로 부재"], ["수덕사 대웅전의 의의?", "건립 연대를 정확히 알 수 있는 가장 오래된 목조건축"], ["공포의 기본 부재 3가지?", "주두, 첨차, 소로"], ["미륵사지 석탑의 의의?", "현존하는 가장 오래되고 가장 큰 석탑 ※목조건축 X"], ["부여 군수리 석조여래좌상의 수인·대좌·재료?", "선정인, 상현좌, 곱돌(납석)"], ["백제 금제관식의 주된 무늬(인동 넝쿨 + 이국적 당초)?", "인동당초문"], ["칠지도의 상징과 제작?", "벽사·생명력 상징 / 철제, 7개의 가지, 금상감 명문"], ["국보 83호 반가사유상의 의의?", "정면 위주에서 입체감·사실성을 찾기 시작한 불상, 환조의 최고 걸작, 가장 큰 금동반가사유상"], ["신라 금관에서 관테 아래로 늘어뜨린 장식?", "드리개(수식) ※세움장식은 입식"], ["통일신라 후기 석탑의 변화?", "옥개받침 5단→4단, 옥개석이 얇아지고 전각 반전이 심해짐, 이형탑 등장"], ["옥개석 추녀 끝의 들려 올라간 부분?", "전각 ※우동: 낙수면이 만나는 모서리"], ["월정사 석조보살좌상의 강원 지역 양식 특징?", "높은 원통형 보관, 보개, 둥글고 통통한 얼굴, 부드럽고 곡선적인 조형감"], ["월정사 석조보살좌상의 자세?", "호궤좌"], ["산치대탑 요소에 해당하는 상륜부 부재(안다·하르미카·차트라)?", "안다: 복발 / 하르미카: 앙화 / 차트라: 보륜"], ["보림사 철조비로자나불좌상의 의의?", "명문을 알 수 있는 가장 오래된 철불"], ["기림사 건칠보살좌상의 건칠 기법과 과정?", "탈활 건칠법 — 흙 원형 → 삼베·옻칠 여러 겹 → 건조 → 내부 흙을 파내고 나무 심 넣기"]];</script>
<script id="app">
