<script>const QA=[
["동료장학의 개념과 장점은?", "2명 이상의 교사가 짝을 이뤄 서로의 수업을 관찰·피드백하며 전문성을 향상 / 장점: 이용의 편리성, 인접 자원 최대 활용, 동료 관계 증진"],

["컨설팅 장학의 개념과 원리는?", "학교·교원의 자발적 의뢰로 외부 전문가가 학교 교육 전반에 조언·해결책을 제공 / 원리: 전문성, 자발성, 자문성, 독립성, 일시성, 교육성"],
["변혁적 지도성의 개념은?", "구성원의 성장 욕구를 자극·동기화해 태도와 신념을 변화시키고 기대 이상의 성과를 달성하게 하는 지도성"],
["변혁적 지도성의 4요소는?", "이상화된 영향력, 영감적 동기화(감화력), 지적 자극, 개별적 배려"],
["문화적 지도성이란?", "구성원의 의미 추구 욕구를 충족시켜 학교의 주인으로 만들고 조직의 제도적 통합을 가능케 하는 지도성 / 조직 문화의 변화로 효과성 개선"],
["'현장 교육 전문가'로서의 지도성은?", "교육적 지도성: 교육에 대한 전문 지식·능력으로 교수·학습 프로그램, 교육과정 개발 등을 효과적으로 수행"],
["도덕적 지도성이란?", "지도자의 도덕성과 구성원의 자율성을 바탕으로 구성원 각자를 셀프 리더로 만들어 도덕적이고 효과적인 조직을 만드는 지도성"],
["분산적 지도성의 개념과 목표는?", "지도자·구성원·상황의 상호작용으로 지도성이 분산되어 실행되는 것 / 목표: 교수·학습 개선, 전문적 학습공동체 구현"],
["호이·미스켈 학교풍토론의 교사·교장 행동 특성은?", "교사: 협동, 친밀, 일탈 / 교장: 지원, 지시, 제한"],
["호이·미스켈의 학교풍토 4유형은?", "개방 풍토, 몰입 풍토, 일탈 풍토, 폐쇄 풍토"],
["개방 풍토의 특징은?", "교장은 교사의 제안과 전문성을 존중·지원 / 교사는 협동·친밀성이 높고 과업에 헌신"],
["폐쇄 풍토의 특징은?", "교장은 불필요한 잡무 지시·통제, 교사를 존중하지 않음 / 교사는 무관심·무책임, 교장과 불화"],
["허즈버그 동기-위생 이론의 개념은?", "동기 요인: 충족 시 만족·동기 유발, 없어도 크게 불만은 없음 / 위생 요인: 충족은 당연하고, 불충족 시 불만 크게 증가"],
["허즈버그 이론의 학교 조직 시사점은?", "직무 재설계(직무 풍요화): 권한 이양, 자율성·책임감 부여로 성장 기회 제공 / 경력 단계 프로그램(수습 교사제 등)"],
["의사결정 모형 6가지는?", "합리 모형, 만족 모형, 점증 모형, 혼합 모형, 최적 모형, 쓰레기통 모형"],
["만족 모형의 개념과 장단점은?", "최선이 아닌 만족할 만한 대안을 선택 / 장점: 합리 모형보다 신속한 결정 / 단점: 주관적, 구체적 기준 부재"],
["점증 모형의 개념과 장단점은?", "기존 정책을 약간 수정·개선해 결정 / 장점: 안정적 결정·집행, 폭넓은 지지, 실현 가능성 높음 / 단점: 소극적 악의 제거에 치중, 보수적, 개혁에 부적합"],
["최적 모형이란?", "합리성뿐 아니라 직관·통찰·상상력 같은 초합리성도 함께 고려해 결정하는 모형"],
["로크 목표설정 이론의 핵심과 좋은 목표의 속성은?", "목표가 동기를 형성하는 가장 중요한 요인 / 구체성, 곤란성, 참여, 수용성, 피드백, 동료 경쟁"],
["목표설정 이론에서 수용성이란?", "구성원이 자발적으로 수용한 목표일수록 더 큰 동기 유발"],
["목표관리기법(MBO)의 개념과 장단점은?", "구성원이 목표 설정에 공동 참여하고 성과를 평가·보상하는 관리 기법 / 장점: 참여 의식 고양, 인적 자원 활용, 효율성 제고, 역할 갈등 해소 / 단점: 단기적·가시적 목표에 치중, 업무 부담 가중"],
["조하리의 창 4영역은?", "개방적 영역(나·타인 모두 앎), 맹목적 영역(타인만 앎), 잠재적 영역(나만 앎), 미지적 영역(둘 다 모름)"],
["호이·타터 참여적 의사결정에서 민주적 상황(관련성·전문성 有)의 구조와 교장 역할은?", "신뢰 有: 집단합의 → 통합자, 다수결 → 의회인 (항상·광범위 참여) / 신뢰 無: 집단자문 → 교육자 (항상 참여하나 제한적)"],
["학습조직이란?", "교사들이 지식·정보를 공유하고 협력적 학습으로 지속적으로 새 지식을 창출해 환경 변화에 적응하는 조직"],
["학습조직의 5가지 원리(센게)는?", "개인적 숙련, 정신 모델, 공유 비전, 팀 학습, 시스템 사고"],
["학습조직 원리 중 개인적 숙련과 정신 모델이란?", "개인적 숙련: 원하는 지식·기술·태도를 위해 역량을 지속적으로 키움 / 정신 모델: 현상을 이해하는 인식 체계, 성찰과 탐구로 사고의 틀을 새롭게 함"],
["학습조직 원리 중 공유 비전, 팀 학습, 시스템 사고란?", "공유 비전: 조직이 추구할 미래상에 공감대 형성 / 팀 학습: 팀으로 학습해 조직 학습 유도 / 시스템 사고: 사건을 부분이 아닌 전체적 상호작용으로 이해"],
["전문적 학습공동체의 필요성은?", "수업 개선, 교사 전문성 신장, 학생 학업성취 향상, 학교 조직 문화 개선"],
["단위학교 책임경영제(SBM)의 개념과 장점은?", "학교 운영 권한을 단위학교에 대폭 이양해 실정에 맞게 운영하고 책임지는 제도 / 장점: 학생 중심·다양한 교육, 학교 특성 반영, 교사 전문성·책임감 제고, 만족도 향상"],
["SBM 실천 방안은?", "학교운영위원회, 초빙교사제, 교장공모제"],
["학교운영위원회 구성원은?", "교원위원(교장 당연직), 학부모위원, 지역위원"],
["조직개발(OD)이란?", "조직 효과성 향상을 목적으로 조직 전반에 걸쳐 계획적으로 변화를 꾀하는 관리 전략"],
["단위학교 예산제도의 개념과 장점은?", "교육청 배분 방식 대신 학교가 예산을 자율적으로 편성·운영 / 장점: 효율적·자율적 운영, 교육의 질 향상, 교사·학부모 참여로 투명성·신뢰성 제고"],
["세티아와 글리노의 조직 문화 유형은?", "인간·성과 관심 기준 / 보호 문화(인간↑성과↓), 냉담 문화(모두↓), 실적 문화(성과↑인간↓), 통합 문화(모두↑)"],
["스타인호프와 오웬스의 학교 문화 유형은?", "가족 문화(애정·협동), 기계 문화(교사를 기계처럼 이용), 공연 문화(학생 반응·멋진 가르침 중시), 공포 문화(서로 비난·적대적)"]];</script>
<script id="m">
let S=[];try{S=JSON.parse(localStorage[KEY]||"[]")}catch(e){}
const b=document.body,L=()=>[...S].sort((x,y)=>x-y),sv=()=>{try{localStorage[KEY]=JSON.stringify(S)}catch(e){}};

b.onchange=e=>{const t=e.target;if(t.id=='o')return b.classList.toggle('only',t.checked);const i=+t.dataset.i;S=t.checked?[...S,i]:S.filter(v=>v!=i);t.closest('.q').classList.toggle('w',t.checked);sv()};
x.onclick=()=>{if(!S.length)return alert('체크된 문항이 없습니다');const k=KEY+'-wrong',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([`<script>const KEY=${JSON.stringify(k)};<\/script>\n<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${k}</title>${document.querySelector('style').outerHTML}<body><script>const QA=${JSON.stringify(L().map(i=>QA[i]))};<\/script><script id="m">${m.textContent}<\/script>`],{type:'text/html'}));a.download=k+'.html';a.click()};
c.onclick=()=>{const t=L().map(i=>i+1).join(','),f=()=>{const a=document.createElement('textarea');a.value=t;b.append(a);a.select();document.execCommand('copy');a.remove()};try{navigator.clipboard.writeText(t).catch(f)}catch(e){f()}};
</script>
