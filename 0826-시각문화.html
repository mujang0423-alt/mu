<script>
const QA=[
["시각문화 미술교육(VCAE)의 시대적 배경은?","형식주의에서 구성주의로의 이행, 시각 미디어의 급속한 발달, 맥락(배경)의 중요성 부각 — 작품·제작자·감상자의 배경이 모두 중요해짐."],
["VCAE의 사상적 배경은?","사회재건주의 철학, 포스트모더니즘, 비판철학, 로티의 신실용주의."],
["랜드하와가 말한 시각적 문해력의 세 가지는?","시각적 사고, 시각적 학습, 시각적 의사소통."],
["시각적 사고란?","내면에서 조형요소와 원리를 활용해 내적·상징적 이미지를 조직화하는 것."],
["시각적 학습이란?","시각 현상들과의 상호작용을 통해 지식·정보를 습득하고 새롭게 재구성하는 것."],
["시각 문해력이란?","시각 이미지를 글 읽듯 읽어내는 능력. 이미지에 숨겨진 의도와 가치까지 비판적으로 해독하는 힘."],
["VCAE의 목적은?","권한 부여, 비판적 이해, 시각 문해력 향상, 문화 창조에 참여하는 민주적 시민 육성."],
["VCAE의 필요성은?","① 다양한 시각문화 현상을 향유하기 위해 ② 시각문화와 삶의 상호 맥락을 이해·활용하기 위해 ③ 문화적 정체성을 강화하고 미래 문화산업 인재를 양성하기 위해 ④ 문화 현상을 비판적으로 수용하는 능력을 기르기 위해."],
["VCAE의 한계점은?","철학적 토대·심리학적 근거 등 이론적 배경이 미흡함, 비평 중시로 작품 제작에 소홀함, 정치·사회적 이슈에 치중해 미술 교과의 본질이 희미해짐, 표현 매체가 인공적이어서 전통 재료의 감각적 쾌감이 부족함."],
["VCAE의 성과는?","미술교육의 내용과 범위 확장, 제작과 비평의 공생 관계 확립, 표현 매체(시각 미디어) 확장, 학생의 삶과 교육의 연계 및 적극적 참여 유도, 사회적 정당성 확보."],
["VCAE의 지도 방법은?","통합 교육, 다양한 시각문화 이미지를 활용한 수업, 구성주의적 수업, 학생의 삶과 연관된 내용, 순수미술뿐 아니라 대중문화·다문화 미술을 함께 다룸, 제작과 비평의 상호 보완적 지도."],
["키퍼-보이드의 인터비주얼에서 세 가지 맥락은?","작품, 제작자, 감상자."],
["인터비주얼 과정은 무엇을 기반으로 하는가?","구성주의."],
["인터비주얼에서 감상자가 갖추어야 할 것은?","자신의 경험과 가치관, 그리고 감상자와 관련된 맥락(자기 자신에 대한 이해와 배우려는 태도)."],
["인터비주얼을 통해 얻는 효과는?","학습자가 의미를 그대로 수용하지 않고 자신의 경험·지식에 비추어 재구성하므로, 비판적 사고력이 길러지고 자신과 자신의 삶을 더 잘 이해하며 다양한 비판적 관점을 가질 수 있다."],
["시각문화에 대한 접근에서 나이트와 키퍼-보이드가 말한 것은 각각?","나이트: 가치 명료화 / 키퍼-보이드: 상호 관련적 접근."],
["상호 관련성이란?","실생활의 문제와 경험을 시각문화와 관련시키는 접근. 이미지는 그것이 생산된 문화·사회와 연결되어 있으므로 관련 문화를 함께 알아야 이미지를 파악할 수 있다."],
["던컴의 원칙 중 '권력'은 무엇을 하는 것인가?","사회·경제·문화적 컨텍스트 속에서 이미지가 권력을 행사하는 방법을 살펴보는 것. (짝이 되는 개념은 '응시(게이즈)')"],
["던컴이 말한 시각문화 미술교육의 사상 다섯 가지는?","① 시각문화는 새로운 패러다임이다 ② 시각문화는 다문화적이다 ③ 시각문화에서 제작과 비평은 공존하며 서로 보완한다 ④ 시각문화는 미학적 가치와 사회적 이슈를 함께 탐구한다 ⑤ 시각문화는 자연스러운 이미지의 학습이다."],
["햄블런이 말한 '문화적 담화'란?","시각문화가 제시하는 힘을 강조하며, 시각 이미지에 담긴 문화적 요소를 토론과 대화의 주제로 삼아 자아 정체성 등을 성찰하게 하는 것."],
["문화적 담화의 예시는?","광고에 나오는 여성·남성의 모습을 통해 문화가 제시하는 성 역할을 알 수 있고, 만화영화 인물의 묘사 방식을 통해 특정 인종·국가·종교에 대한 견해를 알 수 있다."],
["프리드먼: 교육과정의 모든 교과를 가로지르는 교육은?","통합 교육과정."],
["프리드먼: 절대 지식 대신 담론을 새롭게 구성해 가는 해석 능력을 강조하는 것은?","구성주의적 비판."],
["프리드먼: 다양한 문화 집단들의 시각예술을 포함한 교육과정은?","문화적 반응."],
["프리드먼이 말한 포스트모더니즘 교육과정의 다섯 가지 조건은?","작은 이야기, 콜라주, 재현의 형식, 창의적 생산, 투명성."],
["교육과정을 왜 '콜라주'라고 하는가?","교육과정 생산이 다양한 개인과 집단의 아이디어를 이어 붙인 작업이기 때문."],
["윌슨이 말한 '제3의 공간'이란?","전통적 학교 미술과 학생들이 관심을 갖는 대중적 시각문화가 공존하는, 새로운 미술교육의 장."],
["윌슨의 체제와 반체제는 각각 무엇인가?","체제: 기존 학교 미술 교육과정 / 반체제: 만화 그리기처럼 학생들이 자발적으로 하는 그리기."],
["윌슨은 만화 그리기를 어떻게 보았는가?","단순한 대중매체의 영향이나 모방이 아니라 새로운 문화 현상·사고·가치관이 반영된 것이므로 긍정적으로 보고 존중해야 한다."],
["윌슨이 강조한 미술교육은?","텍스트 읽기로서의 미술교육."],
["윌슨의 평가 항목 두 범주는?","내용과 행동."],
["윌슨 평가 항목 중 '내용'에 해당하는 것은?","매체·도구, 형성 과정, 시각적 구조, 소재, 미술의 형식, 문화적 맥락, 미술 이론과 미술 비평."],
["윌슨 평가 항목 중 '행동'에 해당하는 것은?","지각, 지식(이해), 분석, 감상, 제작. — 기술과 창의성은 '제작', 가치 평가·감정은 '감상'에 들어감."],
["에플랜드의 시사점은?","미술 교육과정의 패러다임 변화를 이끌었고, 인지 중심 미술교육을 지식의 통합 및 학생의 삶과의 연계 중심으로 전환시켰으며, 순수미술과 대중문화를 균형 있게 수용하는 교육과정을 논의했다."],
["에플랜드가 말한 미술이 제공하는 인지적 특성(논의) 네 가지는?","인지적 유연성 논의, 지식 통합 논의, 상상력 논의, 미적 경험 논의."],
["미적 경험 논의란?","인지적 이해가 전제되었을 때 미적 경험도 비로소 성립 가능하며, 미술을 통한 생생한 미적 경험은 그 자체로 교육적 가치를 지닌다."],
["레티스(격자) 모형이란?","격자 구조의 엇갈린 패턴으로 다양한 상황에서 개념을 다차원적으로 검토할 수 있게 하는 모형. 비구조화된 교과인 미술에 적합하다."],
["레티스 모형은 누구의 영향을 받았는가?","스피로의 인지적 유연성 이론."],
["인지적 유연성이란?","지식의 범주를 넘나들고 연결지으면서, 다양한 방법으로 급격하게 변화하는 상황적 요구에 적응력 있게 대처하는 능력."],
["인지적 유연성을 증진시키는 방법은?","학습자의 맥락에 맞는 실제적 과제를 제공하고, 습득한 지식과 경험을 다양하게 표현하게 하며, 지식을 확장시키는 활동을 제공한다."],
["나선형 모형의 특징은?","순차적이고 계층적이다."],
["삶을 위한 미술교육의 목표는?","자신을 잘 이해하고 타인도 이해하면서 전체적으로 자아를 성장시켜, 사회 발전과 지구촌 사회에 기여할 수 있는 사람이 되게 하는 것."],
["삶을 위한 미술교육의 교육 내용 일곱 가지는?","미학, 미술사, 미술 제작, 미술 비평, 시각문화 연구, 창의적 자아표현, 현대 테크놀로지."],
["개인의 관심을 반영해 작품을 제작하며 자기반성을 하고, 우리는 누구인가·무엇을 믿는가·어디에 적합한가를 묻는 전략은?","창의적 자아표현."],
["교육 전략에서 간학문적 접근은 어디에 해당하는가?","역사적·맥락적 연구(통합적 접근)."],
["삶을 위한 미술교육의 교육 방법은?","주제 중심의 교수·학습, 그리고 구성주의적 접근으로 학생이 스스로 지식을 재구성하게 하는 것."],
["삶을 위한 미술교육의 평가 두 가지는?","폐쇄적 평가(결과 평가: 연구보고서, 작품 제출 등) / 개방적 평가(과정 평가: 전시, 시연, 포트폴리오 등)."],
["그 평가의 목적은?","서열화가 아니라, 학생이 자신과 타인을 이해하고 세상을 더 좋게 바꾸는 힘을 기르도록 돕는 것."],
["하우스먼이 말한 미술교사의 역할은?","매체와 미디어에 대해 잘 알고 있어야 하고, 학생의 생각과 매체의 관계를 이해해야 하며, 학생을 창의적인 존재로 존중해야 한다."],
["하우스먼이 중시한 것 — 아이디어를 자유롭게 말하고 새로운 방법을 시도하게 하는 것은?","피드백."],
["하우스먼의 평가관은?","교사가 직접 평가도구를 제작해야 하고, 미술 활동 과정 자체의 평가가 중요하며, 표현(심동적) 영역과 지적(인지적) 영역의 목표가 함께 제시되어야 하고, 포트폴리오·관찰평가·누가 기록 등을 개발해 평가해야 한다."],
["엘게라가 말한 '실질적인 행위'란?","개인과 관객 사이의 의사소통과 이해를 촉진하는 사회적 행위. 미술이 실제 사회 문제를 해결할 수 있도록 하는 실제적 행위."],
["다중계층적 참여 구조의 순서는?","명목적 참여 → 지시적 참여 → 창의적 참여 → 협업적 참여."],
["명목적 참여란?","수동적으로 작품을 바라보는 행위. 일회적 접촉으로 무의식적이고 우연한 참여 수준."],
["지시적 참여란?","단순한 임무를 수행하는 수준. 외부의 요구에 의해 소극적·비자발적으로 참여한다."],
["창의적 참여와 협업 수준의 참여는 어떻게 다른가?","창의적 참여는 미술가가 만들어 놓은 틀 안에서 참여자가 창의성을 발휘하는 부분적 참여이고, 협업적 참여는 미술가와 참여자가 완전히 동등한 수준에서 자발적으로 전 과정에 참여하는 것."],
["사회적 상황에서 '교환 문제'란?","예술가가 지역사회에 바람직한 무언가를 제공하며 프로젝트를 착수하면 지역사회는 예술가에게 프로젝트 장소나 참여자를 제공하는, 서로 무엇을 주고받는가의 문제."],
["클레어 비숍이 말한 프로젝트의 요건은?","참여자는 바깥의 대중인 2차 참여자가 아니라 실질적 제작자인 1차 참여자가 된다. 미적 경험보다 문제 해결과 구체적 성과가 중요하고, 미학적 성격보다 윤리적 성격이 우선하며, 실질적이고 효능 있는 가치 있는 과제여야 한다."],
["공예와 액티비즘이 합쳐진, 뜨개질 프로젝트 같은 작업을 무엇이라 하는가?","크래프티비즘. 협업 수준의 참여 작품에 해당한다."],

["기 드보르가 말한 사회참여 미술의 핵심적 관점은?","능동적 주체 창출, 저자성의 새로운 태도, 공동체적 관심."],
["'저자성의 새로운 태도'란?","저자성이 작가 개인만의 것이 아니라 참여자 모두에게 확산·양도되는 것. 이렇게 양도될 때 더 평등하고 민주적인 것으로 평가된다."],

["CBAE의 범주 네 가지는?","지역사회, 민족 공동체, 생태학, 사이버 공동체."],
["지역사회 중심 미술교육은 어떻게 하는가?","지역사회의 자원을 활용해 지역 미술가를 학교에 초빙하여 함께 교육하고, 그 지역의 문화와 역사를 배우게 한다."],
["민족 공동체 중심 미술교육이란?","소수민족·소외 계층의 문화를 배움으로써 개개인의 정체성과 그들만의 공동체적 뿌리를 함양하게 하는 것."],
["사이버 공동체 중심 미술교육이란?","물리적 지역사회를 넘어 가상 세계까지 지역사회의 범위에 포함하는 것. SNS나 온라인 게임을 교육 프로그램과 연결해 학생의 삶과의 연계성과 학습 동기를 높인다."]
];
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const L=document.getElementById("list"),O=document.getElementById("only"),C=document.getElementById("cnt");
const nums=()=>QA.map((_,i)=>S[i]?i+1:0).filter(Boolean);
function flt(){[...L.children].forEach((el,i)=>{el.classList.toggle("on",!!S[i]);el.classList.toggle("hide",O.checked&&!S[i])});C.textContent="틀림 "+nums().length+" / "+QA.length}
QA.forEach((r,i)=>{const w=document.createElement("div");w.className="it";
const d=document.createElement("details"),s=document.createElement("summary"),p=document.createElement("p");
s.textContent=(i+1)+". "+r[0];p.textContent=r[1];d.append(s,p);
const l=document.createElement("label");l.className="w";const c=document.createElement("input");c.type="checkbox";c.checked=!!S[i];
c.onchange=()=>{S[i]=c.checked;save();flt()};l.append(c,document.createTextNode("틀림"));w.append(d,l);L.append(w)});
O.onchange=flt;flt();
document.getElementById("exp").onclick=()=>{const k=KEY+"-wrong",W=QA.filter((_,i)=>S[i]);if(!W.length)return alert("체크된 문항이 없습니다.");
const h=L.innerHTML;L.innerHTML="";
const doc="<!doctype html>"+document.documentElement.outerHTML.replace(/const KEY=.*?;/,"const KEY="+JSON.stringify(k)+";").replace(/const QA=[\s\S]*?\];/,"const QA="+JSON.stringify(W).replace(/</g,"\\u003c")+";");
L.innerHTML=h;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([doc],{type:"text/html"}));a.download=k+".html";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("cp").onclick=()=>{const t=nums().join(",");
const fb=()=>{const x=document.createElement("textarea");x.value=t;document.body.append(x);x.select();try{document.execCommand("copy")}catch(e){}x.remove()};
try{navigator.clipboard.writeText(t).then(()=>alert("복사: "+t),()=>{fb();alert("복사: "+t)})}catch(e){fb();alert("복사: "+t)}};
</script></body></html>
