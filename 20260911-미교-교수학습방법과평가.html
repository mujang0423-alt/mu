["직접 교수법의 단계는?","문제 인식 → 설명 및 시범 → 질의응답 → 연습 활동 → 작품 제작 → 정리 및 발전"],

["반응 중심 학습법의 단계는?","반응 형성 → 반응 명료화 → 반응 심화 → 반응의 내면화(정리 및 발전)"],

["반응 명료화 단계에서 하는 일은?","교사-학생, 학생-학생 간 질문·토의·반성 등 상호작용을 통해 형성된 반응을 명료하게 한다."],
["반응 심화 단계에서 하는 일은?","작가의 의도 탐색, 관련 작품 비교·탐색, 새로운 시각으로의 재해석, 표현 활동과의 연계를 통해 반응을 심화한다."],

["반응 중심 학습법은 무엇을 기르기 위한 방법인가?","미적 체험과 감상 능력(감성)"],

["아이디어 탐색 단계에서 하는 일은?","브레인스토밍, 마인드맵 등 확산적 사고 기법으로 문제에 대한 아이디어를 다양하게 발상한다."],
["아이디어 정교화 단계에서 하는 일은?","탐색한 아이디어를 분석·정교화하는 단계. 스케치로 아이디어를 시각화하고, 여러 아이디어 중 최선을 선택하여 재검토·보완한다."],
["종합 및 재검토 단계에서 하는 일은?","결과물에 아이디어가 잘 반영되었는지 감상·분석하고, 실생활의 다른 문제에도 적용해 보며 새로운 선택의 가능성을 생각한다."],
["귀납적 사고법의 단계는?","문제 인식 → 관계 탐색 → 개념 발견 → 개념 적용 → 정리 및 발전"],
["귀납적 사고법의 문제 인식 단계에서 하는 일은?","학습 자료를 통해 학습 문제를 파악하는 단계. 교사는 문제에 대한 관심을 고조시키고 학생의 기존 사고 체계를 변화시킬 학습 자료를 준비한다."],
["귀납적 사고법의 관계 탐색 단계에서 하는 일은?","제시된 자료를 다양하게 관찰·탐색하며 공통점과 차이점을 찾는다. 주제에 대한 생각을 명확히 하고 자신의 의미와 언어를 다른 학생과 대비시켜 정교화하도록 유도한다."],
["귀납적 사고법은 어떤 능력을 기르기 위한 방법인가?","미적 체험·감상 영역의 미적 인식 능력"],
["PMI 기법이란?","Plus(장점)·Minus(단점)·Interesting(흥미로운 점)으로 나누어 살피는 기법. 장점은 부각하고 단점은 보완하며 흥미로운 점을 창의적·독창적으로 발전시킨다."],
["비주얼 씽킹이란?","그림과 글을 이용해 생각을 정리하고 소통하는 능력, 이미지로 생각하는 습관. 한눈에 쉽게 인식되고 공감대 형성이 쉬우며 의사 결정 속도가 빠르다."],
["스캠퍼(SCAMPER) 기법의 항목은?","대체하기 / 결합하기 / 응용(적용)하기 / 수정·확대·축소하기 / 다른 용도로 사용하기 / 제거하기 / 재배열·뒤집기"],
["'선풍기 날개를 크게 하거나 작게 하면 어떻게 될까'는 스캠퍼의 어느 항목인가?","수정하기(확대·축소, Modify)"],
["속성 열거법의 단계는?","① 대상의 주요 속성을 열거한다 → ② 속성의 변경 방법을 열거한다 → ③ 그 속성을 다른 대상의 속성 변경에 활용한다"],
["육색 사고모 기법에서 청색 모자의 역할은?","사회자 역할. 메타인지를 발휘하여 사고 과정을 조절하고 요약·정리한다."],
["시넥틱스의 네 가지 유추는?","직접 유추 / 개인(의인) 유추 / 상징적 유추 / 환상적 유추"],
["브레인스토밍의 4대 원칙은?","판단 유보(비판 금지) / 질보다 양 / 자유분방한 발상 / 결합과 개선"],
["마인드맵이란?","중심에서 사방으로 뻗어 나간다는 의미의 방사형 사고 표현. 글자·기호·그림을 사용하여 마음속 지도를 그리듯 생각을 표현하는 방법."],
["형태 분석법(속성 분석법)이란?","각 요인의 속성을 가로축과 세로축에 열거하여 차트를 만들고, 교차하는 각 칸에 새로운 아이디어를 기록하는 행렬 기법. 다양한 측면에서 체계적으로 많은 아이디어를 생성할 수 있다."],
["강제 결합법이란?","관련 없는 두 개 이상의 대상을 인위적으로 연결시켜 발상하는 방법. 아이디어가 떠오르지 않을 때 유용하며 사고의 유연성을 기른다."],
["프로젝트법의 두 가지 유형은?","아이디어를 외적으로 드러내기 위한 프로젝트 / 미적 경험을 즐기기 위한 프로젝트"],
["프로젝트법의 단계는?","목표 설정 → 계획 → 실행 → 평가"],
["프로젝트법의 목표 설정 단계에서 지도상 유의점은?","학생 스스로 목표를 설정하게 할 것, 학교 교육 계획과 연관된 목표일 것, 바람직한 지식·기능·태도를 기를 수 있을 것, 학습자의 흥미를 향상시킬 것, 시간 낭비가 일어나지 않을 것, 재료와 관련 자료를 쉽게 얻을 수 있을 것."],
["프로젝트법의 계획 단계에서 점검할 사항은?","프로젝트를 통해 어떤 바람직한 지식·기능·태도를 얻게 되는가, 성공적으로 마치기 위한 적절한 시설과 자료가 있는가, 활동이 학생의 발달 수준에 적절한가, 흥미를 유지할 충분한 범위와 다양성이 있는가."],
["프로젝트법의 장점은?","학생의 주체성을 살려 자발적·능동적 학습이 가능하고, 실생활과 연계되어 학습자의 흥미를 이끌며 실제적인 문제 해결 능력에 도움이 된다. 자기 평가·동료 평가를 병행해 자기주도적 학습 능력을 기를 수 있다."],
["학생이 스스로 질문하고 가설을 세우고 관찰하며 문제 해결 방법을 사용함으로써 고등 사고 능력을 기르는 방법은?","탐구 학습법"],
["문제 중심 학습법(일반적 단계)은?","문제 인식 및 확인 → 문제 해결을 위한 자료 수집 → 해결안 도출 → 해결안 발표 → 정리 및 평가"],
["문제 중심 학습법 응용 모형의 단계는?","문제 제시 → 문제 재확인 → 발표 → 결론 → 평가"],
["문제 중심 학습법에서 문제 재확인 단계의 네 가지 요소는?","생각 / 사실 / 학습 과제 / 향후 계획"],
["토론법의 단계는?","도입 → 의제 점검 및 공유 → 진행 방법 결정 → 진행 → 정리 및 발전"],
["토론법의 진행 단계에서 교사가 할 일은?","학생이 자신과 타인의 발언을 정리하고 적을 수 있도록 하며, 토론 규칙을 잘 지키도록 지도한다."],
["토론법의 평가 기준은?","사전에 준비한 자료의 다양성과 충실성 / 토론 내용의 충실성과 논리성 / 반대 의견을 존중하는 태도 / 토론 진행 방법"],
["토론법의 장점은?","비판적 사고력·자기주도적 학습 능력을 기를 수 있고, 교수·학습과 평가가 동시에 이루어지며, 체험·표현·감상 전 영역에서 폭넓게 활용할 수 있다."],
["평가 시기에 따른 평가 유형 구분은?","수업 전 진단 평가 / 수업 중 형성 평가 / 수업 후 총괄 평가"],
["감상문·비평문의 평가 기준은?","준비도 / 이해력 / 표현력 / 비평 능력 / 미술사의 이해"],
["감상지에 포함되어야 할 내용은?","작품의 주제 / 표현상의 특징 / 재료와 기법 / 제작 의도 / 감상자의 느낌"],
["서술형·논술형 평가의 평가 기준은?","미술에 관한 이해 / 재료와 용구 / 조형 요소와 원리 / 제작 방법 / 미술사"],
["서술형·논술형 평가의 장점은?","학생이 실제로 이해하고 있는지를 확인할 수 있고, 지식뿐 아니라 논리성·타당성 등 글의 전개 방식까지 평가할 수 있으며, 창의력과 비판력을 기를 수 있다."],
["실기 평가의 특징은?","교수·학습과 평가가 동시에 이루어지며, 개별 학생을 관찰하고 지도·조언하는 과정 자체가 평가의 일부가 된다. 학생의 실제적인 수행 능력을 평가할 수 있다."],
["실기 평가의 유의점은?","기능 그 자체보다 태도와 창의성에 중점을 두고, 태도·과정·결과를 고르게 평가한다."],
["포트폴리오 평가의 교사 입장 장점은?","학생의 현재 발달 수준을 진단할 수 있고, 누적된 결과물을 바탕으로 피드백을 제공하여 발전 방향을 안내할 수 있다."],
["포트폴리오의 평가 기준은?","작품집의 경우 작품의 성실성, 지속적 발전 여부, 포트폴리오 형식. 연구 과제의 경우 내용의 이해도, 아이디어의 창의성, 자료의 충실성, 편집."],
["포트폴리오 평가의 단점과 보완 방법은?","제작과 채점에 시간이 오래 걸리고 채점에 주관성이 개입될 수 있다. 루브릭을 사용하여 보완한다."],
["구술 평가의 평가 기준은?","준비도 / 이해력 / 판단력 / 의사소통 능력"],
["미술과에서 구술 평가는 어떻게 이루어지는가?","작품에 대한 자신의 생각이나 타인의 작품에 대한 견해를 심층적으로 말하게 한다."],
["성취기준의 의미는?","교과를 통해 학생이 배워야 할 지식과 기능, 수업 후 학생이 할 수 있거나 할 수 있기를 기대하는 능력을 나타내는 결과 중심의 도달점."],
["루브릭의 평가자 측면 장점은?","평가 시 활용할 수 있도록 각각의 수행 수준에 대한 특징 정보를 명세하여 제공하므로 평가의 정확성과 신뢰도를 높인다."],
["루브릭의 학습자 측면 장점은?","자신이 어느 수준인지 분명한 피드백을 받고, 향후 수행을 위해 무엇이 필요한지 알 수 있으며, 스스로 평가 과정에 참여할 수 있다."],
["루브릭 작성·활용 시 유의 사항은?","충분한 사전 설명 / 실제적인 피드백 제공 / 구체적이고 세분화된 수행 수준 명세 / 실현 가능한 수준으로 설정"],
["루브릭에서 대표적으로 활용할 수 있는 평가 도구는?","체크리스트, 평정 척도"],
