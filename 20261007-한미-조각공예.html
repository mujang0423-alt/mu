<!doctype html><html lang="ko"><head><script>const KEY="1007-한미-조각공예";</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1007 한미 탑·불상·도자</title>
<style>

<div class="top"><h1>1007 한미 탑·불상·도자</h1><label><input type="checkbox" id="only"> 틀린 것만</label></div>
<div id="list"></div>
<script>
const QA=[
["정림사지 5층 석탑에 보이는 백제탑의 특징은?","여러 석재를 목탑처럼 조립(결구식), 완만한 체감률, 살짝 들린 전각, 감실 없음"],
["지붕 모서리에 기와를 여러 겹 높이 쌓은 내림마루를 무엇이라 하는가?","우동(추녀마루)"],
["감은사지 3층 석탑의 목탑 영향과 석탑 영향은?","목탑: 위로 들린 추녀, 낙수면 경사, 탑신·옥개석의 결구식(4등분)\n석탑: 층단형 옥개받침, 크고 단순한 규모, 2층 기단 위 3층 탑신의 전형"],
["통일신라 부도의 형태는?","팔각원당형"],
["석등의 의미와 조선 능묘 앞 석등의 명칭은?","어둠을 밝히는 진리의 빛, 등불을 안치한 석조물\n능묘 앞: 장명등"],
["감산사 석조아미타불입상·백률사 금동약사여래입상의 법의 양식은?","Y자형 의습(하나로 내려오다 두 다리로 갈라짐) / U자형 의습(U자 주름 반복)"],
["선정인이란?","참선할 때 결가부좌 위에 양손을 포갠 수인\n(설법 시 수인은 전법륜인)"],
["고려 후기 라마계 금동보살상의 특징과 앉음새는?","화려한 장신구, 긴 영락, 원형 귀걸이\n앉음새: 윤왕좌(한쪽 무릎 세우고 한 손은 뒤로 바닥 짚음)"],
["불상의 백호와 육계가 상징하는 것은?","백호(미간 흰 털): 광명을 비춤\n육계: 지혜"],
["아미타정인(구품인)이란?","중생의 근기에 따라 상중하 3등급을 다시 3등급으로 나눈 9가지 수인, 모든 중생을 극락으로 이끔"],
["영주 부석사 소조여래좌상과 광배의 제작 방법은?","나무로 골격을 만들고 진흙을 붙인 소조불\n광배: 목판 위에 흙을 입혀 조각(별도 제작)"],
["불상 계주의 의미는?","소원을 이뤄주는 여의주 상징"],
["관촉사 미륵보살입상의 외형적 특징은?","높은 원통형 보관, 거대한 규모(광종 대), 형태의 퇴보·지방화(충청 지역 양식)"],
["높이 6척 이상의 큰 불상은?","장육상"],
["조선 전기·후기 불교 조각의 경향은?","숭유억불로 조형성 퇴보\n전기: 소형 불상, 중형 목조불\n후기: 머리가 크고 목이 앞으로 굽은 움츠린 자세, 라마식, 채색불"],
["일반적 삼세불과 조선 특유의 삼세불 구성은?","일반: 정광(연등)불·석가불·미륵불\n조선: 석가불·아미타불·약사불"],
["순청자 시대에 기형보다 중시된, 깊고 순수한 발색은?","비색"],
["진사(구리) 안료의 발색은?","붉은색"],
["고려청자의 혁신적 업적은?","비색 구현, 상감기법 창안, 진사 안료 최초 사용, 뛰어난 조형성"],
["분청사기의 상감분청계와 백토분청계 종류는?","상감분청계: 상감, 인화\n백토분청계: 박지, 조화, 귀얄, 덤벙, 철화"],
["청화백자 문양을 그리는 안료는?","코발트(회회청)"],
["청화백자 중기의 특징은?","사군자·십장생 등 한국적 소재, 적당한 여백, 어깨가 아래로 내려옴, 각진 몸체"],
["경천사지 10층 석탑의 라마 영향은?","3단으로 중첩된 기단, 3단 탑신의 아(亞)자형 평면, 층마다 불상 조각"],
["고려시대 백제계 석탑의 특징은?","낮은 기단부, 체감이 강한 사다리꼴 탑신, 얇고 평평한 옥개석(무게감 없음), 결구식"],
["분황사 모전석탑의 특징과 전탑적 특징은?","인왕상 배치, 4면 감실, 조적식 구조\n전탑적 특징: 층단형 옥개받침"],
["보림사 철조비로자나불좌상의 특징은?","통일신라 말 철불, 솟은 육계, 올라간 눈꼬리, 날렵한 콧날, 반월형 중앙계주 처음 등장, 지권인"],
["금동미륵보살반가사유상(83호)의 특징과 의의는?","78호보다 후대, 삼산관, 몸에 밀착된 옷, 반가좌\n의의: 정면 위주에서 벗어나 입체감·사실성 추구"],
["정혜사지 13층 석탑은 지붕 형태상 어떤 식인가?","밀첨식"],
["땅의 기운이 쇠한 곳에 절·탑을 세우면 나라가 보호받는다는 사상은?","비보사탑설"],
["수인의 두 분류와 뜻은?","통인: 여러 불상이 공통으로 쓰는 수인\n별인: 특정 불·보살만 쓰는 수인"],
["지권인을 쓰는 불상은?","비로자나불(별인)"],
["항마촉지인은 어떤 다리 자세의 불상에서만 나타나는가?","결가부좌"],
["건칠불이란? 종류는?","삼베와 옻칠로 만든 불상\n목심건칠불, 탈활건칠불"],
["탈활건칠불의 명칭 유래는?","속의 흙을 파내어(탈활) 비워 만듦"],
["판불의 종류 3가지는?","타출판불, 단조판불, 주조판불(거푸집 사용, 대량 생산, 우리나라 대부분)"],
["통일신라 탑의 전기→후기 변화는?","전기: 하층기단이 넓어 안정감\n중기: 상·하층 기단 넓이 차이 감소\n후기: 세장형, 가파름\n석재 수: 조립식 → 단일 모각식으로 감소"],
["고려청자의 시대별 특징은?","초기청자: 태토에 잡물 많고 녹갈색의 거친 유약\n순청자: 갑발 사용, 유약 두껍고 고름, 빙열 없음\n상감청자: 유약층 얇아 빙열 발생\n쇠퇴기: 비색 상실·황록색, 화청자·퇴화문·철채청자"],
["퇴화문이란?","백토·흑토를 붓으로 발라 무늬가 도드라지게 한 것"],
["유약을 바르지 않고 바탕 흙을 그대로 구워 드러내는 기법은?","노태"],
["분청사기 제작 방법과 관요 관청은?","회청색 태토에 백토로 분장한 뒤 유약을 발라 구움\n관청: 사옹원"],
["덤벙분청이란?","그릇 굽을 잡고 백토물에 통째로 담갔다 꺼내 분장"],
["백자의 산화소성·환원소성 시 색은?","산화: 부드러운 유백색\n환원: 푸른빛이 감도는 설백색"],
["조선 범종에서 통일신라·고려와 달라진 점은?","단룡 → 쌍룡 종뉴, 음통 소멸, 입상화문대 소멸 후 범자대 등장, 종신 중간 띠(돌림띠), 크기 축소"],
["월정사 팔각구층석탑의 특징은?","송 영향의 다각다층탑(고구려계), 상륜부 금동 장식"],
["마곡사 5층 석탑 상륜부 장식의 명칭과 의미는?","풍마동: 바람이 잘 통할수록 광택이 남"],
["탑 상륜부 구성 요소(위에서부터)는?","보주, 용차, 수연, 보개, 보륜, 앙화, 복발, 노반 (찰주가 관통)"],
["상륜부에서 감로수를 담는 그릇(보병)을 구슬 모양으로 상징한 것은?","용차"],
];
let W={};try{W=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const L=document.getElementById("list"),O=document.getElementById("only");
function R(){L.innerHTML=QA.map(([q,a],i)=>O.checked&&!W[i]?"":`<div class="q"><details><summary>${i+1}. ${q}</summary><div class="a">${a}</div></details><label><input type="checkbox" data-i="${i}"${W[i]?" checked":""}> 틀림</label></div>`).join("")}
L.onchange=e=>{const i=e.target.dataset.i;if(i==null)return;e.target.checked?W[i]=true:delete W[i];try{localStorage.setItem(KEY,JSON.stringify(W))}catch(x){}if(O.checked)R()};
O.onchange=R;R();
</script></body></html>
