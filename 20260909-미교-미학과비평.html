<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0909 미교 미학과 비평</title>
<script>const KEY="0909-미교-미학과비평";
/*Q*/const QA=[
["모방론에서 플라톤과 아리스토텔레스의 차이는?","플라톤: 모방을 부정적으로 보아 예술을 '모방의 모방'으로 봄(진리에서 멀어진 것).\n아리스토텔레스: 모방을 긍정적으로 보아 진실된 재현으로 봄."],
["헤겔이 말한 세 가지 예술 형식은?","상징적 형식 - 고전적 형식 - 낭만적 형식.\n상징적: 형식이 이념을 압도(부조화)\n고전적: 이념과 형식의 조화\n낭만적: 이념이 형식을 압도"],
["조지 디키의 예술 제도론 구성 요소는?","예술가, 예술작품, 대중, 예술계.\n예술가: 이해를 갖고 작품을 제작하는 사람\n예술작품: 대중에게 선보이기 위해 제작된 인공물\n대중: 예술계에서 작품을 이해할 준비가 된 구성원"],
["디키가 말한 예술계와 예술계 체계란?","예술계: 회화·극장·갤러리·박물관 등 모든 하부 체계의 총합.\n예술계 체계: 예술가가 예술계의 대중에게 예술작품을 제시하기 위한 틀."],
["조르주 바타유의 저급 유물론이란?","사물의 근본을 극단적으로 추구하는 유물론적 성격. 초현실주의와 관련되며 형식과 위계를 해체함."],
["칸트의 미적 판단 네 가지 계기는?","무관심성, 보편성, 필연성, 합목적성(목적 없는 합목적성)."],
["칸트의 무관심성이란?","대상의 존재·소유·효용에 대한 실제적 관심을 배제하고 순수하게 형식을 바라보는 태도."],
["칸트의 보편성과 필연성이란?","보편성: 미적 판단은 만인에게 공통되게 유효함.\n필연성: 한 대상이 어떤 사람에게 미적 만족을 준다면 필연적으로 다른 사람에게도 그러함."],
["칸트가 말한 예술작품의 형식(합목적성)이란?","목적을 의식적으로 표상하지는 않았지만 전체 형식이 자연스럽게 목적을 구현하고 있는 상태. 인간의 합목적적 활동의 결과."],
["들뢰즈 리좀의 여섯 가지 원리는?","접속, 이질성, 다양성, 탈기표적 단절, 지도 그리기, 데칼코마니."],
["리좀의 '지도 그리기'란?","미리 수립된 한정된 중심에서 뻗어 나가는 지형을 보여주는 것이 아니라, 실제와의 접촉을 통해 다양한 방면에서 자유롭게 생성되는 지형을 보여주는 것."],
["푸코의 에피스테메란?","한 시대 속에서 세상을 인식하게 만드는 의식의 틀을 지탱하는 인식 체계."],
["푸코의 유사와 상사의 차이는?","유사: 원본이 있고 그에 종속되는 닮음.\n상사: 원본이 없는 닮음. 위계 없이 무한히 증식됨."],
["파노프스키 도상학의 세 단계는?","전도상학적 기술 - 도상학적 분석 - 도상해석학적 해석."],
["파노프스키 각 단계에서 해석하는 내용은?","전도상학적 기술: 일차적·자연적 의미. 눈에 보이는 사실.\n도상학적 분석: 관습적 의미. 소재의 상징과 알레고리.\n도상해석학적 해석: 본질적 의미. 맥락적 정보를 토대로 의미를 해석."],
["수용미학이란?","기존의 생산미학·작품미학을 비판하며 등장. 작가나 작품이 아닌 감상자 중심으로, 감상자가 작품을 수용하는 과정에서 의미가 생성된다고 보는 미학."],
["야우스가 말한 '기대지평'이란?","독자(감상자)가 작품을 해석하고 평가하는 데 사용하는 기준이 되는 인식의 틀."],
["스톨니츠의 비평 다섯 가지는?","규칙에 의한 비평, 맥락에 의한 비평, 인상주의 비평, 의도주의 비평, 신비평."],
["스톨니츠 비평 다섯 가지의 내용은?","규칙: 정해진 규칙·기준에 맞추어 비평\n맥락: 사회·문화적 배경에 의한 비평\n인상주의: 개인의 감각적 인상에 의한 비평\n의도주의: 작가가 작품에 담은 의도를 파악하는 비평\n신비평: 맥락이 아닌 조형 요소 등 작품 자체의 본질을 통한 비평"],
["후기구조주의 미학이란?","구조주의를 비판하며 등장. 절대적 진리나 고정된 근원은 상대적·불안정적·유동적임을 지적(자크 데리다 등). 작품의 가치는 언제든 변할 수 있고 감상자에 의해 의미와 가치가 생성된다는 점에서 수용미학과 맥을 같이함."],
["아브젝시옹 미술이란?","사회 질서에 의해 배척되는 것을 다루는 미술. 개념적으로 주체와 객체 사이에 위치하며, 오물·폐기물·배설물 등의 존재를 맞닥뜨렸을 때 느끼는 역겨움에서 비롯된 외상적 경험을 드러냄."],
["니콜라 부리오의 관계미학이란?","관람자를 작품에 끌어들여 작품과 상호작용하도록 유도하는 방식. 인간과 사회 문제를 다루며 소통과 공감을 강조하고 관객의 참여를 유도함."],
["부리오가 말한 '사회적 엔지니어'란?","관계적 작업을 하는 예술가. 사회적 상호작용이 일어나는 상황 자체를 설계함."],
["부리오가 말한 '사회적 틈'이란?","사회적 상호작용이 이루어지는 공간으로, 후기 산업사회에서 단절된 인간관계를 회복시키는 자리."],
["리오타르가 말한 '거대담론'이란?","개인과 사회가 지식을 추구하고 진리에 대한 지배적 주장을 펼치기 위해 사용하는 이야기 형식. 거대담론에 대한 불신이 훨씬 커진 상태를 '포스트모던의 조건'으로 제시함."],
["아도르노의 대중매체(문화산업)에 대한 관점은?","비판적. 대중매체가 획일화된 취향을 강요해 사이비 개성화를 낳고, 자본과 권력자의 의도를 공고히 하는 매체로 대중예술이 이용되며 수동적 소비자를 형성한다고 봄."],
["맥루한의 핫미디어와 쿨미디어는?","핫미디어: 정보 전달량이 많고 논리적이어서 수신자 참여가 낮음(라디오·신문·영화·잡지).\n쿨미디어: 정보 전달량이 적고 불분명하여 수신자 참여가 높음(전화·만화·TV·컴퓨터)."],
["벤야민이 대중매체를 긍정적으로 본 이유는?","기술적 복제성을 통해 대중문화의 변혁이 가능하다고 봄. 대중매체 발달로 지각이 세분화되고 시각적 문해력이 발달하여 대중이 객관적·비판적 시각으로 작품을 해석할 수 있고, 예술의 정치화가 가능해짐."],
["알레고리란?","본래 뜻을 감추고 나타나 있는 것 이상의 깊은 뜻이나 내용을 미루어 살피게 하는 표현법. 현대 예술작품에서는 모호한 의미의 복수성, 분절적 재현 등의 모습으로 존재함."],
["벤야민의 의례 가치와 전시 가치는?","의례 가치: 종교적·의식적 역할을 하던 시기 미술의 가치. 아우라와 연결됨.\n전시 가치: 복제기술로 아우라가 상실된 이후, 전시되기 위해 존재하는 작품의 가치."],
["앙드레 말로의 '벽 없는 미술관'이란?","사진 도판·사진집을 통해 시간과 장소에 구애받지 않고, 멀리 떨어져 있는 작품들까지 한눈에 모아 보고 수집할 수 있게 된 상상의 미술관."],
["게이건의 비평적 탐구 단계는?","문제 인식 - 문제 명확화 - 가설 설정 - 결과 추론 - 가설 검증 - 적용."],
["펠드먼의 비평 명칭과 단계는?","비평적 담화. 기술 - 분석 - 해석 - 판단."],
["아레나스의 대화중심 감상법이란?","작품 감상에서 대화와 토론을 중시하는 감상법. '보고, 생각하고, 이야기하기'를 중심으로 진행함."]
];/*E*/</script>
<style>
body{font:16px/1.65 system-ui,-apple-system,sans-serif;max-width:760px;margin:0 auto;padding:12px 14px 60px;background:#fafafa;color:#222}
h1{font-size:17px;margin:6px 0}
#bar{position:sticky;top:0;z-index:9;background:#fafafa;padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #ddd}
button{padding:6px 10px;border:1px solid #bbb;border-radius:6px;background:#fff;font:inherit;font-size:14px;cursor:pointer}
#bar label{font-size:14px;display:inline-flex;gap:4px;align-items:center}
details{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px 12px;margin:8px 0}
details.x{border-color:#e33;background:#fff5f5}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 0;white-space:pre-wrap}
label.w{display:inline-flex;gap:4px;align-items:center;font-size:13px;color:#999;margin-top:10px}
#cnt{font-size:13px;color:#777}
</style></head><body>
<h1>미학과 비평 · 스터디 0909</h1>
<div id="bar"><label><input type="checkbox" id="only"> 틀린 것만</label><button id="ex">오답 내보내기</button><button id="cp">번호 복사</button><span id="cnt"></span></div>
<div id="list"></div>
<script>
let C=[];try{C=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const S=()=>{try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}};
const W=()=>QA.map((_,i)=>C[i]?i+1:0).filter(Boolean);
const F=()=>{[...list.children].forEach((d,i)=>d.hidden=only.checked&&!C[i]);cnt.textContent=W().length+"/"+QA.length};
QA.forEach(([q,a],i)=>{const d=document.createElement("details");
d.innerHTML="<summary>"+(i+1)+". "+q+"</summary><p></p>";d.querySelector("p").textContent=a;
const l=document.createElement("label");l.className="w";l.innerHTML="<input type=checkbox> 틀림";
const c=l.firstChild;c.checked=!!C[i];d.classList.toggle("x",!!C[i]);
c.onchange=()=>{C[i]=c.checked;d.classList.toggle("x",c.checked);S();F()};
d.appendChild(l);list.appendChild(d)});
only.onchange=F;F();
ex.onclick=()=>{const w=QA.filter((_,i)=>C[i]);if(!w.length)return alert("체크된 문항이 없습니다.");
const h=list.innerHTML;list.innerHTML="";
const s="<!doctype html>"+document.documentElement.outerHTML.replace(/\/\*Q\*\/[\s\S]*?\/\*E\*\//,"/*Q*/const QA="+JSON.stringify(w)+";/*E*/").replace(KEY,KEY+"-wrong");
list.innerHTML=h;
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/html;charset=utf-8"}));a.download=KEY+"-wrong.html";a.click();URL.revokeObjectURL(a.href)};
cp.onclick=()=>{const n=W().join(",");const fb=()=>{const t=document.createElement("textarea");t.value=n;document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(e){}t.remove();alert(n||"없음")};
try{navigator.clipboard.writeText(n).then(()=>alert(n||"없음"),fb)}catch(e){fb()}};
</script></body></html>
