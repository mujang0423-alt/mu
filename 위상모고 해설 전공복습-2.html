<script id="d">const KEY="위상모고 해설 전공복습",QA=[
["[서미·1 ㄱ] ( ㄱ )에 해당하는 용어?\n지문: 첨단 기술로 명화를 재해석하는 예술 장르 / 캔버스 명화 같은 2차원 작품을 프로젝션 매핑 등 디지털 기술로 입체 영상 신호로 재구성 → 고화질 프로젝터로 대형 스크린 투사 / 모션 그래픽으로 명화에 움직임·상호작용을 더한 미디어 아트","컨버전스 아트\n· 몰입형 미디어 아트의 대표 예 (공간 전체 활용, 관람+체험)\n· 26학년도 프로젝션 매핑 출제의 연장선 — 도판 없이 텍스트로 풀리게 출제"],
["[서미·1 ㄴ] 미술에서 ( ㄴ )에 해당하는 용어?\n지문: 작품을 제외한 작가 노트·메모·드로잉·전시 인쇄물·시청각 자료·육성 녹취 등 미술 활동 과정에서 생산된 기록물 또는 저장소 / 완성작보다 과정·맥락·기록 자체의 가치에 집중","아카이브\n· 디지털 아카이브: 자료를 디지털 파일로 변환해 영구 보존"],
["[한미·2 ㄱ] ( ㄱ )에 적합한 미술 단체?\n지문: 1950년대 후반 동양화단, 중견 작가 단체(김기창 등 후소회 계열, 천경자·박래현) / 1960년대 대만·일본 전시로 국제 교류 / '동양화' 대신 '한국화' 명칭 거론","백양회\n· 1957 출범, 반국전 + 한국화의 현대성 모색, 서구 모더니즘(입체파·표현주의) 수용\n· 강조: 근현대는 주요 단체 중심 기입형 대비 (25학년도 서화협회·동연사·현대미술가협회)"],
["[한미·2 ㄴ] ( ㄴ )에 적합한 미술 단체?\n지문: 동양화단 유일의 전위적 청년 작가 집결체 / 1960 창립전, 서세옥·민경갑 / 반전통·반조형, 재래의 매재와 방법 탈피 / 앵포르멜의 표현주의적 추상과 정신적 유대","묵림회\n· 수묵이라는 전통 매재로 추상 — 뿌리기·번짐 실험\n· 의의: 화단에 수묵 추상 등장의 기점 (70~80년대로 이어짐)"],
["[서미·6] (가)가 속하는 사조와 등장 배경(사회적·예술적)?\n(가) 카노바 〈승리의 비너스로 분장한 보르게제〉","신고전주의\n· 사회적: 프랑스 대혁명 영향 — 고대 로마의 정치와 덕성을 담아 혁명 정신 고취 (공화정의 이상 = 로마 공화정)\n· 예술적: 로코코 양식에 대한 반발 / 폼페이·헤르쿨라네움 유적 발굴(고대 문화 연구)\n· 함정: 계몽주의 = 사상·철학적 측면 → 답 ✗\n· 감점: 사회적·예술적 나눠서 함께 써야 인정"],
["[서미·6 ㄱ] 독일 미학자 ( ㄱ )?\n지문: 『그리스 회화·조각의 모방론』 / '장엄한 단순함과 위대한 고요함' = 가장 높은 미적 경험 / 균형과 비례에서 비롯 / 그 영향을 받은 카노바","빈켈만\n· 장엄한 단순함: 불필요한 장식·기교 없이 본질·구조 중시\n· 위대한 고요함: 격정 속 내면의 평온·절제 (라오콘 군상)"],
["[서미·6] (가) 작품의 주제적·조형적 특징?\n(가) 나폴레옹의 여동생(보르게제 가문)을 비너스로 분장시킨 조각","· 주제적: 실제 인물을 그리스·로마 신화 속 인물로 분장시켜 고대의 이상미 구현\n· 조형적: 이상적 인체 비례와 형태 / 매끈한 표면 마무리(대리석 질감)\n· 강조: 모르는 작품은 사조 특징으로 서술 / 26학년도 건축 출제 → 회화 + 동시대 조각·건축"],
["[중미·7] 시와 그림의 내적 결합 형식을 주장한 북송대 화론의 명칭과 의미?\n도판: 정선 〈금강전도〉(제화시 포함)","소식의 시화일률(시화본일률) 사상\n· 의미: 시와 그림은 창작 원리·경지가 같다 — 작가의 사상과 생각이 반영된 의경을 중시하는 공통된 창작 법칙\n· 내적 결합: 표현 수단만 다르고 내재된 정신·본질 동일 (왕유 '시중유화 화중유시')\n· 외적 결합: 그림 위·옆에 시를 쓰는 등 한 화면에 물리적 결합\n· 강조: 미술사+화론 혼합이 트렌드, 화론 버리지 말 것"],
["[한미·7] 제화시의 개념?\n지문: 〈금강전도〉 제화시 — 1만 2천 봉 모두 개골산… 참모습을 단청으로 그려내지 않았다면 어찌 그 험한 얼굴을 알았으랴","그림을 소재로 지은 시 — 그림의 주제나 그림에 대한 생각·감정을 적은 것\n· 〈금강전도〉 제화시 = 험한 금강산을 그려낸 정선의 자부심"],
["[한미·7] 〈금강전도〉 토산 표현에 쓰인 남종화 준법 2가지?","피마준, 미점준\n· 감점: 2개 모두 써야 1점, 부분 점수 없음\n· 참고: 암산은 수직준(위→아래로 내려긋기), 원형 구도"],
["[서미·8] 옳지 않은 항목을 찾아 바르게 고치면?\n(나) 피카소 〈볼라르의 초상〉: 원근법·명암법 지양, 시점 복수화, 다시점으로 인물을 기하학적 형태로 포착, '데포르마시옹 기법으로 구축적으로 재구성'","(나) — 데포르마시옹 ✗ → 데콩포지시옹 ○\n· 데포르마시옹 = 대상의 변형·왜곡\n· 데콩포지시옹 = 대상을 해체·분해하여 화면을 재구성 (분석적 큐비즘)\n· 강조: 26학년도 신유형"],
["[서미·8 ㄱ] ㄱ드리핑 기법의 제작 방식과 영향을 준 이전 사조의 기법?\n(가) 잭슨 폴록 〈넘버 18〉","· 캔버스를 바닥에 눕혀 놓고, 붓 대신 페인트 통을 들고 물감을 떨어뜨리거나 뿌리며 작업\n· 오토마티즘(자동기술법): 이성의 작용·고정관념·습관적 기법을 배제하고 손이 움직이는 대로 그리는 기법\n· 감점 방지: '캔버스를 바닥에 눕힌다' 필수"],
["[서미·8] 폴록 작품을 '토톨로지의 원류'로 보는 이유?\n지문: 그린다는 행위 자체에 가치, 형상성 없는 순수 추상 / 행위의 반복적 표현 특성을 포함한 토톨로지의 원류","· 토톨로지: 같은 소재의 반복적 표현 — 팝아트(워홀 〈마릴린 먼로〉)·미니멀 아트(저드 〈무제〉)·시스테믹 페인팅(스텔라 블랙 페인팅)\n· 형태·색채 요소 간 내적 관계성 없음 = 무관계 미술 → 추상표현주의(올오버)도 무관계 미술\n· 내적 관계성: 화면 내 조형 요소·원리가 유기적으로 연결되어 서사를 만들어내는 상태"],
["[서미·8 ㄴ] ( ㄴ )에 해당하는 용어?\n(다) 들로네 〈에펠탑〉: 색채성이 풍부한 ( ㄴ ) / 다시점 에펠탑 / 색채·형태로 개인적 열정 표현","오르피즘 또는 오르피 큐비즘 (둘 다 정답)\n· 신인상주의 연구 + 입체파·미래파 영향 / 2011학년도 유사 기출"],
["[서미·9 ㄱ·ㄴ] ( ㄱ ), ( ㄴ )의 명칭?\n지문: (가) 독일 국회의사당, 네오 르네상스 양식 — 건축 중앙의 ( ㄱ )과 고전적인 ( ㄴ ) 오더로 그리스 건축을 따름 / ( ㄴ ) = 아칸서스 잎과 덩굴 장식을 기둥머리에 배치","ㄱ 페디먼트(삼각 박공) / ㄴ 코린트식\n· 함정: 중앙이라 '돔' ✗ — 돔은 그리스 건축 아님\n· 네오 르네상스: 비례·균형·대칭, 그리스 오더, 페디먼트, 수평성"],
["[서미·9 ㄷ] ㄷ인포메이셔널 드로잉의 개념?\n지문: 크리스토 부부가 포장 국회의사당 실행 전 (나)와 같은 여러 장의 ㄷ을 제작","있는 그대로의 사실 및 정보를 전달하는 목적의 드로잉\n· 이전 기입형 기출 → 개념 서술로 변형"],
["[서미·9 ㄹ] ㄹ엠파케타주를 통한 작가의 의도?\n지문: 1995 포장된 독일 국회의사당, 2주간 500만 명 방문, 가장 유명한 공공 미술","사물을 포장하는 행위로 가시적 실체를 부정하고, 대상의 역사적·사회적 의미와 맥락을 제거하여 새로운 대상으로 보게 함\n· 참고: 2차 대전 상흔의 의사당 → 정치적 아픔 치유·화합\n· 강조: 대지 미술 → 25학년도 마타클락(스미스슨 영향) → 원점 재출제 가능"],
["[중미·10 ㄱ] 소재로 보아 인물화 중 ( ㄱ )? (나)의 제작 시대?\n(가) 양해 〈발묵선인도〉 / (나) 가오 〈한산도〉","도석 인물화 / 무로마치 시대\n· 남송 양해 → 가오 영향 (선종 수묵화) / 한산·습득 = 당대 선종 승려\n· 계보: 위진남북조 장승요 → 당 오도자·위지을승 → 오대 관휴·석각 → 남송"],
["[중미·10 ㄴ] ( ㄴ )의 명칭과 특징?\n지문: (가)는 화원풍의 채색 인물화와 구별되는 호방한 붓질의 묵법인 ( ㄴ ) 사용","발묵법\n· 특징: 정형화되지 않은 자연스러운 형상, 자연스러운 번짐과 농담으로 대상의 기운과 감정을 풍부하게 표현\n· 함정: 개념 vs 특징 중 무엇을 묻는지 구분"],
["[중미·10 ㄷ·ㄹ] 황휴복의 저서 ( ㄷ )와, ㄹ일격을 가장 높은 품평으로 둔 이유?\n지문: (가)(나) 모두 ( ㄷ )에서 제시한 ㄹ일격에 해당","『익주명화록』\n· 이유: 북송 문인화가의 심미관 반영 — 형식에 얽매이지 않는 자유롭고 일정함 없는 상태에서 작가의 내면과 사상을 반영한 사의(寫意)가 담긴 미술을 최고 경지로 여김\n· 감점: '사의를 최고로 여김' 빠지면 득점 ✗\n· 배경: 안록산의 난 이후 익주로 피난 → 다양한 화풍·선종 유입 → 신·묘·능으로 설명 불가"],
["[서미·11 ㄱ] ㄱ카메라 옵스큐라의 의미?\n지문: 고대부터 원리 알려짐 / 다빈치가 논증과 지식의 도구로 사용 / 포르타가 광학적 관측 장비 또는 사생 도구로 정의","형상의 윤곽을 정확하게 그리는 데 사용한 기구 — 상자나 방 한쪽 면에 작은 구멍을 내 빛이 들어가게 하고, 반대편 벽면에 물체의 이미지가 거꾸로 보이도록 한 장치\n· 조선: 칠실파려안"],
["[서미·11 ㄴ] ( ㄴ )의 명칭?\n지문: (가) ( ㄴ )을 활용한 스케치 / 카메라 옵스큐라보다 작고 휴대 간편 / 일정 각도로 배치된 프리즘으로 피사체를 아래쪽 종이에 투사","카메라 루시다\n· '밝은 방', 1806 윌리엄 하이드 울러스턴 발명, 원근·비례를 맞추기 위한 광학 드로잉 기구 (사전 용어)"],
["[서미·11 ㄷ] ㄷ제작 기법의 명칭과 이미지 생성 원리?\n지문: (나) 모홀리나기 〈자화상〉 / 감광지 위에 남겨진 실제 오브제의 흔적 / 탈보트가 발명, 다다이스트가 전혀 다른 동기로 재사용","포토그램\n· 원리: 카메라를 사용하지 않고, 암실에서 인화지 위에 물체를 직접 올린 후 빛을 비추어 이미지 생성\n· 함정: 모홀리나기 → 레이요그램 ✗\n· 감점 방지: '카메라를 사용하지 않음' 필수\n· 동기 차이: 탈보트(포토제닉 드로잉) = 대상과 똑같은 형상 얻기 ↔ 다다·모홀리나기 = 추상적·초현실적 이미지 실험"]
];</script>
