<script>const QA=[
["모리스 루이스의 작업 특징은?","헬렌 프랑켄탈러의 영향을 받아 스테인 페인팅(얼룩 회화)을 함. 밑칠하지 않은 대형 로(raw) 캔버스 사용."],
["쉬포르/쉬르파스의 특징은?","미술의 상업성에 반발. 캔버스 나무틀을 떼어내고 서명·제작 일자·제목 등을 일체 포기해 작가성 제거. 정형적 캔버스에서 벗어난 평면적·추상적 작업."],
["하드에지의 등장 배경과 전체적 특징은?","추상표현주의의 과도한 감정 표출에 반발. 차갑고 이지적인 기하학적 추상. 색면 경계가 명확하고 평면적이며, 아크릴 물감으로 선명한 원색 사용."],
["하드에지는 몬드리안 등 기존 기하학적 추상과 어떻게 다른가?","기존 기하학적 추상은 부분적 형태 요소가 모여 전체를 구성했지만, 하드에지는 하나의 형태가 화면 전체를 차지하는 전면적 성격을 띰."],
["하드에지의 조형적 특징은?","원색·단순한 색상, 단순한 사각형 색면, 색면 경계가 명확(깔끔한 모서리), 아크릴 물감, 하나의 형태가 화면 전체를 차지(전면 회화)."],
["프랭크 스텔라의 주요 작업은?","줄무늬 회화, 셰이프트 캔버스(성형 캔버스), 각도기 연작, 릴리프 회화."],
["성형(셰이프트) 캔버스란? 사용 이유는?","정방형·장방형이 아닌 다양한 모양의 캔버스. 그림 표면과 캔버스 바탕을 일치시켜 배경을 제거함으로써, 회화가 환영을 보여주는 창이 아니라 물감이 발라진 물질 그 자체임을 강조."],
["스텔라 연작 작품에서 사용되는 세 가지 원리는?","줄무늬, 성형 캔버스, 부채꼴(각도기를 변형한 무지개 모양)."],
["그린버그는 추상표현주의와 그 이후의 새로운 추상을 각각 무엇이라 명명했나?","추상표현주의 = 회화적 추상, 이후 새로운 추상 = 후기 회화적 추상."],
["후기 회화적 추상의 하위 경향은?","스테인 페인팅(색면), 하드에지 등."],
["'계획된·일관된'을 뜻하며 기본 단위의 규칙적 반복으로 그림과 변형 캔버스를 융합, 반복 구조에 의한 단일적 전체성의 공간 구조를 확보하는 것(로렌스 앨러웨이)은?","시스테믹 페인팅."],
["옵아트는 무엇의 영향을 받고 무엇에 반발했나?","영향: 신인상주의, 오르피즘, 신조형주의. 반발: 추상표현주의, 팝아트의 상업성."],
["옵아트의 목적은?","순수한 시각적 반응 유도. 착시를 통한 심리적 반응뿐 아니라 형이상학적 측면을 감지하는 데 목표."],
["시각적 동력학이란?","관람자의 관점에 따라 시각적 환영이 다르게 생산되는 것."],
["야코브 아감 작업의 특징은?","관람자의 이동에 따라 작품이 다르게 보임 → 관람자 참여 유도."],
["네오다다의 등장 배경은?","추상표현주의의 지나치게 주관적·내적인 감흥 표현에 반발. 다다·초현실주의(오브제 사용)의 영향."],
["다다와 네오다다의 오브제 사용 차이는?","다다: 반미학·반전통, 기존 서구 예술의 전면 부정을 위해 사용. 네오다다: 새로운 매체 실험, 매체 가능성 모색 등 긍정적 측면에서 사용."],
["네오다다의 의의는?","회화와 조각, 예술과 일상(비예술)의 경계를 모호하게 함."],
["컴바인 페인팅이란?","라우셴버그가 창안. 2차원 회화와 3차원 오브제·조각을 결합한 것."],
["라우셴버그는 존 케이지의 무엇에 영향을 받았나?","우연성 음악."],
["라우셴버그 〈Retroactive I〉의 제작 방법과 특징은?","실크스크린과 유화. 이집트 회화의 주대종소 원리를 사용해 과거 양식을 차용."],
["재스퍼 존스가 제시한 '재현된 오브제'란?","기성품을 그대로 제시하지 않고, 회화나 조각으로 동일한 모양을 직접 만들어 복제한 것."],
["존스 〈채색된 청동〉의 의미는?","일회용 맥주 깡통에 청동 흉상 같은 영구적 가치를 부여해, 관객이 일상용품과 미술품의 경계에 대해 생각하도록 유도."],
["존스 작품에서 납화법의 역할은?","그림을 지지체와 하나로 묶어, 회화를 하나의 이미지인 동시에 사물로 만듦."],
["신사실주의의 등장 배경과 영향은?","(유럽) 추상표현주의·앵포르멜에 반발. 다다의 레디메이드와 초현실주의의 무의식적 사물 결합에 영향."],
["네오다다와 신사실주의의 사물에 대한 태도 차이는?","네오다다: 사물에 대한 애정을 바탕으로 활용에 초점. 신사실주의: 사물이 인간에 대항하는 위험한 존재로 발전할 수 있다고 보아 경계심·긴장 관계 유지."],
["신사실주의가 현실의 사물(아상블라주)을 사용한 이유는?","추상표현주의를 현실과 동떨어진 엘리트주의 미술로 보고, 현실 사물을 직접 제시해 현실을 직접 반영하고 예술과 현실을 결합하려 함."],
["인터내셔널 클랭 블루(IKB)란? 무엇을 상징하나?","이브 클랭이 직접 만든 파란색 안료. 비물질성을 강조하며 우주의 근원을 상징."],
["이브 클랭이 나체 모델에 IKB를 바르고 지시에 따라 캔버스에 몸을 찍고 끌게 한 퍼포먼스는?","인체 측정(앙트로포메트리)."],
["아르망의 주요 기법은?","아상블라주(사물의 집적). ※ 압축 조각·엄지손가락은 세자르, 나나 시리즈는 니키 드 생팔."],
["장 팅겔리가 고안한 것은?","메타메카닉스: 기계가 자동으로 움직이며 스스로 파괴되도록 한 기계 조각."],
["장 팅겔리는 무엇의 선구로 불리나?","인터랙티브 아트."],
["팅겔리 〈뉴욕에 대한 경의〉의 의미는?","작동하다 스스로 폭발·파괴되는 기계로, 현대 기술 사회(미국)를 풍자."],
["E.A.T.(예술과 기술의 실험, 1960년대)의 의의는?","예술가와 공학자를 하나로 모아 협업 → 예술가의 사회적 역할 확장."],
["영국 팝아트의 등장 배경은?","추상표현주의·앵포르멜에 반발. 산업사회의 대중문화를 미술에 반영."],
["영국 팝아트를 시작한 그룹과 전시는?","인디펜던트 그룹, 〈이것이 내일이다〉전."],
["에두아르도 파올로치가 사용한 기법은?","포토몽타주, 레디메이드 은유."],
["레디메이드 은유란?","광고·만화처럼 대중매체가 만들어 놓은 기성 이미지를 현대 사회의 상징으로 가져다 쓰는 기법."],
["데이비드 호크니의 사진 콜라주 기법 이름과 내용은?","조이너스 기법: 여러 각도에서 찍은 사진을 겹쳐 배치해 다시점을 표현 → 시간의 흐름과 공간의 깊이감 표현."],
["호크니 〈어머니의 초상〉에 나타나는 특징은?","포토콜라주로 다시점과 시간성을 표현. 메시지보다 시각적 표현에 초점."],
["미국 팝아트의 등장 배경은?","시대적 낙관론, 대중문화 긍정, 추상표현주의에 반발."],
["미국 팝아트 전시회는?","〈뉴 리얼리스트〉전."],
["리히텐슈타인 〈큰 붓질〉의 의도는?","추상표현주의의 제스처적 붓질도 똑같이 복제할 수 있음을 보여 추상표현주의를 비판·조롱·풍자."],
["리히텐슈타인이 벤데이 점으로 표현하고자 한 것은?","만화 인쇄의 망점을 재현해, 작가의 감정을 담지 않은 기계적 복제 효과를 강조."],
["앤디 워홀이 실크스크린을 사용한 이유는?","대량 복제·대량 생산이 가능하기 때문."],
["워홀이 자신의 작업실을 명명한 이름은?","팩토리."],
["워홀 〈인종 폭동〉이 나타내는 것은?","미디어 안에서 반복되는 사건의 노출이 그 사건에 무감하게 만든다는 것 + 인종차별에 대한 비판."],
["토톨로지란?","동어반복. 복제·대량 생산·반복."],
["다른 작품들에서 발췌·인용한 부분들을 결합해 작품을 만드는 기법은?","브리콜라주."],
["조지 시걸의 작업은?","라이프 캐스팅(인사이드 캐스팅·아웃사이드 캐스팅), 프로즌 해프닝."],
["프로즌 해프닝이란?","일상의 한 장면을 얼어붙은 듯 정지된 조각으로 표현하는 것."],
["올덴버그의 연성 조각이란?","부드러운 조각. 대상의 본질적 속성이 변형·파괴되도록 해 기존 조각의 영속성·권위를 부정. 그 외 환경 조각도 함."],
["키엔홀츠의 조각은?","환경 조각(타블로): 2차원 배경을 세우고 그 앞에 실제 3차원 사물·조각을 배치."],
["1960~70년대 재즈 음악의 영향을 받은 미술 경향은?","펑크 아트."],
["미니멀 아트의 등장 배경은?","그린버그 모더니즘 이론(매체의 순수성)에 기초. 그러나 3차원이라 관람자 시선·위치에 따라 결과가 달라져 연극성이 개입됨."],
["미니멀 아트(프라이머리 스트럭처)의 특징은?","최소한의 조형 단위 형태, 에어브러시 등으로 작가 표현성 제거·매끈한 표면, 선명한 단색·원색, 알루미늄·스테인리스 등 산업 재료, 발주 예술, 좌대 없이 놓여 관람자와 상호작용(환경적 성격)."],
["미니멀 아트의 무관계 미술이란?","사회적 메시지·내러티브 등 관계성을 끊고 작품 자체로만 존재. 모듈식 구조·토톨로지로 추상표현주의의 내적 관계성을 배제하고 개별 요소의 독립성을 강조."],
["도널드 저드가 발표한 글과 두 가지 조건은?","〈특수한 사물〉. 실제 공간에 현전하는 3차원의 사물성, 장소성의 적극적 도입."],
["저드가 부분적으로 사용한 재료와 그 이유는?","플렉시글라스. 작품의 단순성에 변화를 주고 작품에 대한 지각을 까다롭게 만듦."],
["칼 안드레의 작업 특징은?","바닥에 깔아두는 작품. 수직적 전통 조각을 수평적 공간 개념으로 전환, 교체 가능한 단위로 위계적 통일성 극복, 산업재 사용."],
["솔 르윗의 월 드로잉 제작 방식은?","작가는 작업 지시문만 만들고, 실제 작품은 조수가 제작."],
["라이트 아트의 특성은?","빛을 매개로 공간을 새롭게 정의. 관람자의 피부 등에 빛이 닿으며 공간이 기존과 다르게 인식됨."],
["댄 플래빈 작품의 미니멀리즘적 측면은?","발주 예술, 형광등이라는 산업 재료, 그대로 걸어 작가 표현성 배제, 실존하는 사물성, 빛을 조형 요소로 사용."],
["플래빈 작품과 미니멀리즘의 차이는?","사물보다 빛에 초점 → 비물질적·환영적. 형광등의 수명으로 영구적이지 않고 일시적."],
["에바 헤세가 1966년 포스트미니멀리즘 흐름에 동참하며 참여한 전시는?","〈기이한 추상〉전."],
["앤서니 카로가 데이비드 스미스에게 받은 영향은?","추상 조각, 용접 기법."],
["데이비드 스미스와 카로의 차이는?","스미스는 수직적 구성, 카로는 수평적 구성 → 주변 공간 확장, 좀 더 순수한 추상."],
["훌리오 곤잘레스는 어느 유파인가?","초현실주의. (피카소와 철 용접 작업을 해 입체주의와 혼동 주의)"]
