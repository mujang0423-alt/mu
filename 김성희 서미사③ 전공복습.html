["다다 vs 초현실주의 구분(목적·기법)", "· 목적: 다다 = <b>반예술·전통 부정<\/b> / 초현실 = <b>무의식 표현<\/b><br>· 기법: 다다 = 반미학을 위한 실험적 기법 / 초현실 = 무의식을 표현하기 위한 기법"],
["카바레 볼테르(Cabaret Voltaire, 1916)란?", "취리히에서 휴고 발·아르프·트리스탄 차라 등이 모여 다다를 선언한 장소. 소음 음악, 즉흥 연극, 퍼포먼스, 해프닝 → 전통 예술 형식의 부정과 조롱"],

["아르프의 ‘생기론(生起論)’과 받침대 없는 조각은?", "· 초현실주의 합류 후 식물·아메바 같은 <b>유기적 추상 형태<\/b>로 발전<br>· 생기론: 예술은 진보하는 게 아니라 <b>자연 발생적<\/b>으로 생겨나는 것(나무가 씨앗부터 자라듯)<br>· 받침대 없는 조각: 작가가 만든 게 아니라 원래부터 생겨나 자란 것처럼 → 헨리 무어·헵워스에 영향"],
["뉴욕 다다의 배경과 유럽 다다와의 차이는?", "· 배경: 1913 <b>아모리 쇼<\/b> + 스티글리츠의 <b>갤러리 291<\/b> → 유럽 미술(피카소·마티스) + 뒤샹 유입<br>· 유럽 다다: 전쟁·정치 비판 성향 강함, <b>사회 제도 비판<\/b><br>· 뉴욕 다다: 반미학·개념 실험 집중, <b>미술 제도 비판<\/b>"],
["뒤샹 〈계단을 내려오는 누드〉(1912)와 미래주의의 차이는?", "미래주의적 형식(연속 동작)을 취하지만 미래주의처럼 전쟁·기계를 찬양하는 게 아니라 <b>부정<\/b>하는 다다 → 목적이 다름"],
["뒤샹 ‘레디메이드(Readymade)’가 바꾼 개념들은?", "· 기성품을 선택·발견해서 제시 → <b>창작의 개념 전복<\/b>: 그리거나 만드는 것 → 선택하거나 발견하는 것<br>· 미술가: 그리는 사람 → 발견·선택·아이디어를 제시하는 사람<br>· 미술품: 그린 것·예쁜 것 → 보고·이해하고·논쟁하는 <b>담론의 대상<\/b><br>· 관람자: 감상하는 사람 → 자기 의지로 해석·참여하는 사람<br>· 영향: 개념미술, 과정미술, 오브제미술, 참여미술, 미니멀아트, 플럭서스"],
["뒤샹 〈샘(Fountain)〉(1917)의 이중 비판은?", "· 남성 소변기를 뒤집어 “R. Mutt” 가명으로 출품 → 전시 거부<br>· 참가비만 내면 전시해준다더니 거부 → <b>미술 제도 비판<\/b> / 뒤샹 이름이었으면 해줬을 것 → <b>권위·원본성 비판<\/b><br>· 원본이 없어 복제품으로 전시 → 원본성 해체"],
["뒤샹 〈3개의 표준 장치〉와 ‘우연의 통조림’ vs ‘유명론’ 판별법은?", "· 같은 길이 실 3가닥을 떨어뜨려 생긴 우연한 형태로 자를 만듦 → 과학적 객관성·표준화의 절대성에 의문, 반과학적 유머 / 큰 유리·개념미술·과정미술의 출발점<br>· <b>우연의 통조림<\/b>: 순간의 우연을 규격화된 상자에 박제<br>· <b>유명론<\/b>: 보편자(아름다움·예술)는 실재하지 않고 개별 사물과 이름만 존재(스콜라 실재론과 대립) → 예술이라고 부르면 예술<br>· 판별: 발문이 “개념·명칭·이름”, 뒤샹의 작품·행위 중심 → 우연의 통조림 / “철학적 배경”, 예술의 본질·정의 중심 → 유명론"],
["뒤샹 〈큰 유리(The Large Glass)〉의 특징은?", "· 유리판(캔버스 대신)에 표현하되 입체로 설치 → 회화·조각 경계 탈피<br>· 유리판 사이 금속선·납판·먼지 등 부착<br>· 상단 = 신부, 하단 = 독신자·기계 영역 → 남녀 간 불완전한 소통, 욕망의 기계, <b>현대인의 고립을 암시하는 기계적 알레고리<\/b><br>· 쌓인 먼지, 운반 중 깨진 유리 → 모두 작품 일부로 수용 → <b>우연성과 과정미술<\/b>"],
["뒤샹 〈L.H.O.O.Q.〉·〈회전 유리판〉·〈초록 상자〉·〈가방 속 상자〉의 의의는?", "· 〈L.H.O.O.Q.〉: 모나리자 복제 엽서에 수염·선정적 제목 → 전통 부정, 원본성 해체, <b>패러디<\/b>(조롱)<br>· 〈회전 유리판〉: 모터로 회전시켜 기하학 무늬 → “기하학적 추상을 기계가 더 잘 그린다”, 미술 권위 부정 → 키네틱·옵아트 선구<br>· 〈초록 상자〉: 큰 유리 스케치·메모 복제 → 아이디어·기록·맥락이 핵심 → 개념미술·아카이브 미술 선구<br>· 〈가방 속 상자〉: 작품 미니어처를 담은 이동식 미술관 → 원본·미술관 제도·예술 위계 해체<br>· 포스트 프로덕션: 작가는 창조하지 않고 <b>편집<\/b>한다"],
["뒤샹이 영향을 준 이후 미술들은?", "올덴버그의 부드러운 조각, 솔 르윗의 개념미술, 워홀, 셰리 레빈, 아카이브 미술, 영화 재편집 미술 등"],
["피카비아(Picabia)의 특징은?", "· 뒤샹과 뉴욕 다다 초석<br>· 기계 부품을 인간 성격·감정처럼 의인화한 <b>허무주의적 기계 초상화<\/b><br>· 〈이것이 스티글리츠다〉: 초상화를 기계로 그림"],
["독일(베를린) 다다의 포토몽타주와 뉴욕 다다와의 결정적 차이는? (시험)", "· 포토몽타주: 신문·포스터·잡지의 사진·활자를 재조합 → 풍자적·충격적 메시지, 전통 미술 부정 + 부조리한 언론 매체 비판<br>· 뉴욕 다다: <b>미술 제도 비판<\/b>(개인·반미학 실험)<br>· 독일 다다: <b>사회·정치 비판 + 대중 매체 비판<\/b>, 좌익 성향의 정치적 아방가르드 – 대중 매체가 가짜 뉴스로 선동하는 것을 폭로하며 메시지를 대중에 전달"],
["하트필드(Heartfield)의 특징은?", "· 포토몽타주 기법의 선구자, 히틀러·나치 독재와 사회 부조리 강하게 비판<br>· 잡지·신문·포스터에 연재 → <b>대중 선전 도구<\/b><br>· 작가 = 창조자가 아니라 편집자<br>· 이후 바바라 크루거에게 영향"],
["하우스만(Hausmann)의 특징과 〈기계 머리(시대 정신)〉 (예전 시험 출제)", "· 언어·텍스트·타이포그래피를 해체적으로 → 의미·논리 구조 전복<br>· 〈미술 비평가〉: 속물적 미술 평론가를 잡지 이미지 콜라주로 조롱<br>· 〈기계 머리(시대 정신)〉: 인체 모형에 측량기·시계 부품 부착 → “요즘 사람들은 스스로 생각 안 하고 기계의 합리성에 의존” → <b>인간 소외·탈개성화 비판<\/b>(→ 초현실주의로 이어짐)"],
["슈비터스(Schwitters)의 메르츠·우르소나테·메르츠바우는?", "· 독일, 경계적 존재 / 뒤샹처럼 미술 제도만 비판, 정치 비판 X<br>· <b>메르츠 회화<\/b>: 전단지에서 우연히 잘라낸 단어 조합에서 시작, 버려진 인쇄물·오브제 콜라주 → <b>정크아트의 시발점<\/b><br>· <b>우르소나테<\/b>: 뜻 있는 단어 대신 의미 없는 음소를 소나타 형식으로 배열해 목소리로 연주<br>· <b>메르츠바우<\/b>: 방 전체를 수집 오브제로 채움 → 환경 전체가 작품, 관객이 입장해 경험 → 몰입형 환경 최초 구현, <b>환경·설치미술의 시조<\/b>(1920년대)"],
["정크아트의 본격적 시작을 알린 작가는?", "<b>로버트 라우센버그<\/b> – 폐타이어·박제 동물 등 일상의 쓰레기를 활용한 ‘<b>컴바인 페인팅<\/b>’ (시발점은 슈비터스의 메르츠)"],
["만 레이의 레이요그램(Rayogram)의 의의는?", "· 다다 → 초현실주의, 핵심은 새로운 기법 창안<br>· 레이요그램 = 포토그램: 카메라 없이 인화지 위 사물에 빛 → 이미지<br>· 의의: 사진의 역할을 “외부를 정확히 기록” → “<b>우연하게 이미지를 창조<\/b>”로 전환(재현 중심 → 창조 개념)"],
["솔라리제이션 vs 사바티에 효과 vs 에어로그래피 구분은?", "· <b>솔라리제이션<\/b>: 현상 과정에서 필름·인화지를 극단적으로 노광 → 밝은 부분이 반전(밝음↔어둠), 부조 같은 효과·강한 윤곽선 / 감광 재료의 광화학 반응 특성<br>· <b>사바티에 효과<\/b>: 유사하나 전체가 아닌 <b>부분적·시간차 노광<\/b>, 재노광 시점에 따라 효과 다름 / <b>현상 처리 방법<\/b>에 의한 특수 기법<br>· <b>에어로그래피<\/b>: 에어브러시로 안개처럼 색조 입히기"],
["막스 에른스트(Max Ernst)의 특징은?", "· 아르프와 쾰른 다다 형성 → 반미학에서 초현실주의로<br>· 사진 콜라주로 기괴·몽환적 형태<br>· 〈여기 모든 것이 아직 떠 있다〉: 해부학적 벌레가 깊은 바다에 떠다니는 듯 → 무의식 이미지 생성 실험<br>· 키리코(형이상학 회화) 영향 → 초현실주의 창시자로"],
["독일 신즉물주의(Neue Sachlichkeit)란?", "사회적 사실주의. 독일 다다처럼 사회·정치를 비판하지만 포토몽타주가 아닌 <b>구상 회화<\/b> 사용"],
["벤야민 기술 복제 시대의 배경과 영화의 의미는?", "· 배경: 판화(뒤러부터) → 사진 → 영화 → 디지털 사진 순 복제 기술 발전 → 이미지 대량 확산, 원본·복제 경계 흐려짐 / 회화 재현 역할이 사진으로 → 인상주의 등 새 미술<br>· 영화: <b>몽타주(편집)<\/b>로 서로 다른 장면을 결합해 새 의미 창출, 클로즈업·슬로모션 등 새 시각 언어, 시간·공간을 자유롭게 구성 → 관객이 적극 해석·참여"],
["벤야민의 ‘아우라(Aura)’ 개념과 아우라 붕괴의 결과는?", "· 아우라: 전통 예술 작품의 <b>유일성·원본성·현존성(지금 여기에 있음)·역사적 권위<\/b>, 특정 시공간에서 직접 마주할 때 느끼는 거리감과 권위<br>· 붕괴: 사진·영화 등의 대량 복제 → 원본의 유일성·현존성 약화 → <b>예술의 민주화·사회적 확장<\/b><br>· 수용자: 수동적 감상 → 적극적 참여자·해석자·비판적 수용자<br>· 예술 기능: 미적 감상 → 정치·사회 실천·대중적 소통"],
["‘제의적 가치 → 전시적 가치’ 전환이란?", "· 전통 예술: 종교·제의적 기능, 신성한 원본(아우라 극대) = <b>제의적 가치<\/b><br>· 기술 복제 시대: 거리·극장·대중 공간으로 확산, 수용자가 적극적 해석자·참여자 = <b>전시적 가치<\/b>"],
["판화 vs 아날로그 사진 vs 디지털 사진 비교(원본/아우라/작가와 관객/사회적 의미)", "· 원본: 판화 = 원판 존재·에디션 유지 / 아날로그 = 필름 원본 존재, 원본·복제 구분 가능 / 디지털 = 원본·복제 경계 완전 소멸(무한 복제, 원본=복제)<br>· 아우라: 수작업 흔적·작가 개입 → 일부 유지 / 기계 생산으로 급격히 약화 / 완전 해체, <b>시뮬라크르<\/b> 세계<br>· 작가와 관객: 한정 계층 소유·감상, 귀족적 / 누구나 생산·소유(접근성 확대) / 관객이 편집·공유·변형까지<br>· 사회적 의미: 고급 예술, 귀족적 / 예술의 대중화 시작 / 예술 = 일상적 대중 콘텐츠"],
["초현실주의(Surrealism)의 정의와 두 경향은?", "· 앙드레 브르통 <b>제1차 초현실주의 선언(1924)<\/b>, 프로이트 정신분석 기반 → 무의식·꿈·자동기술로 이성의 통제에서 벗어난 표현<br>· <b>유기적 추상적 초현실주의<\/b>: 자동기술법(오토마티즘), 비정형 생물처럼 꿈틀거리는 유기적 이미지 – 마송<br>· <b>자연주의적 초현실주의<\/b>: 데페이즈망, 유사 사진적 사실성으로 극사실 묘사 – 달리, 마그리트"],
["초현실주의 기법 정리(오토마티즘~언캐니)", "· <b>오토마티즘<\/b>: 무상무념 상태에서 무의식적으로 이미지 표현<br>· <b>데페이즈망<\/b>: 일상 사물을 뜻밖의 장소에 놓거나 상관없는 물체를 병치해 낯설고 비논리적 상황 연출하는 전치·전이 기법 → 심리적 충격, 무의식 해방<br>· <b>프로타주<\/b>: 표면의 요철 위에 종이를 놓고 문질러 나타나는 이미지<br>· <b>그라타주<\/b>: 물감을 바른 후 긁어내어 우연적 효과<br>· <b>데칼코마니<\/b>: 물감을 종이에 바른 뒤 접거나 다른 면에 찍어냄<br>· <b>언캐니(Uncanny)<\/b>: 익숙하면서도 낯선, 기이하고 소름 끼치는 감정"],
["패러디 vs 전유 vs 패스티시 vs 레플리카 구분은?", "· <b>패러디<\/b>: 조롱·풍자 <b>필수<\/b> → 의미 역전 / 뒤샹 L.H.O.O.Q.<br>· <b>전유<\/b>: 조롱 X → 다른 맥락으로 재사용, 의미 재맥락화 / 셰리 레빈의 워커 에반스 사진 차용<br>· <b>패스티시<\/b>: 조롱 X → 그냥 가져와 사용, 의미 변화 없음(아무 생각 없는 형식 차용) / 키리코의 고전 양식 차용<br>· <b>레플리카<\/b>: 원작자가 자신의 작품을 동일한 방법으로 다시 실현"],
["키리코(de Chirico)의 특징과 포스트모더니즘 선구로 평가받는 이유는?", "· 초기 초현실주의, <b>형이상학파<\/b><br>· 일상적인 것과 환상적 장면을 병치 → <b>데페이즈망 기법의 원형<\/b><br>· 1920년대 이후 과거 작품 모사·고전 양식 회귀 = <b>패스티시<\/b> → 1970년대 포스트모더니즘의 선구"],
["달리·마송·마그리트의 키워드는?", "· <b>달리<\/b>: <b>편집광적 비판 방법(Paranoiac-Critical Method)<\/b> 창안, 가상의 공포·환각·강박을 극사실 묘사 → 달리 = 무조건 편집광적 비판<br>· <b>마송<\/b>: 자동기술적 드로잉, 캔버스에 풀을 무작위로 바르고 모래를 뿌린 <b>모래 그림<\/b>으로 오토마티즘 구현<br>· <b>마그리트<\/b>: 익숙한 사물을 변형·병치해 당혹감, 형태 변형 없이 사실적으로 재현하면서 현실인지 환영인지 모를 이미지 / 마술적 사실주의 / 데페이즈망·유사·시뮬라크르와 관계"],
["푸코의 상사(Resemblance) vs 유사(Similitude)와 마그리트는?", "· <b>상사<\/b>: 본질적·구조적 닮음, 진리를 모방하려는 것, 이미지와 사물이 동일 → 지시·설명<br>· <b>유사<\/b>: 피상적·착각을 주는 닮음, 이미지와 사물이 동일하지 않음 → 모방의 진리를 파괴하는 장난<br>· 마그리트 = 유사 / 《이것은 파이프가 아니다》 → 재현의 규칙 전복, 질문 유도 → <b>시뮬라크르<\/b> 개념의 시작(“이미지는 원본과 같지 않다”)"],
["초현실 조각의 성격과 피카소·곤잘레스 협업은?", "· 다다의 레디메이드 + 아상블라주 정신 계승, 단 목적은 전통 부정이 아니라 <b>무의식 자극<\/b> / 피카소 철 조각에서 시작<br>· 피카소: 30년대 곡선적 큐비즘 그림을 철 용접으로 구현 – 피카소(형태 구성) + 곤잘레스(용접 기술)"],
["피카소 〈정원의 여인〉·〈비비 원숭이〉의 의의는?", "· 〈정원의 여인〉: 폐철·철판을 주워 자르고 붙인 구축 조각<br>· 〈비비 원숭이〉: 자전거 손잡이 + 안장 아상블라주<br>· 아상블라주를 청동으로 주조 → 영속적 예술로 전환 → 일시적 쓰레기(비미술) → 권위 있는 미술품 = <b>일상과 미술의 통합<\/b>(→ 워홀)<br>· 철 조각 핵심: <b>회화와 조각의 결합<\/b> – 선적 드로잉을 철사로 구현 → 콜더 모빌, 스미스에 영향"],
["곤잘레스(González)의 ‘공간에 드로잉하기’와 〈몽세라트〉는?", "· “공간에 드로잉하기”: 직접 명명, 공간 자체에 선으로 드로잉하는 철 구조물, 비어 있는 공간이 중요한 조형 요소<br>· 철의 <b>문명성<\/b>(산업·신재료) + <b>반문명성<\/b>(녹슮 = 시간·소멸) 동시 표현<br>· 〈몽세라트〉: 파시즘에 맞서는 스페인 국민의 저항 정신을 철의 질감으로 상징"],
["자코메티(Giacometti) 초현실 조각과 〈오전 4시의 궁전〉은?", "· 조각을 단순한 물체가 아닌 <b>감정·심리의 무대<\/b>로 확장 → 처음으로 조각으로 심리 표현<br>· 〈오전 4시의 궁전〉: 동트기 직전의 막막하고 차가운 새벽 감정 시각화, 나무·유리·철사·실"],
["멕시코 벽화 운동의 배경·성격과 전통 벽화와의 차이는?", "· 양차 대전 사이(1920~30년대), 전 세계가 국제 추상으로 갈 때 멕시코만 <b>민족주의 양식<\/b><br>· 정치적 아방가르드 세 특징 모두 충족: 사회적 행위(민족 고양), 제도 비판(부르주아 미술 + 식민지 체제), 대중과 소통<br>· <b>공공 미술의 기반<\/b> – 이젤화 거부, 건물 밖으로 나간 벽화<br>· 전통 벽화: 실내(성당), 특정 권력층 ↔ 멕시코 벽화: 실외, 대중을 위한 민중 교육·민족 정체성 고양<br>· 프레스코의 한계(습기)가 야외에서 노출 → 새로운 재료 실험<br>· 민족주의 양식: 모더니즘 + 스페인 침략 이전 전통 미의식 융합<br>· 미국 추상표현주의에 지대한 영향 – 거대 사이즈, 공업용 페인트, 행위성"],
["멕시코 벽화 3대 작가(시케이로스·오로스코·리베라)의 특징은?", "· <b>시케이로스<\/b>: 가장 과격·혁명적, <b>아크릴 물감을 벽화에 최초 사용<\/b>(선명·영구 보존), 에어브러시·스프레이 건·공업용 페인트 최초 도입 → 그래피티 선구, 떨어뜨리기·흘리기 기법을 미국 실험 작업실에서 교육 → <b>폴록에게 직접 영향<\/b><br>· <b>오로스코<\/b>: 표현주의적, 우울·비판적 화면<br>· <b>리베라<\/b>: 끝까지 <b>프레스코 고수<\/b>, 국민 작가, 유럽 초기 모더니즘 + 르네상스 프레스코 + 멕시코 전통"],
["프리다 칼로와 루피노 타마요의 융합 방식은?", "· 프리다 칼로: 초현실주의(모더니즘) 기법 바탕 + 아즈텍 신화·토착 멕시코 전통 요소를 자화상에 결합<br>· 루피노 타마요: 유럽 입체주의·추상 수용 + 선콜럼비아 시대 조각·벽화에서 영감받은 흙빛 질감"],
["양차 대전 사이 미국 미술: 쓰레기통파와 정밀주의는?", "· <b>쓰레기통파(Ashcan School)<\/b>: 다른 나라가 추상할 때 여전히 사실주의, 권투 시합·뒷골목 같은 하찮은 일상 소재<br>· <b>정밀주의(Precisionism)<\/b>: 미국의 첫 모더니즘, 사실주의 전통 + 유럽 추상(입체주의) / 사진적 정밀성 + 기하학적 단순화, 명확한 윤곽, 평면적 화면, 세부는 정밀하나 전체는 추상적·비인격적 → “차가운 미술” / 공장·기계를 정밀하게 그리다 보니 추상처럼 → 팝아트·극사실주의에 영향 / 셰일러(공장 사진적 묘사), 드무스(큐비즘·미래주의, 복합 시점), 오키프(꽃·자연을 정밀 확대)"],
["장면 회화/지방주의(Regionalism)와 사회적 사실주의(Social Realism)는?", "· <b>지방주의<\/b>: 대공황기 정부 주도 공공 미술 사업, 유럽풍 추상(정밀주의) 비판, 미국적 삶·복고적 지방 풍모, 개척 역사를 역사화로 → 시민적 자부심 / 벤턴, 우드(〈아메리칸 고딕〉)<br>· <b>사회적 사실주의<\/b>: 대공황의 절망 배경, 미국 정치·경제 체제 강하게 비판 / <b>템페라<\/b> 선호, 음영 없는 형태, 명확한 윤곽 → 유화의 광택·물질감 제거 → 건조하고 팍팍한 현실 / 호퍼(한낮에 할 일 없이 창밖을 내다보는 쓸쓸한 인물 – 실업), 벤 샨"],
["미국 사진: 픽토리얼리즘 vs 포토 세세션은?", "· <b>픽토리얼리즘(회화주의 사진)<\/b>: 사진도 예술이 될 수 있다는 이념, 초점 흐림(아웃포커싱·소프트 포커스)·인공 구도·조명 조작·후처리로 회화적 질감(수채화·파스텔화 같은 몽환적 분위기)<br>· <b>포토 세세션(사진 분리파)<\/b>: 이념 동일, 스티글리츠 중심 미국 단체 = 이념의 제도화·조직화, 사진을 순수 예술로 인정받게 하려 한 최초의 영향력 있는 그룹"],
["스트레이트 포토그래피(정통·직설적 사진)의 특징과 스티글리츠는?", "· 기록사진과 예술사진의 통합, 인위적 조작 없이 사진 고유의 매체성으로 모더니즘 형식 실현<br>· 선명한 초점, 명확한 구조, 광학적 정밀감 → 형태(선과 면)의 아름다움 + 현실의 삶을 있는 그대로<br>· 스티글리츠: 초기 포토 세세션 대장(조작 사진) → 후기 조작 없이 찍었더니 더 예술적 → 스트레이트로 전환<br>· 〈3등실 승객〉: 조작 없이 대각선 구도·화면 분할 등 모더니즘 회화 같은 효과<br>· 〈등가물(Equivalents)〉: 구름 사진으로 내면 감정·음악적 리듬 → 사진이 감정·추상까지(몬드리안 같은 화면도, 칸딘스키 같은 화면도)"],
["f64 그룹과 존 시스템(Zone System)은?", "· f64: 스트레이트 계승·심화, 조리개 f64(가장 좁은 값) = 최대 선명도·심도 / 웨스턴, 앤설 애덤스<br>· <b>존 시스템<\/b>(애덤스): 필름 명암을 0~10단계로 나눠 노출·현상 조절 → 어두운·밝은 부분, 가까운·먼 곳 모두 극도로 선명"],
["카르티에-브레송의 ‘결정적 순간(The Decisive Moment)’이란?", "· 1952년 출간 사진집, 움직이는 대상의 본질과 기하학적 구도가 완벽하게 어우러지는 찰나<br>· 눈·마음·영혼의 일치, 철저한 기하학적 구성, 연출 없는 진실"],
["셰리 레빈(Sherrie Levine)의 차용(워커 에반스 재촬영) 의미 3가지는?", "· 워커 에반스 사진을 그대로 재촬영해 작품으로 제시(= 전유)<br>1. <b>포스트모더니즘<\/b>: 원본성·독창성·창의성 부정<br>2. <b>페미니즘<\/b>: 남성 중심 권위 미술에 대한 조롱<br>3. <b>대공황 맥락<\/b>: FSA 워커 에반스 사진의 거짓·조작에 대한 야유"],
["대공황기 FSA 다큐멘터리 사진과 그 논란은?", "· 뉴딜 정책 농업안정국(FSA) 주도, 빈곤한 농민·이주 노동자의 삶을 찍어 정부 홍보<br>· 도로시아 랭, 워커 에반스<br>· 논란: <b>연출된 사진<\/b>임이 밝혀짐 – 정부 홍보를 위해 포즈, 실제 삶은 나아지지 않음 → 사진의 진실 여부 논쟁"],
["구성 사진(Constructed/메이킹 포토)과 대표 작가는?", "· 1970년대 스트레이트 포토그래피에 대한 반발, 작가가 무대·상황을 직접 연출·구성해 찍은 사진<br>· <b>신디 셔먼<\/b>: 작가 자신이 다양한 페르소나로 분장한 셀프 포트레이트 → 대중매체·가부장제가 여성에게 강요하는 정형화된 이미지·고정관념 해체·비판<br>· <b>샌디 스코글런드<\/b>: 기괴하고 초현실적인 세트를 직접 제작·설치해 촬영"],
["현대미술의 시기 구분은?", "· 20c 초~1945 이전: (초기) 모더니즘 – 유럽 중심, 이성·합리성 기반, 추상 양식 형성<br>· 1945~60년대: 후기 모더니즘 – 미국 중심, 실존주의 기반 / 네오 아방가르드<br>· 70년대: 과도기 – 탈미니멀, 다원주의 등장<br>· 80년대~: 포스트모더니즘 – 네오 아방가르드 계열만 남음<br>· 90년대~현재: 동시대 미술(시험 범위에 최근 추가)"],
["1945년 이후 두 가지 핵심 변화와 미국·유럽의 시각 차이는?", "① 화단 중심 <b>유럽 → 미국<\/b> 이동 ② 지배 철학 <b>이성주의 → 실존주의<\/b><br>· 45년 이전: 이성·합리성·수학적 질서 → 무의식(초현실)까지 / 45년 이후: 실존주의가 이후 모든 양식 지배<br>· 미국: 역사·전통 없어 뒤처졌다가 2차 대전 후 역전 – 전쟁 피해 적고 자본주의 패권 → 개인·긍정적 자본주의 시각<br>· 유럽: 전쟁 피해 직접 → 인간 전체에 부정적 시각"],
["실존주의란?", "· “진리가 어딘지 모르지만 부딪혀서 알아보겠다” – 이상이 아니라 현실·경험에 비중<br>· 인간은 <b>피투<\/b>(주어진 것)로 태어났지만 <b>기투<\/b>(선택하는 것)로 살아가는 존재<br>· 미리 정해진 본질은 없으며 자유 의지로 스스로 삶과 본질을 만들어감<br>· 보편적 진리·합리성보다 개인의 주체성과 삶의 의미 중심"],
["후기 모더니즘(45~60년대)의 성격과 그린버그 모더니즘의 핵심 논리는?", "· 모더니즘 세 특징(작가 중심 / 순수 형식 / 엘리트주의) 유지 + <b>실존주의 바탕<\/b><br>· 그린버그: 미술이 가리켜야 하는 건 <b>미술 자체(순수 형식)<\/b> – 벨라스케스가 교황을 그리면 미술이 교황을 가리킴 → 미술 아님 / 몬드리안도 작가의 사상이 들어가면 미술 아님 / 진보의 목적지 = 미술이 미술만 가리키는 순수 형식 → 미니멀에서 완성"],
["추상표현주의와 폴록의 3가지 업적은?", "· 작가의 <b>실존<\/b>을 표현(이전: 작가의 사상 표현)<br>· 폴록의 액션 페인팅 = 실존을 찾기 위한 ‘행동·뿌리기’<br>· 결과물: <b>전면 균질<\/b>(작가가 컨트롤하지 않고 내버려 둠 → 매체의 실존)<br>· 캔버스가 어마어마하게 커짐 → 화면이 환경이 됨 → 관람자가 눈으로 보는 게 아니라 체험<br>· 3가지 업적: <b>액션 페인팅 / 전면 균질 / 거대 사이즈<\/b>"],
["네오 아방가르드(45~60년대)의 목적과 구조는?", "· 후기 모더니즘과 동시에 진행된 또 다른 흐름, 목적 = <b>미술과 생활의 통합<\/b><br>· A 사회적 행위 = 미술과 생활의 통합<br>· B 제도 비판 = ① 오브제(네오다다, 팝) ② 행위성(행위미술, 놀이)<br>· C 대중 참여<br>· 이후: 후기 모더니즘 → 70년대 베트남전·불안 → 탈미니멀 / 네오 아방가르드 → 다원주의"]];</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fafaf7;--fg:#222;--card:#fff;--line:#e3e1da;--acc:#c0392b;--sub:#6b6b6b}
@media(prefers-color-scheme:dark){:root{--bg:#18181a;--fg:#e8e6e1;--card:#232326;--line:#38383c;--acc:#ff7a6b;--sub:#9a9a9a}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px}
h1{font-size:16px;margin:0 0 6px}.t{background:var(--acc);color:#fff;border-radius:4px;padding:1px 7px;margin-right:6px;font-size:13px}
button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
main{max-width:820px;margin:auto;padding:10px}
.q{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.q.x{border-color:var(--acc)}.w .q:not(.x){display:none}
.q label{font-size:12px;color:var(--sub);white-space:nowrap;padding-top:3px}
details{flex:1;min-width:0}summary{cursor:pointer;font-weight:600}summary b{color:var(--acc)}
details>div{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
details>div b{color:var(--acc)}#c{font-size:12px;color:var(--sub);margin-left:6px}
</style>
<body>
<script id="app">
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},$=s=>document.querySelector(s),N=(x,i)=>x[2]||i+1,C=()=>Object.keys(S).sort((a,b)=>a-b);
document.title=`[${SUBJ}] ${TITLE}`;
document.body.insertAdjacentHTML('afterbegin',`<header><h1><span class=t>${SUBJ}</span>${TITLE}</h1><label><input type=checkbox id=f> 틀린 것만</label> <button id=ex>오답 내보내기</button> <button id=cp>번호 복사</button><span id=c></span></header><main id=L>${QA.map((x,i)=>`<div class="q${S[N(x,i)]?' x':''}"><label><input type=checkbox data-n=${N(x,i)}${S[N(x,i)]?' checked':''}> 틀림</label><details><summary><b>${N(x,i)}.</b> ${x[0]}</summary><div>${x[1]}</div></details></div>`).join('')}</main>`);
const cnt=m=>$('#c').textContent=m||`틀림 ${C().length}/${QA.length}`;cnt();
$('#L').onchange=e=>{const t=e.target,n=t.dataset.n;t.checked?S[n]=1:delete S[n];t.closest('.q').classList.toggle('x',t.checked);sv();cnt()};
$('#f').onchange=e=>document.body.classList.toggle('w',e.target.checked);
$('#cp').onclick=()=>{const t=C().join(','),ok=()=>cnt('복사됨: '+(t||'없음')),fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove();ok()};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}};
$('#ex').onclick=()=>{const w=QA.map((x,i)=>[x[0],x[1],N(x,i)]).filter(x=>S[x[2]]);if(!w.length)return cnt('체크된 문항 없음');const j=v=>JSON.stringify(v).replace(/<\//g,'<\\/'),h='\ufeff<script>const KEY='+j(KEY+'-wrong')+',SUBJ='+j(SUBJ)+',TITLE='+j(TITLE+' (오답)')+',QA='+j(w)+';<\/script>\n<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+$('style').outerHTML+'<body>'+$('#app').outerHTML,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html;charset=utf-8'}));a.download=KEY+'-wrong.html';a.click()};
</script>
