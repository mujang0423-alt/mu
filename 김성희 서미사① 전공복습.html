["그림 안에 ‘누가’ 들어가느냐로 본 미술사 흐름은?", "· 전통 미술: 의뢰자(교황·귀족)의 취향 / 시대 이념(종교·도덕·역사)<br>· 초기 모더니즘(세잔~마티스)·20c 초 진보 아방가르드: <b>작가<\/b>가 들어옴 / 형식(색·선·면)<br>· 2차 대전 이후 모더니즘(추상표현·색면): 작가도 빠짐 / 순수 형식만<br>· 미니멀: 형식 최소화 → 물질만 남음<br>· 미니멀 이후·설치·포스트모던·동시대: <b>대중<\/b>이 들어옴 / 사회·정치·맥락, 체험으로 의미 생성, 해석·참여·소통"],
["야수파(Fauvism)의 특징 5가지는?", "1. <b>색채의 해방<\/b> – 색채는 자연에 종속되지 않고 색채 자체가 주제가 될 수 있음<br>2. 주관적 감정의 <b>주정주의<\/b> – 화가 개인과 회화의 자율성 추구 → 추상화의 기틀<br>3. 형의 단순화와 왜곡, 평면성, 강렬한 색 대비, 즉흥적 붓질<br>4. 원시 미술(프리미티비즘)에서 창조적 에너지의 근원 탐구<br>5. 고갱, 고흐, 들라크루아, 신인상주의, 세잔의 영향<br>· 프랑스 중심, 진보적 아방가르드, 색의 추상성"],
["마티스 회화(붉은 방·춤·컷아웃)의 특징과 한계는?", "· 야수파 양식의 완성자, 선과 색채 단순화<br>· 《붉은 방》: 바닥·벽 구분 없는 평면성, 패턴 반복 / 《춤》: 선과 색의 리듬으로 원초적 환희·생명력<br>· <b>컷아웃<\/b>: 구아슈 칠한 종이를 오려 붙임 → “종이를 조각하는 회화”, 장식 미술<br>· 한계: 색채를 해방시켰어도 <b>인물을 화면에 남김<\/b> → 몬드리안처럼 완전한 추상으로 가지 못함"],
["독일 표현주의의 배경과 두 갈래(다리파 vs 청기사파) 비교는?", "· 배경: 중세 고딕부터 내려오는 그로테스크하고 강렬한 지역 양식(낭만주의 풍경화에도)<br><b>다리파(Brücke)<\/b>: 사회적 표현주의 / 반미학·정치적 아방가르드 / 키르히너·콜비츠 / 목판화·석판화·에칭 / 사회 비판<br><b>청기사파(Blaue Reiter)<\/b>: 서정적 추상 / 진보적 아방가르드 / 칸딘스키 / 유화·추상 / 잡지 《청기사》, 시각적 감흥·서정적 추상·예술 전반의 통합, 전형적 부르주아 장식 미술"],
["칸딘스키 《예술에 있어서 정신적인 것에 관하여》의 핵심(삼각형·색채·내적 필연성)은?", "· 예술은 모방이 아니라 인간 내면의 정신에 작용하는 고차원적 행위<br>· 예술 발전 = <b>삼각형(피라미드)<\/b>: 꼭대기 소수 선구자 예술가 / 중간 창작자·감식자 / 밑바닥 대중 → 예술가는 정신적 진화를 이끄는 ‘영혼의 안내자’<br>· 색채 = 정신에 직접 작용하는 진동: 파랑 심오·영적·침잠 / 노랑 외향·불안정한 흥분 / 빨강 생명력·격동<br>· 외부 규칙이 아닌 <b>내면의 필연성<\/b>에 따른 표현<br>· 음악의 비서사성·비재현성을 회화의 이상으로 → 최초의 추상화가"],
["다리파(Brücke)의 성격과 목판화를 쓴 이유는?", "· 반미학·정치적 아방가르드, 건축가 모임에서 화가 그룹으로 전환 → 고딕의 뾰족한 특징이 작품에 남음<br>· 미술 = 사회적 행동·실천 행위<br>· 목판화: <b>원시성<\/b> 표현, 산업화 이전 <b>수공 문화<\/b> 동경, 대중에게 나눠줄 수 있는 <b>저렴한 매체<\/b>, 작가를 <b>노동자<\/b>로 표현<br>· 아프리카 조각·원시 문화·중세 목판화 참고 — 피카소는 새로운 형식을 위해, 다리파는 <b>메시지 전달<\/b>을 위해(목적이 다름)<br>· 왜곡된 인체, 날카롭고 모난 형태, 수직적·압축적 공간"],
["키르히너(Kirchner)의 특징은?", "· 거리 풍경·무용수·서커스 등 도시인의 소외와 불안, 반근대적 이념 표출<br>· 사회적 사실주의 경향<br>· 도시의 속도감·긴장감을 날카롭고 모난 선과 강렬한 색 대비로"],
["콜비츠(Käthe Kollwitz)의 특징과 2세대 페미니즘에서 예시로 나오는 이유는?", "· 다리파는 아니지만 반미학적, 전쟁·빈곤 등 사회 부조리 고발하는 판화가·조각가 → <b>참여 미술의 선구자<\/b><br>· 노동자가 된 것처럼 목판 수공, 명암의 극적 대비, 즉흥적 감정·심리적 긴장감의 선묘<br>· 응축된 형·절제된 감정의 석재·청동 조각<br>· 주제: 노동자 계급의 삶, 전쟁·억압 비판, 모성애와 상실감<br>· 판화(에칭·목판·석판) 선호: 싸고 대중적, 포스터처럼 배포해 대중 선동<br>· 2세대 페미니즘: 1세대의 바느질·공예 같은 여성성 강조를 고정관념이라 비판 → 여성성과 무관하게 전쟁·빈곤·사회 부조리를 다룬 사례"],
["놀데(Emil Nolde)의 특징과 주요 작품은?", "· 초기 다리파 회원 → 목판화로 원시성·사회 비판 → 이후 개인적 감정 표현으로 독자적 세계<br>· 고통과 환희 등 내면 정서, 사회적 타락을 상징적으로<br>· 나뭇결 질감 강조 목판화, 에칭 부식 과정의 우연성 활용(렘브란트 에칭 전통 계승)<br>· 《예언자》: 영웅적이 아닌 인간적 불안의 예언자 → 시대의 불안<br>· 《최후의 만찬》: 다빈치의 안정 구도와 달리 강한 명암 대비·표현주의적 긴장<br>· 《아이들에게 둘러싸인 그리스도》: 불안한 시대 속 사랑과 희망"],
["보링거(Worringer) 《추상과 감정이입》의 내용·의의·한계는?", "· 추상은 현대에 새로 나온 것이 아니라 <b>인류의 보편적 형식 욕구<\/b><br>· <b>추상 충동<\/b>: 세계에 대한 불안·적대감 → 기하학적 추상으로 도피(중세·원시·표현주의)<br>· <b>감정이입<\/b>: 세계와 조화 → 자연 모방(그리스·르네상스)<br>· 의의: 중세 미술을 최초로 긍정적 재평가, 현대 추상 미술의 이론적 정당화<br>· 한계: 추상=불안, 감정이입=조화라는 지나친 이분법"],
["20세기 조각 변화의 특징(주도 세력·방향·결과)은?", "· 주도: 마티스·피카소 등 <b>화가<\/b>들이 먼저 실험<br>· 방향: 회화의 이념을 입체로 확장하면서 추상 조각 등장<br>· 결과: <b>브랑쿠시<\/b>에 의해 본격적인 상징적 추상 조각 완성<br>· 계보: 피카소《기타》(새 재료·구축·열린 공간) → 타틀린 역부조·구성주의 → 설치·미니멀 / 마티스《등》(형 단순화·선과 구조) → 브랑쿠시(직접 조각·재료성·좌대 통합, 무한주 → 미니멀 선구)"],
["마티스 조각 《뱀(La Serpentine)》의 특징과 기출 연결은?", "· 원시 조각 영향, 거칠고 단순한 모델링<br>· 뱀처럼 구불구불 나선형으로 올라가는 자세, 불안정한 곡선 형태에 기대면서 균형감 확보<br>· 형·운동감·구조·공간의 조화를 추구하는 표현적 인물상<br>· 화가가 조각 → 양감·질감 대신 <b>선이나 구조<\/b>가 입체에서도 조형 요소임을 처음 보여줌(→ 구성주의 조각)<br>· 마티스 조각 한계: 인체에서 크게 벗어나지 못함<br>⚠ 기출: 드가 무희 조각과 나란히 놓고 “공통적으로 강조되는 것 두 가지”"],
["마티스 후기 《등(Back) 시리즈》의 특징은?", "· 등을 보이는 인물 → 누구인지 중요하지 않음, <b>익명성<\/b><br>· 시리즈를 거칠수록 점점 단순화, 양감 위주 → 선의 흐름과 구조로 이행<br>· 결론: 기하학적·구조적 단순화, 구성미 강조 → 브랑쿠시에 영향"],
["피카소 초기 조각 《여인의 두상》의 의의는?", "평면에서 형태를 분해·재구성하는 입체주의 이념을 조각으로 확장. 양감 위주이지만 처음으로 조각에 <b>면(面)<\/b> 개념 등장"],
["피카소 《기타》의 조각적 혁신 4가지는?", "① <b>열린 공간<\/b>: 선재·면재로 양감 안에 숨어 있던 허공간을 밖으로 → 닫힌 공간 탈피, 현실 공간과 맞닿음, 현실 공간을 조형 공간으로(→ 설치미술·미니멀)<br>② 새 기법 <b>구축(Construction)<\/b>: 깎거나 붙이는 전통 기법이 아닌 쌓아 올리기 최초 창안(→ 타틀린)<br>③ <b>인물 배제<\/b>: 기타라는 오브제 선택 → 서사성·상징성 탈피<br>④ <b>새로운 재료<\/b>: 종이·판금·철사 등 비미술적·산업적 재료 최초 사용"],
["피카소가 조각에서 처음 해낸 것 최종 목록은?", "1. 오브제 도입(회화·조각 모두 처음)<br>2. 구축(Construction) 기법 최초 창안<br>3. 면재·선재 사용, 3차원 덩어리 개념 해체<br>4. 조각의 서사성 탈피 – 인물 재현 → 형·공간·구조 탐구, 조각 정의 자체를 바꿈<br>5. 빈 공간을 형과 대등한 조형 언어로 활용 → 설치미술·미니멀<br>6. 발견된 오브제(Found Object) 활용의 시작<br>7. 이 모든 것이 타틀린(구성주의) → 추상 구성 조각으로"],
["독일 표현주의 조각의 수준과 바를라흐(Barlach)의 특징은?", "· 표현주의 회화 양식을 조각으로 옮기는 수준, 피카소 같은 혁신 없음<br>· 바를라흐: 산업화의 불안·빈곤·퇴폐 속 소외된 인간을 영적으로 표현, 러시아 민중 전통의 소박함, 중세 독일 목조 조각 영향, 인체를 길게 늘이고 우울한 감정 → <b>고딕적 원시주의<\/b>(후기 고딕의 우울감·그로테스크 계승)"],
["바를라흐 《귀스트로의 천사》가 전통 기념비 조각과 다른 점은?", "· 1차 대전 희생자 추모 기념 조각<br>· 영웅적·승리적 전통 기념비와 달리 <b>침묵·명상·추모<\/b>의 정서<br>· 성당 내부에 매달아 설치 → 올려다보는 수직 시선 + 주변을 도는 수평 이동<br>· 숭고함 속 함께 추모·명상하는 <b>참여적 경험<\/b>, 조각과 환경의 유기적 조화·관람자 경험 강조"],
["렘브루크(Lehmbruck)의 특징은?", "고전적 요소 + 고딕적 요소 재해석, 길게 늘어진 몸·침묵하는 인물로 우울감·비극·명상적 표현"],
["브랑쿠시의 ‘상징적 추상 조각’이란?", "· 로댕의 제자였지만 다른 길, 마티스의 형 단순화 + 피카소의 구성 실험을 토양으로 조각 최초의 본격적 상징적 추상 조각 완성<br>· 대상을 그대로 재현하지 않고 <b>대상의 본질을 원초적 형태로 단순화<\/b>해 상징적으로 표현<br>· 진보적 아방가르드(예술을 위한 예술, 순수주의)<br>· 인상주의가 루앙 성당이 아닌 빛을 그렸듯, 새가 아닌 새의 본질 = <b>비상(飛翔)<\/b>"],
["브랑쿠시 조각의 형식적 특징(좌대·표면·직접 조각·영향)은?", "· <b>좌대<\/b>: 단순 받침이 아닌 조형 구성의 일부 → 처음으로 좌대가 하나의 조형 언어<br>· 대리석·청동: 오래 직접 연마해 매끈한 표면 → <b>탈물질화<\/b>된 표면(빛 반사, 덩어리·공간 융화)<br>· 목조: 나뭇결·표면 질감 → 재료의 생명력·촉각성<br>· <b>직접 조각(Direct Carving)<\/b>: 간접법(모델링 후 복제) 거부, 재료와 직접 상호작용<br>· 영향: 아프리카 원시 미술의 단순성, 동양 신비주의의 정신성"],
["브랑쿠시 《무한주(Endless Column)》의 의의는?", "· 1차 대전 루마니아 병사 추모 기념비(추모 3부작)<br>· 작가 설계 + 산업 기술자 협업 → <b>미니멀리즘 제작 방식의 선구<\/b><br>· 공간의 통합: 좌대 해체, 하늘·지면 연결, 일상 공간을 조형 공간으로<br>· 탈서사성: 인물 없이 순수 추상으로 기념비성 → <b>기념비 조각 최초의 추상 형식<\/b><br>· 기하학적 무한 반복"],
["브랑쿠시 《침묵의 테이블》의 의의는?", "· 추모 3부작, 바를라흐와 같은 방향이나 <b>완전한 추상으로 참여적 기념비<\/b> 실현<br>· 원형 테이블 + 12개의 의자 → 시간과 의례적 공동체 상징<br>· 관람자가 실제로 앉아 경험·참여·추모하는 <b>환경 조각의 초기 사례<\/b>"],
["입체파의 ‘형의 분해와 재구성’과 인상주의와의 차이는?", "· 세잔 영향, 전경·후경을 끌어모아 평면에 → 다시점, 형태 분해·재구성 → 윤곽선 파괴 = <b>선의 추상성<\/b> 탄생<br>· 결과: 환영 공간을 부정하는 <b>평면성<\/b> 확립<br>· 목적은 형태 연구, 추상성은 부산물 → 기하학적 추상으로 발전시킨 건 몬드리안<br>· 인상주의 = <b>시간<\/b>에 따라 변하는 빛 연구 / 입체파 = <b>공간<\/b>에 따라 변하는 형태 연구"],
["파피에 콜레·콜라주(Papier Collé)의 등장 이유와 결과는?", "· 분해·재구성 → 너무 추상화돼 형태가 안 보임 → <b>형태를 되살리기 위해 붙임<\/b>(종이·벽지·나무 등 비미술 재료)<br>· 회화에서 처음으로 그리지 않고 붙이는 행위<br>· 결과: 평면+입체 경계 붕괴 / 그린 환영 vs 붙인 실물 중 무엇이 진짜냐는 <b>개념적 물음<\/b> / 회화를 그리는 것 → <b>구성하는 것<\/b>으로 전환 / 콜라주 → 아상블라주 → 정크아트 계보"],
["입체파 1기 ‘세잔적 큐비즘’의 특징과 대표작은?", "· 세잔의 단순형 + 흑인 조각 영향, 대상을 기하학적으로 단순화, 다각도 표현, 전통 원근법 해체의 기초<br>· 《아비뇽의 처녀들》: 인체의 평면적 해석, 르네상스 해부학·원근법 마감의 상징, 누드화 전통 관념 해체<br>· 《에스타크의 집들》: 전경·후경을 모아 꾸겨 넣은 세잔적 큐비즘의 전형"],
["입체파 2기 ‘분석적 큐비즘’의 특징은?", "· 피카소(인물 위주)·브라크(정물 위주) 공동 작업<br>· 인물을 빼고 정물·악기 소재(상징성 배제), 공간에 따라 변하는 형태를 분해·재구성해 다시점을 한 화면에 통합<br>· 문자·숫자 삽입으로 현실감 암시(추상화 보완)<br>· <b>파사주(Passage)<\/b>: 형태와 공간이 서로 관통하며 경계가 모호해지는 기법<br>· 너무 추상·복잡 → 실패로 보고 종합적 큐비즘으로"],
["입체파 3기 ‘종합적 큐비즘’의 특징과 후안 그리스는?", "· 시각적 형태 부활 시도, 파피에 콜레·콜라주 → 결론: <b>회화는 그리는 것이 아니라 구성하는 것<\/b><br>· 분석적에서 빠진 <b>색채 복원<\/b><br>· 글자·상표 등 언어적 요소를 조형 요소로 도입 → 미래주의·구성주의가 가져다 씀<br>· 후안 그리스(Juan Gris): 종합적 큐비즘 체계화·확장, “인지할 수 있는 형태감과 색채를 복원”"],
["피카소 《등나무 의자가 있는 정물》의 의의는?", "타원형 캔버스에 인쇄된 유포(모조 등나무 무늬) 조각을 붙임 → <b>실제 물질이지만 가짜(모조품)<\/b>라는 이중성, 실제·허구·진짜·가짜의 경계를 모순적으로 묶어냄"],
["피카소 《압생트의 잔》의 구성과 의의는?", "· 구성: 분해·재구성한 입체주의 양식 + <b>실제 스푼(오브제)<\/b> + 밀랍으로 떠낸 각설탕(단순 모방)<br>· 동일 주형으로 6개 판본 → 다 다르게 채색 → 원본을 말할 수 없음<br>· 조각이란 무엇인가에 대한 근본적 물음, 회화·조각·오브제 경계 해체, 레디메이드의 예술화·<b>사유적 조각<\/b>의 최초 실천, 원본·복제 개념 해체, 유일성·독창성 부정"],
["피카소의 시기별 변화(1차 대전 이후~1950년대)는?", "· 1차 대전 후 <b>고전주의 회귀<\/b>: 이성·과학 회의 → 신고전주의, 그리스·로마 조각 같은 육중한 인물상(《경주》)<br>· <b>초현실주의 교류<\/b>: 왜곡된 신체, 꿈·무의식, 큐비즘 구조+초현실 상징 / 처음으로 정치적 성향 / 철 조각(드로잉 같은 조각, 회화·조각 통합)<br>· 정치: 스페인 내전·나치 비판, 《게르니카》 – 상징적 형상·왜곡된 인체로 전쟁의 참혹함 고발<br>· 1950년대 <b>거장의 재해석<\/b>: 추상표현주의·색면 추상의 작가주의·독창성 절정기를 비웃듯 명화 재해석"],
["피카소 《시녀들》 시리즈의 의의는?", "· 벨라스케스 명화를 입체주의 언어로 재해석 → <b>차용·전유<\/b>, 근대적 원본성·독창성·권위 해체<br>· 같은 원본을 58점 이상 다르게 → 의미는 고정되지 않고 맥락에 따라 다양하게 재해석됨을 시각화<br>· 포스트모더니즘 차용(Appropriation) 전략·원작 해체 개념의 선구<br>· 그리는 행위 자체를 유희적·실험적 과정으로"],
["누드화 계보 정리(티치아노~피카소)", "· 베네치아 르네상스 티치아노: 이상적 아름다움·관능미<br>· 사실주의 마네 《올랭피아》: 이상적 미의 전복<br>· 후기 인상주의 고갱: 인체에 상징(샤머니즘·죽음)<br>· 야수파 마티스 《청색 누드》: 인체는 조형 실험의 도구<br>· 입체파 피카소 《아비뇽의 처녀들》: 누드화 전통 완전 마감"],
["입체파·피카소가 남긴 것을 이후 사조가 어떻게 가져갔나?", "입체파는 형태 연구 중 의도치 않게 추상성·평면성을 만들었고, 피카소는 ‘그림은 구성이다’라는 결론 후 다음으로 넘어감 → 남은 것을 <b>미래주의·구성주의·몬드리안·초현실주의<\/b>가 하나씩 주워 자기 양식으로"],
["브라크(Braque)의 특징과 《바이올린과 팔레트》는?", "· 세잔 이론을 가장 충실하게 전개한 <b>입체파 이론의 확립자<\/b>, 정물화 같은 풍경, 조용·차분한 색채<br>· 《바이올린과 팔레트》: 하반부 분해·재구성 / 상반부 <b>눈속임 기법으로 못<\/b> 묘사 → 르네상스의 환영성과 입체파의 매체 실험을 동시에 인식하게 하는 개념적 자세"],
["레제(Léger)의 ‘실린더리즘(원통주의)’이란?", "· 큐비즘 형식을 기계적 형상에 적용, 산업화·기계화를 반영하는 원통형 인물상<br>· 1차 대전 이후 기계의 역동성, 금속적 질감, 강한 원색 → 현대적 인공미·속도<br>· 노동자와 기계 문명을 긍정적으로 이상화 → 미래주의와 유사<br>· 형태 연구가 목적이라기보다 큐비즘 형식을 빌려 산업화 이후 일상 이미지 표현"],
["아르키펜코(Archipenko)의 볼륨 재정의와 투조 기법은?", "· 전통: 볼륨 = 꽉 찬 덩어리 → 아르키펜코: 볼륨 = <b>덩어리 + 공간 + 구조의 관계성<\/b><br>· <b>투조(透彫)<\/b>: 양감을 두고 뚫어서 형태·공간 관계 탐구<br>· 피카소 기타와 방향은 같으나 방식 다름: 피카소는 재료 자체를 바꿈, 아르키펜코는 덩어리에 구멍<br>· 헨리 무어 이전에 공간·대상 관계를 탐구한 선구자"],
["아르키펜코의 ‘아르키펜투라’와 ‘회화 조소’란?", "· <b>아르키펜투라<\/b>: 여러 패널을 겹쳐 모터로 돌리면 장면이 바뀌는 시스템 → 회화+조각+기계 융합, <b>키네틱 아트·미디어 아트의 선구<\/b><br>· <b>회화 조소(Sculpto-peinture)<\/b>: 부조 형태 조각에 채색, 나무·유리에 색·배경 → 회화·조각 경계 해체"]];</script>

<style>

$('#cp').onclick=()=>{const t=C().join(','),ok=()=>cnt('복사됨: '+(t||'없음')),fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove();ok()};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}};
$('#ex').onclick=()=>{const w=QA.map((x,i)=>[x[0],x[1],N(x,i)]).filter(x=>S[x[2]]);if(!w.length)return cnt('체크된 문항 없음');const j=v=>JSON.stringify(v).replace(/<\//g,'<\\/'),h='\ufeff<script>const KEY='+j(KEY+'-wrong')+',SUBJ='+j(SUBJ)+',TITLE='+j(TITLE+' (오답)')+',QA='+j(w)+';<\/script>\n<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+$('style').outerHTML+'<body>'+$('#app').outerHTML,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html;charset=utf-8'}));a.download=KEY+'-wrong.html';a.click()};

<style>

</style><script>/*MEMO*/addEventListener("load",()=>{
const ds=[...document.querySelectorAll("details")];if(!ds.length)return;
const H=location.hostname,seg=location.pathname.split("/").filter(Boolean);
const REPO=/\.github\.io$/.test(H)&&seg.length>1?H.split(".")[0]+"/"+seg[0]:"mujang0423-alt/mu",BR="main";
const RAW="https://raw.githubusercontent.com/"+REPO+"/"+BR+"/",API="https://api.github.com/repos/"+REPO+"/contents/";
const NAME=(typeof KEY!="undefined"?KEY:decodeURIComponent(seg[seg.length-1]||"x").replace(/\.html?$/i,"")).replace(/[\\\/:*?"<>|#%]/g,"_");
const PATH="memo/"+NAME+".json",LK="mm|"+NAME;
const enc=p=>p.split("/").map(encodeURIComponent).join("/");
const tok=()=>{try{return localStorage.getItem("hub-token")}catch(e){return null}};
const b64=s=>{const u=new TextEncoder().encode(s);let r="";for(let i=0;i<u.length;i+=8192)r+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(r)};
const ub64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const btn=(x,f)=>{const b=el("button");b.type="button";b.textContent=x;b.onclick=e=>{e.preventDefault();f()};return b};
let M={};try{M=JSON.parse(localStorage.getItem(LK))||{}}catch(e){}
const store=()=>{try{localStorage.setItem(LK,JSON.stringify(M))}catch(e){}};
const ui=[];

function view(i){
  const u=ui[i],m=M[i]||{},has=!!((m.t&&m.t.trim())||(m.img&&m.img.length));
  u.box.innerHTML=has?esc(m.t||"")+(m.img||[]).map(p=>'<img loading="lazy" src="'+esc(RAW+enc(p))+'">').join(""):"";
  u.box.style.display=has?"":"none";
  u.btn.textContent=has?"메모 수정":"＋ 메모";
}
function shrink(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,1400/Math.max(im.width,im.height)),c=el("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  const d=c.toDataURL("image/jpeg",.82);URL.revokeObjectURL(im.src);res({url:d,b64:d.split(",")[1]})};
  im.onerror=()=>rej(new Error("이미지를 읽지 못함"));im.src=URL.createObjectURL(f)})}
async function get(){
  const r=await fetch(API+enc(PATH)+"?ref="+BR+"&t="+Date.now(),{headers:{Authorization:"Bearer "+tok()},cache:"no-store"});
  if(r.status===404)return{d:{},sha:null};
  if(!r.ok)throw new Error("읽기 실패 "+r.status);
  const j=await r.json();let d={};try{d=JSON.parse(ub64(j.content))||{}}catch(e){}
  return{d:d,sha:j.sha};
}
async function put(p,content,msg,sha){
  const b={message:msg,content:content,branch:BR};if(sha)b.sha=sha;
  const r=await fetch(API+enc(p),{method:"PUT",headers:{Authorization:"Bearer "+tok(),"Content-Type":"application/json"},body:JSON.stringify(b)});
  if(!r.ok){let m=r.status;try{m=(await r.json()).message||m}catch(e){}const e=new Error(m);e.status=r.status;throw e}
}
async function commit(i,v){
  for(let n=0;;n++){
    const g=await get(),d=g.d;if(v)d[i]=v;else delete d[i];
    try{await put(PATH,b64(JSON.stringify(d,null,1)),"메모: "+NAME+" "+(i+1)+"번",g.sha);M=d;store();return}
    catch(e){if(n>=2||(e.status!==409&&e.status!==422))throw e}
  }
}
function thumb(src,rm){const w=el("span","mm-th"),im=el("img"),x=el("b");im.src=src;x.textContent="×";x.onclick=rm;w.append(im,x);return w}

function edit(i){
  const u=ui[i],m=M[i]||{},imgs=(m.img||[]).slice(),adds=[];
  const ta=el("textarea");ta.value=m.t||"";ta.placeholder="모르는 단어 뜻, 보충 설명…";
  const th=el("div"),fi=el("input"),st=el("span","mm-st");
  fi.type="file";fi.accept="image/*";fi.multiple=true;fi.style.display="none";
  const draw=()=>{th.innerHTML="";
    imgs.forEach((p,k)=>th.append(thumb(RAW+enc(p),()=>{imgs.splice(k,1);draw()})));
    adds.forEach((a,k)=>th.append(thumb(a.url,()=>{adds.splice(k,1);draw()})))};
  fi.onchange=async()=>{for(const f of fi.files){try{adds.push(await shrink(f))}catch(e){st.textContent=e.message}}fi.value="";draw()};
  const close=()=>{u.ed.innerHTML="";u.ed.style.display="none";u.bar.style.display="";view(i)};
  const ok=btn("저장",async()=>{
    if(!tok()){st.textContent="허브(index)에서 '토큰'을 먼저 저장해야 해요";return}
    ok.disabled=true;
    try{
      const paths=[];
      for(let k=0;k<adds.length;k++){
        st.textContent="사진 올리는 중 "+(k+1)+"/"+adds.length;
        const p="memo/img/"+NAME+"-"+(i+1)+"-"+Date.now().toString(36)+k+".jpg";
        await put(p,adds[k].b64,"메모 사진: "+NAME);paths.push(p);
      }
      st.textContent="저장 중…";
      const t=ta.value.replace(/\s+$/,""),all=imgs.concat(paths);
      await commit(i,(t||all.length)?{t:t,img:all}:null);
      ds.forEach((_,k)=>{if(k!==i)view(k)});close();
    }catch(e){st.textContent="저장 실패: "+e.message;ok.disabled=false}
  });
  u.ed.innerHTML="";u.ed.append(ta,th,fi,btn("사진 추가",()=>fi.click()),ok,btn("취소",close),st);
  u.bar.style.display="none";u.ed.style.display="";draw();ta.focus();
}

ds.forEach((d,i)=>{
  const w=el("div","mm"),box=el("div","mm-box"),bar=el("div"),ed=el("div"),b=btn("＋ 메모",()=>edit(i));
  bar.append(b);ed.style.display="none";w.append(box,bar,ed);d.append(w);
  ui[i]={box:box,bar:bar,ed:ed,btn:b};view(i);
});

(async()=>{try{
  let d;
  if(tok())d=(await get()).d;
  else{const r=await fetch(RAW+enc(PATH)+"?t="+Date.now(),{cache:"no-store"});if(r.status===404)d={};else if(r.ok)d=await r.json();else return}
  M=d||{};store();ds.forEach((_,k)=>{if(ui[k].ed.style.display==="none")view(k)});
}catch(e){}})();
})</script>
