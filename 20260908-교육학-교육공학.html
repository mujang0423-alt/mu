<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>20260908-교육학-교육공학</title>
<script>const KEY="0908-교육학-교육공학";</script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;max-width:820px;margin:0 auto;padding:16px;line-height:1.7;color:#222;background:#fafafa}
h1{font-size:18px;margin:0 0 12px}
#bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:#fafafa;padding:8px 0;border-bottom:1px solid #ddd;margin-bottom:12px}
button{padding:6px 12px;font-size:14px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
label{font-size:14px;cursor:pointer}
.item{background:#fff;border:1px solid #ddd;border-radius:8px;margin-bottom:8px;padding:8px 12px}
.item.w{background:#fff1f1;border-color:#e57373}
summary{cursor:pointer;font-weight:600;font-size:15px}
.a{margin-top:8px;padding-top:8px;border-top:1px dashed #ddd;white-space:pre-wrap;font-size:14px}
.chk{margin-top:6px;font-size:13px;color:#c62828}
.hide{display:none}
#cnt{font-size:13px;color:#666;margin-left:auto}
</style>
</head>
<body>
<h1>교육학 · 교육공학(교수설계) (2026-09-08)</h1>
<div id="bar">
<label><input type="checkbox" id="only"> 틀린 것만</label>
<button id="exp">오답 내보내기</button>
<button id="cp">번호 복사</button>
<span id="cnt"></span>
</div>
<div id="list"></div>
<script>
const QA=[
["4C/ID 모형이란? 구성 요소는?","복합적인(복잡한) 인지 기능의 학습을 위해 제시된 교수설계 모형.\n구성 요소: ① 학습 과제 ② 지원적 정보 ③ 절차적 정보 ④ 부분 과제 연습"],
["교수 체제 설계(체제적 교수설계)란?","학습 과정에 영향을 미치는 모든 맥락을 고려하여 수업을 설계하는 것. 딕과 캐리 모형이 여기에 포함된다."],
["교수 체제 설계의 필요성은?","· 오류를 지속적으로 수정·보완하여 효과적인 교수 프로그램을 완성할 수 있다\n· 목표에 적합한 교수 전략을 고안할 수 있다"],
["딕과 캐리 모형의 단계는?","① 교수 목적 설정(요구 분석) ② 교수 분석(과제 분석) ③ 학습자 및 환경 분석 ④ 수행 목표 진술 ⑤ 평가 도구 개발 ⑥ 교수 전략 개발 ⑦ 교수 자료 개발 ⑧ 형성 평가 실시 ⑨ 교수 프로그램 수정 ⑩ 총괄 평가 실시\n※ 크게 분석-설계-개발-평가"],
["교수 분석(과제 분석)이란? 그 유형은?","최종 교수 목적 달성을 위해 필요한 지식·기능·태도가 무엇인지 위계적으로 분석하는 것. 교수 목표의 유형과 그 목표의 하위 기능을 분석한다.\n유형: 군집 분석, 위계 분석, 절차 분석, 통합 분석"],
["ASSURE 모형의 절차는?","① 학습자 분석 ② 목표 설정 ③ 매체와 자료의 선정 ④ 매체와 자료의 활용 ⑤ 학습자 참여 유도 ⑥ 평가 및 수정 (하이니히)"],
["ASSURE 모형에서 '매체와 자료의 활용' 5단계는?","① 자료 사전 검토 ② 자료 준비 ③ 환경 준비 ④ 학습자 준비 ⑤ 학습 경험 제공(수업 제공)"],
["매체와 자료의 선정 기준은?","· 교육과정과의 일치 여부\n· 학습자의 특성 및 흥미 유발 정도\n· 자료의 참신성"],
["플립러닝이란?","온라인 영상 등을 통해 미리 사전 학습을 하고, 교실에서는 토론·실습 등 심화 활동을 하는 학습자 중심 수업."],
["플립러닝의 장점은?","· 프로젝트 학습, 토론 학습 등 학습자 중심 수업을 확대할 수 있다\n· 학습자의 수준과 특성에 맞는 수업이 가능하다\n· 사전 학습을 통해 학업 격차를 줄일 수 있다\n· 활동 학습을 통해 수업에 대한 자신감을 기를 수 있다\n· 교사가 이론 수업 대신 다양한 활동을 제공하여 학습 경험이 폭넓어진다"],
["플립러닝에서 교사의 역할 및 유의점은?","· 매체 활용 방법에 대한 사전 안내를 제공한다(학생마다 기술·매체 활용 능력에 차이가 있으므로)\n· 스캐폴딩을 제공하는 조력자·촉진자 역할\n· 온라인 사전 학습을 충분히 하지 않은 경우를 대비하여 마이크로 러닝(짧은 영상 강의)을 준비한다"],
["라이겔루스의 교수설계 3대 변인은?","① 교수의 조건 ② 교수의 방법 ③ 교수의 성과(교수 결과·학습 성과)"],
["라이겔루스의 3대 변인 각각의 하위 요소는?","· 교수의 조건(바꿀 수 없는 것): 교과 목표, 교과 내용의 특성, 학습자 특성, 제약 조건\n· 교수의 방법: 조직 전략(미시적/거시적), 전달 전략, 관리 전략\n· 교수의 성과: 효과성, 효율성, 매력성"],
["거시적 조직 전략이란? 라이겔루스는 주로 어떤 전략을 사용했는가?","두 개 이상의 개념(여러 개의 아이디어)을 가르칠 때 이를 어떻게 조직하여 전달할 것인가에 대한 전략. 라이겔루스는 주로 거시적 조직 전략을 사용했다."],
["정교화 이론의 교수설계 전략 7가지는?","① 단순-복잡의 정교화된 계열화 ② 선수 학습 요소의 계열화 ③ 요약자 사용 ④ 종합자 사용 ⑤ 비유 활용 ⑥ 인지 전략 촉진자(활성자) ⑦ 학습자 통제"],
["선수 학습 요소의 계열화란?","새로운 내용을 학습하기에 앞서 반드시 학습해야 하는 선수 학습 요소를 순서화하여 가르치는 것.\n예) 2차 방정식을 학습하기 위해 제곱과 미지수(변인)를 먼저 학습한다."],
["상황 정착 수업 이론(앵커드 교수)이란?","실제적인 과제를 실제 사용되는 맥락과 함께 영상·비디오 매체(이야기)로 제시하여, 학습자들이 함께 문제를 해결해 나가고 지식을 일상생활에 적용·전이하도록 하는 교수 방법."],
["정착 수업에서 과제의 성질은?","· 포괄적이고 복잡한 구조를 가진 과제\n· 실제성을 지닌 과제\n· 학생들에게 친숙한 내용\n· 통합적인 과제\n· 다양한 영상 매체를 활용하여 제시"],
["자원 기반 학습이란?","학습자가 스스로 다양한 자원과 상호작용하면서 문제를 해결해 나가는 학습."],
["Big6 Skills의 단계는?","① 과제 정의 ② 정보 탐색 전략 ③ 소재 파악과 접근 ④ 정보 활용 ⑤ 종합 정리 ⑥ 평가"],
["자원 기반 학습에서 교사의 역할은?","· 다양한 학습 자원의 소재와 활용 방법을 안내하는 조력자\n· 학습 지도 및 스캐폴딩 제공\n· 자기 주도적 학습 과정에 대한 코칭 제공\n· 다양한 학습 자원 및 매체 제공"],
["상황 학습이란? 정착 수업과의 차이는?","상황 학습은 실제적인 과제를 실제 사용되는 맥락과 함께 제시하여 지식이 일상생활에 적용될 수 있도록 하는 방법.\n정착 수업은 실제 문제 상황을 영상 매체·이야기로 제시하여 해결하도록 한다는 점에서 상황 학습의 하위에 포함된다."],
["상황 학습에서 과제는 어떻게 설계해야 하는가?","· 실제적인 과제를 제시한다\n· 그 과제가 사용되는 맥락을 함께 제시한다\n· 구체적이고 다양한 사례를 활용한다"],
["상황 학습에서 교수 방법은 어떻게 설계해야 하는가?","· 학습자가 관찰하고 모델링할 수 있도록 시연과 관찰의 기회를 제공한다\n· 학습 과정을 관찰하여 코칭과 스캐폴딩을 제공한다\n· 타인과 협동하고 자신의 생각을 반성·명료화할 수 있는 기회를 제공한다"],
["자기 주도적 학습이란?","학습 목표, 학습 내용, 학습 방법, 평가 등 학습 과정 전반을 학습자 스스로 결정하는 학습 방법."],
["자기 주도적 학습의 필요성은?","· 스스로 학습해야 진정으로 의미 있는 지식이 된다\n· 스스로 해결해 나가야 할 과제가 많은 사회에서 자신에 대한 이해를 높일 수 있다"],
["자기 주도적 학습의 실천 방안은?","· 교수·학습: 학생 중심 교육으로 전환하여 학생의 활동을 강조한다\n· 교육과정을 탄력적으로 운영하여 교과 시간, 창의적 체험 활동, 방과 후 교육 활동 시간을 최대한 활용한다\n· 평가: 다양화·개별화·자율화"],
["자기 주도적 학습에서 평가의 세 가지 원칙은?","· 평가의 다양화: 개별 학생의 수만큼 다양한 방식의 평가를 실시한다\n· 평가의 개별화: 학생마다 학습 내용·수준·진도가 다르므로 평가도 개별적으로 시행한다\n· 평가의 자율화: 학습자가 자신의 속도와 진도에 맞춰 학습 과정이나 성취 결과를 자발적으로 평가하도록 한다"]
];
const L=document.getElementById("list"),O=document.getElementById("only"),C=document.getElementById("cnt");
let S=[];
try{S=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
const on=i=>S.indexOf(i)>-1;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function render(){
 L.innerHTML="";
 QA.forEach((q,i)=>{
  if(O.checked&&!on(i))return;
  const d=document.createElement("div");
  d.className="item"+(on(i)?" w":"");
  const de=document.createElement("details");
  de.innerHTML="<summary>"+(i+1)+". "+q[0]+"</summary><div class='a'></div>";
  de.querySelector(".a").textContent=q[1];
  const lb=document.createElement("label");lb.className="chk";
  const cb=document.createElement("input");cb.type="checkbox";cb.checked=on(i);
  cb.onchange=()=>{on(i)?S.splice(S.indexOf(i),1):S.push(i);save();render()};
  lb.append(cb,document.createTextNode(" 틀림"));
  d.append(de,lb);L.append(d);
 });
 C.textContent="총 "+QA.length+" · 오답 "+S.length;
}
O.onchange=render;
document.getElementById("cp").onclick=()=>{
 const t=S.slice().sort((a,b)=>a-b).map(i=>i+1).join(",");
 const fb=()=>{const x=document.createElement("textarea");x.value=t;document.body.append(x);x.select();document.execCommand("copy");x.remove();alert("복사됨: "+t)};
 navigator.clipboard?navigator.clipboard.writeText(t).then(()=>alert("복사됨: "+t),fb):fb();
};
document.getElementById("exp").onclick=()=>{
 const w=S.slice().sort((a,b)=>a-b).map(i=>QA[i]);
 if(!w.length)return alert("체크된 문항이 없습니다.");
 const h=document.documentElement.outerHTML
  .replace(/const QA=\[[\s\S]*?\n\];/,"const QA="+JSON.stringify(w)+";")
  .replace(/const KEY="[^"]*";/,'const KEY="'+KEY+'-wrong";');
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob(["<!DOCTYPE html>"+h],{type:"text/html"}));
 a.download=KEY+"-wrong.html";a.click();URL.revokeObjectURL(a.href);
};
render();
</script>
</body>
</html>
