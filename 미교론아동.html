<script>
const QA=[
["아동 미술을 보는 네 가지 관점은?","개성 표현 이론, 발생 반복 이론, 인지 발달 이론, 지각 발달 이론"],
["인지 발달 이론의 관점은?","'아는 것을 그린다'. 아동의 지능이 발달할수록 비재현적 그림에서 점차 사실적 그림으로 나아간다."],
["지각 발달 이론의 관점은?","'본 것을 그린다'. 지각이 성장하며 분화·복잡해져 세부 특성을 표현할 수 있게 된다."],
["인지 발달·지각 발달 이론의 대표 학자는?","인지 발달: 로웬펠드, 굿이너프, 해리스 / 지각 발달: 맥피, 아른하임"],
["맥피의 지각-묘사 이론 네 가지 요소는?","① 어린이의 준비도 ② 정보 처리 능력 ③ 작업 환경 ④ 묘사(표현) 기능"],
["지각-묘사 이론에서 '작업 환경'에 포함되는 것은?","어린이가 느끼는 억압의 정도, 보상과 처벌, 동일시의 정도"],
["로웬펠드와 대비되는 맥피·윌슨의 입장은?","로웬펠드는 아동이 일정한 발달 단계를 따라 발달한다고 보았으나, 맥피와 윌슨은 선천적 요인보다 문화적·환경적 영향이 더 크게 작용한다고 보았다."],
["게슈탈트 심리학의 개념은?","'전체는 부분의 단순한 합 이상이다.' 인간은 대상을 부분으로 지각하지 않고 새롭게 조직화·재구성하여 하나의 의미 있는 전체로 지각한다."],
["집단화의 법칙 다섯 가지는?","유사성, 근접성, 폐쇄성(완결성), 연속성, 공동 운명성의 원리"],
["불완전한 틈이나 간격을 메워 하나의 완성된 형태로 지각하려는 원리는?","폐쇄성의 원리"],
["프래그난츠 법칙이란?","지각을 가장 단순하고 대칭적이며 균형 잡힌 구조로 조직하려는 경향"],
["불완전한 형태를 자신이 알고 있는 형태와 연관시켜 이해하려는 것은?","친숙성의 법칙"],
["로웬펠드 발달 단계 중 형식적 조작기에 해당하는 것은?","결정기"],
["결정기의 특징은?","시각형·촉각형·중간형이 뚜렷하게 나타남. 대상을 비판적으로 봄. 시각형은 원근법 등 사실적 표현을, 촉각형은 감정을 드러내는 색을 사용. 사실적 표현과 추상 표현이 함께 나타남."],
["의사실기의 특징은?","사실적으로 표현하려는 욕구가 커지나 자기 표현이 뒤떨어짐을 인식해 표현이 침체됨. 원근법적 표현이 나타나고 시각형과 비시각형(촉각형)으로 분화된다."],
["시각형과 비시각형의 차이는?","시각형은 대상을 객관적·사실적으로 표현하고, 비시각형(촉각형)은 주관적으로 자신의 기분에 따른 색채 표현을 한다."],
["상징 발달 5단계 중 4단계의 명칭과 특징은?","규칙 체계기. 또래 집단 생활을 통해 타인의 관점을 이해하며 주관적 표현이 사라지고, 도식적 표현과 사실적 표현이 혼합된다. 해당 문화권의 관습적 양식을 충분히 인식하고 그 시각으로 작품을 해석할 수 있다."],
["상징 발달 5단계 중 5단계의 명칭과 특징은?","후인지기. 상징이 객관적 사물을 실제로 의미하는지에 구애받지 않고 그 자체로 의미 있는 것으로 인식한다. 예술적 관습을 성숙한 수준에서 이해하고 관습으로부터 독립된 시각을 가지며, 도달하는 사람은 극소수이다."],
["색채 지각을 기준으로 나눈 유형 중 '객관형'의 특징은?","호불호나 정서·감정에 좌우되지 않고 색을 있는 그대로 지적인 측면에서 이해하며, 감상 시 자신만의 기준을 중심으로 판단한다."],
["허버트 리드의 유형 중 '유기형'의 특징은?","부분보다 전체적인 조화와 율동을 중시하며, 외부 대상에 감정 이입을 잘하고 집단적 대상을 선호한다."],
["각기 분리된 세부를 꼼꼼히 표현하며 사실적이지만 건축가적 묘사에 가까운 유형은?","열거형"],
["펠드먼 미술 비평의 명칭과 단계는?","비평적 담화. 기술 - 분석 - 해석 - 판단"],
["앤더슨 미술 비평의 명칭과 단계는?","교육적 미술 비평. 반응 - 기술 - 해석 - 판단"],
["펠드먼의 기술과 앤더슨의 기술의 차이는?","펠드먼은 작품에 나타난 외형적 요소를 관찰해 무엇이 보이는지 객관적으로 기술하며 감정·느낌은 유보한다. 앤더슨은 형식과 맥락을 모두 보며, 감상자의 경험에 비추어 해석적으로 기술한다."],
["앤더슨 기술 단계의 네 가지 하위 요소는? (명·형·미·맥)","① 명백한 주제적·형식적·비교적 특성 ② 형식과 이미지 간의 관계 ③ 미묘한 형식적 특성 ④ 맥락의 검토"],
["앤더슨 기술 단계의 발문 예시 두 개는?","'어떤 이미지, 색깔, 질감이 보이나요?' '이것은 조각인가요, 사진인가요?' '어떤 분위기가 제시되나요?'"],
["펠드먼의 해석 단계에서 하는 일은?","작가의 의도와 작품의 의미를 해석한다. (교사 주도적 해석)"],
["앤더슨의 해석 단계에서 하는 일은?","작가의 의도를 해석하되 감상자의 판단에 근거하므로 다의적 해석이 가능하다. (감상자 주도적 해석)"],
["펠드먼 해석 단계의 발문 두 개는?","'이 작품의 주제는 무엇인가요?' '이 작품이 만들어진 시대적·사회적 배경은 어떠한가요?'"],
["앤더슨 해석 단계의 발문 두 개는?","'내가 이 작품 속 인물(사물)이 된다면 어떤 느낌일까요?' '내가 제목을 붙인다면 무엇이라고 하겠어요?'"],
["펠드먼과 앤더슨의 판단 단계 비교는?","펠드먼은 형식주의·표현주의·도구주의라는 미학적 기준을 바탕으로 작품의 미적 가치를 판단한다. 앤더슨은 개인적 경험 - 미적 판단 - 맥락적 판단 - 최종 판단의 네 단계로 판단한다."],
["게이건의 비평적 탐구 여섯 단계는?","문제 인식 - 문제 명확화 - 가설 설정 - 결과 추론 - 가설 검증 - 적용"],
["게이건의 '가설 설정' 단계에서 하는 일은?","작품의 의미와 가치에 대한 의문점을 바탕으로 가설을 형성하는 단계"],
["게이건의 '결과 추론' 단계에서 하는 일은?","감상자들 간의 토의·토론 활동을 통해 가설들의 결과를 추론하고, 이를 뒷받침할 정확한 자료를 찾는 단계"],
["게이건 비평적 탐구에 포함된 교육 활동 세 가지 유형은?","학생 반응 활동, 개념과 기능 개발 활동, 학생 연구 활동"],
["'개념과 기능 개발 활동'에서는 무엇을 하는가?","개념은 예제와 예증을 통해 정의를 제공하고, 기능은 예증(시범)을 제시한 뒤 관련 있는 기능을 지도한다."],
["'학생 연구 활동'에서는 무엇을 하는가?","작품의 의미와 가치를 이해·판단하는 데 필요한 개념적 지식, 기능, 작가 지식, 맥락적 지식을 연구한다. 교사는 프로젝트 학습을 통해 지식을 획득하도록 유도하고, 도서관 등에서 공동으로 탐색하도록 안내한다."],
["학생의 비평적 반응을 촉진하는 방법 세 가지는?","① 관찰 내용과 의견을 서로 나누도록 촉진한다 ② 연관성 있는 다른 작품을 비교·대조한다 ③ 대조적이고 논쟁적일 수 있는 내용을 경험하게 한다"],
["VTS는 무엇의 약자인가?","Visual Thinking Strategies (시각적 사고 전략)"],
["VTS의 구성 요소 여섯 가지는?","① 그룹 ② 토의 주제(미술품) ③ 조용히 바라보기 ④ 세 가지 개방적 질문 ⑤ 촉진 ⑥ 수업 마무리"],
["VTS의 세 가지 개방적 질문은?","① 이 작품에서 무슨 일이 일어나고 있나요? ② 무엇을 보고 그렇게 말했나요? ③ 그 밖에 무엇을 더 찾을 수 있나요?"],
["VTS의 촉진 전략 세 가지는?","가리키기, 바꾸어 말하기, 연결하기"],
["VTS 수업 마무리는 어떻게 하는가?","토의는 옳고 그름을 가리기 위한 것이 아니라 생각하는 방식을 연습하기 위한 것임을 이야기하여 다음에도 편안하게 참여하도록 한다. 토의 내용은 요약·정리하지 않는다."],
["VTS에서 토의 내용을 요약하지 않는 이유는?","요약하려면 몇몇의 의견을 생략할 수밖에 없어 모든 의견을 동등하게 존중하기 어려워지기 때문"],
["VTS에서 학생에게 요구되는 다섯 가지는?","① 작품을 주의 깊게 관찰할 것 ② 관찰한 것에 대해 말할 것 ③ 자신의 생각을 근거를 들어 뒷받침할 것 ④ 타인의 관점을 고려할 것 ⑤ 여러 가지 해석에 대해 토론할 것"],
["VTS가 영향받은 이론과 그 내용은?","피아제: 단계적으로 발달한다는 점 / 구성주의: 감상자 스스로 작품을 이해해 자신만의 해석으로 발전시킨다는 점 / 비고츠키: 대화 중심의 교수법이 사고 발달에 유용하다는 점"],
["아레나스 대화 중심 감상법의 단계는?","수용 - 교류 - 통합"],
["아레나스 '수용' 단계의 유의점은?","교사가 먼저 작품 내용을 설명하지 않는다."],
["미틀러 감상 비평 모델의 네 단계는?","미숙한 결정짓기 - 내부 단서를 찾기 위한 관찰 - 외부 단서를 찾기 위한 관찰 - 최종 결정"],
["'내부 단서를 찾기 위한 관찰'은 어떤 양식으로 분류되는가?","모방주의, 형식주의, 표현주의"],
["내부 단서와 외부 단서를 찾기 위한 관찰의 차이는?","내부 단서는 모방주의·형식주의·표현주의를 바탕으로 조형 요소와 원리 등 형식적·미학적 가치를 판단한다. 외부 단서는 시대·사회·문화 등이 작품에 미친 영향을 살피는 맥락적 탐구이다."],
["하인의 미술관·박물관 교육 이론에서 지식축의 양극은?","독립적으로 존재하는 지식 ↔ 학습자에 의해 구성된 지식"],
["하인 이론에서 학습축의 양극은?","학습은 지속적인 점진(증진)이다 ↔ 모든 학습은 학습자에 의해 개인적·사회적으로 구성된다"],
["하인의 '발견' 영역 전시의 특징은?","전시 구조물 사이를 오가며 탐구할 수 있는 형태로 능동적 학습이 가능하다. 해답을 스스로 찾게 하는 라벨과 패널을 제공하고, 각자 나름대로 해설할 수 있는 수단을 제공한다."],
["하인의 '구성주의' 영역 전시의 특징은?","들어오는 입구와 나가는 출구가 구분되지 않는다. 다양한 경험과 재료를 제공해 학습자가 스스로 추측하고 결론을 내리는 능동적 학습이 가능하며, 자신의 경험을 활용하도록 한다."],
["학습자가 박물관 경험을 능동적으로 구성하기 위한 두 요소는?","① 물리적 접근의 용이성: 관람자에게 위압감·부담감을 주지 않도록 한다 ② 개념적 접근의 용이성: 배경지식을 활용하고 이미 알고 있는 것과의 연관성을 고려하며, 감각 경험 및 협동 학습을 장려한다"],
["파슨스의 심미적 발달 5단계는?","편애(주관적 선호) - 미와 사실성 - 표현성 - 양식과 형식 - 자율성"],
["파슨스의 '표현성' 단계는?","작품에서 표출되는 작가의 감정이나 생각이 강렬할수록 좋은 작품이라고 판단하며, 추상적인 작품도 평가할 수 있게 된다."],
["파슨스의 '자율성' 단계는?","작품의 가치는 역사의 변화에 따라 변하고 시대적 상황에 따라 조정되어야 함을 안다. 양식과 형식에서 벗어나 스스로 작품에 의미를 부여하고, 자신의 경험에 비추어 주관적으로 판단한다."],
["가드너 예술 발달 단계의 마지막 두 단계는?","탈사실적 사고와 미적 감수성의 출현 / 예술적 위기와 몰입"],
["'예술적 위기와 몰입' 단계의 특징은?","표현(제작) 능력은 떨어지는 대신 비판 능력이 신장되어 타인의 작품을 비판하려는 경향이 나타난다. 예술을 역사적 틀로 인식하고 판단의 객관도가 높아지며, 사실적 표현에 대한 고정관념에서 자유로워진다."],
["루켄스 주기 3단계에서 일어나는 일은?","표현 능력은 침체하고 감상 능력이 발달하여 글쓰기 능력 등이 신장된다. (고원 단계)"],
["루켄스 주기 4단계에서 일어나는 일은?","감상 능력은 계속 발달하지만 표현 능력은 소수의 아동만 발달하여 그들에게서 예술적 창작이 일어난다. (상승 단계)"],
["벅카트는 무엇을 기준으로 아동의 표현 유형을 나누었는가?","창의성. 처음으로 표현 특성을 인성적 특성과 연결한 점이 특징이다."],
["벅카트가 나눈 두 가지 유형은?","숙고형과 자의형"],
["자의형의 인성 특징과 작품 특징은?","인성: 교사의 권위에 도전적이고 자기 긍정적이며 창의적이다. 작품: 개성적이고 자유로운 윤곽선, 다양한 구도와 자유로운 색채, 세부를 다양하고 복잡하게 처리한다."],
["앙드레 말로의 '상상의 미술관'이란?","작품을 장소의 속박에서 해방시켜, 대중매체의 사진으로 이루어진 가상의 박물관, 즉 '벽 없는 미술관'으로 의미를 변화시킨 것"],
["'상상의 미술관'의 장점은?","시공간의 제약을 받지 않아 거대한 구조물도 수용할 수 있고, 거리적 제약이 없으므로 아주 먼 곳의 작품을 나란히 놓고 비교할 수 있다. 언제든 감상이 가능하며, 모든 미술품이 예술화되는 시뮬라크르의 과정을 거친다."]
];
let W={};try{W=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const L=document.getElementById('l'),C=document.getElementById('c');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(W))}catch(e){}};
const nums=()=>QA.map((_,i)=>W[i]?i+1:0).filter(Boolean);
const count=()=>C.textContent='틀림 '+nums().length+' / '+QA.length;
QA.forEach(([q,a],i)=>{
  const d=document.createElement('details');
  if(W[i])d.className='w';
  d.innerHTML='<summary><span class="n">'+(i+1)+'.</span>'+q+'</summary><div class="a">'+a+'</div><label><input type="checkbox"> 틀림</label>';
  const c=d.querySelector('input');c.checked=!!W[i];
  c.onchange=()=>{W[i]=c.checked?1:0;d.classList.toggle('w',c.checked);save();count()};
  L.appendChild(d);
});
count();
document.getElementById('f').onchange=e=>L.classList.toggle('only',e.target.checked);
document.getElementById('e').onclick=()=>{
  const s=QA.filter((_,i)=>W[i]);
  if(!s.length)return alert('체크된 문항이 없습니다.');
  const h='<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>'+KEY+' 오답</title><style>'+document.querySelector('style').innerHTML+'</style></head><body><h1>오답 노트 ('+s.length+'문항)</h1>'+
    s.map(([q,a],i)=>'<details class="w" open><summary><span class="n">'+(i+1)+'.</span>'+q+'</summary><div class="a">'+a+'</div><label><input type="checkbox" checked> 틀림</label></details>').join('')+'</body></html>';
  const u=URL.createObjectURL(new Blob([h],{type:'text/html'})),a=document.createElement('a');
  a.href=u;a.download=KEY+'-wrong.html';a.click();URL.revokeObjectURL(u);
};
document.getElementById('p').onclick=()=>{
  const t=nums().join(',');if(!t)return alert('체크된 문항이 없습니다.');
  const fb=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(e){prompt('복사하세요',t)}x.remove();alert('복사됨: '+t)};
  const p=navigator.clipboard&&navigator.clipboard.writeText(t);
  p?p.then(()=>alert('복사됨: '+t)).catch(fb):fb();
};
</script></body></html>
