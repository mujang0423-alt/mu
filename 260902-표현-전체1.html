<h1>0902 · 표현 · 전범위</h1>
<div id="app"></div>
<script>
const KEY="0902-표현-전범위";
const QA=[
["조형 요소를 모두 말하시오.","점, 선, 면, 형·형태, 색, 양감, 질감, 공간, 여백, 농담."],
["형태를 성격에 따라 분류하면?","기하학적 형태, 유기적 형태, 자연형, 변형형, 추상형."],
["형태 변화의 세 가지 요인은?","눈높이, 보는 방향, 원근."],
["작가가 의도적으로 만들어 낸 색은?","창조색. (색의 분류: 자연색·인공색·창조색)"],
["카츠의 색 분류 중 '면색'이란?","하늘색처럼 외부 조건의 영향 없이 색 자체만 지각되는 가장 순수한 색. 표면색·공간색과 구분된다."],
["조형 원리 9가지는?","균형, 비례, 조화, 통일, 변화, 대비, 강조, 율동, 동세(운동감)."],
["균형의 두 종류와 대칭의 세 종류는?","대칭 균형과 비대칭 균형. 대칭에는 좌우대칭, 방사대칭, 역대칭이 있다."],
["콩테는 무엇으로 만드는가?","안료에 밀랍과 기름을 섞어 굳혀 만든다."],
["목탄 소묘에서 종이를 원추형으로 감아 문지르기·그라데이션에 쓰는 도구는?","찰필."],
["해칭(선영법)의 종류 세 가지는?","평행 해칭, 교차 해칭(크로스 해칭), 윤곽 해칭."],
["물감의 구성 요소는?","안료, 바인더(고착제), 전색제(용제)."],
["바인더의 역할은?","안료 입자들을 결합하고 그림 표면에 부착·고착시킨다."],
["불투명 수채화의 특징과 방법은?","두터운 덧칠과 스크래치 효과를 낼 수 있고, 흰색으로 명도를 조절하며 어두운 색부터 채색한다. 방법은 ①투명 수채 물감에 물을 적게 사용 ②포스터 물감 ③과슈(석회 등 백색 안료가 섞임) 세 가지."],
["포스터컬러의 사용 목적과 장점은?","인쇄 전에 정확한 색을 확인·재현하기 위해 사용한다. 균일하고 선명한 색면 표현이 가능하다."],
["포스터컬러의 단점은?","자외선에 약해 빛바램이 생기고, 유화의 중후한 느낌이나 수채의 맑은 효과를 내기 어려우며 내구성이 떨어진다."],
["좋은 포스터컬러의 조건은?","입자가 고울 것, 독성이 없을 것, 칠했을 때와 말랐을 때 색이 같을 것, 불투명·은폐력·접착력이 좋을 것."],
["포스터컬러를 오래 보관하는 방법은?","알코올을 부어 두고, 사용 후 즉시 뚜껑을 닫으며, 장기 보관 시 미디엄을 첨가한다."],
["아크릴 물감 사용 시 유의점은?","제작 장소의 온도가 10도 이상이어야 한다. 건조가 빨라 붓과 팔레트를 굳기 전에 관리해야 한다."],
["파스텔은 무엇으로 만드는가?","안료를 백악(석회) 가루와 아라비아고무로 굳혀 만든다. 소프트 파스텔은 크레파스·콩테와 달리 밀랍 성분이 없다."],
["파스텔의 장점은?","문질러 부드러운 그라데이션을 낼 수 있고, 은은한 색조 표현이 가능하며, 준비 과정이 간단해 즉흥적인 표현에 적합하다."],
["파스텔의 단점은?","혼색이 어려워 다양한 색상이 필요하고, 정착액을 뿌려 보관해야 하며, 고착력이 약해 요철이 있는 전용지를 써야 한다."],
["적수법과 중채법의 차이는?","적수법은 먹·물감을 칠한 위에 물을 떨어뜨려 번지게 하는 기법. 중채법은 마른 뒤 물감을 층층이 쌓아 올려 겹쳐 칠하는 기법."],
["데포르마시옹이란?","대상의 형태를 과장·생략·변형·왜곡하여 표현하는 것."],
["동양화 튜브 물감(채)의 단점은?","물에 잘 녹지 않는 아교 대신 수용성이 높은 수지가 들어 있어 배접할 때 번지기 쉽다."],
["백묘법·구륵법·몰골법을 각각 설명하시오.","백묘법: 채색 없이 윤곽선만으로 형태를 표현. 구륵법: 윤곽선을 그린 뒤 그 안을 채색. 몰골법: 윤곽선 없이 먹과 색의 농담만으로 형태를 표현."],
["붓대를 완전히 눕혀 붓의 측면으로 표현하는 필법은?","와봉."],
["판화 서명 순서와 필기구는?","일련번호/총매수 → 제목 → 작가 서명 → 제작 연도. 반드시 연필로 서명한다."],
["우드컷과 우드 인그레이빙의 재료는?","우드컷은 널목판, 우드 인그레이빙은 눈목판(마구리판)."],
["널목판과 눈목판의 특징은?","널목판은 무르고 나뭇결이 있어 잘 파이며 대담한 칼자국 표현에 좋다. 눈목판은 크기가 작지만 단단하고 나뭇결의 영향을 받지 않아 섬세한 표현에 적합하다."],
["오목판화의 구분과 장단점은?","직접법(드라이포인트·인그레이빙·메조틴트 등)과 간접법(부식)으로 나뉜다. 장점은 정교하고 섬세한 표현과 풍부한 톤, 단점은 비용이 많이 들고 제작 과정이 복잡한 것."],
["사진 인쇄에 쓰이는 오목판 인쇄 방식은?","그라비어 인쇄. (옵셋은 평판 인쇄)"],
["부식을 이용한 오목판화의 종류는?","에칭, 아쿠아틴트, 포토에칭. (리프트 그라운드, 소프트 그라운드 등도 부식 기법)"],
["포토에칭의 과정은?","포지티브 필름 제작 → 암실에서 판에 감광액 도포·건조 → 필름과 판을 밀착해 노광 → 현상액에 담가 현상 → 물로 잔여물 세척 → 부식 → 인킹 후 닦아내기 → 동판 프레스로 찍어 완성."],
["포토에칭 노광 시 떨어져 나가는 부분은?","포지티브 필름을 쓰므로 빛을 받은 부분은 경화되어 남고, 빛을 받지 못한 부분이 현상 과정에서 씻겨 나간다."],
["평판화의 3대 특징은?","물과 기름이 서로 반발하는 발수 원리를 이용한다. 드로잉 재료의 느낌을 살릴 수 있어 판화 중 회화적 효과가 가장 강하다. 요철 없이도 섬세한 표현이 가능하다."],
["콜로타이프는 어떤 필름을 쓰는가?","네거티브 필름."],
["콜로타이프에서 젤라틴의 역할은?","사진의 톤 변화에 따라 감광 정도가 달라진 젤라틴 막이 잉크의 양을 선택적으로 받아들여 섬세한 톤 변화를 낸다. 감광되지 않은 부분은 글리세린을 흡수한다."],
["콜로타이프를 확대하면 무엇이 보이는가?","그물 모양의 거친 패턴이 보인다."],
["예술적 실크스크린을 무엇이라 부르는가?","세리그래피."],
["실크스크린 탈막 시 이미지 부분의 감광액이 제거되지 않는 원인은?","차가운 물로 너무 약하게 분사한 경우, 탈막 전 자외선 등 빛에 오래 노출된 경우, 과도하게 노광한 경우."],
["조소(소조)의 조형적 특성 네 가지는?","입체성, 공간성, 가촉성, 보존성."],
["합성수지의 종류는?","폴리에스테르, 에폭시, 실리콘, 알지네이트."],
["모빌의 특성은?","칼더가 제작한 움직이는 조각으로, 조각에 시간성을 도입했다."],
["모빌의 혁신성 네 가지는?","운동감과 시간성 도입, 얇은 면재 사용으로 양감 최소화, 좌대 없이 공중에 매다는 방식, 선명한 색채."],
["스타빌이란? 명칭은 누가 붙였는가?","칼더 후기의 정지된 조각으로, 강철로 제작해 공공장소에 설치하고 사람이 그 아래를 지나다닐 수 있다. 공공조각·환경조각에 속한다. 명칭은 아르프가 붙였다."],
["입체파·다다이즘·네오다다의 오브제 사용 목적은?","입체파: 분석적 큐비즘의 지나친 해체로 잃은 형상성·현실성을 회복하기 위해 실재하는 물질을 직접 화면에 부착. 다다이즘: 반문명·반예술의 입장에서 기존 예술을 전면 부정하기 위해 사용. 네오다다: 현실과 예술의 경계를 타파하고 소재의 새로움을 탐구하기 위해 사용."],
["신사실주의와 팝아트의 오브제 사용은?","현실과 미술의 거리를 좁히고 대중문화를 그대로 끌어들였다. 네오다다·신사실주의·팝아트를 묶어, 현대 물질 사회의 단면을 드러내기 위해 일상적 오브제와 폐품을 사용했다고 정리한다."],
["전통 청동 주조(중공식)의 과정은?","점토로 대략적인 원형 제작 → 밀랍(과 소기름)을 씌워 세부 조각 → 그 위에 흙을 붙여 외형 제작 → 형지 꽂기 → 가열해 밀랍을 녹여 뺌 → 녹인 청동 주입 → 굳으면 외형 제거, 형지 뽑고 내부 점토 제거."],
["디자인의 조건 네 가지는?","합목적성, 심미성, 경제성, 독창성."],
["미술공예운동의 성과는?","미술과 공예를 융합해 공예가의 지위를 예술가 수준으로 격상시켰고, 기능성과 심미성의 조화로 아르누보에 영향을 주었으며, 최초의 디자인 품질 회복 운동으로 근대 디자인 개념의 출발점이 되었다."],
["미술공예운동의 한계는?","지나친 수공예 강조로 생산성·경제성이 기계 제품을 따라가지 못했고, 가격이 높아 소수 상류층을 위한 사치품에 머물렀으며, 과거를 모방한 절충 양식에 그쳤다."],
["아르누보의 성과는?","자연 모티브를 산업 사회에 적합한 순수 조형 요소로 재탄생시켰고, 철·유리·콘크리트 등 신재료 실험으로 산업적 활용 가능성을 모색했으며, 유럽 전역과 미국까지 확산되어 하나의 양식으로 자리 잡았다."],
["아르누보의 한계는?","지나치게 개인적·수공예적 경향으로 기계 생산에 대응하지 못했고, 견고한 구축성과 기능적 요소가 결여되어 대중화에 성공하지 못했다. 곡선 위주의 장식이 후기로 갈수록 복잡해져 실용성이 떨어졌다."],
["아르누보의 각국 명칭은?","영국·미국: 모던 스타일. 독일: 유겐트 스틸. 오스트리아: 제체시온(빈 분리파). 이탈리아: 스틸레 리베르티(리버티 양식)."],
["매킨토시가 자포니즘에서 받은 영향은?","일본 인테리어 특유의 격자 구조, 그리고 단순함의 미학."],
["빈 분리파의 등장 배경과 특징은?","기존 빈 미술가연맹 화단의 고루함에 반발해 분리·창립했다. 아르누보 양식을 적극 수용하고, 순수미술과 응용미술을 통합해 미술과 생활을 잇는 총체예술을 추구했으며, 빈 공방을 설립했다. 후기로 갈수록 곡선을 배제하고 직선적·반복적·기하학적 패턴을 강조했다."],
["독일공작연맹이 대두한 이유는?","산업 제품의 질 하락으로 공업과 예술의 결합에 대한 사회적 요구가 커졌기 때문. 규격화·표준화를 통한 품질 향상을 꾀했다."],
["바우하우스의 의의는?","기능적이고 합목적적인 새로운 미의 기준을 제시해 현대 기능주의 디자인의 토대를 마련했고, 건축을 중심으로 공업과 미술을 통합해 미술의 대중화에 기여했다."],
["유럽 기능주의와 미국 기능주의의 명칭은?","유럽은 국제 양식, 미국은 모던 스타일."],
["국제 양식의 특징은?","직육면체 구성, 큰 유리창, 장식 없는 벽면, 강철로 된 상자 모양의 건축. 철강·콘크리트 등 산업 재료를 사용한다."],
["스칸디나비아 모던 디자인의 특징은?","밝은 빛깔의 목재와 깨끗한 선, 간결하면서도 조각적인 형태, 단순미와 자연미. 자작나무·밤나무·티크·가죽 등 자연 소재를 인공 소재와 함께 사용한다."],
["이탈리아 벨 디자인의 특징은?","알레산드로 멘디니가 대표. 굿 디자인 개념에 반발해 아름다운 디자인을 표방했고, 제품을 단순한 실용품이 아니라 인간의 감성을 자극하는 예술적 오브제로 인식시켰다. 플라스틱·합성수지를 활용해 자유로운 성형과 현란한 색상을 강조했으며, 프루스트 의자처럼 패러디(리디자인) 기법을 사용했다."],
["인더스트리얼 스타일 또는 매트 블랙으로 알려진, 1970년대 초 건축에서 시작된 미국·영국의 양식은?","하이테크."],
["멤피스 그룹의 창시자는?","에토레 소트사스."],
["멤피스 그룹의 특징은?","기하학적 형태, 키치하고 아이러니한 이미지, 선명한 색상, 플라스틱 라미네이트 등 새로운 재료 사용. 과거와 현재를 다양하게 융합했고 반기능주의를 표방했다."],
["색의 3요소는?","색상, 명도, 채도."],
["채도란?","색의 맑고 순수한 정도."],
["혼합의 종류는?","가산혼합, 감산혼합, 중간혼합(병치혼합·회전혼합)."],
["중간혼합의 정의는?","색을 직접 섞는 것이 아니라 망막상의 잔상에 의해 색이 섞인 것처럼 보이는 현상."],
["색채 대비는 크게 어떻게 나뉘는가?","동시대비와 계시대비(연속대비)."],
["색상대비란?","보색 잔상이 다른 색에 영향을 주어 서로의 색상이 다르게 느껴지는 현상."],
["한색은 더 차갑게, 난색은 더 따뜻하게 느껴지는 대비는?","한난대비."],
["동일한 톤을 원칙으로 인접·유사 색상 범위 내에서 색상을 다르게 선택하는 배색은?","톤 인 톤 배색."],
["색상과 톤이 약간의 변화를 가진 배색으로, 다른 소재를 조합할 때 생기는 미묘한 색 효과를 뜻하는 것은?","포카마이유 배색."],
["시선을 끄는 힘이 커서 눈에 빨리 띄는 성질은?","주목성."],
["명시성이란? 명시성이 가장 높은 배색은?","두 색을 배색했을 때 멀리서도 명확하게 구분되는 정도. 검정과 노랑의 배색이 가장 높다."],
["애브니 효과란? 영향을 거의 받지 않는 색은?","같은 색상이라도 채도가 변함에 따라 색상이 다르게 보이는 현상. 중성 색상 계열은 거의 영향을 받지 않는다."],
["빛의 강도 변화에 따라 색이 다르게 보이는 현상은? 불변색은?","베졸트-브뤼케 현상. 불변색은 파랑, 노랑, 초록."],
["색상 차가 커도 명도 차가 작으면 색의 차이가 쉽게 인식되지 않는 현상은?","리프만 효과."],
["슈브뢸 색채조화론의 다섯 가지는?","인접색의 조화, 주조색(도미넌트 컬러)의 조화, 반대색의 조화, 근접 보색의 조화, 등간격 3색의 조화."],
["주조색의 조화란?","전체적으로 하나의 주된 색을 사용하면 조화롭다는 원리."],
["오스트발트 24색상환은 어떻게 구성되는가?","빨강·노랑·초록·파랑의 4원색에 사이색인 주황·연두·청록·보라를 더한 8색을 원으로 배열하고, 각각을 3분할하여 24색상으로 만든다."],
["오스트발트 색체계의 구성 요소는?","순색량, 백색량, 흑색량. 세 양의 합은 항상 100이다."],
["색입체 수직축과 평행한 선상의 색은 순도가 같아 조화를 이룬다는 원리는?","등순계열의 조화."],
["파버 비렌 색채조화론의 구성 요소는?","순색, 흰색, 검정을 기본으로 톤, 틴트(밝은 색조), 셰이드(어두운 색조), 그레이가 구성된다."],
["보색으로 배색할 때 기준색의 보색 양쪽에 가까운 색을 쓰면 조화를 이룬다는 배색은?","분열 보색 배색."],
["24색상환에서 색상차 6~8 이내의 색은 조화를 이룬다는 오스트발트의 조화는?","이색조화."],
["오스트발트 색입체의 단점은?","종단면도상 같은 기호로 마주 보는 색이라도 색상에 따라 명도·채도의 감각이 같지 않아 명도 구분이 모호하다."],
["맥컬로 효과란?","뇌가 대상물의 방향을 인지하는 과정에서 일어나는 보색 잔상 현상. 가로 빨강·세로 초록 격자를 본 뒤 흑백 격자를 보면 방향에 따라 보색 잔상이 나타난다."],
["가산혼합과 감산혼합의 3원색은? 가산혼합의 3색을 모두 합치면?","가산혼합은 R·G·B, 감산혼합은 C·M·Y. 가산혼합 3색을 모두 합치면 흰색이 된다."]
];
function APP(){
 const $=s=>document.querySelector(s),app=$("#app");
 let st=[];try{st=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
 const fb=t=>{const x=document.createElement("textarea");x.value=t;document.body.append(x);x.select();try{document.execCommand("copy")}catch(e){}x.remove()};
 app.innerHTML='<div class="bar"><label><input type="checkbox" id="f"> 틀린 것만</label><button id="e">오답 내보내기</button><button id="c">번호 복사</button><span id="n"></span></div>'
 +QA.map((q,i)=>'<details data-i="'+i+'"><summary>'+(i+1)+". "+q[0]+'</summary><p>'+q[1]+'</p><label class="w"><input type="checkbox" class="x"> 틀림</label></details>').join("");
 const it=[...app.querySelectorAll("details")];
 const draw=()=>{it.forEach((d,i)=>{const on=st.includes(i);d.querySelector(".x").checked=on;d.classList.toggle("m",on);d.hidden=$("#f").checked&&!on});$("#n").textContent=st.length+" / "+QA.length};
 app.addEventListener("change",e=>{const t=e.target;if(t.classList.contains("x")){const i=+t.closest("details").dataset.i;st=t.checked?st.concat(i):st.filter(v=>v!==i);st.sort((a,b)=>a-b);save()}draw()});
 $("#e").onclick=()=>{const h='<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+KEY+'-wrong</title>'+document.querySelector("style").outerHTML+'<h1>'+KEY+' 오답</h1><div id="app"></div><script>const KEY="'+KEY+'-wrong";const QA='+JSON.stringify(st.map(i=>QA[i]))+";("+APP+")()<\/script>";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));a.download=KEY+"-wrong.html";a.click()};
 $("#c").onclick=()=>{const t=st.map(i=>i+1).join(",");(navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>fb(t)))||fb(t)};
 draw();
}
APP();
</script>
