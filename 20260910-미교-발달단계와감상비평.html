<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0910 미교 발달단계와 감상비평</title>
<script>const KEY="0910-미교-발달단계와감상비평";
/*Q*/const QA=[
["아동미술을 보는 네 가지 관점은?","발생반복설, 인지발달 관점, 지각발달 관점, 개성표현(정서표현) 관점."],
["인지발달 관점의 내용과 대표 학자는?","아동은 '아는 것'을 그린다. 인지·지능이 발달하면 그림 실력도 저절로 발달하므로 그림을 지능 발달의 척도로 봄.\n학자: 로웬펠드, 굿이너프, 해리스"],
["지각발달 관점의 내용과 대표 학자는?","아동은 '본 것'을 그린다. 성장하면서 지각이 분화되어 전체에서 세부로, 점점 더 자세히 묘사하게 됨.\n학자: 맥피, 아른하임"],
["맥피의 지각-묘사 이론에서 미술활동에 영향을 미치는 네 요인은?","어린이의 준비도, (심리적) 작업 환경, 정보처리 능력, 묘사하는 기능."],
["어린이의 신체적·지각적 발달은 맥피의 네 요인 중 어디에 속하는가?","어린이의 준비도."],
["게슈탈트 집단화의 법칙에는 무엇이 있는가?","유사성, 근접성, 완결성(폐쇄성), 연속성, 공동운명."],
["게슈탈트의 형과 바탕의 법칙이란?","관심의 초점에 따라 물체의 모양으로 보이는 부분을 형(전경)으로 인지하고, 그 외의 부분을 배경(바탕)으로 파악하는 것."],
["게슈탈트의 친숙성의 법칙이란?","불완전한 형태를 자신이 이미 알고 있는 익숙한 형태와 연관시켜 이해하려는 경향."],
["로웬펠드 결정기의 세 유형은?","시각형, 촉각형, 중간형."],
["로웬펠드 결정기의 특징은?","비판적 안목이 생겨 주관적 표현이 이루어짐. 투시·원근법적 표현으로 완전한 사실적 표현이 가능해지고 추상 표현도 나타남. 세 유형으로 완전히 분화됨."],
["결정기 입체표현에서 시각형과 촉각형의 방법 차이는?","시각형: 분석적 방법. 전체에서 세부로 나아감.\n촉각형: 종합적 방법. 부분을 만든 뒤 전체로 결합함."],
["버트의 억제기 특징은?","사물을 본 대로 표현하지 못해 자신의 그림에 실망하고 흥미를 잃는 시기. 언어를 매개로 한 표현에 관심이 커지며, 인물 표현이 드물고 형식적인 디자인을 선호함."],
["리드의 예술적 부활기 특징은?","소수만이 다시 예술적 표현에 도달함. 성별에 따라 유형을 구분하여 여성은 섬세한 선·풍부한 색채·장식적 표현, 남성은 기술적·기계적 표현이 나타난다고 봄."],
["예술적 부활기에서 리드와 로웬펠드의 차이는?","리드: 성별에 따라 표현 특징을 구분하고, 대부분은 억제기에 머물러 소수만 도달 가능하다고 봄.\n로웬펠드: 기질(시각형·촉각형)에 따라 구분하고, 누구나 도달할 수 있다고 봄."],
["버크하트 발달 유형 구분의 의의는?","처음으로 아동의 그림(표현 특징)을 인성적 특성과 연결하여 제시함."],
["버크하트 자의적(자발적) 유형의 인성·작품 특징은?","인성: 권위에 반항적, 창의적, 확산적, 자유로움.\n작품: 추상적, 복잡한 구도, 개성적이고 다양한 형태와 색채 사용."],
["버크하트 숙고형의 인성·작품 특징은?","인성: 교사에게 순응적, 자기부정적.\n작품: 사실적 묘사, 설명적, 날카롭고 매끈한 윤곽선, 세부를 단순·반복적으로 처리, 단순한 구도."],
["루켄스 3주기(침체기)의 특징은?","감상 능력이 표현 능력보다 앞서 발달하여 스스로 표현 능력의 부족을 인식함. 그림에 대한 즐거움이 줄고 표현은 쇠퇴하며 고원 현상을 겪음. 글쓰기 능력은 신장하나 묘사력은 침체함."],
["파슨스의 미적 발달 5단계는?","편애 - 미와 사실성 - 표현성 - 양식과 형식 - 자율성."],
["파슨스 '미와 사실성' 단계의 특징은?","사실적으로 잘 그린 그림이 가장 좋은 그림이라고 생각하는 단계."],
["파슨스 '표현성' 단계의 특징은?","작품에 담긴 감정을 읽을 수 있게 되며, 감정 표현이 잘 된 그림일수록 좋은 그림이라고 생각하는 단계."],
["허위츠와 데이가 제시한 마지막 단계는?","전사춘기."],
["전사춘기 아동에 대한 교사의 역할은?","자신감을 심어 주고, 아동의 지각과 인식에 맞는 다양한 조형 능력을 육성시켜 주는 것."],
["하그리브스와 겔튼 단계 중 가장 높은 단계는?","후인지기."],
["리드의 유형 중 외부 대상에 감정이입을 잘하고 고립된 대상보다 집단적 대상을 선호하는 유형은?","유기형."],
["리드의 유형 중 전체적 분위기에 구애받지 않고 전적으로 대상에만 의거하여 표현하는 유형은?","열거형."],
["색채 지각을 기준으로 유형을 나눈 학자와 '객관형'의 특징은?","볼로. 객관형은 정서나 감정에 좌우되지 않고 오로지 지적인 측면에서 이해를 추구함."],
["볼로의 유형 중 특정 색채에 대한 편파적 표현을 싫어하고 색에 대한 이해와 인식의 범위가 넓은 유형은?","성격형."],
["펠드먼의 비평 명칭과 단계는?","비평적 담화. 기술 - 분석 - 해석 - 판단."],
["펠드먼의 기술 단계에서 다루는 내용은?","작가, 작품명, 크기, 재료 등 눈에 보이는 외형적 요소를 조사함."],
["펠드먼의 분석 단계에서 다루는 내용은?","조형 요소와 원리 등 작품의 형식적·미적 특성을 분석함."],
["펠드먼과 앤더슨의 판단 단계 차이는?","펠드먼: 개인적 판단보다 형식주의·도구주의·표현주의 등 예술철학에 기반한 객관성을 요구.\n앤더슨: 개인적 반응과 맥락적 요소를 포함하여 판단."],
["펠드먼 비평의 장점과 단점은?","장점: 단계적·순차적이어서 학교 현장에서 쉽게 적용 가능하고 별도 자료 준비 부담이 적음.\n단점: 학습자 개인의 반응을 무시해 다의적 해석이 어렵고, 맥락적 측면을 간과하며 비순환적 사고를 유도함."],
["앤더슨이 제시한 비평 모형의 명칭과 단계는?","교육적 미술비평. 반응 - 기술 - 해석 - 판단."],
["앤더슨의 기술 단계는 어떻게 나뉘는가?","형식적 조사: 조형 요소와 원리, 기법, 재료와 매체 등.\n맥락적 조사: 작가가 누구인지, 작가의 의도, 제작 배경과 시기, 영향 관계 등."],
["앤더슨의 해석 단계에서 할 수 있는 질문 예시는?","이 작품에 제목을 새로 붙인다면 무엇이라 하겠는가? 작품 속 인물이 된다면 어떤 생각을 하겠는가?"],
["앤더슨의 판단은 어떤 기준으로 이루어지는가?","개인적 경험에 관한 판단, 미학적 판단, 맥락적 판단, 최종 판단."],
["앤더슨의 최종 판단 단계에서 할 수 있는 질문은?","이 작품이 여러분을 감동시키고 행동을 변화시킬 힘이 있는가? 긍정적으로 검토할 가치가 있는가? 작가의 의도가 잘 드러나는가?"],
["브라우디가 제시한 비평의 명칭과 단계는?","미적 주사(심미적 검색). 감각적 특성 - 형식적 특성 - 기술적 특성 - 표현적 특성 조사."],
["브라우디에서 작품의 가치 평가는 언제 이루어지는가?","최종적인 가치 평가는 앞 단계에서 정서적 내용을 충분히 얻기 전까지 유보되어야 함."],
["펠드먼과 브라우디의 공통점은?","둘 다 형식적 측면에 초점을 두고, 순차적 단계로 진행되며, 작품에 대한 가치 판단을 최대한 뒤로 미룸."],
["펠드먼과 브라우디의 기술(기술적 특성) 단계 차이는?","펠드먼: 작가·작품명·크기·재료 등 눈에 바로 보이는 외형적 요소.\n브라우디: 재료와 도구를 사용해 나타낸 방법·효과·특질(스케치인지 판으로 찍은 것인지 등)."],
["게이건의 비평적 탐구 단계는?","문제 인식 - 문제 명확화 - 가설 설정 - 결과 추론 - 가설 검증 - 적용."],
["게이건에서 가설 검증에 실패하면 어떻게 하는가?","가설 설정 단계로 돌아가 가설을 다시 세운다."],
["게이건이 제시한 세 가지 교육적 활동은?","개인적 반응 활동, 개념과 기능 개발 활동, 학생 연구 활동."],
["게이건의 학생 연구 활동이란?","검증을 위해 작품에 관한 여러 정보와 자료를 수집·활용하는 활동. 작품의 의미와 가치를 이해하고 판단하는 데 필요한 개념적 지식, 기능, 작가 지식, 맥락적 지식 등을 연구하고 획득함."],
["학생 연구 활동에서 교사의 역할은?","직접 답을 주기보다 프로젝트 학습을 통해 학생이 스스로 지식을 획득하도록 유도하고, 도서관 등을 활용해 관련 문제를 공동으로 탐색하도록 안내함."],
["아레나스 대화중심 감상법의 과정 3단계는?","수용 - 교류 - 통합."],
["VTS의 구성 요소 여섯 가지는?","조용히 바라보기, 세 가지 개방적 질문, 촉진, 그룹 토의, 주제, 마무리."],
["VTS의 세 가지 개방적 질문은?","이 작품에서 무슨 일이 일어나고 있나요? / 무엇을 보고 그렇게 말했나요? / 또 무엇을 발견할 수 있나요?"],
["VTS 세 질문의 확산적·수렴적 구분은?","확산적: '무슨 일이 일어나고 있나요?', '또 무엇을 더 찾을 수 있나요?'\n수렴적: '무엇을 보고 그렇게 말했나요?'"],
["VTS에서 촉진의 방법에는 무엇이 있는가?","가리키기, 바꿔 말하기, 연결하기."],
["VTS에서 학생에게 요구되는 다섯 가지는?","작품을 주의 깊게 관찰할 것, 관찰한 것에 대하여 말할 것, 자신의 생각을 근거를 들어 뒷받침할 것, 타인의 관점을 듣고 고려할 것, 여러 가지 해석들에 대해 토론할 것."],
["하인의 박물관 교육에서 '발견' 영역의 전시 특징은?","전시 구성물 사이를 오가며 탐구할 수 있는 전시 형태. 다양한 수준의 능동적 학습이 가능하고, 방문자에게 질문하고 스스로 해답을 찾게 하는 라벨과 패널을 제공하며, 각자 나름대로 해설할 수 있는 수단을 제공함."],
["하인의 '구성주의' 영역의 전시 특징은?","입구와 출구가 정해져 있지 않아 자유롭게 이동함. 자신의 인생과 경험을 활용할 수 있는 다양한 활동, 경험과 사물을 결합시켜 지식의 의미를 재구성하기, 실험하고 추측하기 등이 이루어짐."],
["하인의 '설명적·교훈적 교육학'은 어디에 초점을 두는가?","전적으로 주제(내용)에 초점을 둠."],
["하인의 '자극-반응 교육학'은 어디에 초점을 두는가?","교육 방법에 초점을 둠. 학생이 권위에 도전하거나 너무 많은 질문을 하도록 만들지 않기 때문에 권위적인 교육자들이 선호하며, 세뇌 또는 교화라고도 불림."],
["하인의 '발견적 학습을 위한 교육학'에 필요한 조건은?","학습자에게 능동적 학습 여건이 마련되어 직접 체험할 수 있어야 함."],
["하인의 '구성주의를 위한 교육학'의 초점은?","학습자의 마음에 이미 존재하는 도식과 학습자의 지식 사이의 연결고리를 찾을 수 있는 환경을 만들어 주는 것."],
["미틀러의 감상·비평 단계는?","미적 결정짓기 - 내부 단서를 찾기 위한 관찰 - 외부 단서를 찾기 위한 관찰 - 최종 결정 내리기."]
];/*E*/</script>

<div id="list"></div>
<script>
let C=[];try{C=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const S=()=>{try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}};
const W=()=>QA.map((_,i)=>C[i]?i+1:0).filter(Boolean);
const F=()=>{[...list.children].forEach((d,i)=>d.hidden=only.checked&&!C[i]);cnt.textContent=W().length+"/"+QA.length};
QA.forEach(([q,a],i)=>{const d=document.createElement("details");
d.innerHTML="<summary>"+(i+1)+". "+q+"</summary><p></p>";d.querySelector("p").textContent=a;
const l=document.createElement("label");l.className="w";l.innerHTML="<input type=checkbox> 틀림";
const c=l.firstChild;c.checked=!!C[i];d.classList.toggle("x",!!C[i]);
c.onchange=()=>{C[i]=c.checked;d.classList.toggle("x",c.checked);S();F()};
d.appendChild(l);list.appendChild(d)});
only.onchange=F;F();
ex.onclick=()=>{const w=QA.filter((_,i)=>C[i]);if(!w.length)return alert("체크된 문항이 없습니다.");
const h=list.innerHTML;list.innerHTML="";
const s="<!doctype html>"+document.documentElement.outerHTML.replace(/\/\*Q\*\/[\s\S]*?\/\*E\*\//,"/*Q*/const QA="+JSON.stringify(w)+";/*E*/").replace(KEY,KEY+"-wrong");
list.innerHTML=h;
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/html;charset=utf-8"}));a.download=KEY+"-wrong.html";a.click();URL.revokeObjectURL(a.href)};
cp.onclick=()=>{const n=W().join(",");const fb=()=>{const t=document.createElement("textarea");t.value=n;document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(e){}t.remove();alert(n||"없음")};
try{navigator.clipboard.writeText(n).then(()=>alert(n||"없음"),fb)}catch(e){fb()}};
</script></body></html>
