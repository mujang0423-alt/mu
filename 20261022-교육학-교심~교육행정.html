<script>const QA=[["와이너 귀인이론의 3차원?", "소재, 안정성, 통제 가능성"], ["실패를 무엇에 귀인해야 하나? 능력 부족에 귀인하면?", "노력(전략) 부족 / 학습된 무기력 형성"], ["코빙턴 자기가치이론의 학생 유형과, 자기장애 전략을 쓰는 유형?", "완숙지향형·실패회피형·실패수용형 / 실패회피형"], ["로저스의 실현 경향성과 타인의 역할?", "성장을 위한 투쟁·고통을 이겨 나가는 선천적 경향 / 무조건적 긍정적 관심으로 충분히 기능하는 인간이 되도록 함"], ["기대가치이론의 과제 가치 4가지?", "달성 가치, 내재 가치, 효용 가치, 비용"], ["스턴버그 분석적 지능의 요소?", "메타요소, 수행요소, 지식습득요소 (전통 IQ와 관련)"], ["스턴버그 경험적 지능과 통찰의 3과정?", "창의적 능력 — 신기성(통찰)·자동화 / 선택적 부호화·선택적 비교·선택적 결합"], ["강화계획 4가지와 가장 효과적인 것?", "고정간격(월급), 변동간격(쪽지시험), 고정비율, 변동비율 / 변동비율"], ["딕 & 캐리 모형 단계?", "교수목적 설정(요구분석) → 교수 분석 → 학습자·환경 분석 → 수행목표 진술 → 평가도구 개발 → 교수전략 개발 → 교수자료 개발 → 형성평가 → 프로그램 수정 → 총괄평가"], ["요구분석이란?", "바람직한 상태와 현재 상태의 차이를 분석해 근본 원인을 규명하고 해결방안을 찾는 것"], ["교수분석이 필요한 이유?", "성취목표·학습내용 확인, 계열화·조직화로 학습·파지 효율↑, 의사소통 원활, 교육비용 절감"], ["브루너 발견학습 요소 4가지와 요구상태(동기)의 적정 수준?", "학습태세, 요구상태, 관련 정보, 연습의 다양성 / 너무 높거나 낮지 않은 보통 수준 ※높을수록 X"], ["브루너 교수이론의 4요소?", "학습 경향성, 지식의 구조, 계열성, 강화"], ["라이겔루스 교수설계의 교수 조건?", "교과 목표, 교과 내용 특성, 학습자 특성, 제약 조건"], ["4C/ID 구성요소와 학습 과제 조건?", "학습 과제, 지원적 정보, 절차적 정보, 부분 과제 연습 / 실제성↑, 단순→복잡 순서 ※처음부터 복잡 X"], ["Big6 단계와 평가 대상?", "과제 정의 → 정보탐색 전략 → 소재 파악과 접근 → 정보 활용 → 종합 정리 → 평가 / 결과의 유효성, 과정의 효율성"], ["자원기반학습 처리 도구?", "차트, 스프레드시트, 워드프로세서, 인지맵 (탐색-검색엔진, 조작-시뮬레이션, 의사소통-이메일·게시판·메신저)"], ["토의법의 종류 7가지?", "원탁, 배심(패널), 공개(포럼), 대담, 단상(심포지엄), 세미나, 버즈"], ["지능지수가 높으면 창의성도 높다고 평정하는 오류?", "논리적 오류"], ["스크리븐 탈목표 평가의 장단점?", "장: 잠재적 결과까지 포함한 실제 효과 평가, 전문적 평가 중시\n단: 서로 다른 판단 증거로 내린 성과를 같게 볼 위험, 판단의 타당성을 평가할 방법이 없음 ※의사결정 정보 제공은 CIPP"], ["내재적 준거 vs 외재적 준거?", "내재적: 프로그램 자체의 기본 속성(목표·내용·조직 등)\n외재적: 실제 운영 성과·프로그램의 효과"], ["아이스너 교육비평의 3요소?", "기술(사실 그대로 생생히 묘사) → 해석(의미·중요성 설명) → 평가(교육적 가치 판단)"], ["CIPP 모형의 단점?", "의사결정 과정·방법이 불명확, 평가 대상의 가치는 판단하지 않음"], ["사회성 측정법 유의점?", "학급을 잘 아는 담임이 실시, 결과 비밀 유지, 선택·배척 기준을 밝힘, 부정적 기준 사용 지양"], ["실용도의 조건?", "실시·채점이 쉬움, 비용·시간·노력 절약, 해석·활용 용이"], ["신뢰도를 높이는 검사 관련 요인?", "문항 수 많게, 범위 좁게, 내용 고르게, 난이도 보통"], ["신뢰도와 타당도의 관계?", "신뢰도는 타당도의 필요조건 — 타당도가 높으면 신뢰도도 높지만, 신뢰도가 높다고 타당도가 높은 것은 아님"], ["호이·미스켈 학교풍토 — 교사·교장 행동과 풍토 유형?", "교사: 협동적·친밀적·일탈적 / 교장: 지원적·지시적·제한적\n유형: 개방·몰입·일탈·폐쇄"], ["몰입 풍토란?", "교사는 개방(높은 협동·친밀, 전문적 업무 수행), 교장은 폐쇄(비효과적 통제·업무 방해)"], ["핼핀·크로프트 — 자율적 풍토 vs 간섭적 풍토?", "자율적: 교장은 냉담하나 과업을 강조하지 않고, 교사가 자유롭게 업무·사회적 욕구 충족\n간섭적: 교장은 배려적이나 과업을 강조, 교사는 무관심·친밀성 낮음"], ["학교 관료제의 특성?", "분업과 전문화, 권한의 위계, 경력 지향성, 규칙과 규정, 몰인정성"], ["겟젤스·구바 사회과정모형의 두 차원과 이상적 상태?", "조직적: 제도-역할-역할기대 / 개인적: 개인-인성-욕구성향 / 역할기대와 욕구성향의 조화"], ["에치오니 조직 유형과 학교의 유형?", "강제·공리·규범 조직 / 규범 조직(사명감·신념 등 규범적 권력 → 도덕적 참여)"], ["민츠버그 전문적 관료제의 구성과 장점?", "핵심 운영층 + 기술의 표준화(교육·연수로 간접 통제) / 수평·수직적 분권화, 전문화↑·공식화↓ → 자율성·민주적 관계"], ["계선 조직 vs 참모 조직?", "계선: 수직적 명령 계통으로 업무를 직접 수행(1차)\n참모: 계선을 지원(기획·자문·협의)"], ["교육행정의 원리?", "효율성, 민주성, 합법성, 기회균등, 자주성, 안정성, 전문성 보장"]];</script>
<script id="app">
let W;try{W=new Set(JSON.parse(localStorage.getItem(KEY))||[])}catch(e){W=new Set}
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify([...W]))}catch(e){}},B=document.body,bar=document.createElement('div'),L=document.createElement('div');
bar.id='bar';bar.innerHTML='<label><input type=checkbox> 틀린 것만</label><button>오답 내보내기</button><button>번호 복사</button>';B.append(bar,L);
const[f,ex,cp]=bar.querySelectorAll('input,button'),F=()=>[...L.children].forEach((e,i)=>e.hidden=f.checked&&!W.has(i));
QA.forEach(([q,a],i)=>{const d=document.createElement('div');d.className='it';d.innerHTML=`<label><input type=checkbox> 틀림</label><details><summary>${i+1}. ${q}</summary><p>${a}</p></details>`;const c=d.querySelector('input');c.checked=W.has(i);c.onchange=()=>{c.checked?W.add(i):W.delete(i);sv();F()};L.append(d)});
f.onchange=F;
ex.onclick=()=>{const s=QA.filter((_,i)=>W.has(i));if(!s.length)return alert('체크된 문항이 없습니다');const h=`<script>const KEY=${JSON.stringify(KEY+'-wrong')};<\/script>\n<meta charset="utf-8"><title>${KEY}-wrong</title>${document.querySelector('style').outerHTML}<body><script>const QA=${JSON.stringify(s)};<\/script><script id="app">${document.getElementById('app').textContent}<\/script>`,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download=KEY+'-wrong.html';a.click()};
cp.onclick=()=>{const s=[...W].sort((a,b)=>a-b).map(i=>i+1).join(','),ok=()=>{cp.textContent='복사됨: '+(s||'없음');setTimeout(()=>cp.textContent='번호 복사',1500)},fb=()=>{const t=document.createElement('textarea');t.value=s;B.append(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove();ok()};try{navigator.clipboard.writeText(s).then(ok,fb)}catch(e){fb()}};
</script>
