["수원 화성의 축성 배경은?","정조의 왕권 강화, 방어 시설, 상업 진흥, 사도세자에 대한 효심"],

["구본웅 작품의 표현 특징은?","야수파·표현주의: 거친 붓터치, 일그러진 형태"],
["고유섭이 말한 한국 미의식의 특징 5가지는?","무기교의 기교, 무계획의 계획, 구수한 큰 맛, 고소한 작은 맛(단아함), 무관심성"],

["1950~70년대 미술의 특징은?","현대미술가협회 등장, 앵포르멜 확산, 모노크롬 등 추상회화 수용"],

["이응노의 60~70년대와 80년대 작품 경향은?","60~70년대: 문자추상\n80년대: 광주민주화운동 바탕, 화합을 강조한 춤추는 군상(군상 시리즈)"],

["탑을 생략하고 주 법당 앞 중정, 남쪽 문루, 동서 요사를 둔 조선 사찰 배치 형식은?","산지중정형 배치"],
["향교의 전학후묘 배치에서 앞과 뒤는?","앞: 교육 공간(명륜당)\n뒤: 제사 공간(대성전)"],
];
let W={};try{W=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const L=document.getElementById("list"),O=document.getElementById("only");
function R(){L.innerHTML=QA.map(([q,a],i)=>O.checked&&!W[i]?"":`<div class="q"><details><summary>${i+1}. ${q}</summary><div class="a">${a}</div></details><label><input type="checkbox" data-i="${i}"${W[i]?" checked":""}> 틀림</label></div>`).join("")}

O.onchange=R;R();
