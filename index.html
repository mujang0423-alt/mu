<!doctype html><meta charset=utf-8>
<title>복습 허브</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark}
body{max-width:820px;margin:0 auto;padding:12px 14px 60px;font:16px/1.7 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
h1{font-size:19px;margin:6px 0;display:flex;align-items:baseline;gap:10px}
h2{font-size:15px;margin:20px 0 4px;opacity:.85}
#dday{font-size:14px;color:#e56;font-weight:600}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid #8884;margin-bottom:8px}
button{font:inherit;padding:5px 10px;border:1px solid #8887;border-radius:7px;background:transparent;color:inherit;cursor:pointer}
button.on{background:#8883;font-weight:600}
ul{list-style:none;padding:0;margin:0}
li{border:1px solid #8884;border-radius:9px;padding:9px 11px;margin:7px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
li a{flex:1;min-width:55%;text-decoration:none;font-weight:600;color:inherit}
.tag{font-size:12px;border:1px solid #8886;border-radius:5px;padding:1px 6px;opacity:.8}
.w{font-size:13px;color:#e56;font-weight:600}
.n{font-size:12px;opacity:.55}
.old{color:#e90;font-weight:600;opacity:1}
details{border:1px solid #8884;border-radius:9px;padding:9px 11px;margin:9px 0}
summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:7px;border-bottom:1px dashed #8884;padding-bottom:6px}
.a{white-space:pre-wrap}
.src{font-size:12px;opacity:.6;margin:12px 0 2px}
#msg{font-size:13px;opacity:.7}
textarea{width:100%;height:200px;font:13px/1.6 ui-monospace,monospace;margin-top:10px;padding:8px;border:1px solid #8886;border-radius:8px;background:transparent;color:inherit}
</style>

<h1>복습 허브 <span id=dday></span></h1>

<div class=bar>
<button id=v0 class=on>최신순</button>
<button id=v1>주차별</button>
<button id=v2>과목별</button>
<button id=rl>새로고침</button>
</div>
<div class=bar>
<button id=go>전체 오답 모아보기</button>
<button id=rnd>랜덤 10문항</button>
<button id=txt>오답 텍스트</button>
<span id=msg>불러오는 중…</span>
</div>

<div id=list></div>
<div id=out></div>

<script>
const REPO="mujang0423-alt/mu", EXAM=[2026,11,28], DOFF=0;

/* ── 자동 인식 안 되는 파일 보정: "파일명(확장자 제외)":["과목","MMDD"] ──
   과목은 서미/한미/중미/미교/교육학 중 하나. 날짜 없으면 "" 로 두면 됨.
   앞으로는 파일명을 0901-서미-바로크.html 처럼 만들면 여기 안 적어도 됨. */
const FIX={
 "원명청":["중미","0828"],
 "미술용어":["미교","0829"],
 "미교론아동":["미교","0827"],
 "중미고대_교육심리":["중미","0827"],
 "0826-현대한미-교육평가":["한미",""],
 "0826-시각문화":["미교",""],
 "0825-이해중심":["미교",""],
 "0824-회화고려":["한미",""],
 "0824-교육과정":["교육학",""]
};

const SUBJ=[["서미",["서미","서양미술사"]],
            ["한미",["한미","한국미술사","고려","조선","삼국","고구려","백제","신라"]],
            ["중미",["중미","중국미술사","원명청","송대","당대"]],
            ["미교",["미교","미술교육론","미술용어","시각문화","감상","표현"]],
            ["교육학",["교육학","교육과정","교육평가","교육심리","교육사회","교육행정","교육"]]];
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const key=n=>n.replace(/\.html$/,"");
function mmdd(s){
  const m=s.match(/(\d{2})(\d{2})/);if(!m)return null;
  const y=new Date().getFullYear(), d=new Date(y,+m[1]-1,+m[2]);
  if(d-new Date()>60*864e5)d.setFullYear(y-1);
  return d;
}
function dateOf(n){
  const k=key(n), f=FIX[k];
  if(f&&f[1])return mmdd(f[1]);
  const m=k.match(/(\d{4})(\d{2})(\d{2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  const s=k.match(/(?:^|[^\d])(\d{4})(?:[^\d]|$)/);
  return s?mmdd(s[1]):null;
}
function subjOf(n){
  const k=key(n), f=FIX[k];
  if(f&&f[0])return f[0];
  const t=k.replace(/^qa-/,"").replace(/\d{4,8}/,"");
  for(const[s,al]of SUBJ)if(al.some(a=>t.includes(a)))return s;
  return "기타";
}
const wrongOf=n=>{try{const o=JSON.parse(localStorage.getItem(key(n)))||{};
  return Object.keys(o).filter(i=>o[i]).map(Number).sort((a,b)=>a-b)}catch(e){return[]}};
const visits=()=>{try{return JSON.parse(localStorage.getItem("hub-visit"))||{}}catch(e){return{}}};
function mark(n){try{const v=visits();v[n]=Date.now();localStorage.setItem("hub-visit",JSON.stringify(v))}catch(e){}}
const days=t=>Math.floor((Date.now()-t)/864e5);
const monday=d=>{const x=new Date(d),w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x};
const md=d=>(d.getMonth()+1)+"/"+d.getDate();

let files=[], view=0;

(function(){const t=new Date();t.setHours(0,0,0,0);
  const d=Math.round((new Date(EXAM[0],EXAM[1]-1,EXAM[2])-t)/864e5)-DOFF;
  dday.textContent=d>0?"D-"+d:d===0?"D-day":"D+"+(-d)})();

async function load(){
  msg.textContent="불러오는 중…";list.innerHTML="";out.innerHTML="";
  try{
    const j=await (await fetch("https://api.github.com/repos/"+REPO+"/contents/?t="+Date.now())).json();
    files=j.filter(f=>f.type==="file"&&/\.html$/i.test(f.name)&&!/^index/i.test(f.name))
           .map(f=>f.name).sort().reverse();
  }catch(e){msg.textContent="목록을 불러오지 못했어요";return}
  render();
}

function row(n){
  const w=wrongOf(n), v=visits()[n], d=(v==null)?null:days(v);
  return "<li><a href='"+encodeURIComponent(n)+"' data-f=\""+esc(n)+"\">"
    +esc(key(n))+"</a><span class=tag>"+subjOf(n)+"</span>"
    +(w.length?"<span class=w>오답 "+w.length+"</span>":"")
    +"<span class='n"+(d===null||d>=7?" old":"")+"'>"
    +(d===null?"미복습":d===0?"오늘":d+"일 전")+"</span></li>";
}

function render(){
  let h="", tot=0;
  files.forEach(n=>tot+=wrongOf(n).length);
  if(view===0){ h="<ul>"+files.map(row).join("")+"</ul>"; }
  else if(view===1){
    const g={};
    files.forEach(n=>{const d=dateOf(n);const k=d?monday(d).getTime():0;(g[k]=g[k]||[]).push(n)});
    h=Object.keys(g).sort((a,b)=>b-a).map(k=>{
      const m=new Date(+k), e=new Date(+k+6*864e5);
      return "<h2>"+(+k?md(m)+" ~ "+md(e):"날짜 없음")+" ("+g[k].length+")</h2><ul>"+g[k].map(row).join("")+"</ul>";
    }).join("");
  } else {
    const order=SUBJ.map(s=>s[0]).concat("기타"), g={};
    files.forEach(n=>{const s=subjOf(n);(g[s]=g[s]||[]).push(n)});
    h=order.filter(s=>g[s]).map(s=>"<h2>"+s+" ("+g[s].length+")</h2><ul>"+g[s].map(row).join("")+"</ul>").join("");
  }
  list.innerHTML=h;
  msg.textContent=files.length+"개 파일 / 오답 "+tot+"문항";
}

list.onclick=e=>{const a=e.target.closest("a[data-f]");if(a)mark(a.dataset.f)};

async function parse(n){
  const t=await (await fetch(encodeURIComponent(n)+"?t="+Date.now())).text();
  const m=t.match(/const QA=(\[[\s\S]*?\n\]);/);
  if(m){try{return JSON.parse(m[1])}catch(e){}}
  const d=new DOMParser().parseFromString(t,"text/html");
  return [...d.querySelectorAll("details")].map(x=>[
    (x.querySelector("summary")?.textContent||"").replace(/^\s*\d+\.\s*/,"").trim(),
    (x.querySelector(".a")?.textContent||"").trim()]);
}

async function collect(){
  const r=[];
  for(const n of files){
    const w=wrongOf(n);if(!w.length)continue;
    let qa=[];try{qa=await parse(n)}catch(e){continue}
    r.push([n,w.filter(i=>qa[i]).map(i=>[i+1,qa[i][0],qa[i][1]])]);
  }
  return r;
}

const busy=(b,t,f)=>{b.disabled=f;b.textContent=t};

go.onclick=async()=>{
  busy(go,"모으는 중…",1);out.innerHTML="";
  const r=await collect();
  const tot=r.reduce((s,x)=>s+x[1].length,0);
  out.innerHTML=tot?"<h2>전체 오답 "+tot+"문항</h2>"+r.map(function(x){
    const n=x[0],qs=x[1];
    return "<div class=src>"+esc(key(n))+" · 번호 "+qs.map(q=>q[0]).join(",")+"</div>"
    +qs.map(q=>"<details><summary>"+q[0]+". "+esc(q[1])+"</summary><div class=a>"+esc(q[2])+"</div></details>").join("");
  }).join(""):"<p id=msg>체크된 오답이 없어요. 각 파일에서 '틀림'을 체크한 뒤 다시 눌러주세요.</p>";
  busy(go,"전체 오답 모아보기",0);
};

txt.onclick=async()=>{
  busy(txt,"뽑는 중…",1);out.innerHTML="";
  const r=await collect();
  const s=r.map(function(x){
    const n=x[0],qs=x[1];
    return key(n)+" 오답: "+qs.map(q=>q[0]).join(",")+"\n\n"
      +qs.map(q=>q[0]+". "+q[1]+"\n"+q[2]).join("\n\n");
  }).join("\n\n———\n\n");
  out.innerHTML="<textarea readonly onclick=this.select()>"+esc(s||"체크된 오답이 없어요.")+"</textarea>";
  busy(txt,"오답 텍스트",0);
};

rnd.onclick=async()=>{
  busy(rnd,"뽑는 중…",1);out.innerHTML="";
  const pool=[];
  for(const n of files){let qa=[];try{qa=await parse(n)}catch(e){continue}
    qa.forEach((x,i)=>pool.push([key(n),i+1,x[0],x[1]]))}
  pool.sort(()=>Math.random()-.5);
  const p=pool.slice(0,10);
  out.innerHTML=p.length?"<h2>랜덤 "+p.length+"문항</h2>"+p.map(q=>
    "<details><summary>"+esc(q[2])+"</summary><div class=a>"+esc(q[3])
    +"</div><div class=src>"+esc(q[0])+" · "+q[1]+"번</div></details>").join(""):"<p id=msg>문항이 없어요.</p>";
  busy(rnd,"랜덤 10문항",0);
};

[v0,v1,v2].forEach((b,i)=>b.onclick=()=>{view=i;[v0,v1,v2].forEach((x,j)=>x.className=i===j?"on":"");render()});
rl.onclick=load;load();
</script>
