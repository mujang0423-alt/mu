<!doctype html><meta charset=utf-8>
<title>복습 허브</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark}
body{max-width:820px;margin:0 auto;padding:12px 14px 60px;font:16px/1.7 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
h1{font-size:19px;margin:6px 0;display:flex;align-items:baseline;gap:10px}
h2{font-size:15px;margin:20px 0 4px;opacity:.85}
#dday{font-size:14px;color:#e56;font-weight:600}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid #8884;margin-bottom:8px}
button{font:inherit;padding:5px 10px;border:1px solid #8887;border-radius:7px;background:transparent;color:inherit;cursor:pointer}
button.on{background:#8883;font-weight:600}
.tabs button{flex:1;padding:8px 10px}
ul{list-style:none;padding:0;margin:0}
li{border:1px solid #8884;border-radius:9px;padding:9px 11px;margin:7px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
li a{flex:1;min-width:55%;text-decoration:none;font-weight:600;color:inherit}
.tag{font-size:12px;border:1px solid #8886;border-radius:5px;padding:1px 6px;opacity:.8}
.w{font-size:13px;color:#e56;font-weight:600}
.n{font-size:12px;opacity:.55}
.old{color:#e90;font-weight:600;opacity:1}
details{border:1px solid #8884;border-radius:9px;padding:9px 11px;margin:9px 0}
summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:7px;border-bottom:1px dashed #8884;padding-bottom:6px}
.a{white-space:pre-wrap}
.src{font-size:12px;opacity:.6;margin:12px 0 2px}
#msg{font-size:13px;opacity:.7}
textarea{width:100%;height:200px;font:13px/1.6 ui-monospace,monospace;margin-top:10px;padding:8px;border:1px solid #8886;border-radius:8px;background:transparent;color:inherit}
.it{border:1px solid #8884;border-radius:9px;padding:9px 11px;margin:9px 0}
.it details{border:0;padding:0;margin:0}
.it .a{margin-top:2px}
.mmb{margin-top:8px;padding:8px 10px;border-left:3px solid #e9a23b;background:rgba(233,162,59,.12);border-radius:0 6px 6px 0;white-space:pre-wrap;font-size:15px}
.mmb img{display:block;max-width:100%;border-radius:6px;margin-top:6px}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;margin-top:8px}
.ctl .sp{flex:1;min-width:40%;opacity:.55;font-size:12px}
.ctl button{font-size:12px;padding:3px 8px}
.ctl button.ok{border-color:#3a9d5d;color:#3a9d5d}.ctl button.ng{border-color:#e56;color:#e56}
.undo{font-size:13px;opacity:.75;display:flex;gap:10px;align-items:center}
.undo button{font-size:12px;padding:2px 8px}
.it.gone{padding:6px 11px;border-style:dashed}
.st{color:#d9a300;font-weight:700;margin-right:4px}
.cn{font-size:11px;font-weight:700;background:#e56;color:#fff;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px}
.ad{font-size:11px;font-weight:600;color:#3a7bd5;border:1px solid #3a7bd5;border-radius:4px;padding:0 4px;margin-right:6px}
#q{flex:1;min-width:50%;font:inherit;padding:6px 10px;border:1px solid #8887;border-radius:7px;background:transparent;color:inherit}
.hot{border-color:#e5a100;font-weight:600}
</style>

<!-- SUKJI 제외: 허브에는 숙지 스크립트를 붙이지 않음 -->
<h1>복습 허브 <span id=dday></span></h1>

<div class="bar tabs">
<button id=t0 class=on>전화스터디</button>
<button id=t1>전공복습</button>
</div>
<div class=bar>
<button id=v0 class=on>최신순</button>
<button id=v1>주차별</button>
<button id=v2>과목별</button>
<button id=rl>새로고침</button>
</div>
<div class=bar>
<button id=td class=hot>오늘 복습</button>
<button id=sr>★ 별표</button>
<button id=rp>상습 오답</button>
<button id=go>전체 오답</button>
<button id=rnd>랜덤 오답 10</button>
<button id=txt>오답 텍스트</button>
</div>
<div class=bar>
<input id=q type=search placeholder="문제·답·메모 검색 (전체 파일)">
<button id=qs>검색</button>
</div>
<div class=bar>
<button id=sy>동기화</button>
<button id=tk>토큰</button>
<span id=msg>불러오는 중…</span>
</div>

<div id=list></div>
<div id=out></div>

<script>window.HUB=1</script>
<script src="addons.js"></script>
<script>
const REPO="mujang0423-alt/mu", EXAM=[2026,11,28], DOFF=0;

/* ── 자동 인식 안 되는 파일 보정: "파일명(확장자 제외)":["과목","MMDD"] ──
   과목은 서미/한미/중미/미교/교육학 중 하나. 날짜 없으면 "" 로 두면 됨.
   날짜는 0901 / 260901 / 20260901 / 2026-09-01 다 됨.
   앞으로는 파일명을 0901-서미-바로크.html 처럼 만들면 여기 안 적어도 됨. */
const FIX={
 "원명청":["중미","0828"],
 "미술용어":["미교","0829"],
 "미교론아동":["미교","0827"],
 "중미고대_교육심리":["중미","0827"],
 "0826-현대한미-교육평가":["한미",""],
 "0826-시각문화":["미교",""],
 "0825-이해중심":["미교",""],
 "0824-회화고려":["한미",""],
 "0824-교육과정":["교육학",""]
};

const SUBJ=[["서미",["서미","서양미술사"]],
            ["한미",["한미","한국미술사","고려","조선","삼국","고구려","백제","신라"]],
            ["중미",["중미","중국미술사","원명청","송대","당대"]],
            ["미교",["미교","미술교육론","미술용어","시각문화","감상","표현"]],
            ["교육학",["교육학","교육과정","교육평가","교육심리","교육사회","교육행정","교육"]]];
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const key=n=>n.replace(/\.html$/,"");
/* 날짜 인식: 0901(MMDD) / 260901(YYMMDD) / 20260901(YYYYMMDD)
   및 2026-09-01, 26.09.01 처럼 구분자가 있는 형태까지 모두 지원 */
function toDate(y,mo,dy){
  if(mo<1||mo>12||dy<1||dy>31)return null;
  const d=new Date(y,mo-1,dy);
  return (d.getMonth()===mo-1&&d.getDate()===dy)?d:null;
}
function noYear(mo,dy){            // 연도 없는 MMDD: 60일 이상 미래면 작년으로
  const y=new Date().getFullYear();
  let d=toDate(y,mo,dy);
  if(d&&d-Date.now()>60*864e5)d=toDate(y-1,mo,dy);
  return d;
}
function fromDigits(g){            // 숫자 덩어리 하나를 날짜로
  if(g.length===8)return toDate(+g.slice(0,4),+g.slice(4,6),+g.slice(6,8));
  if(g.length===6)return toDate(2000+ +g.slice(0,2),+g.slice(2,4),+g.slice(4,6));
  if(g.length===4)return noYear(+g.slice(0,2),+g.slice(2,4));
  return null;
}
function parseDate(s){
  if(!s)return null;
  const t=String(s);
  const m=t.match(/(\d{4}|\d{2})[-._/ ](\d{1,2})[-._/ ](\d{1,2})(?!\d)/);
  if(m){const y=m[1].length===4?+m[1]:2000+ +m[1];
        const d=toDate(y,+m[2],+m[3]);if(d)return d;}
  for(const g of (t.match(/\d+/g)||[])){const d=fromDigits(g);if(d)return d;}
  return null;
}
function dateOf(n){
  const k=key(n), f=FIX[k];
  return (f&&f[1]) ? parseDate(f[1]) : parseDate(k);
}
function subjOf(n){
  const k=key(n), f=FIX[k];
  if(f&&f[0])return f[0];
  const t=k.replace(/^qa-/,"").replace(/\d+/g,"");
  for(const[s,al]of SUBJ)if(al.some(a=>t.includes(a)))return s;
  return "기타";
}
const visits=()=>{try{return JSON.parse(localStorage.getItem("hub-visit"))||{}}catch(e){return{}}};
function mark(n){try{const v=visits();v[n]=Date.now();localStorage.setItem("hub-visit",JSON.stringify(v))}catch(e){}}
const days=t=>Math.floor((Date.now()-t)/864e5);
const monday=d=>{const x=new Date(d),w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x};
const md=d=>(d.getMonth()+1)+"/"+d.getDate();


const A=window.AD;
if(!A){document.getElementById("msg").textContent="addons.js를 못 불러왔어요. 저장소에 addons.js가 있는지 확인해 주세요."}
const {esc:E,get:G,op:OP,today:TD,plus:PL,IV,J,LSg,LSs,setOf,setPut,tok}=A||{};

/* ── 파일 정보: KEY, 틀림 저장 형식 ── */
let META=J?J("hub-meta",{}):{};
const WK=n=>(META[n]&&META[n].k)||key(n);
const FM=n=>(META[n]&&META[n].f)||"obj";
const NM=n=>A.nameOf(WK(n));
const DIR=location.pathname.replace(/[^/]*$/,"");
const SK=n=>(META[n]&&META[n].k)?META[n].k+"-d":DIR+encodeURIComponent(n)+"-d";
const FMT=()=>{const o={};Object.keys(META).forEach(n=>{if(META[n].f==="idx")o[WK(n)]="idx"});return o};

const TX={};                                  // 파일별 문항 [문제,답]
const strip=s=>String(s==null?"":s).replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").trim();
function qaOf(t){
  const m=t.match(/const QA=(\[[\s\S]*?\n\]);/);
  if(m){let a=null;
    try{a=JSON.parse(m[1])}catch(e){try{a=JSON.parse(m[1].replace(/,\s*\]$/,"]"))}catch(e2){try{a=new Function("return "+m[1])()}catch(e3){}}}
    if(Array.isArray(a))return a.map(x=>[strip(x[0]),strip(x[1])]);}
  const d=new DOMParser().parseFromString(t,"text/html");
  return [...d.querySelectorAll("details")].map(x=>[
    (x.querySelector("summary")?.textContent||"").replace(/^\s*\d+\.\s*/,"").trim(),
    (x.querySelector(".a")?.textContent||"").trim()]);
}
async function fetchText(n,fresh){return (await fetch(encodeURIComponent(n)+(fresh?"?t="+Date.now():""),fresh?{cache:"no-store"}:{})).text()}
async function syncMeta(force){
  const todo=ALL.filter(n=>force||!META[n]);
  for(let i=0;i<todo.length;i+=8){
    msg.textContent="파일 확인 중… "+Math.min(i+8,todo.length)+"/"+todo.length;
    await Promise.all(todo.slice(i,i+8).map(async n=>{
      try{const t=await fetchText(n,1),m=t.match(/KEY\s*=\s*["']([^"']+)["']/);
        META[n]={k:m?m[1]:"",f:/S\.includes\(/.test(t)?"idx":"obj"};TX[n]=qaOf(t)}catch(e){}
    }));
  }
  LSs("hub-meta",JSON.stringify(META));
  // 예전 동기화 때문에 형식이 망가진 파일 복구(배열이어야 하는데 객체로 저장된 경우)
  Object.keys(META).forEach(n=>{if(META[n].f==="idx"){const v=J(WK(n),null);if(v&&!Array.isArray(v))setPut(WK(n),"idx",setOf(WK(n),"idx"))}});
}

/* ── 문항 상태 ── */
const isW=it=>it.ad?!!G(it.N,["aw",it.k]):setOf(WK(it.n),FM(it.n)).has(it.k);
const isS=it=>it.ad?!!G(it.N,["as",it.k]):setOf(SK(it.n),"obj").has(it.k);
const isStar=it=>!!G(it.N,["star",it.k]);
const cnt=it=>A.cntOf(it.N,it.k,isW(it));
function setW(it,v){
  if(it.ad)OP(it.N,["aw",it.k],v?1:null);
  else{const s=setOf(WK(it.n),FM(it.n));v?s.add(it.k):s.delete(it.k);setPut(WK(it.n),FM(it.n),s);later()}
}
function setS(it,v){
  if(it.ad)OP(it.N,["as",it.k],v?1:null);
  else{const s=setOf(SK(it.n),"obj");v?s.add(it.k):s.delete(it.k);setPut(SK(it.n),"obj",s);later()}
}
function wrongOf(n){
  const s=[...setOf(WK(n),FM(n))],N=NM(n),add=G(N,["add"])||{};
  Object.keys(G(N,["aw"])||{}).forEach(k=>{if(add[k])s.push(k)});return s;
}
function itemsOf(n){
  const N=NM(n),qa=TX[n]||[],r=qa.map((x,i)=>({n,N,k:String(i),no:i+1,q:x[0],a:x[1]}));
  const add=G(N,["add"])||{};
  Object.keys(add).sort((x,y)=>(add[x].c||0)-(add[y].c||0)).forEach((k,j)=>r.push({n,N,k,no:"추가"+(j+1),q:add[k].q,a:add[k].a||"",ad:1}));
  return r;
}
async function ensure(list){
  const need=list.filter(n=>!TX[n]);
  for(let i=0;i<need.length;i+=8){
    msg.textContent="문항 불러오는 중… "+Math.min(i+8,need.length)+"/"+need.length;
    await Promise.all(need.slice(i,i+8).map(async n=>{try{TX[n]=qaOf(await fetchText(n))}catch(e){TX[n]=[]}}));
  }
  const dl=list.filter(n=>!DL[n]);
  for(let i=0;i<dl.length;i+=8){
    msg.textContent="메모·별표 불러오는 중… "+Math.min(i+8,dl.length)+"/"+dl.length;
    await Promise.all(dl.slice(i,i+8).map(async n=>{await A.load(NM(n));DL[n]=1}));
  }
  msg.textContent="";
}
const DL={};

let files=[], view=0, ALL=[], tab=0;
const isMajor=n=>/전공복습/.test(n);
const pick=()=>{files=ALL.filter(n=>isMajor(n)===(tab===1))};

(function(){const t=new Date();t.setHours(0,0,0,0);
  const d=Math.round((new Date(EXAM[0],EXAM[1]-1,EXAM[2])-t)/864e5)-DOFF;
  dday.textContent=d>0?"D-"+d:d===0?"D-day":"D+"+(-d)})();

async function load(force){
  if(!A)return;
  msg.textContent="불러오는 중…";list.innerHTML="";out.innerHTML="";
  try{
    const j=await (await fetch("https://api.github.com/repos/"+REPO+"/contents/?t="+Date.now(),tok()?{headers:{Authorization:"Bearer "+tok()}}:{})).json();
    ALL=j.filter(f=>f.type==="file"&&/\.html$/i.test(f.name)&&!/^index/i.test(f.name)).map(f=>f.name).sort().reverse();
  }catch(e){msg.textContent="목록을 불러오지 못했어요";return}
  await syncMeta(force);
  pick();render();
}

function row(n){
  const w=wrongOf(n).length,N=NM(n),st=Object.keys(G(N,["star"])||{}).length,v=visits()[n],d=(v==null)?null:days(v);
  return "<li><a href='"+encodeURIComponent(n)+"' data-f=\""+E(n)+"\">"
    +E(key(n))+"</a><span class=tag>"+subjOf(n)+"</span>"
    +(st?"<span class=st>★"+st+"</span>":"")
    +(w?"<span class=w>오답 "+w+"</span>":"")
    +"<span class='n"+(d===null||d>=7?" old":"")+"'>"
    +(d===null?"미복습":d===0?"오늘":d+"일 전")+"</span></li>";
}
function render(){
  let h="",tot=0;
  const mj=ALL.filter(isMajor).length;
  t0.textContent="전화스터디 ("+(ALL.length-mj)+")";
  t1.textContent="전공복습 ("+mj+")";
  files.forEach(n=>tot+=wrongOf(n).length);
  if(view===0){h="<ul>"+files.map(row).join("")+"</ul>"}
  else if(view===1){h=byWeek(files,n=>n).map(w=>"<h2>"+wkLabel(w[0])+" ("+w[1].length+")</h2><ul>"+w[1].map(row).join("")+"</ul>").join("")}
  else{
    const order=SUBJ.map(s=>s[0]).concat("기타"),g={};
    files.forEach(n=>{const s=subjOf(n);(g[s]=g[s]||[]).push(n)});
    h=order.filter(s=>g[s]).map(s=>"<h2>"+s+" ("+g[s].length+")</h2><ul>"+g[s].map(row).join("")+"</ul>").join("");
  }
  list.innerHTML=h;list.style.display="";
  msg.textContent=files.length+"개 파일 / 오답 "+tot+"문항";
}
list.onclick=e=>{const a=e.target.closest("a[data-f]");if(a)mark(a.dataset.f)};

const wkKey=n=>{const d=dateOf(n);return d?monday(d).getTime():0};
const wkLabel=k=>{if(!k)return "날짜 없음";const m=new Date(+k),e=new Date(+k+6*864e5);return md(m)+" ~ "+md(e)};
function byWeek(arr,get){
  const g={};arr.forEach(x=>{const k=wkKey(get(x));(g[k]=g[k]||[]).push(x)});
  return Object.keys(g).sort((a,b)=>b-a).map(k=>[+k,g[k]]);
}
function showOut(title){
  list.style.display="none";out.innerHTML="";
  const b=A.el("div","bar"),bk=A.btn("← 목록으로",()=>{out.innerHTML="";render()});b.append(bk);
  out.append(b);if(title)out.insertAdjacentHTML("beforeend","<h2>"+title+"</h2>");scrollTo(0,0);
}
const src=it=>subjOf(it.n)+" | "+key(it.n)+" · "+it.no+"번";

/* ── 문항 카드: 답·메모·형광펜 + 별표/틀림/숙지 (+오늘 복습 버튼) ── */
function card(it,mode){
  const w=A.el("div","it"),d=A.el("details"),s=A.el("summary"),a=A.el("div","a",it.a),m=A.el("div","mmb");
  const head=()=>{const n=cnt(it);s.innerHTML=(isStar(it)?"<span class=st>★</span>":"")+(it.ad?"<span class=ad>추가</span>":"")+E(it.q)+(n>=2?"<span class=cn>"+(n>=3?"3회+":n+"회")+"</span>":"")};
  head();
  const mh=A.memoHTML(G(it.N,[it.k]));m.innerHTML=mh;if(!mh)m.style.display="none";
  d.append(s,a,m);A.paint(a,G(it.N,["hl",it.k,"a"]));A.paint(m,G(it.N,["hl",it.k,"m"]));
  const ctl=A.el("div","ctl"),sp=A.el("span","sp",src(it));
  const cb=(t,v,f)=>{const l=A.el("label"),c=A.el("input");c.type="checkbox";c.checked=v;c.onchange=()=>f(c.checked);l.append(c," "+t);return l};
  const bs=A.btn(isStar(it)?"★":"☆",()=>{const v=!isStar(it);OP(it.N,["star",it.k],v?1:null);bs.textContent=v?"★":"☆";head();
    if(mode==="star"&&!v)gone("별표 해제",()=>{OP(it.N,["star",it.k],1);bs.textContent="★";head()})});
  const lw=cb("틀림",isW(it),v=>{setW(it,v);if(v)A.bump(it.N,it.k,false);head();
    if(!v&&(mode==="wrong"))gone("오답에서 뺌",()=>{setW(it,true);lw.firstChild.checked=true})});
  const ls=cb("숙지",isS(it),v=>{setS(it,v);if(v)gone("숙지 처리됨",()=>{setS(it,false);ls.firstChild.checked=false})});
  ctl.append(sp,bs,lw,ls);
  if(mode==="wrong"||mode==="star"){
    const bw=A.btn("또 틀림",()=>{if(A.bump(it.N,it.k,isW(it))){setW(it,true);lw.firstChild.checked=true;head();bw.disabled=true;bw.textContent="오늘 기록됨"}});
    const c=G(it.N,["cnt",it.k]);if(c&&c.d===TD()){bw.disabled=true;bw.textContent="오늘 기록됨"}
    ctl.append(bw);
  }
  if(mode==="srs"){
    const prev=()=>({s:G(it.N,["srs",it.k]),c:G(it.N,["cnt",it.k]),w:isW(it)});
    const back=p=>()=>{OP(it.N,["srs",it.k],p.s||null);OP(it.N,["cnt",it.k],p.c||null);setW(it,p.w);lw.firstChild.checked=p.w;head()};
    ctl.append(
      A.btn("기억남",()=>{const p=prev(),b=Math.min(((p.s&&p.s.b)||0)+1,IV.length-1),due=PL(IV[b]);
        OP(it.N,["srs",it.k],{b:b,due:due});gone("✓ 다음 복습 "+(+due.slice(5,7))+"/"+(+due.slice(8)),back(p))},"ok"),
      A.btn("헷갈림",()=>{const p=prev();A.bump(it.N,it.k,p.w);OP(it.N,["srs",it.k],{b:0,due:PL(1)});setW(it,true);lw.firstChild.checked=true;head();
        gone("내일 다시 나와요",back(p))},"ng"));
  }
  w.append(d,ctl);
  const u=A.el("div","undo");u.style.display="none";w.append(u);
  function gone(t,undo){
    d.style.display=ctl.style.display="none";w.classList.add("gone");u.innerHTML="";u.style.display="";
    u.append(A.el("span",null,t+" · "+it.q.slice(0,22)+(it.q.length>22?"…":"")),A.btn("되돌리기",()=>{undo();u.style.display="none";d.style.display=ctl.style.display="";w.classList.remove("gone")}));
  }
  return w;
}
function groups(items,mode){        // 주차 → 파일별로 묶어서 보여주기
  const byF={};items.forEach(it=>(byF[it.n]=byF[it.n]||[]).push(it));
  byWeek(Object.keys(byF),n=>n).forEach(w=>{
    const c=w[1].reduce((s,n)=>s+byF[n].length,0);
    out.insertAdjacentHTML("beforeend","<h2>"+wkLabel(w[0])+" · "+c+"문항</h2>");
    w[1].forEach(n=>byF[n].forEach(it=>out.append(card(it,mode))));
  });
}

/* ── 기기 간 동기화 (틀림·숙지·방문기록) ── */
const API="https://api.github.com/repos/"+REPO+"/contents/";
const LS=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const canon=(k,f)=>{const o={};setOf(k,f).forEach(i=>o[i]=true);return o};
const norm=o=>{const r={};Object.keys(o||{}).forEach(i=>{if(o[i])r[i]=true});return r};
function stateKeys(){
  const s=new Set(ALL.map(WK).filter(Boolean));
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^qa-|-d$/.test(k))s.add(k)}}catch(e){}
  return [...s];
}
function localState(){
  const F=FMT(),o={};
  stateKeys().forEach(k=>{if(LS(k)!=null)o[k]=canon(k,F[k]||"obj")});
  o._visit=visits();return o;
}
function merge(base,loc,rem){
  const out={},ks=new Set([].concat(Object.keys(base),Object.keys(loc),Object.keys(rem)));
  ks.forEach(k=>{
    if(k==="_visit"){
      const v=Object.assign({},base._visit,loc._visit);
      Object.keys(rem._visit||{}).forEach(f=>{if(!v[f]||rem._visit[f]>v[f])v[f]=rem._visit[f]});
      out._visit=v;return;
    }
    const b=norm(base[k]),l=norm(loc[k]),r=norm(rem[k]),lc=!eq(b,l),rc=!eq(b,r);
    out[k]=(lc&&rc)?Object.assign({},l,r):lc?l:rc?r:l;
  });
  return out;
}
function setTok(){
  const cur=LS("hub-token")||"";
  const t=prompt("GitHub 토큰 붙여넣기 (비우고 확인하면 삭제)",cur);
  if(t===null)return;
  if(t.trim())LS("hub-token",t.trim());else try{localStorage.removeItem("hub-token")}catch(e){}
  msg.textContent=t.trim()?"토큰 저장됨":"토큰 삭제됨";
}
let syncing=0,lt;
const later=()=>{if(!LS("hub-token"))return;clearTimeout(lt);lt=setTimeout(sync,3000)};
async function sync(){
  const T=LS("hub-token");
  if(!T){setTok();return}
  if(syncing)return;syncing=1;sy.disabled=true;sy.textContent="동기화 중…";
  try{
    let rem={},sha=null;
    const g=await fetch(API+"state.json?t="+Date.now(),{headers:{Authorization:"Bearer "+T},cache:"no-store"});
    if(g.ok){const j=await g.json();sha=j.sha;try{rem=JSON.parse(A.ub64(j.content))}catch(e){}}
    else if(g.status!==404)throw new Error("읽기 실패 "+g.status);
    let base={};try{base=JSON.parse(LS("hub-base")||"{}")}catch(e){}
    const m=merge(base,localState(),rem),F=FMT();
    Object.keys(m).forEach(k=>{if(k!=="_visit")setPut(k,F[k]||"obj",new Set(Object.keys(m[k])))});
    LS("hub-visit",JSON.stringify(m._visit||{}));
    const body=JSON.stringify(m);
    const p=await fetch(API+"state.json",{method:"PUT",
      headers:{Authorization:"Bearer "+T,"Content-Type":"application/json"},
      body:JSON.stringify(sha?{message:"sync",content:A.b64(body),sha:sha}:{message:"sync",content:A.b64(body)})});
    if(!p.ok)throw new Error(((await p.json()).message)||("쓰기 실패 "+p.status));
    LS("hub-base",body);
    if(!out.innerHTML)render();
    msg.textContent="동기화 완료 "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){msg.textContent="동기화 실패: "+e.message}
  syncing=0;sy.disabled=false;sy.textContent="동기화";
}
sy.onclick=sync;tk.onclick=setTok;
