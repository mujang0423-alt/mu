<style>
:root{color-scheme:light dark}
body{max-width:820px;margin:0 auto;padding:12px 14px 60px;font:16px/1.7 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
h1{font-size:19px;margin:6px 0;display:flex;align-items:baseline;gap:10px}
h2{font-size:15px;margin:20px 0 4px;opacity:.85}
#dday{font-size:14px;color:#e56;font-weight:600}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid #8884;margin-bottom:8px}
button{font:inherit;padding:5px 10px;border:1px solid #8887;border-radius:7px;background:transparent;color:inherit;cursor:pointer}
button.on{background:#8883;font-weight:600}
.tabs button{flex:1;padding:8px 10px}
ul{list-style:none;padding:0;margin:0}
li{border:1px solid #8884;border-radius:9px;padding:9px 11px;margin:7px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
li a{flex:1;min-width:55%;text-decoration:none;font-weight:600;color:inherit}
.tag{font-size:12px;border:1px solid #8886;border-radius:5px;padding:1px 6px;opacity:.8}
.w{font-size:13px;color:#e56;font-weight:600}
.am{font-size:13px;color:#8a63d2;font-weight:600}
.n{font-size:12px;opacity:.55}
.old{color:#e90;font-weight:600;opacity:1}
details{border:1px solid #8884;border-radius:9px;padding:9px 11px;margin:9px 0}
summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:7px;border-bottom:1px dashed #8884;padding-bottom:6px}
.a{white-space:pre-wrap}
.src{font-size:12px;opacity:.6;margin:12px 0 2px}
#msg{font-size:13px;opacity:.7}
textarea{width:100%;height:200px;font:13px/1.6 ui-monospace,monospace;margin-top:10px;padding:8px;border:1px solid #8886;border-radius:8px;background:transparent;color:inherit;box-sizing:border-box}
.it{border:1px solid #8884;border-radius:9px;padding:9px 11px;margin:9px 0}
.it details{border:0;padding:0;margin:0}
.it .a{margin-top:2px}
.mmb{margin-top:8px;padding:8px 10px;border-left:3px solid #e9a23b;background:rgba(233,162,59,.12);border-radius:0 6px 6px 0;white-space:pre-wrap;font-size:15px}
.mmb img{display:block;max-width:100%;border-radius:6px;margin-top:6px}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;margin-top:8px}
.ctl .sp{flex:1 1 100%;opacity:.55;font-size:12px}
.ctl button{font-size:12px;padding:3px 8px}
.ctl button.ok{border-color:#3a9d5d;color:#3a9d5d}.ctl button.ng{border-color:#e56;color:#e56}
.ed textarea{height:auto;min-height:80px;font:15px/1.6 system-ui,sans-serif}
.undo{font-size:13px;opacity:.75;display:flex;gap:10px;align-items:center}
.undo button{font-size:12px;padding:2px 8px}
.it.gone{padding:6px 11px;border-style:dashed}
.st{color:#d9a300;font-weight:700;margin-right:4px}
.cn{font-size:11px;font-weight:700;background:#e56;color:#fff;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px}
.amb{font-size:11px;font-weight:700;background:#8a63d2;color:#fff;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px}
.ad{font-size:11px;font-weight:600;color:#3a7bd5;border:1px solid #3a7bd5;border-radius:4px;padding:0 4px;margin-right:6px}
#q,.kq{flex:1;min-width:50%;font:inherit;padding:6px 10px;border:1px solid #8887;border-radius:7px;background:transparent;color:inherit}
.hot{border-color:#e5a100;font-weight:600}
.kwb{border-color:#3a7bd5;color:#3a7bd5;font-weight:600}
.kwi>summary{font-size:17px}
.kwi .cnt{font-size:12px;font-weight:400;opacity:.6;margin-left:8px}
.kwi .from{font-size:12px;opacity:.6;margin:4px 0}
.kwi textarea{height:auto;min-height:70px;font:15px/1.6 system-ui,sans-serif;margin-top:4px}
.kwi .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.kwi .row button{font-size:13px;padding:3px 9px}
.kwm{white-space:pre-wrap;padding:6px 10px;border-left:3px solid #3a7bd5;background:rgba(58,123,213,.1);border-radius:0 6px 6px 0;margin:6px 0;font-size:15px}
.hint{font-size:13px;opacity:.7;margin:6px 0}
</style>

<!-- SUKJI 제외: 허브에는 숙지 스크립트를 붙이지 않음 -->

<script>window.HUB=1</script>
<script src="addons.js"></script>
<script>
const REPO="mujang0423-alt/mu", EXAM=[2026,11,28], DOFF=0;

/* ── 자동 인식 안 되는 파일 보정: "파일명(확장자 제외)":["과목","MMDD"] ──
   과목은 서미/한미/중미/미교/교육학 중 하나. 날짜 없으면 "" 로 두면 됨.
   날짜는 0901 / 260901 / 20260901 / 2026-09-01 다 됨.
   앞으로는 파일명을 0901-서미-바로크.html 처럼 만들면 여기 안 적어도 됨. */
const FIX={
 "원명청":["중미","0828"],
 "미술용어":["미교","0829"],
 "미교론아동":["미교","0827"],
 "중미고대_교육심리":["중미","0827"],
 "0826-현대한미-교육평가":["한미",""],
 "0826-시각문화":["미교",""],
 "0825-이해중심":["미교",""],
 "0824-회화고려":["한미",""],
 "0824-교육과정":["교육학",""]
};
/* 문제 목록이 없는(Q&A가 아닌) 파일: 허브 모아보기에서 뺌 */
const NOTQA=/빈칸인출/;

const SUBJ=[["서미",["서미","서양미술사"]],
            ["한미",["한미","한국미술사","고려","조선","삼국","고구려","백제","신라"]],
            ["중미",["중미","중국미술사","원명청","송대","당대"]],
            ["미교",["미교","미술교육론","미술용어","시각문화","감상","표현"]],
            ["교육학",["교육학","교육과정","교육평가","교육심리","교육사회","교육행정","교육"]]];
const key=n=>n.replace(/\.html$/,"");
/* 날짜 인식: 0901(MMDD) / 260901(YYMMDD) / 20260901(YYYYMMDD)
   및 2026-09-01, 26.09.01 처럼 구분자가 있는 형태까지 모두 지원 */
function toDate(y,mo,dy){
  if(mo<1||mo>12||dy<1||dy>31)return null;
  const d=new Date(y,mo-1,dy);
  return (d.getMonth()===mo-1&&d.getDate()===dy)?d:null;
}
function noYear(mo,dy){            // 연도 없는 MMDD: 60일 이상 미래면 작년으로
  const y=new Date().getFullYear();
  let d=toDate(y,mo,dy);
  if(d&&d-Date.now()>60*864e5)d=toDate(y-1,mo,dy);
  return d;
}
function fromDigits(g){            // 숫자 덩어리 하나를 날짜로
  if(g.length===8)return toDate(+g.slice(0,4),+g.slice(4,6),+g.slice(6,8));
  if(g.length===6)return toDate(2000+ +g.slice(0,2),+g.slice(2,4),+g.slice(4,6));
  if(g.length===4)return noYear(+g.slice(0,2),+g.slice(2,4));
  return null;
}
function parseDate(s){
  if(!s)return null;
  const t=String(s);
  const m=t.match(/(\d{4}|\d{2})[-._/ ](\d{1,2})[-._/ ](\d{1,2})(?!\d)/);
  if(m){const y=m[1].length===4?+m[1]:2000+ +m[1];
        const d=toDate(y,+m[2],+m[3]);if(d)return d;}
  for(const g of (t.match(/\d+/g)||[])){const d=fromDigits(g);if(d)return d;}
  return null;
}
function dateOf(n){
  const k=key(n), f=FIX[k];
  return (f&&f[1]) ? parseDate(f[1]) : parseDate(k);
}
function subjOf(n){
  const k=key(n), f=FIX[k];
  if(f&&f[0])return f[0];
  const t=k.replace(/^qa-/,"").replace(/\d+/g,"");
  for(const[s,al]of SUBJ)if(al.some(a=>t.includes(a)))return s;
  return "기타";
}
const visits=()=>{try{return JSON.parse(localStorage.getItem("hub-visit"))||{}}catch(e){return{}}};
function mark(n){try{const v=visits();v[n]=Date.now();localStorage.setItem("hub-visit",JSON.stringify(v))}catch(e){}}
const days=t=>Math.floor((Date.now()-t)/864e5);
const monday=d=>{const x=new Date(d),w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x};
const md=d=>(d.getMonth()+1)+"/"+d.getDate();


const A=window.AD;
if(!A){document.getElementById("msg").textContent="addons.js를 못 불러왔어요. 저장소에 addons.js가 있는지 확인해 주세요."}
const {esc:E,get:G,op:OP,today:TD,plus:PL,IV,J,LSg,LSs,setOf,setPut,tok,qh,KWN}=A||{};

/* ── 파일 정보: KEY, 틀림 저장 형식(f), 번호 차이(o), 문항별 비교값(h) ── */
const MV=3;
let META=J?J("hub-meta",{}):{};
const SHA={};
const WK=n=>(META[n]&&META[n].k)||key(n);
const NM=n=>A.nameOf(WK(n));
const FMT=()=>{const o={};Object.keys(META).forEach(n=>{if(META[n].k&&META[n].f)o[META[n].k]=META[n].f});return o};

const TX={};                                  // 파일별 문항 [문제,답]
const strip=s=>String(s==null?"":s).replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").trim();
function arrAt(t,i){                         // t[i]가 '[' 일 때 짝이 맞는 ']' 까지 잘라냄(문자열 안의 괄호는 무시)
  let d=0,q=null;
  for(let j=i;j<t.length;j++){const c=t[j];
    if(q){if(c==="\\")j++;else if(c===q)q=null;continue}
    if(c==='"'||c==="'"||c==="`")q=c;else if(c==="[")d++;else if(c==="]"&&--d===0)return t.slice(i,j+1)}
  return null;
}
function qaOf(t){                             // 파일 글자에서 바로 문항 읽기 → {tx, how}
  const re=/const QA\s*=\s*\[/g;let mm;
  while((mm=re.exec(t))){const s=arrAt(t,mm.index+mm[0].length-1);if(!s)continue;
    let a=null;
    try{a=JSON.parse(s)}catch(e){try{a=JSON.parse(s.replace(/,\s*\]$/,"]"))}catch(e2){try{a=new Function("return "+s)()}catch(e3){}}}
    if(Array.isArray(a)&&a.length&&Array.isArray(a[0]))return{tx:a.map(x=>[strip(x[0]),strip(x[1])]),how:"qa"};}
  const d=new DOMParser().parseFromString(t,"text/html");
  return{tx:A.qaOfDoc(d),how:"dom"};
}
/* 문제를 스크립트로 그리는 파일: 안 보이는 창에서 열어 실제 화면의 문항을 읽음 */
function renderTx(n){return new Promise(res=>{
  const f=document.createElement("iframe");let done=0;
  f.style.cssText="position:absolute;width:400px;height:300px;left:-9999px;top:0;visibility:hidden";
  const fin=v=>{if(done)return;done=1;f.remove();res(v)};
  f.onload=()=>setTimeout(()=>{try{fin(A.qaOfDoc(f.contentDocument))}catch(e){fin(null)}},700);
  setTimeout(()=>fin(null),15000);
  f.src=encodeURIComponent(n)+"?t="+Date.now()+"#hubscan";document.body.append(f);
})}
const txCache=n=>{const c=J("hub-tx|"+n,null);return c&&c.sha===META[n].sha?c.tx:null};
async function fetchText(n,fresh){return (await fetch(encodeURIComponent(n)+(fresh?"?t="+Date.now():""),fresh?{cache:"no-store"}:{})).text()}
async function readFile(n,fresh){             // 문항 + 파일 정보
  const t=await fetchText(n,fresh),R=A.idx().files[n]||{},L=J("ad-reg",{})[n]||{};
  const km=t.match(/KEY\s*=\s*["']([^"']+)["']/);
  let {tx,how}=qaOf(t),r=0;
  if(!NOTQA.test(n)&&(!tx.length||(R.n!=null&&tx.length!==R.n)||(how==="dom"&&R.n==null))){
    const v=await renderTx(n);if(v&&v.length){tx=v;r=1}
  }
  if(NOTQA.test(n))tx=[];
  const k=km?km[1]:"";
  const f=L.f||R.f||(/S\.includes\(/.test(t)?"idx":"");
  return{tx,m:{v:MV,k:k,f:f,o:(L.o!=null?L.o:R.o)||0,sha:SHA[n]||"",r:r,h:tx.map(x=>qh(x[0]))}};
}
async function syncMeta(force){
  const todo=ALL.filter(n=>force||!META[n]||META[n].v!==MV||(SHA[n]&&META[n].sha!==SHA[n]));
  for(let i=0;i<todo.length;i+=6){
    msg.textContent="파일 확인 중… "+Math.min(i+6,todo.length)+"/"+todo.length;
    await Promise.all(todo.slice(i,i+6).map(async n=>{
      try{const x=await readFile(n,1);META[n]=x.m;TX[n]=x.tx;if(x.m.r)LSs("hub-tx|"+n,JSON.stringify({sha:x.m.sha,tx:x.tx}))}catch(e){}
    }));
  }
  const L=J("ad-reg",{});                      // 파일에서 직접 알아낸 저장 형식이 있으면 그걸 우선
  Object.keys(L).forEach(n=>{if(META[n]){if(L[n].f)META[n].f=L[n].f;if(L[n].o!=null)META[n].o=L[n].o;if(L[n].k&&!META[n].k)META[n].k=L[n].k}});
  Object.keys(META).forEach(n=>{if(!ALL.includes(n))delete META[n]});
  LSs("hub-meta",JSON.stringify(META));
}
/* 파일 정보 + 겹치는 문제 묶음 → ad-index.json (각 파일에서 연동할 때 씀) */
async function buildIndex(){
  const files={},g={};
  ALL.forEach(n=>{const m=META[n];if(!m)return;files[n]={k:m.k||null,f:m.f||"",o:m.o||0,n:(m.h||[]).length};
    (m.h||[]).forEach((h,i)=>{if(h)(g[h]=g[h]||[]).push([n,i])})});
  const dup=Object.values(g).filter(a=>a.length>1).sort((a,b)=>(a[0][0]+a[0][1]).localeCompare(b[0][0]+b[0][1]));
  const nx={v:1,files,dup},old=A.idx(),same=JSON.stringify(nx)===JSON.stringify({v:old.v,files:old.files,dup:old.dup});
  A.useIndex(nx);LSs("ad-index",JSON.stringify(nx));
  if(same||!tok())return;
  try{
    const r=await fetch(A.API+"ad-index.json?t="+Date.now(),{headers:{Authorization:"Bearer "+tok()},cache:"no-store"});
    const sha=r.ok?(await r.json()).sha:null;
    await A.put("ad-index.json",A.b64(JSON.stringify(nx)),"파일 목록·겹치는 문제 갱신",sha);
  }catch(e){}
}

/* ── 문항 상태 ── */
const isW=it=>it.ad?!!G(it.N,["aw",it.k]):A.isFlag(it.n,it.k,"w");
const isS=it=>it.ad?!!G(it.N,["as",it.k]):A.isFlag(it.n,it.k,"s");
const isStar=it=>!!G(it.N,["star",it.k]);
const isAmb=it=>!!G(it.N,["amb",it.k]);
const cnt=it=>A.cntOf(it.N,it.k,isW(it));
const linked=(it,kind,v)=>{if(it.ad)return;const n=A.link(it.n,it.k,kind,v);if(n)A.status("겹치는 문제 "+n+"곳에도 같이 표시했어요")};
function setW(it,v){
  if(it.ad)OP(it.N,["aw",it.k],v?1:null);
  else{A.flag(it.n,it.k,"w",v);linked(it,"w",v);later()}
}
function setS(it,v){
  if(it.ad)OP(it.N,["as",it.k],v?1:null);
  else{A.flag(it.n,it.k,"s",v);linked(it,"s",v);later()}
}
function setStar(it,v){OP(it.N,["star",it.k],v?1:null);linked(it,"star",v)}
function setAmb(it,v){OP(it.N,["amb",it.k],v?1:null);linked(it,"amb",v)}
function wrongOf(n){
  const r=A.regOf(n),s=r.k?[...setOf(r.k,r.f)]:[],N=NM(n),add=G(N,["add"])||{};
  Object.keys(G(N,["aw"])||{}).forEach(k=>{if(add[k])s.push(k)});return s;
}
function itemsOf(n){
  const N=NM(n),qa=TX[n]||[],r=qa.map((x,i)=>({n,N,k:String(i),no:i+1,q:x[0],a:x[1]}));
  const add=G(N,["add"])||{};
  Object.keys(add).sort((x,y)=>(add[x].c||0)-(add[y].c||0)).forEach((k,j)=>r.push({n,N,k,no:"추가"+(j+1),q:add[k].q,a:add[k].a||"",ad:1}));
  return r;
}
async function ensure(list){
  const need=list.filter(n=>!TX[n]);
  for(let i=0;i<need.length;i+=6){
    msg.textContent="문항 불러오는 중… "+Math.min(i+6,need.length)+"/"+need.length;
    await Promise.all(need.slice(i,i+6).map(async n=>{
      try{
        if(META[n]&&META[n].r){const c=txCache(n);if(c){TX[n]=c;return}
          const v=await renderTx(n);TX[n]=v||[];if(v)LSs("hub-tx|"+n,JSON.stringify({sha:META[n].sha,tx:v}));return}
        const x=await readFile(n);TX[n]=x.tx;
      }catch(e){TX[n]=[]}
    }));
  }
  const dl=list.filter(n=>!DL[n]);
  for(let i=0;i<dl.length;i+=8){
    msg.textContent="메모·별표 불러오는 중… "+Math.min(i+8,dl.length)+"/"+dl.length;
    await Promise.all(dl.slice(i,i+8).map(async n=>{await A.load(NM(n));DL[n]=1}));
  }
  msg.textContent="";
}
const DL={};

let files=[], view=0, ALL=[], tab=0;
const isMajor=n=>/전공복습/.test(n);
const pick=()=>{files=ALL.filter(n=>isMajor(n)===(tab===1))};

(function(){const t=new Date();t.setHours(0,0,0,0);
  const d=Math.round((new Date(EXAM[0],EXAM[1]-1,EXAM[2])-t)/864e5)-DOFF;
  dday.textContent=d>0?"D-"+d:d===0?"D-day":"D+"+(-d)})();

async function load(force){
  if(!A)return;
  msg.textContent="불러오는 중…";list.innerHTML="";out.innerHTML="";
  try{
    const j=await (await fetch("https://api.github.com/repos/"+REPO+"/contents/?t="+Date.now(),tok()?{headers:{Authorization:"Bearer "+tok()}}:{})).json();

const API="https://api.github.com/repos/"+REPO+"/contents/";
const LS=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const canon=(k,f)=>{const o={};setOf(k,f).forEach(i=>o[i]=true);return o};
const norm=o=>{const r={};Object.keys(o||{}).forEach(i=>{if(o[i])r[i]=true});return r};
const fmtOf=(F,k)=>/-d$/.test(k)&&!F[k]?"obj":(F[k]||"");
function stateKeys(){
  const s=new Set(ALL.map(n=>META[n]&&META[n].k).filter(Boolean));
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^qa-|-d$/.test(k))s.add(k)}}catch(e){}
  return [...s];
}
function localState(){
  const F=FMT(),o={};
  stateKeys().forEach(k=>{if(LS(k)!=null)o[k]=canon(k,fmtOf(F,k))});
  o._visit=visits();return o;
}
function merge(base,loc,rem){
  const out={},ks=new Set([].concat(Object.keys(base),Object.keys(loc),Object.keys(rem)));
