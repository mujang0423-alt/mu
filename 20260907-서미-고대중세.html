<!doctype html><meta charset="utf-8"><title>20260907-서미-고대중세</title>
<script>
const KEY="0907-서미-고대중세";
const QA=[
["이집트 미술의 배경과 전반적 특징","나일강과 사막으로 둘러싸여 외침이 적고 안정적. 내세에 대한 관심이 커서 분묘(장례) 미술이 발달."],
["이집트 회화의 특징","정면성과 엄격한 규칙(눈·가슴은 정면, 얼굴·다리는 측면). 주대종소법, 병렬 구도, 여성 피부를 남성보다 밝게 표현."],
["이집트 조각의 특징","정면성·부동성, 먼 곳을 응시하는 시선, 임무를 표현하는 자세, 여성을 더 밝게 채색."],
["오벨리스크","태양신을 상징하는 탑으로, 하나의 거대한 단일 석재로 이루어짐."],
["이크나톤(아마르나) 양식","신왕국 시대. 엄격한 규칙과 이상성에서 탈피해 부동성이 완화되고 현실적·인간적이며 개성이 드러남."],
["마스타바","평평한 직사각형 형태의 묘. 주로 귀족이 묻혔으며 피라미드의 전 단계."],
["지구라트","수메르 왕조의 신정 건축물. 다층으로 이어진 매우 높은 기단 위에 신전이 배치된 구조물."],
["명문","금속판이나 돌 같은 단단한 물체 위에 새겨진 글자. 과거 사건의 기록이자 당시 생활 풍습과 사고방식을 알 수 있는 자료."],
["그리스 도기화의 진행 단계","흑회식 → 적화식"],
["흑회식","검은 안료로 형상을 그리고 배경은 붉은 태토 색을 그대로 둠. 세부는 송곳이나 칼로 긁어 표현."],
["적화식","형상은 붉은 태토 색 그대로 두고 배경을 검게 칠함. 세부 묘사는 붓으로."],
["흑회식이 적화식으로 대체된 이유","붓으로 세부를 그려 더 자유롭고 섬세한 표현이 가능했기 때문."],
["그리스 조각의 시기 구분","아르카익기 → 클래식기 → 헬레니즘기"],
["빈켈만의 그리스 미술 구분","고양식 → 순고양식 → 우미양식 → 모방양식"],
["아르카익기 조각의 특징","돌에서 독립한 최초의 입상 조각. 팔과 다리 사이에 공간이 생김. 아르카익 미소, 경직된 자세. 대표작은 쿠로스와 코레."],
["코레에 채색된 기법","납화법"],
["납화법의 장단점","장점: 내구성이 뛰어나고 광택이 있으며 돌 표면에 색을 입힐 수 있음. 단점: 빨리 굳어 운용이 어려움."],
["엘긴 마블스","영국 대사 엘긴 경 토마스 브루스가 1801~1803년 아테네에서 가져간 그리스 조각과 건축의 부분."],
["헬레니즘 조각의 특징","사실주의에 입각한 표현성이 강함. 역동적인 자세와 격렬한 표정으로 극적인 감정을 나타내며, 옷주름이 화려하고 복잡하며 관능적."],
["헬레니즘의 등장 배경","알렉산더 대왕의 동방 원정."],
["엔타블러처의 구성 요소","위에서부터 코니스 - 프리즈 - 아키트레이브"],
["에렉테이온 신전과 니케 신전의 주두 양식","이오니아 양식"],
["이오니아 양식 주두의 모양","양쪽에 두 개의 소용돌이(양머리) 장식. 여성적이면서 우아한 느낌."],
["카리아티드","에렉테이온 신전에 대표적으로 쓰인 여인상 기둥."],
["그리스 건축 주두 양식의 전개","도리아 → 이오니아 → 코린트 → 콤포지트 (토스카나식 포함)"],
["도리아 양식 프리즈의 구성","메토프와 트리글리프"],
["그리스 신전에서 부조 장식이 있는 부분","프리즈와 메토프"],
["페디먼트","그리스 신전의 박공. 일반적으로 조각을 하고 꼭짓점에는 장식(아크로테리온)을 붙임."],
["파르테논 신전에 적용된 공법","도리아식, 페리스타일(열주), 엔타시스(배흘림 기둥), 안솔림(기둥을 안쪽으로 기울여 세워 착시를 교정하고 하중을 견고하게 버팀)."],
["스케노그라피아","고대 그리스 극장에서 무대 뒤에 설치된 연극 배경화를 지칭하는 것."],
["폼페이 벽화 제1양식","벽돌로 벽을 쌓고 회벽칠(스투코)로 섬세하게 꾸며 마치 대리석 벽처럼 보이게 하는 실내 장식 기법."],
["폼페이 벽화 제3양식","벽면 전체를 환영적 공간으로 표현하는 대신, 벽을 일종의 그림틀로 활용하여 장식적이고 미묘하며 복잡한 세부 처리를 강조."],
["폼페이 벽화 제4양식","배경을 환영적으로 처리해 창문 등을 그려 넣어 마치 연극 무대처럼 연출."],
["콤펜디아리아 기법","헬레니즘·로마 기법의 하나로 생략적·편의적임을 뜻함. 빠른 붓놀림이 특징이며 제3양식 풍경화에 나타남."],
["베리즘(진실주의)","이상화를 배제하고 대상의 실제 모습을 있는 그대로 극도로 사실적이고 정확하게 표현하는 것."],
["데드마스크","죽은 사람의 모습을 후세에 전하기 위해 뜨는 안면상."],
["로마 조각의 흐름과 특징","공화정기: 귀족·정치가의 초상 조각 발달, 데드마스크, 베리즘. 초기 제국: 황제를 이상화한 영웅적 표현, 기마상 등장. 후기 제국: 혼란기에 황제를 초월적 존재로 거대하게 표현."],
["초기 제국 시대 조각 표현의 특징","황제에게 초인간적 이미지를 부여해 권위를 격상시키기 위한 영웅적 이상화. 그리스 고전주의의 이상적 사실주의를 본받음. 절제된 기마상으로 평화의 수호자 이미지를 부여하고, 사소한 세부는 생략하되 눈을 통해 신적인 인상을 줌."],
["로마 건축의 역할(그리스와의 비교)","그리스는 신을 경배하는 신전으로 산 중턱에 위치. 로마는 제국의 위엄을 과시하는 공공건물로 도시 한복판·광장에 지었고 다수 인원을 수용하는 실용적 성격."],
["도무스","로마 상류층의 개인 주택."],
["인슐라","중산층이나 노동자가 사는 공동 집합 주택."],
["로톤다","원형 또는 타원형 평면을 지니고 돔을 갖추고 있는 건물."],
["나르텍스","바실리카 양식에서 정면 입구와 네이브 사이에 설치된 현관 홀."],
["네이브","성당의 중앙 통로."],
["아일","네이브 양측에 있는 측면 복도."],
["콜로네이드","한편은 건물이고 반대쪽은 터져 있는, 지붕이 달린 주랑. 중세 이탈리아 도시에서 교회·성문 등을 연결해 공공 가로 공간의 기능을 함. 양쪽이 모두 막혀 있으면 아케이드."],
["초기 기독교 미술에서 발달한 것","카타콤 미술."],
["비잔틴 미술의 배경","콘스탄티누스 대제의 콘스탄티노플 천도 이후 동로마·서로마로 분열. 동방정교는 황제 개인의 세속적·정신적 권위의 기반이 되었고 서방 기독교는 황제로부터 독립을 유지하며 세계 교회적 성격을 띰. 비잔티움 제국의 동방정교를 중심으로 한 기독교 미술을 비잔틴 미술이라 함."],
["비잔틴 건축 양식","그리스 십자가(정방형 십자) 평면에 돔을 얹은 중앙집중식. 모자이크화와 이콘화가 유행했고 창을 통해 외부 빛을 유입."],
["하기아 소피아 성당의 특징","초기 기독교의 바실리카 양식에 입각해 긴 축을 중심으로 설계되었으나 중앙부는 정사각형 평면이고 그 위에 돔이 설치됨. 펜던티브 공법 사용. 미나레트(첨탑)는 후대에 증축."],
["이콘의 표현 특징","엄격한 규칙에 의거해 그려져 경직된 표정과 자세, 도식적인 옷주름, 평면적 표현. 예술적 창의성이 배제됨."],
["로마네스크 미술의 배경","'로마적'이라는 뜻. 고대 로마 미술 양식에 게르만족의 전통이 새롭게 가미된 미술."],
["로마네스크 조각의 특징","틀의 법칙에 따라 건축에 맞춰 길쭉하고 왜곡된 형태. 광적이고 혼란스러운 동작, 엄숙하고 다소 무서운 분위기. 교리 전달이 주된 목적."],
["로마네스크 조각과 건축의 관계","조각이 건축에 부속된 위치에 놓이며, 건축의 구조에 맞도록 인물의 형태를 왜곡시켜 표현."],
["더럼 성당의 의의","늑골 궁륭이 체계적으로 적용된 최초의 사례."],
["세데스 사피엔티아에","'지혜의 자리'라는 뜻의 도상. 성모 마리아가 왕좌에 앉아 정면을 바라보고, 무릎 위의 아기 예수도 정면을 향해 앉아 있는 형식."],
["니코포이아","승리를 가져다주는 성모 도상."],
["마에스타스 도미니 / 사크라 콘베르사치오네","각각 '장엄한 그리스도', '성스러운 대화'를 뜻하는 도상."],
["고딕 미술이 최초로 적용된 건물","프랑스의 생드니 수도원."],
["고딕 미술의 등장 배경","원거리 교역과 동방 무역 확대로 경제가 번성하고 도시가 발달하며 부유한 상인이 늘어남. 관심사가 여러 분야로 분산되어 교회 의존이 줄자 신자를 교회로 인도할 새로운 요소가 요구됨. 신비로운 종교 체험으로 신앙심을 고취시키기 위해 발전."],
["고딕 조각의 특징","로마네스크에서 탈피해 고부조로 건축에서 완전히 독립된 입상처럼 보임. 인간적 감정 표현과 다양한 현실적 상징물을 통해 지성과 인간의 감정을 종교에 융합시키려는 경향. 르네상스 환조 등장의 첫 단계."],
["국제 고딕 양식이란","플랑드르와 시에나 화파의 화가들이 프랑스 궁정에 일하러 왔다가 함께 작업하면서 발전시킨 통일된 양식."],
["국제 고딕 양식의 특징","세속적 상류사회에 대한 관심, 정교하고 세밀한 묘사, 사물에 대한 치밀한 관찰, 우아하고 장식적인 화풍, 인물의 감정 표현."],
["젠틸레 다 파브리아노의 화파","움브리아 파"],
["암브로조 로렌체티의 화파","시에나 파"],
["젠틸레 다 파브리아노 '동방박사의 경배'의 의미","젊은·중년·늙은 동방박사를 통해 인간 삶의 3단계를 상징적으로 나타냄. 연속 묘사법이 사용됨."],
["조토의 혁신점","선각보다 양감을 강조해 인물을 삼차원적으로 표현. 나열식 구도를 탈피하고 자연스러운 빛과 인물의 중첩을 통해 공간감을 만들어 냄."]
];
</script>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:14px;line-height:1.6;color:#1c1c1c}
h1{font-size:17px;margin:0 0 10px}
#bar{position:sticky;top:0;background:#fff;padding:8px 0;border-bottom:1px solid #ddd;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
button{padding:5px 10px;font-size:14px;border:1px solid #bbb;border-radius:6px;background:#f6f6f6;cursor:pointer}
details{border:1px solid #e0e0e0;border-radius:8px;padding:9px 11px;margin:7px 0}
details.w{border-color:#e05252;background:#fff5f5}
summary{cursor:pointer;font-weight:600}
details p{margin:9px 0 6px;white-space:pre-wrap}
details label{font-size:13px;color:#666}
</style>
<h1>20260907 서양미술사 · 고대~중세</h1>
<div id="bar">
<label><input type="checkbox" id="o"> 틀린 것만</label>
<button id="ex">오답 내보내기</button><button id="cp">번호 복사</button>
<span id="n"></span>
</div>
<div id="L"></div>
<script id="js">
const L=document.getElementById('L'),C=[];
try{JSON.parse(localStorage.getItem(KEY)||'[]').forEach((v,i)=>C[i]=v)}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(QA.map((_,i)=>!!C[i])))}catch(e){}};
const E=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
L.innerHTML=QA.map((p,i)=>`<details data-i="${i}"${C[i]?' class="w"':''}><summary>${i+1}. ${E(p[0])}</summary><p>${E(p[1])}</p><label><input type="checkbox"${C[i]?' checked':''}> 틀림</label></details>`).join('');
const ft=()=>{const o=document.getElementById('o').checked;L.querySelectorAll('details').forEach((d,i)=>d.style.display=o&&!C[i]?'none':'');document.getElementById('n').textContent=QA.filter((_,i)=>C[i]).length+'/'+QA.length};
L.onchange=e=>{const d=e.target.closest('details'),i=+d.dataset.i;C[i]=e.target.checked;d.className=C[i]?'w':'';sv();ft()};
document.getElementById('o').onchange=ft;ft();
document.getElementById('ex').onclick=()=>{const w=QA.filter((_,i)=>C[i]);const h='<!doctype html><meta charset="utf-8"><title>'+KEY+'-wrong</title><script>const KEY="'+KEY+'-wrong";const QA='+JSON.stringify(w)+';<\/script>'+document.querySelector('style').outerHTML+'<h1>'+KEY+' 오답<\/h1>'+document.getElementById('bar').outerHTML+'<div id="L"></div>'+document.getElementById('js').outerHTML;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download=KEY+'-wrong.html';a.click()};
document.getElementById('cp').onclick=()=>{const t=QA.map((_,i)=>C[i]?i+1:0).filter(Boolean).join(','),f=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()};try{navigator.clipboard.writeText(t).catch(f)}catch(e){f()}};
</script>
