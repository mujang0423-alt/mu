<div id="b"><h1>(김성희) 표현-판화 전공복습</h1><label><input type="checkbox" id="f"> 틀린 것만</label><button id="e">오답 내보내기</button><button id="c">번호 복사</button></div><div id="L"></div>
<script>const QA=[["[기초] 판화의 5가지 특성", "간접성(판을 거쳐 인쇄) / <b>복수성</b>(에디션, 복제이면서 유일성) / 단순성 / 실용성 / 매체적 특수성(목·금속·석·실크별 질감)"], ["[역사] 15~16세기 판화", "15C 목판화 확산, <b>뒤러</b>가 판화를 예술로 격상 (〈묵시록의 네 기사〉)<br>15C 중후반 금속 세공 영향 → 오목판화(인그레이빙: 만테냐·숀가우어)<br>16~17C 에칭 등장, <b>렘브란트</b> 에칭·드라이포인트 → 판화가 지위 확립"], ["[역사] 17~19세기 판화 기법의 등장", "17C 메조틴트 / <b>1796 제네펠더 석판화</b> / 18C 후반 애쿼틴트, <b>토마스 뷰익 우드 인그레이빙</b><br>고야: 역사·환상 주제 (〈로스 카프리초스〉)<br>로트렉: 포스터로 예술성+상업성 / 우키요에 → 인상파"], ["[역사] 20세기 판화", "표현주의: 목판화의 강렬·원시적 생명력 (키르히너, 뭉크)<br>피카소·마티스·샤갈·미로 / <b>워홀</b>: 실크스크린으로 이미지 복제·대중문화"], ["[오리지널 판화] 정의와 세부 원칙", "작가 서명 + <b>전체 매수 + 일련번호</b> 기재<br>에디션 종료 후 판 파기 또는 종료 표시<br>A.P는 전체 에디션의 <b>10% 이내</b>, 에디션 넘버에 미포함<br>공방에 맡겨 찍으면 공방(인쇄자) 이름 기입 가능"], ["[서명] 에디션 표기와 서명 위치", "7/30 = 전체 30장 중 7번째, 번호 상관없이 동일 가치<br>이미지 아래 여백: 왼쪽 에디션 번호 / 가운데 제목 / 오른쪽 서명·연도<br><b>연필</b>: 자외선에 강하고 필압이 드러나 위조 어려움"], ["[기호] A.P / S.P / T.P / B.A.T", "A.P: 작가 보관용, 10% 이내, 로마숫자<br>S.P(State Proof): 제판 단계별 확인용<br>T.P(Trial Proof): 다양한 잉킹 시험 인쇄<br><b>B.A.T</b>(Bon à Tirer): 작가가 최종 결정한 <b>기준 판화</b>"], ["[기호] C.P / H.C / 리스트라이크", "C.P(Cancellation Proof): 에디션 마친 판에 ×자 표시하고 찍은 것<br>H.C(Hors Commerce): 견본·증정용 비매품<br>리스트라이크: 초판 이후 같은 원판으로 다시 찍은 판화"], ["[볼록판화] 특징", "파낸 뒤 <b>남은 볼록면</b>에 잉크 → 흑백 대비 강함, 재료 결의 표면 효과, 제작 단순·선명<br>종류: 목판(판목), 리놀륨, 지판, 콜라그래프 등"], ["[볼록판화] 프린팅 순서와 잉크 조절", "정합(ㄴ, ㅡ 표시) → 잉킹(주걱으로 5분 개기, 롤러) → 바렌으로 문질러 찍기 → 건조·여백에 번호·서명<br>잉크가 굳으면 <b>리소 바니시</b>, 묽으면 <b>탄산마그네슘</b>"], ["[한국 전통 목판화] 판재 준비와 먹", "바닷물에 담그거나 소금물에 삶아 진을 빼고 그늘 건조 → 갈라짐·뒤틀림 방지<br><b>마구리</b>: 손잡이·통풍·뒤틀림 방지·이미지 보호<br>송연묵: 입자 거칠고 접착력 약 / 유연묵: 곱고 접착력 좋아 금속활자 인출에 적합"], ["[볼록판화] 리놀륨 판화", "바닥재, 결 없이 부드러워 자유로운 제판, 넓은 판 가능<br>피카소: 다색 리놀륨(판소멸법) / 마티스: 자유로운 곡선"], ["[볼록판화] 콜라그래피", "판 위에 천·모래·끈·판지 등을 붙여 요철 → 재료 물성 자체가 표현, 질감 대비·우연 효과"], ["[다색 목판] 다판 다색 목판화의 인쇄 순서", "색 분해 후 색 수만큼 판 제작, 정밀한 정합<br>겹쳐 찍으면 <b>광학적(시각적) 혼합</b><br><b>밝은색 → 어두운색</b>, 같은 명도면 <b>채도 높은 난색부터</b>"], ["[다색 목판] 분할판 다색법 vs 판소멸법", "분할판: 한 판을 색 영역별로 잘라 개별 잉킹 후 조합 → 경계에 '<b>흰 강</b>'<br>판소멸법: 한 판을 점진적으로 파며 여러 색 → 수정·추가 인쇄 불가, <b>에디션 처음부터 확정</b>, 회화적 질감"], ["[다색 목판] 키아로스쿠로 다색 목판화", "16C 르네상스, 주요 형태를 흑색으로 찍은 뒤 하이라이트·추가색 겹침 → 회화의 명암법을 판화로"], ["[오목판화] 특징 / 베벨링 / 습지", "홈에 잉크를 밀어넣고 <b>프레스</b>로 찍음, 정교한 농담·질감 / 새김법·부식법<br>베벨링(테두리 갈기): 얼룩 방지, 판자국, 종이 찢김·펠트 보호, 압력 균형<br>습지: 홈의 잉크를 잘 빨아들이고 압력 견딤"], ["[오목판화] 니엘로", "금속 음각 선에 검은 합금(니엘로)을 채운 장식 → 15C경 종이에 찍어낸 것이 <b>근대 판화의 시초</b>"], ["[새김법] 드라이포인트", "철필(니들)로 직접 긁음 → 밀려 올라간 '<b>버(burr)</b>' → 벨벳처럼 번진 선<br>버가 약해 마모 빠름 → <b>에디션 수 적음</b> (렘브란트 〈세 십자가〉)"], ["[새김법] 인그레이빙", "<b>뷰린</b>으로 금속을 직접 절삭, 버는 스크레이퍼·버니셔로 제거 → 강직·기계적 선<br>해칭·크로스해칭, 곡선은 판을 돌려서 / 고압 인쇄 필수 (폴라이우올로)"], ["[새김법] 메조틴트의 원리", "<b>로커</b>로 판 전체에 돌기(검정) → 스크레이퍼·버니셔로 깎아 밝게 = <b>역순 표현</b><br>부드러운 그라데이션 최대 강점 (황규백)"], ["[메조틴트] 유의점", "로커는 일정 간격·압력·다방향 교차로 균일하게<br>과도한 로킹 금지 → 잉크 막힘, 진흙 같은 검은 화면<br>스크레이퍼는 처음부터 밝은 톤 말고 <b>중간 톤부터</b> 점진적으로"], ["[직접법 도구] 니들·뷰린·로커·룰렛·스크레이퍼·버니셔", "니들: 긁기·그라운드 벗김 / 뷰린: 절삭(버 거의 없음) / 로커: 전체 미세 요철 / 룰렛: 톱니로 점 패턴·보조<br>스크레이퍼: 요철 깎아 밝게·버 제거 / 버니셔: 문질러 매끈, 하이라이트"], ["[부식법] 하드그라운드 에칭", "방지막(그라운드) 바르고 니들로 긁은 뒤 산으로 부식<br>선 굵기: <b>니들 힘 + 부식 시간</b> / 너무 조밀한 평행선은 합쳐져 투박한 회색<br>동판: 균질·섬세, 천천히 부식 / 아연판: 무르고 빨리 부식, 거칠고 마모 빠름"], ["[부식법] 소프트그라운드 에칭", "잘 굳지 않는 그라운드 위에 드로잉하거나 천·레이스·잎맥을 눌러 압착 → 질감 전사<br>연필·파스텔·크레용 같은 부드러운 선, 촉각적"], ["[부식법] 리프트그라운드 에칭", "리프트 용액: <b>설탕+비누</b>(또는 수채물감+아라비아고무) — 비누는 잘 벗겨지게<br>용액으로 붓 그림 → 건조 → 하드그라운드 코팅 → <b>따뜻한 물</b>에 담가 벗김 → 부식<br>번짐·수묵 같은 회화적 붓터치"], ["[부식법] 애쿼틴트", "<b>송진 가루</b>를 뿌리고 가열해 고정 → 부식<br>부식 시간으로 명암, 입자 크기·밀도로 질감 → 그림자·안개·피부톤 등 면의 톤 (고야)"], ["[오목 프린팅] 순서", "종이 사방 10cm 이상 여백, 물에 적셔 보관 → 스퀴지 잉킹 → 다버로 홈에 밀어넣기 → <b>면망사로 표면 닦기</b> → 판-판화지-갱지-펠트 순 → 균일 속도로 프레스"], ["[오목판화] 포토 에칭", "투명 필름 이미지를 감광막 금속판에 밀착 노광 → 빛 받은 부분 경화(산 저항) → 현상 → 질산 부식 → 감광막 제거 → 잉킹·프린팅"], ["[평판화] 원리와 특징", "<b>물과 기름의 반발</b>: 이미지=유성(소수성) / 배경=물 머금음(친수성)<br>요철 없는 평면, 크레용·먹·붓 터치 그대로 재현, 회화적"], ["[석판화] 판 준비", "석회석판: 카보런덤 뿌리고 <b>레비게이터</b>로 연마<br>알루미늄판: 금강사+쇠구슬로 돌기 세우기<br>카운터 에치액: 기름때·산화물 제거"], ["[석판화] 재료의 역할 — 아라비아고무·질산·활석가루·보호잉크", "아라비아고무: 비이미지 영역을 친수성으로<br>질산: 산과 혼합해 부식, 유성 지방 입자와 반응<br>활석가루: 고무액 균일 도포 돕고 이미지 보호<br>보호잉크: 부식 후 이미지 보호 임시막, 인쇄 전 제거"], ["[석판화] 석회석판 vs 알루미늄판", "석회석판: 천연 미세 구멍, 섬세한 톤, 무겁고 깨지기 쉬움, 송진+활석가루 사용<br>알루미늄판: 가볍고 저렴·대형, 톤 표현 제한적, 송진가루 미사용"], ["[평판화] 모노타이프", "<b>단판성</b>: 판에 직접 그려 한 번만 찍음, 판화와 회화의 경계<br>드가: <b>다크필드</b>(닦아내는 감산적) 방식, 고스트 프린트 위에 파스텔 보완"], ["[공판화] 특징", "구멍 뚫린 판(스텐실·스크린)으로 잉크를 밀어 전사 → <b>원화와 같은 방향</b>, 평면적, 대형·다양한 재질"], ["[실크스크린] 제작 과정", "틀에 실크 씌우기 → 투명 필름에 불투명 밑그림 → 암실에서 버킷으로 감광액 → 건조 → 노광 → 분무 세척 → 스퀴지로 프린팅"], ["[실크스크린] 탈막 문제 원인", "비이미지 감광액이 녹아 무너짐: 감광액 얇게 칠함, 노광 짧음, 덜 마른 채 노광, 뜨거운 물로 강하게 세척<br>감광액이 안 벗겨짐: 노광 전 빛 노출, 노광 김, 찬물로 약하게 분사"]]</script>
<script id="s">
const $=s=>document.querySelector(s),L=$('#L');let S={};
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
L.innerHTML=QA.map(([q,a],i)=>`<div class="i${S[i]?' x':''}"><input type="checkbox" title="틀림" data-i="${i}"${S[i]?' checked':''}><details><summary>${i+1}. ${q}</summary><div class="a">${a}</div></details></div>`).join('');
L.onchange=e=>{const t=e.target,i=t.dataset.i;t.parentNode.classList.toggle('x',t.checked);t.checked?S[i]=1:delete S[i];try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
$('#f').onchange=e=>document.body.classList.toggle('w',e.target.checked);
const W=()=>Object.keys(S).map(Number).sort((a,b)=>a-b),F=t=>{const x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();document.execCommand('copy');x.remove()};
$('#e').onclick=()=>{const k=KEY+'-wrong',h=`<script>const KEY=${JSON.stringify(k)}<\/script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${k}</title><style>${$('style').textContent}</style>${$('#b').outerHTML.replace(/<h1>.*?<\/h1>/,'<h1>'+k+'</h1>')}<div id="L"></div><script>const QA=${JSON.stringify(W().map(i=>QA[i]))}<\/script><script id="s">${$('#s').textContent}<\/script>`,A=document.createElement('a');A.href=URL.createObjectURL(new Blob([h],{type:'text/html;charset=utf-8'}));A.download=k+'.html';A.click()};
$('#c').onclick=()=>{const t=W().map(i=>i+1).join(',');try{navigator.clipboard.writeText(t).catch(()=>F(t))}catch(e){F(t)}};
</script>
