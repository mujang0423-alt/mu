<script>
const QA=[
["세잔이 '현대 미술의 아버지'로 불린 이유는?","형태 분해를 통해 사물의 본질을 탐구 → 다시점·역원근법이 처음 등장, 이후 미술에 지속적 영향."],
["세잔이 영향을 준 사조는?","입체주의."],
["고흐가 표현주의에 영향을 준 요소는?","우키요에 영향의 평평한 색면·단순화된 형태·강렬한 원색, 감정을 표출하는 주정주의, 임파스토 기법, 의도적 형태 왜곡, 율동감 넘치는 화면 구성, 거친 붓터치."],
["고갱이 다른 후기 인상주의자들과 달리 한 활동은?","종합주의 전개(클루아조니즘 사용), 원시적 소재에 이끌려 타히티에서 원시적·신비적 그림 제작 → 상징주의에 영향."],
["종합주의가 '종합'하는 것은?","해체된 색면의 종합, 감정과 형식의 종합."],
["'고전적 원시주의자' 마욜 조각의 로댕과 다른 특징은?","아르카이크·초기 고전 조각의 단순미와 힘 수용, 매끈하고 광택 있는 표면, 상징을 담지 않고 순수한 조형으로서의 인체를 조각."],
["야수주의가 현대 미술의 출발점으로 평가되는 이유(색채·형태)는?","색채: 고유색·관념색에서 벗어난 색채의 해방, 감정 표현(표현주의의 시초). 형태: 우키요에 영향의 평평한 색면·강렬한 원색·면 구획, 단순화된 형태, 과감한 변형."],
["조르주 루오가 다룬 주제와 표현 특징은?","타락한 세상을 기독교 정신으로 갱생해야 한다고 보고 매춘부·어릿광대·거지 등을 주제로 함. 스테인드글라스 같은 굵은 윤곽선."],
["키르히너가 속한 그룹은?","다리파(Die Brücke)."],
["키르히너가 도시 매춘부와 상류계급 여성을 유사하게 다룬 의도는?","기성의 권력과 관습에 대한 저항(다다와 유사한 입장)."],
["청기사파의 결성 주체와 다리파와의 차이는?","칸딘스키(와 마르크)가 결성. 다리파: 니체 초인사상 영향, 세상을 바꾸려는 현실 비판적 성향. 청기사파: 초월적·영적 정신성, 서정적 심성 표현 추구 → 음악처럼 형태 재현 없이도 감동을 주는 추상 양식 시작."],
["고갱·뭉크의 판화가 독일 표현주의에 준 영향은?","목판화·다색판화에서 판면의 재질(나뭇결)을 살려 하나의 표현 요소로 삼음 → 거친 느낌으로 내면 표현."],
["브랑쿠시가 좌대를 처리한 두 방식과 그 목적은?","① 좌대 제거 ② 좌대를 작품과 연결해 작품의 일부로 삼음. 목적: 기념비성(권위) 배제 → 작품이 그 자체로 독립적 가치 획득. 바닥·주변 환경까지 작품에 포함되어 감상자가 작품 속을 거니는 효과."],
["종합적 큐비즘의 특징은?","분석적 단계의 과도한 형태 분해로 대상을 알아볼 수 없게 되자, 사물의 형상(현실성)을 회복하기 위해 파피에 콜레 사용."],
["퓌토 그룹의 다른 이름은?","황금분할파(섹시옹 도르, Section d'Or)."],
["아르키펜코가 조각과 회화의 경계를 모호하게 만든 방식은?","① 오목·볼록(요철)을 반전시켜 양감과 공간을 새롭게 봄 ② 표면 채색 ③ 투조로 실체와 공허(빈 공간)의 관계 탐색."],
["미래주의 회화의 특징은?","신인상주의의 분할묘법 + 입체파의 형태 분해를 수용해 속도감·역동성 표현, 기계미학 찬양."],
["미래주의의 '세라타(스와레)'란?","극장·강당에서 작품을 전시하며 선언문 낭독, 시 낭송, 관객에게 욕설을 퍼붓는 등의 해프닝."],
["역선(力線) 이론이란?","대상의 생명력을 표출하여 화면 중심으로 관람자를 끌어들이는 힘찬 선."],
["절대주의를 시작한 작가는?","말레비치."],
["말레비치의 큐보-퓨처리즘은 어떤 사조의 결합인가?","입체주의 + 미래주의."],
["말레비치가 절대주의로 실현하고자 한 것은?","색면을 무언가를 표현하는 수단이 아닌 그 자체의 순수성·역동적 에너지를 지닌 독립적 회화로 인정. 목적과 주제 내용에서 자유로운 '비대상성'."],
["타틀린의 회화적 부조와 코너 역부조를 비교하면?","회화적 부조: 벽에 걸어 회화적 환영을 일으키는, 회화와 부조 사이의 작품. 코너 역부조: 두 벽의 모서리를 가로질러 공중에 매달아 실제 공간 속에 현존 → '부조에 반한다'는 의미."],
["로드첸코의 사선 구도·비일상적 시점의 효과는?","역동성 강조."],
["데 스틸 그룹이 추구한 특징은?","몬드리안의 신조형주의 이념(수직·수평선, 삼원색+무채색)을 회화를 넘어 건축 등 모든 분야에 적용."],
["취리히·뉴욕·베를린 다다의 방식은?","취리히: 즉흥적 해프닝 / 뉴욕: 레디메이드 / 베를린: 포토몽타주. (메르츠빌트·메르츠바우는 하노버의 슈비터스)"],
["아모리쇼의 의의는?","미국 최초의 국제 현대 미술전 → 유럽 현대 미술 양식이 미국에 대거 유입되는 계기."],
["뒤샹의 자가복제 행위란?","레플리카로 자신의 작품을 복제 → 작품의 권위·유일성을 부정하고 원본에 대한 물음 제기."],
["키리코가 형이상학적 회화를 만든 배경은?","미래주의의 지나친 기계 성향·물리적 세계 찬양에 반발 → 가시적 세계 이면의 환상적·공포적인 것(무의식적인 것)을 목표로 함."],
["신즉물주의의 마술적 사실주의란?","사실적으로 묘사하면서 신비한 느낌을 더한 사실주의 경향."],
["훌리오 곤잘레스가 최초로 선보인 조각과 이후의 명칭은?","용접 철조각(선재·면재 사용) → 데이비드 스미스에게 이어져 '공간 속의 드로잉'으로 명명."],
["달리 작품의 흐물거리는 형상과 개미가 암시하는 것은?","흐물거리는 형상: 탄생 이전 상태로의 회귀 / 개미: 죽음."],
["신인상주의에서 사용한 보색 체계와 효과는?","혼색하지 않고 보색의 색점을 병치(빨강-초록 등) → 더 빛나는 광도의 색채 구현."],
["쇠라가 색에 부여한 감정은?","난색: 즐거움 / 한색: 슬픔 / 중간색: 조용함(평온)."],
["세잔 〈생트 빅투아르 산〉의 특징은?","산의 외형을 색면으로 조합해 본질적 구조 탐구, 진출색(붉은 계열)·후퇴색(파랑·보라 계열) 배치로 공간감 표현."],
["'이동·통행하다'라는 뜻으로, 붓질·색면을 병치해 대상 간 윤곽선 없이 연결되듯 표현한 세잔의 기법은?","파사주(passage)."],
["고갱의 영향으로 생긴 '예언자' 뜻의 그룹은? 그중 소박한 일상 실내 풍경을 그린 경향은?","나비파 / 앵티미슴(Intimisme)."],
["부르델과 로댕의 차이점은?","로댕의 거친 표면은 계승했지만, 견고한 구조 속 건축적 공간감을 구축하고 엄격한 질서·비례를 강조한 기념비적 조각을 함."],
["야수주의와 표현주의를 배경·특징·주제로 비교하면?","야수주의: 고흐·고갱 등의 전시에서 영감, 색채 강조·짙은 윤곽선·단순한 형태, 주제는 일상의 대상·풍경. 표현주의: 아카데미의 정형적 형태에서 벗어남, 주정적·개성적 필치, 형태 왜곡·원색, 주제는 사회 현실에 대한 비판."],
["칸딘스키의 개념으로, 점·선에 내재된 힘, 색채의 수축·팽창, 구성 요소 간 상호관계 속 긴장감을 뜻하는 것은?","슈파눙(Spannung)."],
["정규 미술 교육 없이 화단과 무관하게, 기교는 떨어지지만 순수·충동적으로 즐겁게 그리는 경향은? (딜레탕트와 구분)","나이브 아트. (딜레탕트: 전문가 기질 없이 애호하는 태도로 그리는 사람)"],
["분석적 큐비즘 단계의 특징은?","입체주의의 두 번째 단계. 대상의 분해·해체가 심화되어 본질을 드러냄, 회색·갈색 등 단일화된 색채 사용."],
["피카소의 시대 구분(순서)은?","청색 → 장밋빛 → 아프리카 → 큐비즘 → 고전주의 → 꿈의 분석 시대(1925~). 〈게르니카〉(1937) 시기는 '분노의 시대'라고도 함."],
["〈게르니카〉의 내용과 상징은?","스페인 내전 중 반란군 프랑코 측이 게르니카 마을을 폭격해 민간인을 학살한 사건. 말: 희생(민중) / 전등: 대낮의 폭격 / 촛불: 희망 / 소: 폭력(강사에 따라 민중으로도 설명 → 교재 확인)."],
["오르피즘이 영향 받은 것과 등장 이유는?","입체주의의 화면 분할 + 미래주의의 속도감. 분석적 입체주의의 색채 결여를 극복하고자 등장."],
["미래주의의 발생 배경은?","기계 문명 발달 → 기계의 속도감·역동성을 예술로 창조하려는 의식. 마리네티가 《피가로》지에 미래주의 선언문 발표(1909)."],
["자코모 발라의 특징은?","신인상주의 영향의 분할주의적 짧은 붓터치, 크로노포토그래피 영향으로 대상의 움직임을 연속 이미지로 제시 → 속도감·시간성·역동성 부여."],
["보초니가 구분한 신인상주의·입체주의·미래주의의 차이는?","신인상주의: 한순간의 시각 / 입체주의: 대상성에 집중 / 미래주의: 모든 가능한 순간을 종합하고 영혼의 상태까지 표현."],
["타틀린이 미술사적으로 영향 받은 작가는?","피카소(구성 작업) → 열린 공간 개념."],
["가보와 페프스너 등이 1920년 8월 5일 모스크바에서 발표한 선언문은?","사실주의 선언."],
["구축주의의 두 갈래는?","① 공리주의(실용) 추구: 타틀린, 로드첸코 ② 순수 미술 추구: 가보·페프스너 형제."],
["엘 리시츠키의 '프로운'이란?","'새로운 것을 위한 계획' — 회화에서 건축으로 가는 과도기 작업. 건축적 구조와 회화적 색채를 결합한 3차원적 회화."],
["몬드리안 〈브로드웨이 부기우기〉의 특징과 의미는?","비대칭적 선, 선 사이 공간의 운동감. 2차 대전 기간 자유를 준 뉴욕에 대한 경의. '시그널 아트'로도 불림."],
["시그널 아트란?","공공 신호등·교통 표지가 갖는 시각적·심리적 자극 효과를 예술적 모티브로 하는 경향."],
["리트벨트 〈슈뢰더 하우스〉의 특징은?","미닫이·이동형 칸막이로 공간을 효율적으로 사용, 가구를 건물에 내장한 빌트인 가구."],
["291 갤러리란?","스티글리츠가 뉴욕에 설립한 갤러리. 아방가르드 작품을 많이 전시, 아모리쇼 개최의 원동력."],
["슈비터스의 메르츠빌트와 메르츠바우는?","하노버 다다. 메르츠빌트: 일상 사물(폐품)로 만든 2차원 회화 작품 / 메르츠바우: 폐품으로 만든 거대한 건축적 구조물."],
["초현실주의의 발생 배경은?","1·2차 세계대전 사이의 불안 속 이성적 합리주의·기존 문화에 대한 반발. 앙드레 브르통 중심(초현실주의 제1선언), 프로이트 영향으로 잠재된 무의식을 발현하는 예술 추구. (용어는 아폴리네르가 처음 사용)"],

</style><script>/*MEMO*/addEventListener("load",()=>{
const ds=[...document.querySelectorAll("details")];if(!ds.length)return;
const H=location.hostname,seg=location.pathname.split("/").filter(Boolean);
const REPO=/\.github\.io$/.test(H)&&seg.length>1?H.split(".")[0]+"/"+seg[0]:"mujang0423-alt/mu",BR="main";
const RAW="https://raw.githubusercontent.com/"+REPO+"/"+BR+"/",API="https://api.github.com/repos/"+REPO+"/contents/";
const NAME=(typeof KEY!="undefined"?KEY:decodeURIComponent(seg[seg.length-1]||"x").replace(/\.html?$/i,"")).replace(/[\\\/:*?"<>|#%]/g,"_");
const PATH="memo/"+NAME+".json",LK="mm|"+NAME;
const enc=p=>p.split("/").map(encodeURIComponent).join("/");
const tok=()=>{try{return localStorage.getItem("hub-token")}catch(e){return null}};
const b64=s=>{const u=new TextEncoder().encode(s);let r="";for(let i=0;i<u.length;i+=8192)r+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(r)};
const ub64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const btn=(x,f)=>{const b=el("button");b.type="button";b.textContent=x;b.onclick=e=>{e.preventDefault();f()};return b};
let M={};try{M=JSON.parse(localStorage.getItem(LK))||{}}catch(e){}
const store=()=>{try{localStorage.setItem(LK,JSON.stringify(M))}catch(e){}};
const ui=[];

function view(i){
  const u=ui[i],m=M[i]||{},has=!!((m.t&&m.t.trim())||(m.img&&m.img.length));
  u.box.innerHTML=has?esc(m.t||"")+(m.img||[]).map(p=>'<img loading="lazy" src="'+esc(RAW+enc(p))+'">').join(""):"";
  u.box.style.display=has?"":"none";
  u.btn.textContent=has?"메모 수정":"＋ 메모";
}
function shrink(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,1400/Math.max(im.width,im.height)),c=el("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  const d=c.toDataURL("image/jpeg",.82);URL.revokeObjectURL(im.src);res({url:d,b64:d.split(",")[1]})};
  im.onerror=()=>rej(new Error("이미지를 읽지 못함"));im.src=URL.createObjectURL(f)})}
async function get(){
  const r=await fetch(API+enc(PATH)+"?ref="+BR+"&t="+Date.now(),{headers:{Authorization:"Bearer "+tok()},cache:"no-store"});
  if(r.status===404)return{d:{},sha:null};
  if(!r.ok)throw new Error("읽기 실패 "+r.status);
  const j=await r.json();let d={};try{d=JSON.parse(ub64(j.content))||{}}catch(e){}
  return{d:d,sha:j.sha};
}
async function put(p,content,msg,sha){
  const b={message:msg,content:content,branch:BR};if(sha)b.sha=sha;
  const r=await fetch(API+enc(p),{method:"PUT",headers:{Authorization:"Bearer "+tok(),"Content-Type":"application/json"},body:JSON.stringify(b)});
  if(!r.ok){let m=r.status;try{m=(await r.json()).message||m}catch(e){}const e=new Error(m);e.status=r.status;throw e}
}
async function commit(i,v){
  for(let n=0;;n++){
    const g=await get(),d=g.d;if(v)d[i]=v;else delete d[i];
    try{await put(PATH,b64(JSON.stringify(d,null,1)),"메모: "+NAME+" "+(i+1)+"번",g.sha);M=d;store();return}
    catch(e){if(n>=2||(e.status!==409&&e.status!==422))throw e}
  }
}
function thumb(src,rm){const w=el("span","mm-th"),im=el("img"),x=el("b");im.src=src;x.textContent="×";x.onclick=rm;w.append(im,x);return w}

function edit(i){
  const u=ui[i],m=M[i]||{},imgs=(m.img||[]).slice(),adds=[];
  const ta=el("textarea");ta.value=m.t||"";ta.placeholder="모르는 단어 뜻, 보충 설명…";
  const th=el("div"),fi=el("input"),st=el("span","mm-st");
  fi.type="file";fi.accept="image/*";fi.multiple=true;fi.style.display="none";
  const draw=()=>{th.innerHTML="";
    imgs.forEach((p,k)=>th.append(thumb(RAW+enc(p),()=>{imgs.splice(k,1);draw()})));
    adds.forEach((a,k)=>th.append(thumb(a.url,()=>{adds.splice(k,1);draw()})))};
  fi.onchange=async()=>{for(const f of fi.files){try{adds.push(await shrink(f))}catch(e){st.textContent=e.message}}fi.value="";draw()};
  const close=()=>{u.ed.innerHTML="";u.ed.style.display="none";u.bar.style.display="";view(i)};
  const ok=btn("저장",async()=>{
    if(!tok()){st.textContent="허브(index)에서 '토큰'을 먼저 저장해야 해요";return}
    ok.disabled=true;
    try{
      const paths=[];
      for(let k=0;k<adds.length;k++){
        st.textContent="사진 올리는 중 "+(k+1)+"/"+adds.length;
        const p="memo/img/"+NAME+"-"+(i+1)+"-"+Date.now().toString(36)+k+".jpg";
        await put(p,adds[k].b64,"메모 사진: "+NAME);paths.push(p);
      }
      st.textContent="저장 중…";
      const t=ta.value.replace(/\s+$/,""),all=imgs.concat(paths);
      await commit(i,(t||all.length)?{t:t,img:all}:null);
      ds.forEach((_,k)=>{if(k!==i)view(k)});close();
    }catch(e){st.textContent="저장 실패: "+e.message;ok.disabled=false}
  });
  u.ed.innerHTML="";u.ed.append(ta,th,fi,btn("사진 추가",()=>fi.click()),ok,btn("취소",close),st);
  u.bar.style.display="none";u.ed.style.display="";draw();ta.focus();
}

ds.forEach((d,i)=>{
  const w=el("div","mm"),box=el("div","mm-box"),bar=el("div"),ed=el("div"),b=btn("＋ 메모",()=>edit(i));
  bar.append(b);ed.style.display="none";w.append(box,bar,ed);d.append(w);
  ui[i]={box:box,bar:bar,ed:ed,btn:b};view(i);
});

(async()=>{try{
  let d;
  if(tok())d=(await get()).d;
  else{const r=await fetch(RAW+enc(PATH)+"?t="+Date.now(),{cache:"no-store"});if(r.status===404)d={};else if(r.ok)d=await r.json();else return}
  M=d||{};store();ds.forEach((_,k)=>{if(ui[k].ed.style.display==="none")view(k)});
}catch(e){}})();
})</script>
