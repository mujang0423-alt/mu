<script>const QA=[["[소묘재료] 실버 포인트의 특징", "중세~르네상스 초기 <b>가장 오래된 금속 소묘 재료</b><br>은선 펜촉 + 뼈가루·분필가루 코팅지<br>은의 산화 → 회갈색·갈색 변색<br>수정 불가·명암 조절 어려움 → 윤곽선 중심 정밀 묘사 (뒤러 〈자화상〉)"], ["[소묘재료] 연필의 구성과 H·B 표기", "흑연+점토, 목재로 감쌈 / 1500년 이후 실버포인트가 납 연필로 대체<br><b>H</b> 숫자↑ 단단, 가는 선·밝은 명도 / <b>B</b> 숫자↑ 부드러움, 굵은 선·어두운 명도"], ["[소묘재료] 목탄의 제작과 처리", "버드나무·포도나무 가지를 삶아 <b>불완전 연소</b> → 가장 자연적 재료<br>번지기 쉬워 <b>픽사티브(정착제)</b> 필요 / 인체 소묘·대형 데생"], ["[소묘재료] 콩테 vs 초크", "콩테: 흑연·산화철 색소+점토+왁스 고온 소성 <b>인공 재료</b>, 강한 콘트라스트·정교한 초상<br>초크: 고대부터 쓰인 <b>천연 석회질</b> 재료 — 화이트(석회)/레드(상긴, 산화철)/블랙, 르네상스 피부톤·입체감, 픽사티브 필요"], ["[선묘 기법] 해칭·크로스 해칭·컨투어 해칭·스티플링", "해칭: 일정 방향 평행선 반복, 간격·굵기로 명암<br>크로스 해칭: 교차선 덧그어 어두운 톤·질감 (렘브란트)<br><b>컨투어 해칭</b>: 형태(입체)의 굴곡 따라 선 → 입체감·부피감·구조감<br>스티플링: 점의 밀도로 명암"], ["[소묘 종류] 에튀드 vs 에스키스 vs 에보시", "에튀드: '연구·연습', 관찰 중심 부분 반복 연습(르네상스 인체·손)<br>에스키스: '초안·예비 스케치', <b>전체 구성·배치·비례</b> 중심 (다비드)<br>에보시: '밑그림·대략적 윤곽', 초기 기본 구조·톤, 신고전주의 밑색"], ["[소묘 종류] 에코르셰 / 카르통", "에코르셰: '근육 노출', 해부학적 누드 연구 (다빈치·미켈란젤로)<br>카르통: '<b>큰 밑그림</b>', 벽화·태피스트리용 실제 크기 정식 밑그림 (라파엘로) — 현대적 의미 카툰=풍자만화"], ["[드로잉] 제스처 드로잉 4종", "라인(움직임 흐름·윤곽) / 매스(덩어리·양감·무게) / 서스테인드(비교적 긴 관찰, 안정적 동작) / 스크리블드 라인(낙서형 선, 에너지)"], ["[드로잉] 컨투어 vs 블라인드 컨투어 드로잉", "컨투어: 대상 윤곽과 굴곡 따라 선으로 묘사<br>블라인드 컨투어: <b>대상에만 시선 고정</b>, 펜을 종이에서 떼지 않고 그림"], ["[현대 선] 솔 르윗 〈격자의 네 구석에서 꼭지점까지〉", "수학적으로 계산된 선, 감정 배제·지적 사고<br>선의 위치를 결정하는 것 자체가 작품<br>전시 후 해체 → <b>작업 지침서로만 존재</b>"], ["[현대 선] 래리 리버스 〈네덜란드인들과 시가〉 / 캐틀릿 〈소작 농부〉", "리버스: 담배 회사 포장의 렘브란트 그림 재사용 → 고급미술과 대중소비문화 충돌<br>캐틀릿: <b>리노컷</b>, 평행 선묘 방향 변화로 면·질감·입체감, 억압받는 흑인 공동체의 삶과 존엄"], ["[조형요소] 키아로스쿠로 vs 테네브리즘", "키아로스쿠로: 빛과 그림자의 <b>점진적 변화</b> → 사실적 입체감, 부드러운 공간감<br>테네브리즘: 화면 대부분 어둡게 + <b>특정 부분만 강렬한 빛</b> → 극적 효과, 종교적 메시지 강화"], ["[조형요소] 존스 〈성조기〉 vs 하몬스 〈African American Flag〉", "존스: 상징의 해제·의미 제거·<b>물질성 강조</b><br>하몬스: 흑인 민족주의 색 '<b>적-흑-녹</b>'으로 변경 → 흑인 정체성, 국가 상징 비판적 재해석"], ["[질감] 시각적/촉각적 질감 + 임파스토·글레이징·오트 파트·그라타주", "시각적: 색·선·명암으로 느끼는 표면 / 촉각적: 물감 두께·혼합재료로 실제 만져짐<br>임파스토: 두껍게 / 글레이징: 얇은 투명층 겹치기<br><b>오트 파트</b>: 시멘트·모래 등 두꺼운 질감, 긁기 (뒤뷔페)<br>그라타주: 칠한 채색층을 긁어 이미지·질감"], ["[공간] 투시 원근법 이전 원근법 4", "차폐(중첩) / 기저(가까운 것 아래, 먼 것 위) / <b>단축법</b>(만테냐 〈죽은 그리스도〉) / 등각(축측) 원근법: 세 축 비율 유지, 소실점 없이 길이·각도 측정 가능 (〈책가도〉)"], ["[공간] 투시 원근법의 원리", "평행선은 한 점(<b>소실점</b>)에서 만남<br>모든 소실점은 감상자 눈높이선(<b>수평선</b>) 위에 놓임<br>소실점 위치 = 감상자 시선, 높낮이 = 감상 각도 / 둥근 형태는 사각형 안에 끼워 표현"], ["[공간] 대기 원근법", "먼 물체일수록 윤곽·색채를 흐리게<br>반 아이크가 체계적 활용, 용어는 <b>다빈치 〈회화론〉</b>에서 처음<br>북유럽·19세기 풍경화, 시적 분위기"], ["[공간] 거울의 활용", "단일 시점 투시의 제약 극복, 추가 시점·정보 제공, 감상자를 그림 속으로 끌어들임<br>반 아이크 〈아르놀피니의 결혼〉, 벨라스케스 〈시녀들〉"], ["[채색화] 채색화의 3요소", "① 바탕제(벽·패널·캔버스·장지·견) ② 발색제(안료·염료) ③ 접착제(바인더·전색제·바니시)"], ["[물감] 물감의 명칭 원리 + 전색제별 회화", "물감 = 안료+미디엄, 물감 이름은 <b>미디엄(전색제)</b>이 결정<br>프레스코: 없음(물) / 수채: 아라비아고무 / 템페라: 난황 / 유화: 건성유 / 아크릴: 아크릴 합성수지"], ["[물감] 바인더 vs 미디엄 vs 바니시", "바인더: 지지체와 채색층 사이를 묶음<br>미디엄(전색제): 채색층 안 안료와 안료 사이를 엮음<br>바니시: 채색층 위를 덮어 효과·보호"], ["[물감] 물감의 고착(발색) 원리", "수용성: 수분 증발 / 유성: 기름·수지가 공기와 <b>산화</b> / 템페라·아크릴: 수분 증발 + 미디엄의 <b>자기중합</b>"], ["[물감] 안료 vs 염료", "안료: 불용성, 전색제와 결합해야 사용, 내구성 강함<br>염료: 가용성, 물만으로 스며듦, 입자 미세 → 번짐·빠짐현상, 은폐력 작아 회화에 부적절"], ["[납화법] 특징·장단점", "뜨겁게 녹인 <b>밀랍+안료</b> / 그리스 조각 채색, 파이윰 미라 초상화<br>장: 발색·윤기, 방습 보존성 / 단: 빨리 굳어 숙련 필요, 우연 효과 어려움<br>2차 가열 융합(금속판·주걱) (재스퍼 존스 〈깃발〉)"], ["[템페라] 특징과 물감 만들기", "안료+<b>달걀 노른자</b>, 식초=방부제<br>빠른 건조·선명·내구성, 세필 극사실, <b>해칭</b>으로 덧칠<br>단: 경직, 혼색 불가, 수정 어려움<br>어두운 안료=노른자 미디엄 / 밝은 안료=흰자 미디엄"], ["[프레스코] 원리와 부온 vs 세코", "젖은 석회 반죽에 물에 갠 안료 → 석회가 마르며 <b>화학적 고정</b><br>부온: 습식, 내구성·색 안정 / 단: 고난도·시간 제한<br>세코: 마른 회벽+전색제, 수정 가능 / 단: 내구성 약, 박락<br>하루 작업 분량 = <b>조르나타</b>"], ["[프레스코] 제작과정 용어 — 아리초·인토나코·카르토네·스폴베로·시노피아", "아리초: 거친 밑바탕 / 인토나코: 매끈한 마감층<br>카르토네(실제 크기 밑그림) → 천공 → <b>스폴베로</b>(구멍 위 목탄가루 두드려 전사)<br>미켈란젤로: 인토나코에 화산재로 건조 지연, 카르토네·스폴베로 없이 <b>시노피아</b>(적갈색 안료)로 직접 드로잉"], ["[수채] 수채화 4기법 + 개척자", "담채(알라프리마): 여백 살려 빠르게 / 겹쳐칠하기(Wet on Dry) / 번지기(Wet in Wet) / 드라이브러시(마른 붓 거칠게)<br>15세기 <b>뒤러</b>가 밑그림용 수채화를 독자 영역으로 개척 → 블레이크·터너"], ["[과슈] 특징", "불투명 수채, 흰색으로 명도 조절, 밑색이 안 올라와 덧칠·수정 자유<br>마르면 젖었을 때보다 <b>밝아짐</b>"], ["[유화] 역사의 흐름", "15C 반 에이크(글레이징·레이어드) → 다빈치 스푸마토 → 티치아노 자유로운 붓터치<br>바로크: 렘브란트 임파스토, 벨라스케스·할스 알라프리마 → 마네"], ["[유화 기법] 글레이징·임파스토·알라프리마", "글레이징: 투명층 여러 번 → 투명성·광택 (반 에이크·티치아노·베르메르)<br>임파스토: 두껍게 → 질감·감정 (렘브란트·고흐)<br>알라프리마: 밑칠 없이 단번에, 젖은 물감 위 덧칠 (벨라스케스·할스·마네, 인상주의 태동)"], ["[유화 기법] 스컴블링·그리자이유·임프리마투라", "스컴블링: 밑색 보이게 불투명색 얇게 문지름 → 안개·대기감 (터너·콘스터블)<br>그리자이유: 회색만, 부조 효과 — 갈색=<b>브루나유</b>, 녹색=<b>베르다유</b><br>임프리마투라: 캔버스에 얇고 투명한 중간톤 밑칠"], ["[유화] 유화의 기본 3원칙", "팻 오버 린(기름 많은 것 위로) / 씩 오버 씬(두꺼운 것 위로) / 슬로우 드라잉 오버 패스트 드라잉 → 균열·박리 방지"], ["[유화] 휘발성유 vs 건성유", "휘발성유: 테레빈·페트롤, 증발, 빠른 건조·광택 죽임 → <b>초기</b> 밑그림<br>건성유: 린시드·포피, 산화, 광택·내구성, 건조 느림 → <b>중후반</b> 마감"], ["[유화] 캔버스와 튜브물감의 등장", "캔버스: <b>베네치아 르네상스</b>, 습한 기후, 운반·대형 화면 (티치아노·틴토레토)<br>F형(인물)/P형(풍경)/M형(해양, P보다 가로 김)<br>튜브물감: 산업혁명 이후 → <b>인상주의</b> 야외 사생"], ["[유화] 디스템퍼 / 펜티멘토", "디스템퍼: 안료를 기름 아닌 <b>아교</b>에 개어 캔버스, 무광·불투명, 만테냐<br>펜티멘토: 덧칠한 밑그림·이전 그림이 다시 드러나는 현상, '후회' 뜻의 이탈리아어"], ["[아크릴] 등장 배경과 전후 미국 미술", "1920년대 <b>멕시코 벽화 운동</b>(오로스코·리베라·시케이로스): 실외 내구성·빠른 건조 필요<br>전후: 폴록 드리핑, 색면추상(프랑켄탈러 스테이닝, 모리스 루이스) — 평면성"], ["[파스텔] 특징", "18C 프랑스 확산 → 인상파 <b>드가</b><br>안료 순도 높아 선명, 건조 불필요, 덧칠·수정 용이, 드로잉과 회화 중간<br>단: 부서지기 쉬움 → 정착액 처리"], ["[동양화] 수묵화 용어의 출처", "당 말 장언원 <b>『역대명화기』</b>, 형호 『필법기』의 '수운묵장'"], ["[수묵화 역사] 왕유 / 왕묵 / 미불·미우인", "왕유(중당): 청록산수 변용, 수묵담채 <b>파묵 산수</b> → 남종문인화<br>왕묵(당말): 취중 <b>발묵</b> 산수, 골법용필 무시<br>미불·미우인(송): 수묵 선염+<b>미점</b>, 운무 풍경"], ["[수묵화 역사] 황공망과 원말사대가", "도가 사상, 갈필·선염의 초형상적 그림<br>황공망 〈부춘산거도〉: 피마준·적묵·파묵 종합, <b>천강산수</b>(수묵 위 옅은 채색) 완성"], ["[수묵화 역사] 명·청 및 근대", "명 중기: 오파 문인화, <b>동기창 남북종론</b> → 북종화 쇠퇴<br>명말청초 유민화가: 팔대산인, 석도<br>근대: 서비홍(서양 사실주의+수묵), 고검부(일본화풍 접목)"], ["[먹] 송연묵 vs 유연묵 vs 칠연묵", "송연묵(청묵): 소나무 그을음, 입자 커 번지기 불가 → <b>선묘</b><br>유연묵(갈묵): 동유 등 식물성 기름 그을음, 입자 미세 → <b>발묵·몰골</b><br>칠연묵: 옻칠 태운 그을음, 광택 강 → 눈동자·머리카락 세부"], ["[종이] 화선지 / 장지 / 한지 / 견", "화선지: 중국 안휘성, 번짐·발묵성 → 문인화·산수<br>장지: 두껍고 견고, 2합·3합, 도침 → 채색화·민화·병풍<br>한지: 질김, 흡수 느림 → 민화·초상·불화<br>견: 채색의 투명성, 앞뒤 아교·<b>배채</b>"], ["[종이] 한지 제조 과정", "원료 삶기(증해, 잿물) → 표백·티 고르기 → 고해(두드리기)·해리 → 초지(외발뜨기·쌍발뜨기, 닥풀) → 물빼기·건조 → <b>도침</b>"], ["[붓] 붓의 4덕", "첨(尖) 뾰족 / 제(齊) 가지런 / 원(圓) 원만·회전 / 건(健) 튼튼·수명"], ["[벼루] 구성", "연당(먹 가는 면) / 연지(먹 모으는 홈) / <b>봉망</b>(요철, 먹이 갈리는 부분)"], ["[표현기법] 구륵법 vs 몰골법", "구륵: 윤곽선 그린 후 채움, 정밀·사실<br>몰골: 윤곽선 없이 먹 농담으로 형태·입체"], ["[용묵법] 묵오채", "초묵(진득, 광택) / 농묵(광택 없음) / 중묵 / 담묵(회색빛, 운무) / 청묵(청회색, 안개·연기)"], ["[용묵법] 발묵 vs 파묵 vs 적묵", "발묵: 먹을 뿌리듯 부어 퍼지게, <b>당 후기 왕묵</b>에서 처음<br>파묵: 먹 위에 다른 농담 먹 덧칠해 깨뜨림, 왕유 시작, 황빈홍 정의<br>적묵: 옅은 먹이 <b>완전히 마른 뒤</b> 짙은 먹 덧칠 → 중후함·괴량감"], ["[용묵법] 선염법 / 홍운탁월 / 퇴묵법", "선염(바림): 점진적 그라데이션, 젖은 화면에 번짐<br>홍운탁월(유백법): 주위를 칠해 대상(달) 돋보이게 (김두량 〈월야관수도〉)<br>퇴묵: 먹을 흡수시킨 거의 마른 붓 → 비백, 갈필 유사"], ["[필법] 백묘법 / 갈필법 / 비백법", "백묘: 색 없이 먹선만, 북송 <b>이공린</b> 재발견<br>갈필: 물기 없는 붓, 거친 선, 원말 문인화 (황공망 피마준, 예찬)<br>비백: 예서에서 유래, 획 속 빈 공간"], ["[필법] 감필법 / 공필법 / 지두화", "감필: 붓 최소화·생략, 원래 서예 기법, 당말오대부터 회화, 선승화가 사의 인물 (양해)<br>공필: 꼼꼼·정밀, 화조·영모, 직업화가<br>지두화: 손가락·손바닥, 청 고기패 유행 → 강세황·심사정, 허련"], ["[준법-점준] 우점준 / 미점준 / 단선점준", "우점준: 빗방울 점, 화북 황토 암석, <b>북송 범관</b> 〈계산행려도〉<br>미점준: 붓을 옆으로 뉘어 가로로 찍음, 미불·미우인, 대미법·소미법<br>단선점준: 짧은 선·점, <b>안견파</b>, 15C 후반~16C 전반 한국적 준법"], ["[준법-선준] 피마준 / 난마준 / 하엽준 / 해삭준", "피마준: 삼베 펼친 듯 평행 가는 선, 토산, 오대 동원 창안, 남종화<br>난마준: 선이 교차, 흐트러진 삼<br>하엽준: 연잎 줄기 흘러내리듯, 조맹부<br>해삭준: 풀어놓은 새끼줄, 〈작화추색도〉"], ["[준법] 절대준 / 우모준 / 부벽준", "절대준: 옆으로 긋고 직각으로 꺾은 'ㄱ'자, 원 <b>예찬</b><br>우모준: 소털처럼 곡선 반복, 둥근 바위<br>부벽준: 도끼로 찍은 단면, <b>마원·하규 → 절파</b>, 대부벽·소부벽·장부벽"], ["[준법] 마아준 / 운두준 / 수직준 / 반두준", "마아준: 말 이빨처럼 뾰족, 이사훈·이소도·조백구 채색화가<br>운두준: 구름 피어오르는 산, <b>곽희</b><br>수직준: 수직으로 내리그음, <b>정선</b> 금강산<br>반두준: 백반 덩어리, 거연·황공망"], ["[수지법] 해조묘 / 녹각법 / 무근수", "해조묘: 곽희, 게 발톱처럼 앙상한 가지<br>녹각법: 사슴뿔 가지, 가을 숲<br>무근수: 미법산수, 뿌리를 안개로 가림 (미우인)"], ["[인물18묘] 고고유사묘 / 철선묘 / 정두서미묘 / 감필묘", "고고유사묘: 누에가 실 토하듯 가늘고 부드러움, <b>고개지</b><br>철선묘: 철사처럼 강하고 일정, 주방<br>정두서미묘: 못 머리처럼 시작 → 쥐꼬리처럼 가늘게<br>감필묘: 절제·간략, 선화"], ["[채색화] 이사훈의 청록산수", "가까운 산 녹청, 먼 산 군청, 산꼭대기·능선 녹청 위 군청 겹침 → <b>북종화</b> 전통"], ["[안료] 광물성 안료(석채) vs 토성 안료 / 레이크·체질 안료", "석채: 석록·석청·진사 등, 수비로 입자 분리, 강렬·명도 높음<br>토채: 황토·백토 등 흙, 부드럽지만 탁함<br>레이크: 염료성 색소+금속염 침전 → 불용성 인공안료<br>체질안료: 호분·백토, 전색제 섞으면 투명, 색조·점도 조절"], ["[안료] 수비(水飛)와 석채 번호", "물의 비중으로 입자 크기별 분리 — 큰 입자 빨리 가라앉음<br>1번(거침·짙은 색) ~ 15번(고움·옅은 색), 15번보다 미세하면 '백' 표기<br>석채는 무거워 교수를 <b>분채보다 진하게</b>"], ["[물감] 석채·수간분채·봉채·안채·튜브물감", "석채: 진채·중색, 견뢰도 우수<br>수간분채: 소립자, 체질안료에 착색한 합성안료 포함, 진채·담채·중색·혼색 모두<br>봉채: 아교 섞어 막대로 굳힘, 갈아 사용<br>안채: 아교·밀납으로 굳힘, 투명, 스케치·담채<br>튜브: 아라비아고무, 혼색·담채만"], ["[안료] 색상별 대표 안료", "백(서·가을): <b>호분</b>(조개껍데기), 백악 — '회사후소'<br>황(중앙): <b>등황</b>(해등나무 수지)<br>적(남·여름): <b>주사</b>, 석간주 — 벽사<br>녹: 석록(두록·이록·삼록) / 청(동): 석청(남동광)<br>이금(금니): 금박+교수, 고려불화 윤곽·문양"], ["[아교] 동양화에서 아교의 역할", "<b>바인더·미디엄·바니시 모두 담당</b><br>1단계 아교포수(바탕 기공 막음) → 2단계 전색용 → 3단계 교수·반수로 마무리"], ["[아교] 교반수 만들기", "아교수+<b>백반</b>: 아교=접착, 백반=응고·경화<br>찬물에 하루 불림 → <b>40~55℃ 중탕</b>(직접 끓이면 단백질 변성, 접착력↓) → 식힌 후 백반수 혼합"], ["[바탕처리] 아교포수 / 도침", "아교포수: 기공 차단·접착 강화·색 안정·박락 방지, 좌우 교차 반복<br>도침: 두드리거나 문질러 섬유 밀착, 흡수성↓·광택↑ → 포수 1~2회로 동일 효과"], ["[채색기법] 중색 vs 혼색", "중색: 마른 채색층 위에 덧쌓음, <b>석채·수간분채만 가능</b>, 깊이감·채도↑, 고려불화·진채화<br>혼색: 미리 섞어 칠함, 튜브 등 소립자, 채도↓·평면적"], ["[채색기법] 배채법", "화면 <b>뒷면</b>에 색을 칠해 앞으로 배어나오게<br>고려불화·조선 초상화, 백색 또는 명도 높은 유사색 사용<br>박리 방지·발색력·보존력 향상"]]</script>
