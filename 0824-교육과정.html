<script>const QA=[
["백워드 설계(이해중심 교육과정)의 3단계는?","① 바라는 결과의 확인 → ② 수용 가능한 증거의 결정 → ③ 학습 경험과 수업 계획"],
["이해의 여섯 가지 측면은?","설명 · 해석 · 적용 · 관점 · 공감 · 자기지식"],
["백워드 설계의 장점은?","목표–평가–내용의 일치를 확보한다.\n국가 수준 교육과정에 부합하는 수업 실행이 가능하다.\n학생의 심층적 이해를 도모한다."],
["백워드 설계의 단점은?","내용이 목표 달성의 수단으로 격하된다.\n부수적 목표의 중요성을 간과한다.\n표면적 변화 중심이어서 내면적 변화는 파악하기 어렵다.\n학습자의 관심·흥미가 소홀해지고 평가 의존적 수업 활동이 될 수 있다. (타일러 모형에 대한 비판과 유사)"],
["스킬벡(Skilbeck) 모형의 정의는?","기존의 국가 중심 교육과정 개발을 비판하고, 학교의 실정(상황)을 분석하여 학교 현장의 교사가 참여해 개발하는 학교 중심 교육과정 개발 모형"],
["스킬벡 모형의 개발 절차는?","상황 분석 → 목표 설정 → 프로그램 구성 → 해석과 실행 → 모니터링·피드백·평가·재구성"],
["스킬벡 모형에서 상황 분석 단계에 하는 일은?","학교의 내적 요인과 외적 요인을 분석한다."],
["스킬벡 모형의 내적 요인 예시는?","학생의 적성·능력·교육적 요구, 교사의 태도·가치관·지식·경험, 학교의 시설과 환경"],
["스킬벡 모형의 외적 요인 예시는?","학부모의 기대, 지역사회의 가치, 이데올로기와 사회문화적 변화, 교육 체제의 요구"],
["스킬벡 모형의 장점은?","학교 현실을 반영하여 학교 실정에 맞는 융통성 있는 교육과정을 만들 수 있다.\n자율성·창의성을 중시하므로 학교에서 직접 활용하기에 적합하다."],
["스킬벡 모형의 단점은?","개발이 나아가는 방향이 일정하지 않아 방향감이 부족하다.\n개발 과정의 역동성으로 혼란이 야기될 수 있다.\n목표 설정이 소홀해지고 시간이 오래 걸린다."],
["아이즈너(Eisner) 모형의 명칭은?","예술적 접근 모형"],
["아이즈너 모형의 개발 절차는?","목표 설정 → 내용 선정 → 학습 기회의 유형 → 학습 기회의 조직 → 내용 영역의 조직 → 제시 양식과 반응 양식 → 평가"],
["아이즈너는 행동목표를 어떻게 비판했는가?","결과만 지나치게 강조하여 미술 등 예체능 교육에 적합하지 않다.\n수업의 역동성을 간과해 수업 도중·이후에 생기는 부수적 목표와 효과를 놓친다.\n목표 진술이 획일적이다."],
["아이즈너가 행동목표의 대안으로 제시한 목표는?","문제해결 목표, 표현적 결과"],
["문제해결 목표와 표현적 결과의 차이는?","문제해결 목표: 해결해야 할 조건이 주어지고 사전 진술이 가능하나 정답은 정해져 있지 않다.\n표현적 결과: 조건이 없고 사전에 진술할 수 없으며, 활동 도중이나 이후에 목표가 형성된다. 정답도 없다."],
["아이즈너 모형에서 내용 선정 시 고려할 요인은?","개인 · 사회 · 교과, 그리고 영교육과정"],
["교육적 상상력이란?","교사가 학습 목표와 내용을 학생에게 의미 있는 학습 경험(학습 기회)이 되도록 적절하게 재구성하여 제공하는 능력"],
["'내용' 측면에서 교육적 상상력을 발휘한다면?","교과서 내용의 순서를 바꾸거나, 보충 자료를 제공하거나, 학습자 참여 중심 활동을 추가하는 방식으로 내용을 재구성한다."],
["아이즈너 모형의 장점과 단점은?","장점: 교사가 전문성을 발휘하고 함양할 수 있다.\n단점: 주관성이 강해 평가의 신뢰도·객관도가 떨어지고 합리성이 부족하다."],
["애플(Apple) 구조적 재개념주의의 기본 입장은?","학생의 실패 원인은 사회적·제도적 구조에 있으며, 학교에서 배우는 교육과정 속에는 지배적 이데올로기가 내재해 있다."],
["애플이 본 학교의 기능은?","문화적 재생산 기능을 수행하고 문화자본을 합법화한다.\n잠재적 교육과정을 통해 기존의 권력관계를 유지한다.\n학생은 복종을 학습하고 교사는 지식 전달자로 전락한다."],
["애플의 컴퓨터 교육 비판 두 가지는?","① 소득·성별에 따라 접근과 습득의 격차가 발생한다.\n② 교사는 외부에서 만든 교육용 소프트웨어를 단순 실행·관리하는 '수업 관리자'가 되어 학생과 동료 교사로부터 소외된다."],
["애플이 제시한 대안은?","새로운 테크놀로지를 무조건 도입하지 않고, 분명한 이유와 목적을 가지고 비판적으로 적용해야 한다."],
["교육과정 재구성의 세 가지 방법은?","교과 내 재구성 / 교과 간 재구성 / 교과와 창의적 체험활동의 연계를 통한 재구성"],
["교과 간 재구성이란?","공통된 주제를 중심으로 교과 간의 공통 개념·내용을 추출하여 재조직하는 것"],
["성취기준을 재구조화할 때 유의점은?","통합·압축 시 내용 요소가 임의로 삭제되지 않도록 한다(내용을 빼면 연계에 문제가 생긴다).\n추가하는 경우 학생의 학습·평가 부담이 가중되지 않도록 학년군·학교급 간 연계성을 충분히 고려한다."],
["교육목표 설정의 세 가지 자원은?","학습자 · 사회 · 교과"],
["블룸(Bloom) 교육목표분류학의 세 영역은?","인지적 영역 · 정의적 영역 · 심동적 영역"],
["인지적 영역과 정의적 영역은 각각 무슨 원리로 구분되는가?","인지적 영역: 복합성의 원리\n정의적 영역: 내면화의 원리"],
["인지적 영역의 위계는?","지식 – 이해 – 적용 – 분석 – 종합 – 평가"],
["정의적 영역의 위계는?","감수 – 반응 – 가치화 – 조직화 – 인격화"],
["'친구들에게 모차르트 음악을 듣도록 열렬히 권한다'는 정의적 영역의 어디인가?","가치화"],
["'모차르트 음악을 다른 음악과 비교하여 최고의 음악이라고 생각한다'는?","조직화 (비교·종합이 나오면 조직화)"],
["정의적 영역의 인격화란?","가치관이 일관성 있게 내면화되어 인격의 일부가 된 단계. 모차르트 음악을 듣는 것이 생활양식이 되고, 스스로 그런 음악가가 되겠다고 하는 수준."],
["'가을 운동회 계획 수립 능력', '주어진 자료에서 잠정적 가설을 형성하는 능력'은 인지적 영역의 어디인가?","종합"],
["인지적 영역 '종합'의 정의는?","여러 요소나 부분을 새로운 의미 체계가 성립되도록 하나로 묶는 능력으로 창의력까지 포함한다. 독특한 의사 전달 방법의 창안, 조작의 계획·절차 창안, 추상적 관계 도출 능력 등이 해당한다."],
["영교육과정이란?","배울 만한 가치가 있음에도 교육과정에서 배제되거나, 수업 시간 부족 등으로 실제로 가르쳐지지 않는 내용"],
["영교육과정으로 남아 있게 되는 원인은?","타성 · 의욕 부족 · 무지"],
["교과중심 교육과정이란?","다음 세대에 전달해야 할 중요한 문화유산을 교과로 체계적으로 조직하여 가르치는 교육과정. 문화 전통의 전수를 통한 이성과 합리성의 개발을 목적으로 한다."],
["교과중심 교육과정의 이론적 근거는?","형식도야설. 근육을 단련하듯 수학·논리 등 필수 교과를 훈련하면 일반적인 정신 능력이 길러진다고 본다."],
["교과중심 교육과정의 교육 방법은?","교사 중심 수업. 강의식·지식 전달식·암기식 수업"],
["광역형 교육과정이란?","서로 유사한 성격의 교과들을 한데 묶어 넓은 영역의 하나의 교과로 재조직한 통합 형태"],
["광역형 교육과정의 장점은?","사실보다 기본 개념과 원리에 충실한 조직이 가능하다.\n주제와 관련된 지식·기능·가치의 습득이 쉽다.\n학문의 개별적 성격이 유지되면서 교과목의 통합이 촉진된다."],
["광역형 교육과정의 단점은?","개략적 내용만 다루어 학습 내용의 깊이가 부족하다.\n추상적이어서 이해가 곤란하다.\n학문 간 결합 정도가 낮아 개별 학문의 전문 지식 학습에 그칠 우려가 있다."],
["2022 개정 교육과정의 핵심역량은?","자기관리 · 지식정보처리 · 창의적 사고 · 심미적 감성 · 협력적 소통 · 공동체 역량 (자·지·창·심·협·공)"],
["학년군으로 묶어 운영하는 이유는?","교육과정 편성·운영의 경직성을 탈피하고, 학년 간 연계성과 협력을 통해 유연성을 부여하기 위해서"],
["블록타임이란?","특정 과목의 수업을 요일별로 나누는 대신, 하루에 여러 시간을 묶어 연속으로 운영하는 수업 방식"],
["블록타임의 장점은? (미술과 기준)","활동을 끊지 않고 이어갈 수 있어 작품의 완성도를 높일 수 있다.\n교사는 효과적인 수업 운영이 가능하다."]
];</script>
<script id="app">
const S=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}})(),
save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},
esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])),
flt=()=>{[...list.children].forEach(d=>d.classList.toggle("hide",only.checked&&!S.includes(+d.dataset.i)));cnt.textContent="틀림 "+S.length+" / "+QA.length};
list.innerHTML=QA.map(([q,a],i)=>`<details data-i="${i}" class="${S.includes(i)?"wrong":""}"><summary>${i+1}. ${esc(q)}</summary><p class="a">${esc(a)}</p><label class="chk"><input type="checkbox"${S.includes(i)?" checked":""}> 틀림</label></details>`).join("");
list.onchange=e=>{const d=e.target.closest("details"),i=+d.dataset.i,k=S.indexOf(i);k<0?S.push(i):S.splice(k,1);d.classList.toggle("wrong",k<0);save();flt()};
only.onchange=flt;flt();
exp.onclick=()=>{const w=[...S].sort((a,b)=>a-b).map(i=>QA[i]);if(!w.length)return alert("체크된 문항이 없습니다.");
const d=`<!doctype html><script>const KEY=${JSON.stringify(KEY+"-wrong")};<\/script>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오답 복습</title>
${document.querySelector("style").outerHTML}<h1>오답 복습 · ${w.length}문항</h1>${bar.outerHTML}<div id="list"></div>
<script>const QA=${JSON.stringify(w)};<\/script><script id="app">${app.textContent}<\/script>`,
u=URL.createObjectURL(new Blob([d],{type:"text/html;charset=utf-8"})),a=document.createElement("a");
a.href=u;a.download=KEY+"-wrong.html";a.click();URL.revokeObjectURL(u)};
cp.onclick=()=>{const t=[...S].sort((a,b)=>a-b).map(i=>i+1).join(","),ok=()=>{cp.textContent="복사됨";setTimeout(()=>cp.textContent="번호 복사",1200)},
fb=()=>{const x=document.createElement("textarea");x.value=t;document.body.append(x);x.select();try{document.execCommand("copy")}catch(e){}x.remove();ok()};
try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}};
</script>
