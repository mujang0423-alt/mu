<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미술교육론 복습 · 고대~오와토나</title>
<style>
:root{--ink:#1c1a17;--line:#e0dad0;--gold:#a8813c;--bg:#faf8f4}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;max-width:780px;margin:0 auto;padding:14px 16px 60px;background:var(--bg);color:var(--ink);line-height:1.62}
h1{font-size:1.1rem;margin:0 0 2px;letter-spacing:-.01em}
.sub{font-size:.78rem;color:#8b8378;margin:0}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;margin:10px 0 14px;display:flex;align-items:center;gap:10px;font-size:.88rem}
.bar label{display:flex;align-items:center;gap:6px;cursor:pointer}
#cnt{margin-left:auto;color:#8b8378;font-size:.76rem;font-variant-numeric:tabular-nums}
details{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;background:#fff;padding:10px 12px;margin-bottom:7px}
details[open]{border-left-color:var(--gold)}
summary{cursor:pointer;font-weight:600;font-size:.94rem}
.n{color:var(--gold);font-variant-numeric:tabular-nums;margin-right:7px;font-size:.8rem}
.a{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:.9rem;white-space:pre-line}
.w{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:.8rem;color:#9a8f7d;cursor:pointer}
.hide{display:none}
button{font:inherit;font-size:.8rem;padding:4px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:#6b6257;cursor:pointer}
#box{width:100%;height:160px;margin-bottom:12px;font-size:.78rem;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff}
</style>
</head>
<body>
<h1>미술교육론 복습</h1>
<p class="sub">고대·중세 ~ 오와토나 프로젝트</p>

<div class="bar">
  <label><input type="checkbox" id="only"> 틀린 것만</label>
  <button id="exp">내보내기</button>
  <button id="rst">초기화</button>
  <span id="cnt"></span>
</div>

<textarea id="box" class="hide" readonly></textarea>
<div id="list"></div>

<script>
const QA = [
["미술교육의 정당성 두 가지는?","본질주의적 정당성 / 맥락주의적 정당성"],
["본질주의·맥락주의적 정당성의 기본 입장은?","본질주의: 미술에는 미술만이 제공할 수 있는 고유한 본질적 가치가 있고, 그것이 인간에게 긍정적 영향을 주므로 미술교육이 필요하다.\n맥락주의: 미술은 개인이나 사회의 발전을 도모하는 유용한 수단이 될 수 있으므로 미술교육이 필요하다."],
["본질주의적 정당성의 한계점은?","① 미술교육이 학습자의 삶과 분리되어 형식적으로 흐를 수 있다.\n② 사회의 요구나 변화를 무시하기 때문에 미술 교과의 사회적 가치가 절하된다."],
["맥락주의적 정당성의 한계점은?","① 미술 교과의 독자성을 잃고 다른 교과를 위한 도구·수단으로 전락할 수 있다.\n② 사회 변화에 따라 교육 목표가 결정되므로 교육의 일관성을 유지하기 어렵다."],
["중세 수도원 학교 이후에 등장한 미술교육 조직은?","길드 — 도제 교육을 담당"],
["길드 교육의 특징은?","① 도제–직인–장인의 수직적 교육 체제\n② 모방과 모사를 통한 기술 습득이 목표"],
["르네상스 미술교육의 특징(초기/후기)은?","초기: 비공식적인 워크숍 형태. 대가와 초보자가 함께 모여 서로의 작품을 토론·연구.\n후기: 아카데미아 델 디세뇨 같은 공식 아카데미가 설립되어, 대가들이 정립한 법칙에 따라 체계적으로 지도. 원근법·해부학·기하학·인체 드로잉 등 교육과정이 체계화됨."],
["르네상스 시대 조르조 바사리가 설립한 최초의 아카데미 명칭은?","아카데미아 델 디세뇨(Accademia del Disegno)"],
["르네상스가 추구한 미술 — '데코룸(decorum)'의 뜻은?","감정을 격하게 표현하는 미술보다, 교양 있고 적절하며 중도적인 미술. (너무 감성적이지도 너무 이성적이지도 않은 중도)"],
["알베르티의 저서는?","『회화론』"],
["프랑스 왕립 회화조각 아카데미의 설립 목적은?","① 절대주의 시대 왕권 강화와 선전\n② 국가의 권력과 위신 강조\n③ 길드 세력에 대항·견제"],
["프랑스 왕립 아카데미의 교육과정 순서는?","하급: 교수의 드로잉을 보고 모사 → 석고를 보고 모사\n상급: 실물(모델) 드로잉"],
["로크가 주장한 아마추어 미술교육의 명칭과 내용은?","신사교육론. 글이나 말로 전달하는 것보다 드로잉으로 표현할 때 훨씬 정확하고 효율적이라는 점에서 드로잉의 중요성을 강조. 단, 교양으로 배워 두되 본업으로 삼아서는 안 된다고 봄."],
["로크(신사교육론)의 의의는?","최초로 미술교육이 직업 화가를 위한 전문 교육이 아니라, 엘리트 계층을 위한 일반 교육(교양 교육)으로서 역할을 했다는 점"],
["표현기능중심 미술교육의 등장 배경은?","① 산업혁명으로 제품 품질의 질적 저하가 일어남\n② 미술 아카데미(프랑스 왕립 회화조각 아카데미)의 오랜 전통을 이어받음"],
["표현기능중심 미술교육의 목적은?","산업사회에 필요한 전문 미술가·산업 디자이너 양성"],
["표현기능중심 미술교육의 성과는?","① 미술을 학교 교육의 일부분으로 자리 잡게 함\n② 시지각과 손의 협응력을 기르기 위해 합리적·과학적·체계적으로 지도\n③ 사회의 요구를 적극적으로 반영한 미술교육"],
["표현기능중심 미술교육의 한계점은?","① 학습자의 특성을 고려하지 않은 획일적 프로그램에 따른 반복 훈련 강조\n② 학생을 제품 생산을 위한 도구로 바라봄\n③ 학교생활을 단지 미래를 위한 준비 과정으로 보고 지나친 희생과 훈련을 강조"],
["독일과 영국의 표현기능중심 미술학교 명칭은?","독일: 무역학교 / 영국: 디자인학교"],
["영국 디자인학교의 교육 내용은?","교본(모범 도안)을 보고 그리는 임화 중심. 실물 드로잉은 가르치지 않음."],
["영국 디자인학교는 이후 어떻게 되었는가?","런던 만국박람회에서 최하위를 기록 → 윌리엄 다이스가 물러나고 헨리 콜로 교체. 콜은 교육과정을 이원화하고 실물 드로잉을 주장, 레드그레이브의 23단계 지도법을 도입함."],
["헨리 콜은 교육과정을 무엇과 무엇으로 이원화했나?","① 전 국민을 대상으로 한 기초(일반) 교육\n② 그 이후 전공을 희망하는 사람을 위한 특별 기술 과정(전문가 교육)"],
["아서 웨슬리 다우의 저서는?","『구성(Composition)』"],
["다우가 사용한 지도 방법은?","종합적 지도 방법(종합적 미술교육)"],
["다우가 제시한 디자인의 3요소와 원리는?","3요소: 선, 농담, 색채\n원리: 대립, 변화, 종속, 반복, 대칭"],
["다우의 시사점은?","① 응용 가능한 디자인의 요소와 원리를 체계화함\n② 교사 중심의 전통적 모방 교육과 달리, 습득한 지식을 응용할 수 있는 지도 방법을 제시하고 지도 시간을 단축함"],
["다우(종합적 지도 방법)의 한계점은?","디자인의 요소와 원리를 미술의 본질과 동일시하여 지나치게 법칙을 강조함"],
["바우하우스의 목표는?","① 모든 미술 분야를 건축을 중심으로 통합\n② 공예를 순수 미술의 경지로 끌어올림\n③ 공예·산업체 지도자들과의 지속적인 만남을 통해 학생들의 사회 진출 지원"],
["바우하우스 교육과정 3단계는?","예비교육 → 공방교육 → 건축교육"],
["바우하우스 예비교육의 내용은?","전 교육생을 대상으로 약 6개월간 재료를 다루는 방법과 기초 조형 교육을 실시"],
["바우하우스 공방교육의 내용은?","예비교육 수료생 중 도제 계약을 맺은 학생을 대상으로 약 3년간 직인 과정 진행. 형태 교육과 공작 교육을 함께 가르치고, 마지막에 수료 시험을 통과하면 직인이 됨."],
["바우하우스 건축교육의 내용은?","직인이 실제 건축 현장에 나가 보조·협력하며 현장을 체험하고, 필요한 부분은 다시 교육을 받음"],
["바우하우스의 한계점은?","기술·기능 위주의 교육에 지나치게 초점을 맞추어, 미술의 본질을 협소하게 '도구로서의 미술교육'에 국한시킴"],
["이텐의 교육 목표와 특징은?","무의식과 직관력의 육성, 내면의 해방과 정신의 정화. 색채 대비 교육과 기초 조형 교육을 강조했고, 기능 교육보다 정신적·전인적 교육을 지향함. (바우하우스 초기, 바이마르 시대)"],
["모홀리나기의 교육 목표와 특징은?","새로운 디자인의 실현. 기계와 산업 재료를 적극 활용하고 입체 작품을 많이 제작함. (이텐 이후, 기능 중심)"],
["창의성중심 미술교육의 등장 배경은?","① 표현기능중심 미술교육에 대한 반발\n② 프로이트 등 심리학의 발달\n③ 표현주의 미술의 등장\n④ 아동중심 교육사조의 확산"],
["창의성중심 미술교육의 시대적 목적은?","창의성 육성, 아동의 전인적 성장 도모, 조형 능력 함양"],
["창의성중심 미술교육의 성과는?","① 미술교육의 무게중심을 교사와 교과 내용에서 아동으로 전환시킴\n② 미술교육을 인간의 삶과 교육에서 중요한 위치로 격상시킴\n③ 아동의 표현 과정과 발달 과정의 중요성을 인식시킴"],
["창의성중심 미술교육의 한계점은?","① 지나친 자기표현 강조로 미술에 필요한 기초 기능 부족을 초래\n② 미술의 본질과 사회적 요구를 무시하고 아동의 심리적 측면만 강조\n③ 교사의 역할을 축소시켜 수업이 방임으로 흐를 위험"],
["치젝의 교육 방법 세 가지는?","① 교사 불간섭 ② 표현 재료의 선택제 ③ 그룹별 지도"],
["치젝의 '교사 불간섭' 수업은 구체적으로 어떻게 하는가?","아동과 이야기를 나누며 상상력을 고취시킨 뒤, 이야기가 끝나면 아동이 원하는 것을 자유롭게 그리게 함. 교사가 앞에 서 있는 것조차 간섭으로 여겨 일절 개입하지 않음."],
["치젝의 '표현 재료의 선택제'란?","아동이 흥미 있는 표현 재료를 직접 선택하도록 하는 것"],
["로웬펠드의 저서는?","『인간을 위한 미술교육』"],
["로웬펠드의 교육 방법은?","① 발달 단계와 표현 유형에 맞는 주제·재료·동기 부여 제공\n② 모방·베끼기·본뜨기 반대\n③ 직접적인 경험 제공\n④ 성인(교사·부모)의 간섭 배제\n⑤ 결과보다 과정 중시"],
["로웬펠드는 평가에 대해 어떻게 말했나?","평가는 아동의 관심을 표현 과정에서 결과물로 돌리기 때문에 해로운 것이라고 봄. 굳이 해야 한다면 과정 평가나 서술형 평가를 해야 한다고 함."],
["로웬펠드가 말한 창의성의 특성 — 독창성은?","새롭게 혹은 색다르게 반응하는 능력"],
["로웬펠드가 말한 창의성의 특성 — 유창성은?","짧은 시간 안에 많은 양의 아이디어를 떠올리는 능력"],
["로웬펠드가 말한 창의성의 특성 — 융통성은?","새로운 상황에 빠르게 적응하고 사고를 빠르게 전환시키는 능력(아이디어를 다양하게 낼 수 있는 능력)"],
["로웬펠드가 제시한 교사의 자질 세 가지는?","① 심리적 통찰력 ② 자아동일화 ③ 융통성"],
["교사의 자질 — 심리적 통찰력이란?","아동이 창작 과정에서 느끼는 어려움의 원인을 파악하고 공감하는 능력"],
["교사의 자질 — 자아동일화란?","어린이가 다루는 재료·매체 혹은 교사 등과 완전한 정서적 유대를 통해 하나가 되는(되고자 하는) 상태"],
["교사의 자질 — 융통성이란?","아동 개개인의 특성에 맞추어 교사가 자신의 사고를 변화시키고 적응할 수 있는 것"],
["허버트 리드의 저서는?","『예술을 통한 교육』"],
["리드가 말한 예술교육의 두 가지 원칙은?","사물에 의한 교육 / 결합에 의한 교육"],
["리드가 말한 예술교육의 세 가지 측면은?","자기표현 활동, 관찰 활동, 감상 활동"],
["리드 — 자기표현 활동이란?","개인이 자신의 사고·감정·정서를 다른 사람에게 전달하고자 하는 선천적인 욕구"],
["리드 — 직관상이란?","이전에 한 번 본 사물이 명료하게 재현되는 것. 잔상과 달리 대상이 사라진 뒤에도 오랫동안 머릿속에 남아 실제 사물이 존재하는 것처럼 몇 시간·며칠·몇 년 후에도 볼 수 있으며 재연도 가능함."],
["직관상은 주로 누구에게 나타나는가?","주로 어린 아이들에게 나타나며, 성인 중에서는 예술과 같은 창조 능력이 발달한 사람에게 잘 나타남"],
["슈타이너의 7년 주기 발달단계 중 3단계의 특징은?","감성체(아스트랄체)의 탄생과 자아의 발달. 권위의 상징이었던 어른의 영향권에서 벗어나며 추상적 사고 능력, 이성적 판단력, 감수성이 발달함."],
["슈타이너 3단계에서 교사의 역할은?","학생이 전문가로서의 판단력을 훈련할 수 있도록 명확한 형태의 지도를 해야 함"],
["슈타이너 2단계에서 교사의 역할은?","교육적 권위를 가지고 학생과 긴밀한 관계를 맺어 신뢰를 형성해야 함"],
["슈타이너의 포르멘(Formen)이란?","움직임으로부터 선과 형태를 창출하는 형태 교육. 직선과 곡선의 다양한 조합·변형을 통한 감각과 감정 훈련, 대칭 연습을 통한 성격의 균형 유지를 도모함."],
["칙센트미하이가 제시한 창의성의 세 가지 요인은?","영역, 개인, 현장(분야)"],
["칙센트미하이 — '현장'이란?","교사, 가족 등 아동을 둘러싼 실제 사람들"],
["로웬펠드와 칙센트미하이의 아동 미술 능력에 대한 관점 비교","로웬펠드: 창의성은 아동 개개인의 내부에 잠재되어 있는 것.\n칙센트미하이: 창의성은 개인과 환경(영역·현장)의 상호작용을 통해 만들어지는 것."],
["로웬펠드와 칙센트미하이의 교사 역할 비교","둘 다 조력자·촉매자로 봄. 로웬펠드는 내재된 창의성이 발현되도록 환경을 마련하고 지지하는 역할, 칙센트미하이는 학생이 새롭고 다양한 아이디어를 생성하도록 돕는 역할."],
["맥피와 윌슨은 아동의 미술 표현이 어떻게 드러난다고 했나?","맥피: 문화·인종 등 어린이가 살고 있는 환경과의 상호작용을 통해 나타난다.\n윌슨: 또래, 내러티브, 만화 등 대중문화의 영향을 받아 나타난다."],
["오와토나 프로젝트의 목적은?","① 미술을 통해 실제 사회 문제를 해결\n② 학생의 취미와 재능 개발, 완전한 인격 개발\n③ 미술에 대한 인식과 감상은 환경 안에서 발전되어야 함\n→ 궁극적으로 민주 시민 양성"],
["오와토나 프로젝트의 영향은?","① 카네기 재단의 기금이 중단된 이후에도 오와토나 공립학교들이 미술교육 프로그램을 계속 유지\n② 지역 사회 도서관의 미술 관련 서적 증가\n③ 미술을 주제로 하는 토론회와 미술 야간 수업 설립 요구 증가\n④ 학생·교사·지역 주민·미술가가 전방위적으로 참여"]
];

const list = document.getElementById('list');
const only = document.getElementById('only');
const cnt = document.getElementById('cnt');

QA.forEach(([q, a], i) => {
  const d = document.createElement('details');
  const s = document.createElement('summary');
  s.innerHTML = '<span class="n">' + String(i + 1).padStart(2, '0') + '</span>';
  s.appendChild(document.createTextNode(q));
  const body = document.createElement('div');
  body.className = 'a';
  body.textContent = a;
  const wrap = document.createElement('label');
  wrap.className = 'w';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.addEventListener('change', () => { d.dataset.wrong = cb.checked ? '1' : ''; refresh(); });
  wrap.appendChild(cb);
  wrap.appendChild(document.createTextNode('틀림'));
  d.appendChild(s); d.appendChild(body); d.appendChild(wrap);
  list.appendChild(d);
});

function refresh() {
  const all = list.querySelectorAll('details');
  let wrong = 0;
  all.forEach(d => {
    const w = d.dataset.wrong === '1';
    if (w) wrong++;
    d.classList.toggle('hide', only.checked && !w);
  });
  cnt.textContent = '틀림 ' + wrong + ' / 전체 ' + all.length;
}
only.addEventListener('change', refresh);
refresh();
</script>
</body>
</html>
