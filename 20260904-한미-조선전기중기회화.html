<h1>조선 전기·중기 회화 (0904)</h1>
<div id="b"><label><input type="checkbox" id="o"> 틀린 것만</label><button id="e">오답 내보내기</button><button id="c">번호 복사</button></div>
<div id="l"></div>
<script id="d">const QA=[["조선 전기 화단의 특징은?", "명나라와 교류. 숭유억불로 불교보다 성리학·유교가 중시됨. 도화서 설치로 화원 배출. 전기에는 북종화풍, 후기에는 남종화풍이 유행."], ["조선 전기에 수용한 중국 화풍은?", "이곽파(곽희파), 마하파, 절파, 미법산수 등."], ["양팽손 「산수도」에 보이는 16세기 안견파의 특징은?", "편파 2단 구조가 편파 3단 구도로 바뀜. 보다 넓어진 공간, 단선점준, 도식화된 산의 형체."], ["강희안 「고사관수도」를 설명하시오.", "절파의 영향을 받아 편각구도. 흑백 대비의 거친 붓터치. 절벽에 기대어 물을 바라보며 사색하는 인물로 문인적 격조와 취향을 드러냄. 생동하는 인물 표현과 풀 묘사 등 강희안의 독자적 화풍이 나타남."], ["이장손·최숙창·서문보의 미법산수 양식은?", "조선 초기 미법산수화. 선염법으로 안개를 표현하고 미점준으로 산과 언덕을 표현. 수평적·사선 구도, 청록 설채 사용."], ["고극공 계열과 미불 계열 미법산수의 차이는?", "고극공계: 가벼운 청록 설채, 두드러진 대각선 구도, 활엽수와 침엽수의 대조. 미불계: 밋밋한 언덕과 짙은 연운, 적극적인 미점준의 구사."], ["조선 중기 화단의 특징은?", "사화·당쟁과 임진왜란·병자호란으로 혼란. 어지러운 시대상이 반영되어 어초문답·탁족도·관폭·완월 등의 소재 등장. 절파화풍 유행과 한국적 화풍 형성. 고씨화보 유입으로 남종화가 전래되어 소극적으로 수용. 실경산수와 기록화 제작이 활발."], ["김시 「동자견려도」에 나타나는 절파계·안견파 특징은?", "절파계: 인물 중심의 주제, 기울어진 산, 흑백의 대조, 굴곡진 소나무, 강한 필묵법. 안견파: 단선점준, 편파 3단 구도."], ["조선 우도(牛圖)의 전형적인 양식은?", "순하고 인간적인 눈매, 초승달 같은 뿔, 소의 발굽과 풀 표현, 중국 소의 몸매(중근종), X자형 주둥이."], ["소상팔경도 – 봄철 아침나절을 배경으로 산시(山市)를 표현한 장면은?", "산시청람(山市晴嵐)."], ["소상팔경도 – 하늘에 떠오른 둥근 가을 달이 동정호에 비치는 풍경은?", "동정추월(洞庭秋月)."], ["소상팔경도 – 모래 언덕에 기러기 떼가 몰려 있거나 내려앉는 풍경은?", "평사낙안(平沙落雁)."], ["소상팔경도 – 먼 바다에서 돌아오는 돛단배 풍경은?", "원포귀범(遠浦歸帆)."], ["사대부들이 계회를 기념하여 그린 기록화로, 친목 도모와 교유를 위해 그린 그림은?", "계회도(契會圖)."], ["조속 화풍의 특징은?", "절파와 원체화풍의 영향을 받아 견각구도를 사용. 대상을 간략하게 생략하는 간결한 구도. 명대 화풍을 받아 시원하고 대담한 붓질과 선, 공간을 메우는 듯한 모자이크식 소재 배치로 짜임새 있는 화면을 구성."], ["조속 「고매서작도」가 의미하는 바는?", "희보춘선(喜報春先). 봄소식을 알리는 매화가 춘선, 기쁜 소식을 상징하는 까치가 희보."], ["윤두서 「평사낙안도」의 특징과 예찬과 다른 점은?", "위쪽에 기러기가 있음. 절대준을 사용하지 않고 선염으로 처리. 예찬식 일하양안 구도를 쓰되 중경을 예찬의 여백이 아닌 수면으로 처리한 점이 다름."], ["이경윤의 화풍은?", "절파의 영향을 받아 「고사탁족도」 등 소경산수인물화를 주로 그림."], ["「고사탁족도」의 뜻은?", "발을 씻는다는 뜻. 맹자의 창랑지수 고사에서 유래하며 은둔·초탈을 주제로 함."], ["이명욱 「어초문답도」의 내용은?", "어부와 나무꾼이 만나 대화를 나누는 내용. 물을 좋아하는 지혜로운 어부와 산을 좋아하는 어진 나무꾼의 만남이 은일사상의 이상적 결합을 상징."], ["「어초문답도」가 유행한 시대적 배경은?", "임진왜란·병자호란 등 전란이 발발하고 정치적으로 사색당쟁이 계속되어 불안하고 어지러운 시대 분위기가 지속됨."], ["이정 「풍죽도」의 특징은?", "조선 특유의 묵죽이 형성되는 초기 단계. 앞의 대나무는 농묵으로 강하게, 뒤의 대나무는 담묵으로 처리한 점이 특징."], ["풍죽이 상징하는 것은?", "외부 압력에 굴하지 않는 선비의 절조."], ["어몽룡 「월매도」를 설명하시오.", "조선 특유의 묵매 양식을 창안. 위로 뻗어 나간 어린 가지는 새 시대에 대한 희망을, 늙은 가지는 어지러운 현실을 뜻함. 미수상락의 의미를 담음."], ["미수상락(眉壽上樂)의 뜻은?", "눈썹이 하얗게 세도록 장수하며 살라는 뜻."], ["묵포도도의 의미와 표현 특징은?", "많은 열매를 맺으므로 다산을 의미. 농담의 변화가 두드러진 묵법과 과감하고 대담한 포치. 아래에서 위로 농담을 달리해 입체감을 표현하고 선염법·몰골법 사용. 가운데 X자로 교차한 대각선 구도. 근경과 중경을 강조하고 원경은 생략하되 흐리게 하기보다 오히려 진하게 처리."], ["김명국 「달마도」의 특징은?", "감필법의 간결하고 대담한 필선으로 그림. 달마가 서역인의 인상을 하고 있으며 고집스러운 표정이 드러남."], ["안견 「몽유도원도」를 설명하시오.", "안평대군의 꿈을 그린 관념산수로 두루마리 형식이며 제발과 찬시가 많이 적혀 있음. 곽희파의 영향으로 조광 효과, 운두준, 해조묘, 부감법이 나타남. 독특한 점은 왼쪽에서 오른쪽 위로 전개되는 이야기 구성, 흩어진 경물의 조합, 현실 세계와 도원 세계를 한 화면에 표현한 점."], ["「몽유도원도」에 담긴 사상은?", "어지러운 현실에서 벗어나고 싶은 마음을 담은 도교의 무위자연 사상. 유교적 요소도 함께 나타남."], ["이암 회화의 특징은?", "영모화를 주로 그림. 중국이 사실적이고 세밀하게 그린 것과 달리 해학적이고 친근하게 표현."], ["이암이 사용한 기법은?", "구륵전채법과 몰골법, 선염, 관념적 배경, 대각선 구도."]];</script>
<script id="s">
const L=document.getElementById('l'),O=document.getElementById('o');
let W={};try{W=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(W))}catch(e){}};
const ft=()=>[...L.children].forEach((d,i)=>d.hidden=O.checked&&!W[i]);
const N=()=>Object.keys(W).map(Number).sort((a,b)=>a-b);
QA.forEach((q,i)=>{
 const d=document.createElement('details');
 d.innerHTML='<summary>'+(i+1)+'. '+q[0]+'</summary><div class="a">'+q[1]+'</div><label class="w"><input type="checkbox"> 틀림</label>';
 const c=d.querySelector('input');c.checked=!!W[i];d.classList.toggle('x',!!W[i]);
 c.onchange=()=>{c.checked?(W[i]=1):(delete W[i]);d.classList.toggle('x',c.checked);sv();ft()};
 L.appendChild(d);
});
O.onchange=ft;ft();
const fb=t=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();alert('복사: '+t)};
document.getElementById('c').onclick=()=>{const t=N().map(i=>i+1).join(',');try{navigator.clipboard.writeText(t).then(()=>alert('복사: '+t),()=>fb(t))}catch(e){fb(t)}};
document.getElementById('e').onclick=()=>{
 const s=N().map(i=>QA[i]);if(!s.length)return alert('체크된 문항이 없습니다.');
 const h='<!doctype html><meta charset="utf-8"><script>const KEY="'+KEY+'-wrong";<\/script><title>'+document.title+' 오답</title>'+document.querySelector('style').outerHTML+'<h1>'+document.querySelector('h1').textContent+' — 오답</h1>'+document.getElementById('b').outerHTML+'<div id="l"></div><script>const QA='+JSON.stringify(s)+';<\/script><script>'+document.getElementById('s').textContent+'<\/script>';
 const u=URL.createObjectURL(new Blob([h],{type:'text/html'})),a=document.createElement('a');a.href=u;a.download=KEY+'-wrong.html';a.click();URL.revokeObjectURL(u);
};
</script></body></html>
