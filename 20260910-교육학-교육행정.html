<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<script>const KEY="0910-교육학-교육행정";
const QA=[["핼핀과 크로프트 학교 조직 풍토론에서 교사의 행동 특성 4가지는?","사기, 장애, 친밀, 일탈"],["핼핀과 크로프트 학교 조직 풍토론에서 교장의 행동 특성 4가지는?","추진, 인화, 냉담, 과업"],["핼핀과 크로프트의 개방적 풍토란?","교사의 사기와 교장의 추진성이 매우 높아 활기차고 생기 있는 조직 풍토. 교장이 과업을 강조하지 않아도 교사들이 목표 달성에 헌신하며 개인적·사회적 욕구도 충족되는 가장 바람직한 풍토."],["핼핀과 크로프트의 폐쇄적 풍토란?","교사는 사기가 극도로 떨어져 업무에 무관심하고, 교장은 냉담하며 불필요한 일과 과업만 지나치게 강조하는 비효율적 풍토. 가장 바람직하지 못한 풍토."],["호이와 미스켈의 교사 행동 특성 3가지는?","협동적, 친밀적, 일탈적"],["호이와 미스켈의 교장 행동 특성 3가지는?","지원적, 지시적, 제한적"],["호이와 미스켈에서 지시적 행동과 제한적 행동의 차이는?","· 지시적: 교사들의 개인적 욕구에 전혀 관심을 두지 않는 엄격한 과업 지향 정도\n· 제한적: 교사들이 업무를 수행할 때 장애를 주는 정도"],["피들러의 상황적 지도성이란?","상황의 호의성에 따라 지도성 유형을 달리해야 한다는 이론."],["상황의 호의성이란?","상황이 지도자로 하여금 집단에 대하여 영향력을 행사할 수 있게 하는 정도."],["상황 호의성의 3요소는?","지도자-구성원 관계, 과업 구조(명확하게 규정되고 구조화되어 있어야 함), 지도자의 지위 권력"],["피들러 이론에서 상황이 호의적/비호의적일 때와 중간일 때 각각 유리한 지도성은?","· 매우 호의적이거나 매우 비호의적일 때: 과업 지향적 지도자\n· 중간일 때: 관계 지향적 지도자"],["허시와 블랜차드의 상황적 지도성이란?","구성원의 성숙도에 따라 지도성 유형을 달리해야 한다는 이론. 성숙도는 직무 성숙도와 (동기 수준을 뜻하는) 심리적 성숙도를 의미."],["허시와 블랜차드에서 구성원의 능력과 동기가 모두 낮을 때 유리한 유형은?","지시형(과업 지향적 지도자)."],["허시와 블랜차드의 지도성 4유형은?","지시형(Q1) → 지도형(Q2) → 지원형(Q3) → 위임형(Q4)"],["전문적 관료제란?","학교 조직이 관료제적 특성과 전문직적 특성을 모두 지니고 있다는 것."],["학교 조직의 관료제적 특성은?","분업과 전문화, 권위의 위계화, 경력 지향성, 규칙과 규정 강조, 몰인정성"],["학교 조직의 전문적 특성은?","자유재량권 부여, 직무 수행의 통일된 표준과 엄격한 감독이 없음, 의사결정 참여 보장"],["권위의 위계화의 순기능과 역기능은?","· 순기능: 원활한 순응과 조정이 가능\n· 역기능: 의사소통의 장애 발생"],["민츠버그 조직 이론에서 전문적 관료제의 조직 구성 요소와 조정 기제는?","· 조직 구성 요소: 핵심 운영층\n· 조정 기제: 기술의 표준화"],["민츠버그의 전문적 관료제의 특징은?","분권화와 표준화가 동시에 허용되며, 전문가에게 많은 자율성을 보장하고 민주적인 관계를 형성함."],["이완조직(이중조직)이란?","조직화되어 있고 상호 관련성은 있으나, 구조적으로 느슨하게 결합되어 각 부분이 독립성을 유지하는 조직."],["이완조직에서 국지적 허용을 하는 이유는?","위험 부담을 낮추고 전문성을 존중하며, 환경 변화에 적응하기 위해 이질적인 요소가 공존하는 것을 허용하고 기발한 해결책의 개발을 장려하기 위함. 한 부분에서 일어난 문제가 다른 부분으로 퍼지지 않음."],["이완조직에서 구성원의 재량은 어떠한가?","학교 구성원에게 많은 자유재량권을 부여하여 교사가 전문가로서 자유재량권을 행사할 수 있게 함."],["블라우와 스콧은 무엇을 기준으로 조직 유형을 나누었는가?","조직의 혜택을 받는 주요 수혜자."],["블라우와 스콧의 분류에서 학교는 어떤 조직인가?","봉사 조직. 1차적 수혜자가 조직과 접촉하는 일반 대중으로서, 고객에게 서비스를 제공하는 데 주요 관심이 있는 조직."],["의사결정 모형의 유형은?","합리 모형, 만족 모형, 점증 모형, 혼합 모형, 최적 모형, 쓰레기통 모형"],["혼합 모형이란?","합리 모형과 점증 모형을 결합한 것으로, 기본 방향 설정은 합리 모형에 따르고 세부적인 문제 해결은 점증 모형에 따름."],["혼합 모형의 장점은?","· 합리 모형과 점증 모형의 장점을 결합해 현실적이면서도 바람직한 방향 제시\n· 장기 전략과 단기적 변화를 동시에 이룰 수 있음\n· 복잡하고 불확실한 상황에 실용적으로 접근 가능"],["혼합 모형의 비판점은?","· 의사결정 과정이 다소 불분명함\n· 기본 방향에 대한 결정을 제외하면 점증 모형과 크게 다를 것이 없음\n· 기존 모형을 절충·혼합한 것에 불과하여 이론적 독자성이 떨어짐"],["최적 모형이란?","합리성과 초합리성을 동시에 고려하여 최적치를 추구하는 모형."],["최적 모형에서 말하는 초합리성이란?","직관적 판단, 창의력, 상상력."],["최적 모형의 장점은?","초합리적인 요인을 의사결정에 포함시켜 창의적이고 혁신적인 의사결정이 가능함."],["최적 모형의 단점(비판점)은?","· 불분명한 초합리성에 의존하고 있어 다소 비현실적이고 너무 이상적임\n· 의사결정에 비합리적인 요소를 고려한다는 것 외에는 합리 모형의 범위를 크게 벗어나지 못함"],["동료 장학이란?","둘 이상의 교사가 짝을 지어 서로의 수업을 봐 주면서 자신의 전문성을 향상시키는 장학."],["동료 장학의 장점은?","· 자유로운 의사 교환과 피드백이 가능\n· 동료 관계를 증진할 수 있음\n· 학교의 인적 자원을 활용하므로 복잡한 절차 없이 간편하고 손쉬움"],["조하리의 창은 무엇을 기준으로 영역을 나누는가?","자신에 관한 정보가 ①자신에게 알려진 경우와 알려지지 않은 경우, ②타인에게 알려진 경우와 알려지지 않은 경우. (개-맹-잠-미)"],["자신에 관한 정보가 타인에게는 알려져 있으나 자신에게는 알려져 있지 않은 영역은?","맹목적 영역(blind area) → 맹목형 의사소통."],["자신에 관한 정보가 자신에게는 알려져 있으나 타인에게는 알려져 있지 않은 영역은?","잠재적 영역(secret) → 비밀형 의사소통."],["자신에게도 타인에게도 알려져 있지 않은 영역은?","미지적 영역(unknown area)."],["갈등의 순기능은?","· 다음에 일어날 갈등을 미연에 방지할 수 있음\n· 조직에 새로운 바람을 불어넣을 수 있음\n· 원만하게 해결되면 조직의 성장에 기여함"],["토마스의 갈등 관리 전략 5가지 유형은?","경쟁, 회피, 수용, 협력, 타협"],["협력이 적절한 상황은?","· 목표가 학습하는 것일 때\n· 합의와 헌신이 중요할 때\n· 양자의 관심사가 매우 중요할 때\n· 다른 사람들로부터 통찰력을 통합하기 위해"],["회피가 적절한 상황은?","· 쟁점이 사소한 것일 때\n· 사태를 진정시키고자 할 때\n· 다른 문제가 해결되면 자연스럽게 해결될 수 있는 하위 갈등일 때"],["수용이 적절한 상황은?","· 자기가 잘못한 것을 알았을 때\n· 더 중요한 문제를 위해 좋은 관계를 유지해야 할 때\n· 패배가 불가피하여 손실을 최소화해야 할 때\n· 다른 사람에게 더 중요한 사항일 때"],["조건정비설이란?","교육행정을 '교육을 위한 행정'으로 보는 입장. 교육 목표를 효율적으로 달성하기 위해 필요한 인적·물적 조건을 정비 및 확립하는 수단적·봉사적 활동으로 파악함. (↔ 국가공권설: 행정 우위, '교육에 관한 행정')"],["커의 리더십 대용 상황 모형에서 대용 상황·억제 상황 외의 상황 변인 3가지는?","과업 특성, 구성원 특성, 조직 특성(역할과 절차의 공식화, 구성원의 응집력, 권력의 강도 등)"]];</script>

const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const btn=(x,f)=>{const b=el("button");b.type="button";b.textContent=x;b.onclick=e=>{e.preventDefault();f()};return b};
let M={};try{M=JSON.parse(localStorage.getItem(LK))||{}}catch(e){}
const store=()=>{try{localStorage.setItem(LK,JSON.stringify(M))}catch(e){}};
const ui=[];

function view(i){
  const u=ui[i],m=M[i]||{},has=!!((m.t&&m.t.trim())||(m.img&&m.img.length));
  u.box.innerHTML=has?esc(m.t||"")+(m.img||[]).map(p=>'<img loading="lazy" src="'+esc(RAW+enc(p))+'">').join(""):"";
  u.box.style.display=has?"":"none";
  u.btn.textContent=has?"메모 수정":"＋ 메모";
}
function shrink(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,1400/Math.max(im.width,im.height)),c=el("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  const d=c.toDataURL("image/jpeg",.82);URL.revokeObjectURL(im.src);res({url:d,b64:d.split(",")[1]})};
  im.onerror=()=>rej(new Error("이미지를 읽지 못함"));im.src=URL.createObjectURL(f)})}
async function get(){
  const r=await fetch(API+enc(PATH)+"?ref="+BR+"&t="+Date.now(),{headers:{Authorization:"Bearer "+tok()},cache:"no-store"});
  if(r.status===404)return{d:{},sha:null};
  if(!r.ok)throw new Error("읽기 실패 "+r.status);
  const j=await r.json();let d={};try{d=JSON.parse(ub64(j.content))||{}}catch(e){}
  return{d:d,sha:j.sha};
}
async function put(p,content,msg,sha){
  const b={message:msg,content:content,branch:BR};if(sha)b.sha=sha;
  const r=await fetch(API+enc(p),{method:"PUT",headers:{Authorization:"Bearer "+tok(),"Content-Type":"application/json"},body:JSON.stringify(b)});
  if(!r.ok){let m=r.status;try{m=(await r.json()).message||m}catch(e){}const e=new Error(m);e.status=r.status;throw e}
}
async function commit(i,v){
  for(let n=0;;n++){
    const g=await get(),d=g.d;if(v)d[i]=v;else delete d[i];
    try{await put(PATH,b64(JSON.stringify(d,null,1)),"메모: "+NAME+" "+(i+1)+"번",g.sha);M=d;store();return}
    catch(e){if(n>=2||(e.status!==409&&e.status!==422))throw e}
  }
}
function thumb(src,rm){const w=el("span","mm-th"),im=el("img"),x=el("b");im.src=src;x.textContent="×";x.onclick=rm;w.append(im,x);return w}

function edit(i){
  const u=ui[i],m=M[i]||{},imgs=(m.img||[]).slice(),adds=[];
  const ta=el("textarea");ta.value=m.t||"";ta.placeholder="모르는 단어 뜻, 보충 설명…";
  const th=el("div"),fi=el("input"),st=el("span","mm-st");
  fi.type="file";fi.accept="image/*";fi.multiple=true;fi.style.display="none";
  const draw=()=>{th.innerHTML="";
    imgs.forEach((p,k)=>th.append(thumb(RAW+enc(p),()=>{imgs.splice(k,1);draw()})));
    adds.forEach((a,k)=>th.append(thumb(a.url,()=>{adds.splice(k,1);draw()})))};
  fi.onchange=async()=>{for(const f of fi.files){try{adds.push(await shrink(f))}catch(e){st.textContent=e.message}}fi.value="";draw()};
  const close=()=>{u.ed.innerHTML="";u.ed.style.display="none";u.bar.style.display="";view(i)};
  const ok=btn("저장",async()=>{
    if(!tok()){st.textContent="허브(index)에서 '토큰'을 먼저 저장해야 해요";return}
    ok.disabled=true;
    try{
      const paths=[];
      for(let k=0;k<adds.length;k++){
        st.textContent="사진 올리는 중 "+(k+1)+"/"+adds.length;
        const p="memo/img/"+NAME+"-"+(i+1)+"-"+Date.now().toString(36)+k+".jpg";
        await put(p,adds[k].b64,"메모 사진: "+NAME);paths.push(p);
      }
      st.textContent="저장 중…";
      const t=ta.value.replace(/\s+$/,""),all=imgs.concat(paths);
      await commit(i,(t||all.length)?{t:t,img:all}:null);
      ds.forEach((_,k)=>{if(k!==i)view(k)});close();
    }catch(e){st.textContent="저장 실패: "+e.message;ok.disabled=false}
  });
  u.ed.innerHTML="";u.ed.append(ta,th,fi,btn("사진 추가",()=>fi.click()),ok,btn("취소",close),st);
  u.bar.style.display="none";u.ed.style.display="";draw();ta.focus();
}

ds.forEach((d,i)=>{
  const w=el("div","mm"),box=el("div","mm-box"),bar=el("div"),ed=el("div"),b=btn("＋ 메모",()=>edit(i));
  bar.append(b);ed.style.display="none";w.append(box,bar,ed);d.append(w);
  ui[i]={box:box,bar:bar,ed:ed,btn:b};view(i);
});

(async()=>{try{
  let d;
  if(tok())d=(await get()).d;
  else{const r=await fetch(RAW+enc(PATH)+"?t="+Date.now(),{cache:"no-store"});if(r.status===404)d={};else if(r.ok)d=await r.json();else return}
  M=d||{};store();ds.forEach((_,k)=>{if(ui[k].ed.style.display==="none")view(k)});
}catch(e){}})();
})</script>
</body></html>
