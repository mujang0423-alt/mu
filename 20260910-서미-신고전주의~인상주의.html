<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<script>const KEY="0910-서미-신고전주의~인상주의";
const QA=[["신고전주의의 등장 배경은?","· 향락적 로코코에 대한 반동\n· 계몽주의의 이성·합리성\n· 빈켈만·레싱의 고대 연구, 폼페이 유적 발굴 → 그리스·로마 동경 풍토\n· 프랑스 혁명기의 혼란 속에서 애국심·역사의식·윤리 규범을 고취시킬 필요성 대두"],["신고전주의의 형태 표현 특징은?","소묘(데생)를 중시하여 정확한 형태와 비례를 사용."],["앵그르의 특징은?","· 자신이 원하는 미적 아름다움을 위해 인체를 의도적으로 왜곡\n· 에로틱하거나 이국적인 주제 선호\n· 사물의 질감과 광택을 정교하게 묘사\n· 그 외에는 다비드 등 신고전주의와 대체로 유사"],["낭만주의의 등장 배경은?","· 미술사적으로 바로크의 영향\n· 신고전주의의 차갑고 이성적인 양식에 대한 반발\n· 계몽주의 이성 중심주의에 대한 반발\n· 낭만주의 문예사조의 영향\n· 산업혁명과 프랑스 혁명"],["낭만주의는 어떤 것을 주제로 삼았나?","감정과 직관에 의존하는 표현을 추구하며 당대 시사적 사건, 동방적·이국적 소재, 중세, 신화, 고전문학, 상상 등 다양한 소재를 다룸."],["오리엔탈리즘 / 엑조티시즘 / 튀르크리의 차이는?","· 오리엔탈리즘: 동방적 취미·정서\n· 엑조티시즘: 이국적 취미. 자기 나라에서 멀리 떨어진 미지의 이국을 취재하여 비현실적인 미의 이데아를 표현 수단으로 삼는 것\n· 튀르크리: 터키 취미"],["제리코 <메두사호의 뗏목>의 소재는?","프랑스 선박이 아프리카 해안에서 난파했을 때, 정부 인맥으로 뽑힌 무능한 선장 때문에 생존자들이 뗏목 위에서 표류하다 대부분 사망한 당대의 실제 사건."],["<메두사호의 뗏목>에 나타난 낭만주의적 특징은?","· 당대 시사적 주제 사용\n· 실제 사건을 그대로가 아니라 더 극적으로 연출\n· 현실감과 함께 격렬한 동세\n· 강한 명암의 색채 등 극적 요소\n· 역동적인 인물 표현"],["들라크루아 <민중을 이끄는 자유의 여신>에 대해 설명하시오.","· 배경: 부르봉 왕조 복고에 반대해 일어난 프랑스 7월 혁명\n· 강한 명암 대비\n· 역동적인 화면 구성\n· 보색과 원색의 사용"],["윌리엄 터너의 채색상 특징(이점)은?","갈색·다갈색 바탕칠(임프리마투라) 대신 흰색 바탕을 사용하고, 노란색 같은 밝은 색은 광도를 높이기 위해 희석하지 않고 그대로 사용하여 완성작을 더 환하게 만듦."],["터너 <비, 증기, 속도>에 사용된 기법은?","스컴블링 기법."],["터너 <영국 국회의사당 화재>는 어떤 식으로 표현되었나?","화재 사건 당시의 인상을 기억했다가, 실제 사건보다 더 왜곡·과장되게 표현하여 격한 감정을 전달하고자 함. 원근법보다 색채를 강조."],["프리드리히의 카프리치오(capriccio)란?","폐허에 관한 낭만적 상상화. 작가의 상상력을 가미해 표현한 즉흥적 성격의 그림(기상곡)."],["레푸수아르(repoussoir)란?","'밀어내다·물리치다'라는 뜻의 프랑스어로, 전경에 위치하여 관람자의 시선을 화면에 집중시키는 역할을 하는 인물이나 물체. 배경이 소퇴되는 듯한 효과를 유발."],["미국 허드슨강 화파(토머스 콜, 비어슈타트)의 표현 특징은?","· 자연과 인간이라는 두 주제. 자연은 풍경으로, 인간은 자기 일에 열중하는 보통 사람들로 표현\n· 미국의 광대한 자연을 경이롭게 극대화\n· 현실이 뒤섞인 낭만주의적 풍경화\n· 근경은 자세히, 원경은 멀어질수록 사라질 듯 흐릿하게"],["코로, 밀레가 속한 유파는?","바르비종파(퐁텐블로파). ※ 퐁타벤파는 고갱과 관련된 종합주의 유파로 다름."],["바르비종파의 특징은?","고전적·낭만적 자연관을 거부하고 직접 야외로 나가 프랑스의 자연을 그림. 관찰력과 자연에 대한 깊은 사랑을 바탕으로 한 자연주의적 성격."],["코로가 표현하고자 한 것은?","객관적 양식의 고전적 풍경화 기법에 자연의 정취를 담되, 낭만주의처럼 이상화하지 않고 '자연에서 포착되는 순간의 진실'을 표현하고자 함."],["밀레의 특징은?","· 농민의 노동하는 모습을 고귀하고 장엄하게 표현\n· 시골 생활 현실을 기념비적으로 포착했다는 점에서 사실주의로 분류되기도 함\n· 그러나 프랑스 사실주의와 달리 대지에 대한 낭만주의적 심정과 강한 감정 표현이 특징"],["사실주의의 등장 배경은?","· 사회경제적: 산업혁명, 2월 혁명\n· 사상적: 사회주의 사상, 콩트의 실증주의, 마르크스주의"],["사실주의의 목적은?","현실을 왜곡하거나 이상화하지 않고 있는 그대로 사회의 모습을 전달하는 것. 도시 빈민이나 노동자가 처한 현실을 거대한 화면에 적나라하게 드러냄."],["사실주의의 의의(이점)는?","미술의 역할을 사회 부조리를 고발하고 사회 문제에 직접 참여하는 역할까지 확장시킴."],["쿠르베가 영향받은 낭만주의 작가는?","제리코와 들라크루아. 이들에게서 사실적 요소의 영향을 받음."],["쿠르베 <오르낭의 매장>의 특징은?","6m가 넘는 대작 화면에 노동계급의 장례식을 그려 지나치게 세속적이고 비관습적이라는 논란을 일으킴. '낭만주의의 매장'을 상징하는 것으로 읽힘."],["<오르낭의 매장>이 출품을 거부당한 곳과 그 결과는?","1855년 만국박람회 출품이 거부됨. 이 일이 '사실주의'라는 명칭이 등장하는 계기가 됨."],["<오르낭의 매장>이 전통 회화에서 수용한 점과 부정한 점은?","· 수용: 다수의 인물, 거대한 캔버스 규모\n· 부정: 이전까지 쓰이지 않던 세속적 주제(하층민의 장례식)를 다루고, 주제를 이상화하지 않고 그대로 표현"],["도미에가 주로 사용한 기법은?","캐리커처와 석판화(리토그래피)."],["도미에 <3등 열차>에 대해 설명하시오.","인물의 윤곽선이 강조되고 색채가 단조롭게 제한되어 유화이면서도 저널리즘 삽화 같은 분위기를 풍김. 산업혁명으로 인한 열차의 계급 구분과 서로 무관심한 서민들의 모습을 사회 비판적으로 접근."],["미국 사실주의 작가는?","토머스 에이킨스, 휘슬러."],["토머스 에이킨스가 영향받은 것은?","에드워드 머이브리지의 크로노포토그래피(연속 사진 기법)."],["크로노포토그래피란?","연속 사진 기법. 대상의 움직임을 연속적 이미지로 제시하는 방식."],["토머스 에이킨스가 큰 영향을 미친 유파는?","애시캔파."],["휘슬러가 주장한 것은?","유미주의. '예술을 위한 예술'을 주장하며 예술은 오로지 미의 추구를 강조해야 한다고 봄."],["휘슬러의 표현 특징은?","어떤 주제를 표현하기보다 장식적인 디자인·문양을 실험하는 성격이 짙음. <검은색과 금색의 야상곡>은 극단적인 비재현성을 추구하여 추상적으로 그려짐."],["토널리즘이란?","1880년대 미국에서 시작된 풍경화 중심의 미술사조로, 세밀한 묘사보다는 어조와 색조를 통해 감정과 분위기를 표현하는 방법."],["인상주의의 등장 배경은?","· 미술사적: 터너, 바르비종파, 우키요에의 영향\n· 사회적: 산업혁명, 자유주의 사상의 대두로 개성 중시\n· 과학·기술적: 사진기, 튜브 물감의 발명, 색채 이론\n· 아카데미 미술에 대한 반발"],["인상주의의 표현 특징은?","· 대상의 일부가 잘려 나가는 파격적 구도\n· 평면적인 화면, 비위계적 구성\n· 짧고 빠른 붓질\n· 일본 목판화의 영향으로 강한 원색, 형의 단순화, 역동적인 대각선 구도\n· 근대 사회의 생활 모습과 자연을 주제로 전면에 부각"],["마네가 이전의 전통 회화와 다른 점은?","· 전통적으로 받아들여지지 않던 파격적인 주제 사용\n· 원근감의 결여\n· 평면적인 색면\n· 환영적인 양감 제거"],["모네 <해돋이 인상>의 표현 특징은?","빠르고 짧은 붓질을 사용하고, 시시각각 변화하는 빛의 효과를 포착함으로써 회화에 시간성을 도입."],["야외에서 캔버스를 펼치고 풍경을 보며 그리는 기법은?","앙플레르(en plein air). 외광파 화풍이라고도 함."],["드가가 다른 인상주의 작가들과 다른 점은?","· 야외가 아닌 실내에서 작업\n· 도박, 카페, 술집 등을 주제로 삼음\n· 스냅샷 같은 파격적인 구도\n· 인체 형태를 정확히 표현하고 견고한 윤곽선을 사용\n· 화면에 깊이감을 표현"],["드가가 '최초로' 시도한 두 가지는?","· 재료: 최초로 파스텔을 완성작으로 전시\n· 기법: 최초로 에드워드 머이브리지의 연속 사진 기법을 회화에 적용"],["플라뇌르(flâneur)란?","정장을 차려입고 공원(도시)을 산책하는 사람들을 뜻하는 말."],["로댕이 전통 조각에 반발한 점은?","· 좌대를 없애 전통 조각의 기념비성을 제거\n· 인상주의적으로 빛을 조각에 도입\n· 대상을 사실적으로 표현\n· <발자크상>처럼 작가의 감정에 따라 대상을 왜곡하여 표현"],["로댕은 빛을 어떻게 도입했는가?","손자국 등을 이용해 표면에 질감 자국을 많이 내어 울퉁불퉁한 표면에 빛이 비치면서 반사되도록 함."],["마르코타주란?","완성작·미완성작에서 부분을 따와 결합하는 기법. 파편화된 각각의 인체를 서로 결합함으로써 인체 자체를 독립된 물체로 인식하는 새로운 관점을 제시하고 서사성을 제거함."],["<칼레의 시민들>에서 나타나는 특이한 점은?","· 기념비 조각이 갖춰야 할 이상성·숭고함과 거리가 멂\n· 좌대를 최소화하여 관람자와 눈높이를 맞춤\n· 인물들의 시선을 통해 열린 공간을 구성하여 기존 조각이 갖는 닫힌 구조에서 벗어남"]];</script>
<style>
body{font:16px/1.6 system-ui,-apple-system,'Malgun Gothic',sans-serif;margin:0;padding:12px;background:#fafafa;color:#222}
.top{position:sticky;top:0;background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.top b{font-size:15px}.top span{color:#666;font-size:13px;margin-left:6px}
.top label{margin-right:8px;font-size:14px;cursor:pointer}
button{font:inherit;font-size:14px;padding:5px 10px;margin:4px 4px 0 0;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
.c{background:#fff;border:1px solid #e2e2e2;border-radius:8px;margin-bottom:8px;padding:8px 10px}
.c.x{background:#fff2f2;border-color:#e79a9a}
.w{float:right;font-size:13px;color:#c00;cursor:pointer;user-select:none}
summary{cursor:pointer;font-weight:600;padding-right:56px}
.a{margin-top:8px;padding-top:8px;border-top:1px dashed #ddd;white-space:pre-wrap;color:#333}
</style>
</head><body>
<script>
const SELF=document.currentScript;
let ST=[];try{ST=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
document.title=KEY;
const hd=document.createElement('div');hd.className='top';
hd.innerHTML='<b>'+KEY+'</b><span id=cnt></span><br><label><input type=checkbox id=only> 틀린 것만</label><button id=ex>오답 내보내기</button><button id=cp>번호 복사</button>';
document.body.appendChild(hd);
const list=document.createElement('div');document.body.appendChild(list);
const render=()=>{const o=only.checked;[...list.children].forEach((c,i)=>c.style.display=o&&!ST[i]?'none':'');cnt.textContent=' 틀림 '+ST.filter(Boolean).length+' / '+QA.length};
QA.forEach(([q,a],i)=>{const c=document.createElement('div');c.className='c';
c.innerHTML='<label class=w><input type=checkbox> 틀림</label><details><summary>'+(i+1)+'. '+q+'</summary><div class=a>'+a+'</div></details>';
const b=c.querySelector('.w input');b.checked=!!ST[i];c.classList.toggle('x',!!ST[i]);
b.onchange=()=>{ST[i]=b.checked;c.classList.toggle('x',b.checked);save();render()};list.appendChild(c)});
only.onchange=render;render();
ex.onclick=()=>{const w=QA.filter((_,i)=>ST[i]);if(!w.length)return alert('체크된 문항이 없습니다.');
const s='<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><script>const KEY='+JSON.stringify(KEY+'-wrong')+';\nconst QA='+JSON.stringify(w)+';<\/script>'+document.querySelector('style').outerHTML+'</head><body>'+SELF.outerHTML+'</body></html>';
const u=URL.createObjectURL(new Blob([s],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=KEY+'-wrong.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1e3)};
cp.onclick=()=>{const t=QA.map((_,i)=>ST[i]?i+1:0).filter(Boolean).join(',');
const fb=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(e){}x.remove();alert(t||'없음')};
try{navigator.clipboard.writeText(t).then(()=>alert(t||'없음'),fb)}catch(e){fb()}};
</script>
</body></html>
