["15·16·17세기 산수화 구도의 특징은?","15C: 편파 2단 구도\n16C: 편파 3단 구도(근·중·원경), 공간감 깊어짐\n17C(이징): 언덕이 중심으로 이동, 깊어진 공간감, 여러 군봉"],

["이장손·최숙창·서문보 산수에서 미불·미우인계 미법산수와 고극공계 미법산수의 특징은?","미불·미우인계: 측필 미점, 습윤한 분위기, 적극적 미점준\n고극공계: 청록 설채, 대각선 구도, 활엽수·침엽수"],
["신사임당 초충도의 특징과 수박·쥐의 상징은?","선명한 채색, 상징이 담긴 그림\n수박: 다산 / 쥐: 다산·부(저장)"],
["김시 소 그림(우도)의 양식 특징은?","해학적 얼굴, X자형 주둥이, 점선으로 된 등, 농묵의 뿔과 발굽"],
["소상팔경 중 저녁 강가에 눈 내리는 풍경은?","강천모설(江天暮雪)"],
["소상팔경 중 안개 낀 산사에서 종소리 울리는 풍경은?","연사모종(煙寺暮鐘)"],
["김명국 등 절파 후기 화풍의 명칭과 특징은?","광태사학파\n거칠고 농담 대비가 강함, 강한 흑백 대비, 거친 부벽준, 기울어진 주산, 인물 강조"],
["윤두서가 종합적 화풍을 이뤘다고 하는 이유는?","조선 중기 절파 요소가 강하지만 남종화풍을 소극적으로 수용"],
["윤두서 채애도(나물캐기)가 시작을 알린 것과 영향 사상은?","풍속화(속화)의 시작\n실학 사상 → 사실적·세밀한 묘사"],
["정선 금강전도의 음양 조화를 준법과 함께 설명하면?","주역 원리 반영\n암산: 상악준, 날카로운 필치, 희게 표현\n토산: 피마준·미점, 부드럽고 짙고 습윤하게"],
["금강전도에서 음과 양은?","음: 토산 / 양: 암산"],
["심사정 하마선인도의 표현 방법과 고사는?","지두화, 유해희섬 고사"],
["하마선인도의 유해가 상징하는 것은?","길상과 재물"],
["강희언 인왕산도의 정선 화풍과 서양 화풍은?","정선: 미점준, 소나무 수지법, 암벽 필법\n서양: 푸른 담채의 하늘, 수채화풍 연운, 명암법, 투시원근법"],
["강서대묘의 북벽·서벽·천장에 그려진 것은?","북벽 현무, 서벽 백호, 천장 황룡"],
["노영 지장보살도의 의의는?","금강산을 실경으로 그린 최초의 그림, 현존 가장 오래된 금강산도"],
["이제현 기마도강도에서 나무에 쌓인 흰 눈의 표현 방법은?","흰 부분을 남겨두는 유백법"],
["조선 초기 화단의 특징은?","북송 원체화풍, 남송 마하파, 절파, 원대 고극공계 미법산수 유입 → 안견파 형성"],
["몽유도원도가 시서화 3절의 종합예술인 이유와 발문 서체는?","안평대군의 제서·발문 + 21명의 찬시 + 안견의 그림\n발문 서체: 송설체"],
["양팽손 산수의 16세기 안견파 특징은?","편파 3단 구도(근·중·원경), 확대지향적 공간, 단선점준"],
["이상좌 송하보월도의 마하파 특징과 마하파와 다른 점은?","일각구도, 굴절된 소나무, 인물의 적지 않은 비중, 생략적 원경\n다른 점: 부벽준을 쓰지 않음(바위는 안견파 필법에 가까움)"],
["조선 중기 화단의 특징은?","절파화풍 유행, 은일사상, 실경산수·기록화 제작 활발, 묵죽·묵매·묵포도·영모·화조 등 서정적 한국화, 고씨화보로 남종화 전래"],
["조선 중기 은일사상을 반영한 주제는?","어초문답, 어부·조어, 탁족, 관폭, 완월"],
["이경윤 고사탁족도의 뜻과 표현은?","물이 맑으면 갓끈을 씻고 흐리면 발을 씻는다는 고사인물화\n소경산수인물화, 근경 인물 배치, 흑백 대비, 원경 생략"],
["이징 연사모종도의 특징은?","기울어진 주산·흑백 대비(절파 영향), 경물이 중앙으로 와 공간감이 깊어짐"],
["김명국 달마도의 종류와 표현은?","도석인물화(선종화)\n광태사학파 화풍: 빠르고 거친 필치, 생략된 선, 감필법"],
["조속 고매서작도의 내용과 화풍은?","희보춘신(매화=봄소식, 까치=기쁜 소식)\n수묵 사의적 화조화, 매화 몰골법·비백, 까치 몰골법"],
["어몽룡 월매도의 늙은 가지·어린 가지의 상징은?","늙은 가지: 어지러운 현실에 꺾인 모습\n어린 가지: 하늘로 곧게 솟아 희망 상징"],
["월매도의 축수 상징 의미는?","미수상락(眉壽上樂) / 미수=88세"],
["조선 후기 화단의 특징은?","실학 영향(사실·세밀), 서양화법(원근·음영) 수용, 정선 중심 진경산수, 시장경제 발달과 여가 확대로 풍속화 발전"],
["조선 후기 남종화를 본격 유행시킨 화보는?","개자원화전"],
["화제: 까치+호랑이+소나무 / 원앙+연꽃 / 소나무+백두조는?","신년보희 / 연생귀자 / 송축백두"],
["정선의 특징은?","진경산수, 남북종 절충(북종 부벽준·해조묘 + 남종 피마준·미점준), 수직준 창안"],
["금강전도의 전반적 특징은?","원형 구도, 주역의 음양 조화(흑백·강유), 수직준·미점준·피마준·상악준, 청색 설채"],
["강세황 영통동구도의 특징은?","남종화 기법에 서양화법(투시원근·음영) 결합, 미점"],
["강세황 70세 자화상의 특징과 자기 그림에 스스로 쓴 찬문은?","관모에 평상복: 마음은 산림, 몸은 조정\n얼굴 음영 표현\n자화자찬"],
["이인문 단발령망금강도의 특징은?","정선 영향(토산 미점), 농묵·담묵 대비, 남북종 절충"],
["농민의 노고를 알리고 농업·잠업 정책을 촉구하려 그린 그림은?","경직도(경작도+잠직도)"],
];
let W={};try{W=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const L=document.getElementById("list"),O=document.getElementById("only");
function R(){L.innerHTML=QA.map(([q,a],i)=>O.checked&&!W[i]?"":`<div class="q"><details><summary>${i+1}. ${q}</summary><div class="a">${a}</div></details><label><input type="checkbox" data-i="${i}"${W[i]?" checked":""}> 틀림</label></div>`).join("")}
L.onchange=e=>{const i=e.target.dataset.i;if(i==null)return;e.target.checked?W[i]=true:delete W[i];try{localStorage.setItem(KEY,JSON.stringify(W))}catch(x){}if(O.checked)R()};
O.onchange=R;R();
</script><style>.sk{display:none!important}</style><script>/*SUKJI*/addEventListener("load",()=>{const K=(typeof KEY!="undefined"?KEY:location.pathname)+"-d",ds=[...document.querySelectorAll("details")],t=document.createElement("input");let s={};try{s=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
const mk=(i,x)=>{const l=document.createElement("label");l.append(i,x);return l},f=()=>ds.forEach((d,i)=>{const p=d.parentElement,b=p.querySelectorAll("details").length>1?d:p,on=t.checked&&!!s[i];b.classList.toggle("sk",on);d._l.classList.toggle("sk",on)});
t.type="checkbox";t.onchange=f;document.body.prepend(mk(t," 숙지 숨기기 "));
ds.forEach((d,i)=>{const c=document.createElement("input");c.type="checkbox";c.checked=!!s[i];c.onchange=()=>{c.checked?s[i]=1:delete s[i];try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}f()};d._l=mk(c," 숙지");d.after(d._l)})})</script>
