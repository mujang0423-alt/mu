<script>const QA=[["[용구] 문방사우 선택 기준", "붓: 털이 곧고 끝이 뾰족, 가지런하고 탄력 적당 (사용 후 씻어 걸어 그늘 건조)<br>먹: 입자 가늘고 가볍고 단단, 향·광택 (송연묵·유연묵)<br>종이: 흡수성 좋고 윤갈·농담이 잘 나타남<br>벼루: 석질 곱고 경도 높음, 먹물이 쉽게 마르지 않음"], ["[자세] 완법 — 현완법 / 제완법 / 침완법", "현완법: 팔을 책상과 수평으로 들어 자유롭게 → <b>큰 글씨</b>·중간 글씨<br>제완법: 오른 팔꿈치를 책상에 가볍게 → 중간·잔 글씨<br>침완법: 왼손등 위에 오른손목 → <b>잔 글씨</b>"], ["[자세] 집필법 — 오지법 / 쌍구법 / 단구법", "오지법: 네 손가락 모두로 붓대를 움켜쥐듯<br>쌍구법: 엄지·집게·<b>가운데</b> 손가락으로 잡고 나머지로 받침<br>단구법: 엄지·집게로 연필 쥐듯 잡고 나머지로 받침"], ["[운필] 기필·행필·수필", "기필(입필): 점·획의 시작, 붓을 처음 대는 과정<br>행필: 기필에서 나아가는 과정<br>수필: 점·획의 끝 마무리"], ["[운필] 원필 vs 방필", "원필: 기필·수필이 <b>둥근</b> 필획, 부드럽고 입체적<br>방필: 기필·수필이 <b>모난</b> 필획, 날카롭고 강함"], ["[운필] 역입 / 회봉", "역입: 시작 시 진행 방향의 <b>반대</b>로 붓을 거슬러 댐<br>회봉: 마무리 시 그어온 반대 방향으로 붓을 되돌림"], ["[운필] 장봉 vs 노봉 / 중봉 vs 편봉", "장봉: 기필 시 붓끝을 감춤(=역입) / 노봉: 붓끝을 노출해 바로 댐<br>중봉: 붓을 수직으로, 끝이 획 <b>한가운데</b> → 고르고 입체적·힘<br>편봉: 붓을 뉘어 끝이 한쪽으로 → 근골 약, 평면적"], ["[운필] 전(轉) vs 절(折)", "전: 방향을 바꿀 때 <b>모나지 않게</b><br>절: 방향을 바꿀 때 <b>모가 나게</b>"], ["[결구] 간가·결구·접필·개형", "간가: 점과 획의 <b>간격</b>을 조형적으로 알맞게<br>결구: 점과 획을 조화 있게 <b>결합</b><br>접필: 점·획이 서로 겹치는 것<br>개형: 글자의 외형, 대강의 모양"], ["[결구] 중심(中心)·중심(重心) / 균제 vs 균형", "중심(中心): 글자의 가운데 / 중심(重心): 무게 중심<br>균제: 고른 배치 → 안정·근엄<br>균형: 고르지 않으나 전체적 조화 → 생동감"], ["[결구] 향세 vs 배세", "향세: 마주보는 두 획을 <b>바깥쪽</b>으로 부푼 듯 휘게 (안진경)<br>배세: 마주보는 두 획을 <b>안쪽</b>으로 휘게 (구양순)"], ["[임서] 형림 / 의림 / 배림", "형림: <b>자형</b>에 치중해 사실적으로, 기초 단계<br>의림: 내면적 <b>정신</b>(필의·필세)을 본받음<br>배림: 체본을 보지 않고 연습, 자신의 필의를 더해 창작 시도"], ["[훈련법] 구궁지 / 운지법", "구궁지: 비첩 임서용 <b>9등분</b> 정사각형 종이, 자형 습득엔 좋으나 무기력해질 수 있음<br>체본 위 투명지로 따라 쓰기(중심선·윤곽선) → 간가·결구 익힘<br>운지법: 체본 위에 손가락으로 쓰듯 연습"], ["[한글서체] 판본체 특징", "직사각형·정사각형, 획 굵기 일정, 수직·수평·대칭, 획의 중간에서 접필, 장중·단정·질박"], ["[한글서체] 판본체 작품별 특징", "훈민정음: 원만, 점은 둥글게, 원필, 정사각형<br>용비어천가: <b>방필</b>로 강인, 약간 납작<br>월인석보: 방필·원필 조화, 세로로 긴 자형, 장중"], ["[한글서체] 궁체의 종류", "조선 중기 궁녀들이 형성<br>정자: 치밀·안정, 엄정 / 흘림: 정자 바탕에 속도↑ / 진흘림: 율동감, 고도의 필력<br>등서체: 베껴 쓴 글씨, 정자·반흘림 / 서간체: 편지글, 진흘림, 개성"], ["[한글서체] 국한문 혼서", "판본체에서 궁체로 변해가는 과정에서 생긴 형식, 한글·한자 혼용<br>조선 중기 선비, 한문 해·행서 필의, 가로·세로획 자유로운 운필"], ["[한글서체] 판본체 vs 궁체 비교", "판본체: 훈민정음·용비어천가 기반, 원필체(전서 본)·방필체(예서 본), 직선·기하학적, 정사각형, 'ㅏ'는 <b>가운데 중심선</b><br>궁체: 곡선·유려, 3절 변화, 가로획 오른쪽이 약간 올라감, 다양한 자형, 'ㅏ'는 <b>오른쪽 세로획</b> 기준"], ["[한문서체] 전서", "갑골문 기반, <b>대전·소전</b>으로 구분<br>원필, 획 굵기 일정, 상하로 긴 장방형, 좌우 대칭, 전(轉) 사용"], ["[한문서체] 예서", "진·한대 발달, 전서를 대신해 실용적으로 / <b>파책</b> 유무로 고례·<b>팔분</b> 구분<br>장봉 역입, 대체로 방필, 파책 가로획은 '잠두안미', 약간 <b>납작한 방형</b>"], ["[한문서체] 해서", "'표준·규범'의 글씨, 방필(예서법)·원필(전서법)<br>평온·단정·구축적, 대체로 정방형, 한 획에 <b>기필·행필·수필 변화 확연</b>"], ["[한문서체] 영자팔법", "'永'자에 기본 필획 8가지<br>측(側) 점 / 늑(勒) 가로획 / 노(努) 세로획 / 적(趯) 갈고리 / 책(策) 오른 삐침 / 약(掠) 긴 왼 삐침 / 탁(啄) 짧은 왼 삐침 / 책(磔) 파임"], ["[한문서체] 해서의 종류 — 구양순 vs 안진경", "구양순: <b>배세·방필</b>, 획이 가늘고 여성적<br>안진경: <b>향세·원필</b>, 획이 굵고 강건, 남성적"], ["[한문서체] 행서 / 초서", "행서: 해서와 초서 중간 반흘림, 빨리 쓰기 위해, 점획 연결·부분 생략, 해서의 근엄+초서의 경쾌<br>초서: 극도로 간략화, 실용보다 예술 — <b>장초</b>(예서에서 파생) / <b>금초</b>(행서에서 파생)"], ["[전각] 정의와 백문인 vs 주문인", "서화에 찍는 도장을 새기는 것, 글자체를 <b>전서</b>로 해서 붙은 이름<br>백문인(음각): 글자 획을 파냄 → 찍으면 글자가 <b>희게</b><br>주문인(양각): 글자만 남기고 여백을 파냄 → 글자가 <b>붉게</b>"], ["[전각] 전각의 3법", "자법(字法): 전서 필법에 어긋나지 않게<br>장법(章法): 인면에 글자를 조화롭게 배치(배자)<br>도법(刀法): 칼 쓰는 법 — 집도법: 단구법·쌍구법·<b>악도법</b>(움켜쥐듯, 큰 인)"], ["[전각] 용구", "인재(새기는 재료) / 인상(인재 끼우는 틀) / 인도(칼) / 인주 / 인솔(가루 터는 솔) / 사포 / 인구(위치 잡는 자)"], ["[전각] 전각의 종류 ①", "성명인: 이름 뒤 인·지인 등, 주로 백문, 소전체, 정방형<br>아호인: 호·재 새김, 대개 주문, '인'자 붙이지 않음<br>사구인: 좌우명·길상어 — 작품 머리 <b>두인</b>, 여백 <b>유인</b><br>당호인: 가옥·서재 이름"], ["[전각] 전각의 종류 ②", "장서인(수장인): 서적·서화 소장 표시<br>감상인: 감상 후 찍음 / 감정인: 감정·황제 열람 표시<br>초형인: 문자 아닌 사물 형상<br>수결인: 사인처럼 새긴 도장"]]</script>

async function put(p,content,msg,sha){
  const b={message:msg,content:content,branch:BR};if(sha)b.sha=sha;
  const r=await fetch(API+enc(p),{method:"PUT",headers:{Authorization:"Bearer "+tok(),"Content-Type":"application/json"},body:JSON.stringify(b)});
  if(!r.ok){let m=r.status;try{m=(await r.json()).message||m}catch(e){}const e=new Error(m);e.status=r.status;throw e}
}
async function commit(i,v){
  for(let n=0;;n++){
    const g=await get(),d=g.d;if(v)d[i]=v;else delete d[i];
    try{await put(PATH,b64(JSON.stringify(d,null,1)),"메모: "+NAME+" "+(i+1)+"번",g.sha);M=d;store();return}
    catch(e){if(n>=2||(e.status!==409&&e.status!==422))throw e}
  }
}
function thumb(src,rm){const w=el("span","mm-th"),im=el("img"),x=el("b");im.src=src;x.textContent="×";x.onclick=rm;w.append(im,x);return w}

function edit(i){
  const u=ui[i],m=M[i]||{},imgs=(m.img||[]).slice(),adds=[];
  const ta=el("textarea");ta.value=m.t||"";ta.placeholder="모르는 단어 뜻, 보충 설명…";
  const th=el("div"),fi=el("input"),st=el("span","mm-st");
  fi.type="file";fi.accept="image/*";fi.multiple=true;fi.style.display="none";
  const draw=()=>{th.innerHTML="";
    imgs.forEach((p,k)=>th.append(thumb(RAW+enc(p),()=>{imgs.splice(k,1);draw()})));
    adds.forEach((a,k)=>th.append(thumb(a.url,()=>{adds.splice(k,1);draw()})))};
  fi.onchange=async()=>{for(const f of fi.files){try{adds.push(await shrink(f))}catch(e){st.textContent=e.message}}fi.value="";draw()};
  const close=()=>{u.ed.innerHTML="";u.ed.style.display="none";u.bar.style.display="";view(i)};
  const ok=btn("저장",async()=>{
    if(!tok()){st.textContent="허브(index)에서 '토큰'을 먼저 저장해야 해요";return}
    ok.disabled=true;
    try{
      const paths=[];
      for(let k=0;k<adds.length;k++){
        st.textContent="사진 올리는 중 "+(k+1)+"/"+adds.length;
        const p="memo/img/"+NAME+"-"+(i+1)+"-"+Date.now().toString(36)+k+".jpg";
        await put(p,adds[k].b64,"메모 사진: "+NAME);paths.push(p);
      }
      st.textContent="저장 중…";
      const t=ta.value.replace(/\s+$/,""),all=imgs.concat(paths);
      await commit(i,(t||all.length)?{t:t,img:all}:null);
      ds.forEach((_,k)=>{if(k!==i)view(k)});close();
    }catch(e){st.textContent="저장 실패: "+e.message;ok.disabled=false}
  });
  u.ed.innerHTML="";u.ed.append(ta,th,fi,btn("사진 추가",()=>fi.click()),ok,btn("취소",close),st);
  u.bar.style.display="none";u.ed.style.display="";draw();ta.focus();
}

ds.forEach((d,i)=>{
  const w=el("div","mm"),box=el("div","mm-box"),bar=el("div"),ed=el("div"),b=btn("＋ 메모",()=>edit(i));
  bar.append(b);ed.style.display="none";w.append(box,bar,ed);d.append(w);
  ui[i]={box:box,bar:bar,ed:ed,btn:b};view(i);
});

(async()=>{try{
  let d;
  if(tok())d=(await get()).d;
  else{const r=await fetch(RAW+enc(PATH)+"?t="+Date.now(),{cache:"no-store"});if(r.status===404)d={};else if(r.ok)d=await r.json();else return}
  M=d||{};store();ds.forEach((_,k)=>{if(ui[k].ed.style.display==="none")view(k)});
}catch(e){}})();
})</script>
