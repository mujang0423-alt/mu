<script id="s">
const L=document.getElementById('l'),F=document.getElementById('f'),M=document.getElementById('msg');
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
QA.forEach((q,i)=>{const d=document.createElement('details');
d.innerHTML='<summary>'+(i+1)+'. '+q[0]+'</summary><p>'+q[1]+'</p><label><input type="checkbox"> 틀림</label>';
const c=d.querySelector('input');c.checked=!!S[i];d.classList.toggle('w',c.checked);
c.onchange=()=>{S[i]=c.checked;d.classList.toggle('w',c.checked);save();flt()};L.appendChild(d)});
const wrong=()=>QA.map((q,i)=>i).filter(i=>S[i]);
const flt=()=>[...L.children].forEach((d,i)=>d.classList.toggle('hide',F.checked&&!S[i]));
F.onchange=flt;flt();
document.getElementById('ex').onclick=()=>{const w=wrong();if(!w.length)return M.textContent='체크된 문항 없음';
const h='<!DOCTYPE html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+KEY+'-wrong</title>'+document.querySelector('style').outerHTML+'<h1>'+KEY+' 오답</h1><div class="bar"><label style="color:#333"><input type="checkbox" id="f"> 틀린 것만</label><button id="ex">오답 내보내기</button><button id="cp">번호 복사</button><span id="msg" style="font-size:13px;color:#888"></span></div><div id="l"></div><script>const KEY="'+KEY+'-wrong";const QA='+JSON.stringify(w.map(i=>QA[i]))+';<\/script><script>'+document.getElementById('s').textContent+'<\/script>';
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download=KEY+'-wrong.html';a.click();M.textContent=w.length+'문항 내보냄'};
document.getElementById('cp').onclick=()=>{const t=wrong().map(i=>i+1).join(',');if(!t)return M.textContent='체크된 문항 없음';
const fb=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()};
try{navigator.clipboard.writeText(t).catch(fb)}catch(e){fb()}M.textContent='복사: '+t};
</script>
</html>
