<div id="bar"><label><input type="checkbox" id="t"> 틀린 것만</label><button id="ex">오답 내보내기</button><button id="cp">번호 복사</button></div>
<div id="L"></div>
<script>
let s={};try{s=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const L=document.getElementById('L'),sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
QA.forEach(([q,a],i)=>{const r=document.createElement('div');r.className='r'+(s[i]?' w':'');r.innerHTML=`<label><input type=checkbox${s[i]?' checked':''}> 틀림</label><details><summary>${i+1}. ${q}</summary><div>${a}</div></details>`;r.querySelector('input').onchange=e=>{e.target.checked?s[i]=1:delete s[i];r.classList.toggle('w',!!s[i]);sv()};L.append(r)});
t.onchange=e=>document.body.classList.toggle('f',e.target.checked);
ex.onclick=()=>{const c=document.documentElement.cloneNode(true);c.querySelector('#d').textContent='const KEY='+JSON.stringify(KEY+'-wrong')+',QA='+JSON.stringify(QA.filter((_,i)=>s[i]))+';';c.querySelector('#L').innerHTML='';c.querySelector('body').className='';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>'+c.outerHTML],{type:'text/html'}));a.download=KEY+'-wrong.html';a.click()};
cp.onclick=()=>{const v=Object.keys(s).map(i=>+i+1).sort((a,b)=>a-b).join(',');(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).catch(()=>{const x=document.createElement('textarea');x.value=v;document.body.append(x);x.select();document.execCommand('copy');x.remove()})};
</script>
